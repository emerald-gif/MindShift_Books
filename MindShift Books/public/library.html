<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Library · MindShift Books</title>
<meta name="description" content="Everything you've saved, wishlisted, and own — in one place."/>
<meta name="robots" content="noindex, nofollow"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --p:#4f46e5;--p2:#06b6d4;--g:linear-gradient(90deg,#4f46e5,#06b6d4);
  --txt:#0f172a;--sub:#6b7280;--mute:#9ca3af;
  --bg:#f8fafc;--card:#fff;--border:#e5e7eb;--border2:#e2e8f0;
  --red:#ef4444;--radius:16px;
}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}

/* ── SHARED MINDSHIFT HEADER (matches profile.html / articles.html) ── */
.sticky-header-stack{position:sticky;top:0;z-index:1000}
.sticky-header-stack header:first-child{position:relative;left:0;right:0;background:white;display:flex;flex-direction:column;gap:10px;padding:16px 20px 18px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.sticky-header-stack .header-top{display:flex;align-items:center;justify-content:space-between;width:100%;flex-wrap:nowrap;gap:8px}
.sticky-header-stack header:first-child h1{font-size:1.45rem;font-weight:700;display:flex;align-items:center;gap:10px;min-width:0;overflow:hidden;margin:0}
.sticky-header-stack header:first-child h1 span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.header-icon-group{display:flex;align-items:center;gap:4px;flex-shrink:0}
.icon-btn{position:relative;display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;border:none;background:transparent;color:#1e293b;cursor:pointer;transition:background-color 150ms ease,color 150ms ease;padding:0}
.icon-btn:hover{background-color:#f1f5f9;color:#4f46e5}
.icon-btn:active{background-color:#e6e9ee}

/* ── TABS ── */
.tab-bar{display:flex;gap:8px;padding:16px 16px 4px}
.tab-btn{flex:1;padding:11px 8px;border-radius:12px;border:1.5px solid var(--border);background:var(--card);
  font-size:13px;font-weight:800;color:var(--sub);cursor:pointer;text-align:center;transition:all .18s;font-family:inherit}
.tab-btn.active{background:var(--g);color:#fff;border-color:transparent}

.lib-section{padding:16px;display:none}
.lib-section.active{display:block}

/* ── EMPTY STATE ── */
.lib-empty{text-align:center;padding:56px 24px}
.lib-empty svg{width:40px;height:40px;margin:0 auto 12px;color:#d1d5db;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.lib-empty p{font-size:14.5px;font-weight:800;color:var(--txt);margin-bottom:4px}
.lib-empty span{font-size:12.5px;color:var(--mute);line-height:1.5;display:block;max-width:260px;margin:0 auto}
.lib-empty a{display:inline-block;margin-top:18px;padding:11px 24px;border-radius:99px;background:var(--g);color:#fff;font-size:13px;font-weight:800;text-decoration:none}

/* ── SKELETON ── */
.skel{background:linear-gradient(90deg,#f0f0f0 25%,#e0e0e0 50%,#f0f0f0 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:8px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.skel-row{height:80px;border-radius:16px;margin-bottom:10px}
.skel-book{border-radius:16px;aspect-ratio:3/4}

/* ── SAVED LIST ── */
.saved-row{display:flex;gap:12px;align-items:center;padding:12px;border:1.5px solid var(--border);
  border-radius:16px;background:var(--card);margin-bottom:10px;cursor:pointer}
.saved-row-img{width:56px;height:56px;border-radius:10px;object-fit:cover;flex-shrink:0;background:#e0e7ff;
  display:flex;align-items:center;justify-content:center;color:var(--p)}
.saved-row-img svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8}
.saved-row-body{flex:1;min-width:0}
.saved-row-type{font-size:10px;font-weight:800;color:var(--p);text-transform:uppercase;letter-spacing:.3px;margin-bottom:2px}
.saved-row-title{font-size:13.5px;font-weight:700;color:var(--txt);line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.saved-row-unsave{width:32px;height:32px;border-radius:50%;border:none;background:var(--bg);color:var(--mute);
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.saved-row-unsave svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ── BOOK GRID (Wishlist + Books tabs) ── */
.book-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.book-card{position:relative;border:1.5px solid var(--border);border-radius:16px;background:var(--card);overflow:hidden;display:flex;flex-direction:column}
.book-card-cover{width:100%;aspect-ratio:3/4;object-fit:cover;background:#e0e7ff;cursor:pointer;display:block}
.book-card-heart{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.92);
  display:flex;align-items:center;justify-content:center;cursor:pointer;color:#dc2626;border:none}
.book-card-heart svg{width:15px;height:15px}
.book-card-body{padding:10px 12px 12px}
.book-card-title{font-size:12.5px;font-weight:800;color:var(--txt);line-height:1.3;margin-bottom:6px;min-height:32px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.book-card-price{font-size:12px;font-weight:700;color:var(--p);margin-bottom:8px}
.book-card-row{display:flex;gap:6px}
.book-card-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;padding:9px;border-radius:9px;
  border:none;font-size:11.5px;font-weight:800;cursor:pointer;text-decoration:none;background:var(--g);color:#fff;font-family:inherit}
.book-card-icon{width:34px;height:34px;border-radius:9px;border:1.5px solid var(--border);background:var(--card);
  display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--sub);flex-shrink:0;text-decoration:none}
.book-card-icon svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.bottom-pad{height:24px}
</style>
</head>
<body>

<div class="sticky-header-stack">
<header>
  <div class="header-top">
    <h1><a href="/" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;"><img src="/MINDSHIFT.jpg" alt="MindShift logo" style="width:36px;height:36px;border-radius:6px;"></a><span>My Library</span></h1>
    <div class="header-icon-group">
      <button type="button" id="sidebarToggle" class="icon-btn" onclick="toggleSidebar()" aria-label="Open menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="22" height="22"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
      </button>
    </div>
  </div>
</header>
</div>

<div class="tab-bar">
  <button type="button" class="tab-btn" id="tabBtnSaved" onclick="switchTab('saved')">Saved</button>
  <button type="button" class="tab-btn" id="tabBtnWishlist" onclick="switchTab('wishlist')">Wishlist</button>
  <button type="button" class="tab-btn" id="tabBtnBooks" onclick="switchTab('books')">Books</button>
</div>

<!-- SAVED -->
<div class="lib-section" id="secSaved">
  <div id="savedList">
    <div class="skel skel-row"></div>
    <div class="skel skel-row"></div>
    <div class="skel skel-row"></div>
  </div>
</div>

<!-- WISHLIST -->
<div class="lib-section" id="secWishlist">
  <div class="book-grid" id="wishlistGrid">
    <div class="skel skel-book"></div>
    <div class="skel skel-book"></div>
  </div>
</div>

<!-- BOOKS -->
<div class="lib-section" id="secBooks">
  <div class="book-grid" id="booksGrid">
    <div class="skel skel-book"></div>
    <div class="skel skel-book"></div>
  </div>
</div>

<div class="bottom-pad"></div>

<div id="sidebar-slot"></div>
<script src="/sidebar-nav.js"></script>
<script src="/create-picker.js"></script>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js';
import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js';
import { getFirestore, doc, getDoc, setDoc } from 'https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js';

const fbApp = initializeApp({
  apiKey:"AIzaSyDTn70s1_uIiSOR6lPLY_nKh8Ff1FViFCs",
  authDomain:"mindshiftbooks-c4451.firebaseapp.com",
  projectId:"mindshiftbooks-c4451",
  storageBucket:"mindshiftbooks-c4451.firebasestorage.app",
  messagingSenderId:"388697987853",
  appId: "1:388697987853:web:f023df9412c22285012e44",
  measurementId: "G-CHPJDQ4W08"
});
const auth = getAuth(fbApp);
const db   = getFirestore(fbApp, 'default');

const ICONS = {
  doc: `<path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/>`,
  x: `<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>`,
  heart: `<path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/>`,
  download: `<path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>`,
  bookmark: `<path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/>`
};

let currentUser = null;
let currentTab = 'saved';
const loaded = { saved:false, wishlist:false, books:false };
const VALID_TABS = ['saved','wishlist','books'];

const params = new URLSearchParams(location.search);
const requested = params.get('tab');
if (VALID_TABS.includes(requested)) currentTab = requested;

onAuthStateChanged(auth, user => {
  if (!user) { window.location.href = '/login?returnTo=' + encodeURIComponent(location.pathname + location.search); return; }
  currentUser = user;
  switchTab(currentTab);
});

window.switchTab = function(tab){
  if (!VALID_TABS.includes(tab)) tab = 'saved';
  currentTab = tab;
  VALID_TABS.forEach(t => {
    document.getElementById(`tabBtn${cap(t)}`).classList.toggle('active', t === tab);
    document.getElementById(`sec${cap(t)}`).classList.toggle('active', t === tab);
  });
  history.replaceState(null, '', `/library?tab=${tab}`);
  if (!currentUser) return; // will re-run once auth resolves
  if (tab === 'saved' && !loaded.saved) loadSaved();
  if (tab === 'wishlist' && !loaded.wishlist) loadWishlist();
  if (tab === 'books' && !loaded.books) loadBooks();
};
function cap(s){ return s.charAt(0).toUpperCase() + s.slice(1); }

/* ── SAVED TAB ── */
async function loadSaved(){
  loaded.saved = true;
  try{
    const snap = await getDoc(doc(db,'userSaves',currentUser.uid));
    const map = snap.exists() ? snap.data() : {};
    const ids = Object.keys(map).filter(id => map[id]);
    if (!ids.length){ renderSavedEmpty(); return; }

    const pairs = await Promise.all(ids.map(async id => {
      const [postSnap, articleSnap] = await Promise.all([
        getDoc(doc(db,'posts',id)).catch(()=>null),
        getDoc(doc(db,'articles',id)).catch(()=>null)
      ]);
      if (postSnap && postSnap.exists()) return { id, type:'post', data: postSnap.data() };
      if (articleSnap && articleSnap.exists()) return { id, type:'article', data: articleSnap.data() };
      return null;
    }));
    const items = pairs.filter(Boolean).sort((a,b) => tsMillis(b.data.publishedAt||b.data.createdAt) - tsMillis(a.data.publishedAt||a.data.createdAt));

    if (!items.length){ renderSavedEmpty(); return; }
    document.getElementById('savedList').innerHTML = items.map(it => {
      const img = it.type==='post' ? (it.data.images && it.data.images[0]) : it.data.cover;
      const title = it.type==='post' ? (it.data.text||'Untitled post') : (it.data.title||'Untitled');
      const href = it.type==='post' ? `/post-read?id=${it.id}` : `/article-read?id=${it.id}`;
      return `
        <div class="saved-row" onclick="location.href='${href}'">
          <div class="saved-row-img">${img?`<img src="${img}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:10px">`:`<svg viewBox="0 0 24 24">${ICONS.doc}</svg>`}</div>
          <div class="saved-row-body">
            <div class="saved-row-type">${it.type}</div>
            <div class="saved-row-title">${esc(nTrunc(title,90))}</div>
          </div>
          <button class="saved-row-unsave" onclick="event.stopPropagation();unsaveItem('${it.id}',this)" aria-label="Remove">
            <svg viewBox="0 0 24 24">${ICONS.x}</svg>
          </button>
        </div>`;
    }).join('');
  }catch(e){
    console.error('loadSaved failed:', e);
    renderSavedEmpty();
  }
}
window.unsaveItem = async function(id, btn){
  const row = btn.closest('.saved-row');
  if (row) row.remove();
  try{ await setDoc(doc(db,'userSaves',currentUser.uid),{[id]:false},{merge:true}); }catch(e){}
  if (!document.querySelector('#savedList .saved-row')) renderSavedEmpty();
};
function renderSavedEmpty(){
  document.getElementById('savedList').innerHTML = emptyHtml(ICONS.bookmark,
    'Nothing saved yet', 'Tap the bookmark icon on any article or post to save it here.', '/', 'Browse Articles');
}

/* ── WISHLIST TAB ── */
async function loadWishlist(){
  loaded.wishlist = true;
  try{
    const token = await currentUser.getIdToken();
    const [wlRes, prodRes] = await Promise.all([
      fetch('/api/wishlist', { headers:{ Authorization:`Bearer ${token}` } }),
      fetch('/api/products')
    ]);
    const wl = await wlRes.json();
    const prod = await prodRes.json();
    const catalog = {};
    (prod.products||[]).forEach(p => catalog[p.id] = p);
    const items = (wl.ids||[]).map(id => catalog[id]).filter(Boolean);

    if (!items.length){ renderWishlistEmpty(); return; }
    document.getElementById('wishlistGrid').innerHTML = items.map(p => `
      <div class="book-card">
        <img class="book-card-cover" src="${p.cover||''}" alt="" onclick="location.href='/books'">
        <button class="book-card-heart" onclick="removeFromWishlist('${p.id}', this)" aria-label="Remove from wishlist">
          <svg viewBox="0 0 24 24" fill="currentColor" stroke="none">${ICONS.heart}</svg>
        </button>
        <div class="book-card-body">
          <div class="book-card-title">${esc(p.title||'Untitled')}</div>
          <div class="book-card-price">${p.priceNGN ? '₦'+Number(p.priceNGN).toLocaleString() : ''}</div>
          <div class="book-card-row"><a class="book-card-btn" href="/books">View in store</a></div>
        </div>
      </div>`).join('');
  }catch(e){
    console.error('loadWishlist failed:', e);
    renderWishlistEmpty();
  }
}
window.removeFromWishlist = async function(productId, btn){
  const card = btn.closest('.book-card');
  if (card) card.remove();
  try{
    const token = await currentUser.getIdToken();
    await fetch('/api/wishlist/toggle', {
      method:'POST',
      headers:{ 'Content-Type':'application/json', Authorization:`Bearer ${token}` },
      body: JSON.stringify({ productId })
    });
  }catch(e){}
  if (!document.querySelector('#wishlistGrid .book-card')) renderWishlistEmpty();
};
function renderWishlistEmpty(){
  document.getElementById('wishlistGrid').outerHTML = `<div id="wishlistGrid">${emptyHtml(ICONS.heart,
    'Your wishlist is empty', 'Tap the heart icon on any book to add it here.', '/books', 'Browse Books')}</div>`;
}

/* ── BOOKS TAB (owned — from past orders) ── */
async function loadBooks(){
  loaded.books = true;
  try{
    const token = await currentUser.getIdToken();
    const res = await fetch('/api/my-orders', { headers:{ Authorization:`Bearer ${token}` } });
    const data = await res.json();
    const seen = new Map();
    (data.rows||[]).forEach(order => (order.items||[]).forEach(it => {
      if (it.pdfUrl && it.productId && !seen.has(it.productId)) seen.set(it.productId, it);
    }));
    const items = Array.from(seen.values());

    if (!items.length){ renderBooksEmpty(); return; }
    document.getElementById('booksGrid').innerHTML = items.map(it => {
      const readHref = `/read-book?src=${encodeURIComponent(it.pdfUrl)}&title=${encodeURIComponent(it.title||'')}&cover=${encodeURIComponent(it.coverUrl||'')}`;
      return `
        <div class="book-card">
          <img class="book-card-cover" src="${it.coverUrl||''}" alt="" onclick="location.href='${readHref}'">
          <div class="book-card-body">
            <div class="book-card-title">${esc(it.title||'Untitled')}</div>
            <div class="book-card-row">
              <a class="book-card-btn" href="${readHref}">Read</a>
              <a class="book-card-icon" href="${it.pdfUrl}" target="_blank" rel="noopener" aria-label="Download" onclick="event.stopPropagation()">
                <svg viewBox="0 0 24 24">${ICONS.download}</svg>
              </a>
            </div>
          </div>
        </div>`;
    }).join('');
  }catch(e){
    console.error('loadBooks failed:', e);
    renderBooksEmpty();
  }
}
function renderBooksEmpty(){
  document.getElementById('booksGrid').outerHTML = `<div id="booksGrid">${emptyHtml(ICONS.doc,
    "You don't own any books yet", 'Books you buy will show up here, ready to read any time.', '/books', 'Browse Books')}</div>`;
}

/* ── HELPERS ── */
function emptyHtml(iconPath, title, sub, href, cta){
  return `<div class="lib-empty"><svg viewBox="0 0 24 24">${iconPath}</svg><p>${title}</p><span>${sub}</span><a href="${href}">${cta}</a></div>`;
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function nTrunc(s,n){ return s.length>n ? s.slice(0,n)+'…' : s; }
function tsMillis(ts){ if(!ts) return 0; return ts.toMillis ? ts.toMillis() : (new Date(ts)).getTime(); }
</script>
</body>
</html>
