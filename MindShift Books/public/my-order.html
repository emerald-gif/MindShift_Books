<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>My Orders | MindShift Books</title>
  <meta name="description" content="MindShift Books — track your order and download your eBook." />

  <link rel="shortcut icon" href="MINDSHIFT.jpg" type="image/jpg">

  <!-- Fonts & icons (same as the rest of the platform) -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

  <style>
:root{ --primary:#0f172a; --accent:#06b6d4; --bg:#f8fafc; }
*{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',sans-serif}
body{background:linear-gradient(180deg,#f8fafc 0%, #eef2f7 100%);min-height:100vh;color:var(--primary);}

/* ---------------- HEADER (shared with index.html) ---------------- */
header{
  position:fixed;top:0;left:0;right:0;
  background:white;z-index:1000;
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 20px;
  box-shadow:0 2px 12px rgba(0,0,0,0.06);
}
header h1{font-size:1.45rem;font-weight:700;display:flex;align-items:center;gap:10px;margin:0;}
.hamburger{font-size:1.3rem;cursor:pointer;color:#1e293b}

main{ max-width:900px;margin:0 auto;padding-left:16px;padding-right:16px;padding-bottom:40px;}

/* ---------------- SIDEBAR (shared with index.html) ---------------- */
.sidebar{position:fixed;top:0;left:-300px;width:280px;height:100%;background:#111827;padding-top:84px;transition:left 0.32s ease;z-index:2000;border-right:1px solid rgba(255,255,255,0.04);color:#fff}
.sidebar .logo-row{display:flex;align-items:center;gap:12px;padding:18px 20px;position:absolute;top:16px;left:12px}
.sidebar img{width:36px;height:36px;border-radius:6px}
.sidebar ul{list-style:none;margin-top:8px}
.sidebar li{padding:16px 20px;font-weight:600;border-bottom:1px solid rgba(255,255,255,0.04);cursor:pointer}
.sidebar li.active{color:var(--accent)}

/* ---------------- PAGE HEADER ---------------- */
.page-head{margin-bottom:18px;}
.page-head h2{font-size:1.3rem;margin-bottom:6px;}
.muted{font-size:.9rem;color:#6b7280}

/* ---------------- TRACK PANEL ---------------- */
.track-panel{
  background:white;padding:16px;border-radius:14px;
  box-shadow:0 18px 40px rgba(0,0,0,0.06);
  display:flex;gap:10px;margin-bottom:18px;
}
.track-panel input{
  flex:1;padding:12px 14px;border-radius:10px;
  border:1px solid rgba(15,23,42,0.08);background:#f8fafc;
  font-size:0.95rem;color:var(--primary);outline:none;
}
.track-panel input:focus{border-color:var(--accent)}

/* ---------------- BUTTONS (shared look) ---------------- */
.btn{padding:12px 16px;border-radius:10px;border:none;font-weight:700;cursor:pointer;}
.buy-btn{background:linear-gradient(90deg,#4f46e5,#06b6d4);color:white;box-shadow:0 8px 20px rgba(79,70,229,0.18);}
.review-btn{border:2px solid rgba(15,23,42,0.06);background:white;color:var(--primary)}

#status{margin-bottom:14px;font-size:0.95rem;color:#6b7280;min-height:20px}

/* ---------------- ORDER CARDS (same family as product-card) ---------------- */
.results{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;}
.order-card{
  background:white;padding:18px;border-radius:14px;
  box-shadow:0 18px 40px rgba(0,0,0,0.06);
  animation:fadeIn 0.35s ease;
}
@keyframes fadeIn{ from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

.order-card h3{font-size:1.05rem;font-weight:700;margin-bottom:6px;color:var(--primary)}
.order-card .meta{margin-bottom:10px;font-size:0.88rem;color:#6b7280;line-height:1.5}
.pill{
  display:inline-block;background:#eef2f7;color:var(--primary);
  padding:6px 12px;border-radius:999px;font-weight:700;font-size:0.82rem;
}
.actions{margin-top:14px}
.download{
  display:inline-block;text-align:center;width:100%;
  background:linear-gradient(90deg,#4f46e5,#06b6d4);color:#fff;
  padding:11px 14px;border-radius:10px;text-decoration:none;font-weight:700;
}

.empty{
  padding:26px;text-align:center;color:#6b7280;
  background:white;border-radius:14px;box-shadow:0 18px 40px rgba(0,0,0,0.06);
}

.loader{
  width:24px;height:24px;border:4px solid rgba(0,0,0,0.06);
  border-top:4px solid var(--accent);border-radius:50%;
  animation:spin 0.7s linear infinite;margin:6px auto 0;
}
@keyframes spin{ to{transform:rotate(360deg)} }

/* ---------------- FOOTER (shared with index.html) ---------------- */
footer{margin-top:32px;background:#0f172a;padding:28px;border-radius:10px;color:white;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
footer .brand{font-weight:700;font-size:1.1rem;color:#fbbf24}

@media (max-width:480px){
  .track-panel{flex-direction:column}
  .btn{width:100%}
}

/* ---------------- ORDER DETAIL OVERLAY (multi-book orders) ---------------- */
.order-detail-overlay{
  position:fixed;inset:0;background:#fff;z-index:5000;
  display:none;flex-direction:column;
  padding:22px 18px;overflow-y:auto;
}
.order-detail-overlay.show{display:flex;animation:fadeIn 180ms ease;}
.order-detail-inner{max-width:640px;width:100%;margin:0 auto;}
.order-detail-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
.order-detail-header h2{font-size:1.2rem;color:var(--primary);}
.order-detail-close{background:none;border:none;font-size:1.4rem;cursor:pointer;color:var(--primary);padding:4px;}

.order-detail-item{
  background:#f8fafc;border-radius:10px;padding:14px;margin-bottom:10px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
}
.order-detail-item-title{font-weight:700;flex:1;min-width:140px;}
.order-detail-item-price{color:#6b7280;font-weight:700;}
.order-detail-item .download{width:auto;padding:9px 16px;}
</style>
</head>

<body>

<header>
  <h1>
    <img src="MINDSHIFT.jpg" alt="MindShift logo" style="width:36px;height:36px;border-radius:6px;">
    <span>MindShift Books</span>
  </h1>
  <div class="hamburger" onclick="toggleSidebar()" aria-label="Open menu">
    <i class="fas fa-bars"></i>
  </div>
</header>

<aside class="sidebar" id="sidebar" aria-hidden="true" data-open="false">
  <div class="logo-row">
    <img src="MINDSHIFT.jpg" alt="logo">
    <div style="font-weight:700">MindShift Books</div>
  </div>

  <ul>
    <li onclick="window.location.href='/'">Browse Books</li>
    <li class="active" onclick="toggleSidebar()">My Orders</li>
    <li onclick="openContact()">Contact Us</li>
    <li onclick="followYoutube()">Follow us on YouTube</li>
  </ul>

  <div style="position:absolute;bottom:18px;left:18px;right:18px;color:#9ca3af;font-size:0.9rem;">
    <div>© 2026 MindShift Books</div>
    <div style="margin-top:6px">Shift your thinking, change your life.</div>
  </div>
</aside>

<main>
  <section class="page-head">
    <h2>📦 Track Your Order</h2>
    <div class="muted">Enter the email used for purchase to view your orders and download links.</div>
  </section>

  <div class="track-panel">
    <input id="emailInput" type="email" placeholder="you@example.com" autocomplete="email">
    <button id="trackBtn" class="btn buy-btn">Track Order</button>
  </div>

  <div id="status"></div>
  <div id="results" class="results"></div>
</main>

<!-- FULL-SCREEN ORDER DETAIL OVERLAY (shown for orders with more than one book) -->
<div class="order-detail-overlay" id="orderDetailOverlay" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="order-detail-title">
  <div class="order-detail-inner">
    <div class="order-detail-header">
      <h2 id="order-detail-title">Order Details</h2>
      <button class="order-detail-close" id="orderDetailCloseBtn" aria-label="Close"><i class="fas fa-times"></i></button>
    </div>
    <div id="orderDetailMeta" class="muted" style="margin-bottom:16px;"></div>
    <div id="orderDetailItems"></div>
  </div>
</div>

<script>
function adjustMainPadding(){
  const header = document.querySelector('header');
  const main = document.querySelector('main');
  if (!header || !main) return;
  const h = header.getBoundingClientRect().height;
  main.style.paddingTop = (h + 24) + 'px';
}
window.addEventListener('load', adjustMainPadding);
window.addEventListener('resize', adjustMainPadding);
adjustMainPadding();

function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  const open = sidebar.getAttribute('data-open') === 'true';
  sidebar.setAttribute('data-open', open ? 'false' : 'true');
  sidebar.style.left = open ? '-300px' : '0px';
  sidebar.setAttribute('aria-hidden', open ? 'true' : 'false');
}
function openContact(){ alert('Contact: contact@mindshiftbooks.shop'); }
function followYoutube(){ window.open('https://www.youtube.com/@MindShift_Books', '_blank'); }
</script>

<script>
const status = document.getElementById('status');
const results = document.getElementById('results');
const btn = document.getElementById('trackBtn');
const input = document.getElementById('emailInput');

function escapeHtml(str) {
  if (str == null) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function formatPaidTime(order) {
  if (order.paidAt?._seconds) {
    return new Date(order.paidAt._seconds * 1000).toLocaleString();
  }
  return "";
}

// Full-screen detail view for an order that contains more than one book
function openOrderDetail(order) {
  const overlay = document.getElementById('orderDetailOverlay');
  const meta = document.getElementById('orderDetailMeta');
  const itemsEl = document.getElementById('orderDetailItems');
  if (!overlay || !meta || !itemsEl) return;

  const paidTime = formatPaidTime(order);
  const items = order.items || [];

  meta.innerHTML = `
    Ref: <strong>${escapeHtml(order.reference)}</strong><br>
    Paid: <strong>${escapeHtml(paidTime)}</strong><br>
    Total: <strong>₦${order.ngn_amount || 0}</strong>
  `;

  itemsEl.innerHTML = items.map(it => `
    <div class="order-detail-item">
      <div class="order-detail-item-title">${escapeHtml(it.title || 'Untitled')}</div>
      <div class="order-detail-item-price">$${Number(it.priceUSD || 0).toFixed(2)}</div>
      <a class="download" href="${it.pdfUrl || '#'}" target="_blank">Download</a>
    </div>
  `).join('');

  overlay.classList.add('show');
  overlay.setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';
}

function closeOrderDetail() {
  const overlay = document.getElementById('orderDetailOverlay');
  if (!overlay) return;
  overlay.classList.remove('show');
  overlay.setAttribute('aria-hidden', 'true');
  document.body.style.overflow = '';
}

document.getElementById('orderDetailCloseBtn')?.addEventListener('click', closeOrderDetail);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeOrderDetail(); });

btn.onclick = async () => {
  const email = input.value.trim().toLowerCase();
  results.innerHTML = "";
  status.textContent = "";

  if (!email) {
    status.textContent = "Please enter an email.";
    return;
  }

  status.innerHTML = `<div class="loader"></div>`;

  try {
    const res = await fetch("/api/orders?email=" + encodeURIComponent(email));
    const data = await res.json();

    if (!res.ok) throw new Error(data.error || "Failed");

    results.innerHTML = "";
    status.textContent = "";

    if (!data.count) {
      status.textContent = "";
      results.innerHTML = `<div class="empty">No orders found for that email.</div>`;
      return;
    }

    status.textContent = `Found ${data.count} order(s).`;

    data.rows.forEach(order => {
      const items = order.items || [];
      const paidTime = formatPaidTime(order);

      const card = document.createElement("div");
      card.className = "order-card";

      if (items.length <= 1) {
        // single-book order — download link goes straight on the card
        const item = items[0] || {};
        const title = item.title || "Purchased eBook";
        const pdfUrl = item.pdfUrl || "#";

        card.innerHTML = `
          <h3>${escapeHtml(title)}</h3>

          <div class="meta">
            Ref: <strong>${escapeHtml(order.reference)}</strong><br>
            Paid: <strong>${escapeHtml(paidTime)}</strong><br>
            Channel: ${escapeHtml(order.paystack?.channel || "—")}
          </div>

          <div>Amount: <span class="pill">₦${order.ngn_amount || "0"}</span></div>

          <div class="actions">
            <a class="download" href="${pdfUrl}" target="_blank">Download PDF</a>
          </div>
        `;
      } else {
        // this purchase covered more than one book — show it as one entity,
        // tapping it opens a screen listing every book in the order
        const titles = items.map(it => it.title || 'Untitled').join(', ');

        card.innerHTML = `
          <h3>${items.length} Books Purchased</h3>

          <div class="meta">
            ${escapeHtml(titles)}<br>
            Ref: <strong>${escapeHtml(order.reference)}</strong><br>
            Paid: <strong>${escapeHtml(paidTime)}</strong>
          </div>

          <div>Amount: <span class="pill">₦${order.ngn_amount || "0"}</span></div>

          <div class="actions">
            <button class="btn buy-btn view-order-btn" type="button">View Books</button>
          </div>
        `;

        card.querySelector('.view-order-btn').addEventListener('click', () => openOrderDetail(order));
      }

      results.appendChild(card);
    });

  } catch (err) {
    console.error(err);
    status.textContent = "Something went wrong. Try again.";
  }
};

input.addEventListener("keyup", e => { if (e.key === "Enter") btn.click(); });
</script>

</body>
</html>
