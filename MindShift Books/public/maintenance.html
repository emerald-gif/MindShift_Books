<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>We'll be right back | MindShift Books</title>
<link rel="shortcut icon" href="/MINDSHIFT.jpg" type="image/jpg">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: #faf9f5; color: #1c1c1c; padding: 24px;
  }
  .card {
    max-width: 420px; width: 100%; text-align: center;
    background: #fff; border-radius: 18px; padding: 40px 28px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.06);
  }
  .logo { width: 56px; height: 56px; border-radius: 12px; margin-bottom: 18px; }
  .badge {
    display: inline-block; padding: 6px 14px; border-radius: 999px;
    background: linear-gradient(90deg,#4f46e5,#06b6d4); color: #fff;
    font-size: 0.72rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
    margin-bottom: 16px;
  }
  h1 { font-size: 1.25rem; font-weight: 800; margin: 0 0 10px; }
  p { color: #64748b; font-size: 0.92rem; line-height: 1.6; margin: 0 0 6px; }
  .eta { font-size: 0.8rem; color: #94a3b8; margin-top: 18px; }
</style>
</head>
<body>
  <div class="card">
    <img class="logo" src="/MINDSHIFT.jpg" alt="MindShift Books">
    <div class="badge">Maintenance</div>
    <h1>We'll be right back</h1>
    <p>MindShift Books is temporarily down for scheduled maintenance.</p>
    <p>Please check back shortly — your books, orders, and account are safe.</p>
    <div class="eta">Thanks for your patience.</div>
  </div>
</body>
</html>
