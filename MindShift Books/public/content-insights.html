<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" href="/MINDSHIFT.jpg">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Insights · MindShift Books</title>
<meta name="description" content="Views, likes and comments for this post or article."/>
<meta name="robots" content="noindex, nofollow"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --p:#6366f1;--p2:#06b6d4;--p3:#8b5cf6;
  --g:linear-gradient(135deg,#6366f1 0%,#8b5cf6 55%,#06b6d4 100%);
  --txt:#0f172a;--sub:#64748b;--mute:#94a3b8;
  --bg:#f4f4fb;--card:#fff;--border2:#edeef5;
  --green:#10b981;--red:#ef4444;--amber:#f59e0b;--radius:20px;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 10px 28px -12px rgba(76,60,190,.16);
  --shadow-sm:0 1px 2px rgba(15,23,42,.04),0 4px 14px -6px rgba(15,23,42,.08);
}
body{font-family:'Segoe UI',system-ui,sans-serif;color:var(--txt);min-height:100vh;
  background:
    radial-gradient(circle at 12% 0%, rgba(99,102,241,.10), transparent 42%),
    radial-gradient(circle at 88% 6%, rgba(6,182,212,.08), transparent 46%),
    var(--bg);
  background-attachment:fixed}

/* ── HEADER (back-button style, matches post-read.html / article-read.html) ── */
.hdr{position:sticky;top:0;z-index:100;background:rgba(248,247,255,.92);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border2);padding:0 16px;height:56px;
  display:flex;align-items:center;justify-content:space-between;gap:8px}
.btn-back,.hdr-open{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--border2);
  background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--txt);flex-shrink:0}
.btn-back svg,.hdr-open svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.hdr-open svg{width:16px;height:16px;stroke-width:2}
.hdr-title{font-size:15px;font-weight:800;color:var(--txt);flex:1;text-align:center}

/* ── PREVIEW CARD ── */
.preview-card{margin:16px;border-radius:var(--radius);background:var(--card);box-shadow:var(--shadow);
  display:flex;gap:12px;padding:15px;cursor:pointer;align-items:flex-start;transition:transform .15s}
.preview-card:active{transform:scale(.99)}
.preview-thumb{width:64px;height:64px;border-radius:14px;flex-shrink:0;background:linear-gradient(135deg,#e0e7ff,#c7d2fe) center/cover no-repeat;
  display:flex;align-items:center;justify-content:center;color:var(--p);overflow:hidden}
.preview-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.preview-thumb svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.preview-body{flex:1;min-width:0}
.preview-title{font-weight:800;font-size:14px;color:var(--txt);line-height:1.35;margin-bottom:3px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.preview-text{font-size:13px;color:var(--sub);line-height:1.5;margin-bottom:6px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.preview-meta{font-size:11.5px;color:var(--mute);font-weight:600}

/* ── SECTION / STATS GRID (matches insights.html) ── */
.section{padding:22px 16px 0}
.section-title{font-size:15px;font-weight:900;color:var(--txt);margin-bottom:2px}
.section-sub{font-size:12.5px;color:var(--mute);margin-bottom:14px}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat-card{background:var(--card);border-radius:18px;box-shadow:var(--shadow-sm);
  padding:15px;display:flex;flex-direction:column;gap:10px}
.stat-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  background:transparent;border:1.5px solid var(--border2)}
.stat-icon svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;color:#1e293b}
.stat-value{font-size:22px;font-weight:900;color:var(--txt)}
.stat-label{font-size:11.5px;color:var(--mute);font-weight:600}

/* ── TREND CARD (matches insights.html) ── */
.day-pills{display:flex;gap:8px;margin-bottom:14px}
.day-pill{padding:7px 15px;border-radius:99px;border:1.5px solid var(--border2);background:var(--card);
  font-size:12.5px;font-weight:700;color:var(--sub);cursor:pointer;font-family:inherit;transition:all .15s}
.day-pill.active{background:var(--txt);color:#fff;border-color:var(--txt)}
.trend-card{background:var(--card);border-radius:var(--radius);padding:20px 18px 18px;box-shadow:var(--shadow)}
.trend-chart-wrap{width:100%}
.trend-chart-wrap svg{width:100%;height:auto;display:block;overflow:visible}
.trend-axis{display:flex;justify-content:space-between;font-size:10.5px;color:var(--mute);font-weight:700;margin-top:8px}
.trend-total{font-size:12px;color:var(--mute);font-weight:600;margin-top:14px;padding-top:14px;border-top:1px solid var(--border2);text-align:center}
.today-summary{display:flex;align-items:center;justify-content:center;padding:14px 0}
.today-summary-item{text-align:center}
.today-summary-value{font-size:36px;font-weight:900;color:var(--txt);line-height:1}
.today-summary-label{font-size:11.5px;color:var(--mute);font-weight:700;margin-top:6px}

/* ── ENGAGEMENT LIST ── */
.metric-list{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.metric-row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border2)}
.metric-row:last-child{border-bottom:none}
.metric-icon{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.metric-icon svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.metric-icon.like{background:linear-gradient(135deg,#fee2e2,#fecaca);color:#dc2626}
.metric-icon.comment{background:linear-gradient(135deg,#fef3c7,#fde68a);color:#d97706}
.metric-icon.repost{background:linear-gradient(135deg,#cffafe,#a5f3fc);color:#0891b2}
.metric-label{flex:1;font-size:13.5px;font-weight:700;color:var(--txt)}
.metric-value{font-size:15px;font-weight:900;color:var(--txt)}

/* ── COMMENT PULSE ── */
.pulse-row{padding:14px 16px;border-bottom:1px solid var(--border2)}
.pulse-row:last-child{border-bottom:none}
.pulse-pin{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.pulse-pin-icon{font-size:16px;flex-shrink:0;margin-top:1px}
.pulse-pin-body{flex:1;min-width:0}
.pulse-pin-lbl{font-size:11px;font-weight:800;color:var(--p);margin-bottom:2px}
.pulse-pin-txt{font-size:13px;color:var(--txt);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pulse-reply-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.pulse-reply-lbl{font-size:13.5px;font-weight:700;color:var(--txt)}
.pulse-reply-val{font-size:12.5px;font-weight:700;color:var(--mute)}
.pulse-bar-track{height:8px;border-radius:99px;background:var(--border2);overflow:hidden}
.pulse-bar-fill{height:100%;border-radius:99px;background:var(--g)}

/* ── PERMANENT COMMENT MANAGER LINK CARD (always visible, top of page) ── */
.cm-link-card{margin:0 16px 16px;border-radius:var(--radius);background:var(--card);box-shadow:var(--shadow);
  padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer}
.cm-link-icon{width:38px;height:38px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#fef3c7,#fde68a);color:#d97706}
.cm-link-icon svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cm-link-body{flex:1;min-width:0}
.cm-link-top{display:flex;align-items:center;gap:6px;margin-bottom:2px}
.cm-link-lbl{font-size:11.5px;font-weight:800;color:var(--p);text-transform:uppercase;letter-spacing:.3px}
.cm-link-dot{width:6px;height:6px;border-radius:50%;background:var(--green)}
.cm-link-txt{font-size:13.5px;color:var(--txt);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cm-link-txt b{font-weight:800}
.cm-link-time{font-size:11px;color:var(--mute);font-weight:600;margin-top:2px}
.cm-link-chev{width:18px;height:18px;flex-shrink:0;color:var(--mute)}
.cm-link-chev svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}

/* ── EMPTY STATE ── */
.empty-state{text-align:center;padding:60px 24px}
.empty-state svg{width:42px;height:42px;color:#d1d5db;margin:0 auto 12px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.empty-state p{font-size:13.5px;color:var(--mute);line-height:1.6}
.empty-state strong{display:block;font-size:15px;font-weight:800;color:var(--txt);margin-bottom:6px}

/* ── SKELETON ── */
.skel{background:linear-gradient(90deg,#f0f0f0 25%,#e0e0e0 50%,#f0f0f0 75%);
  background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:8px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.skel-stat-val{height:22px;width:50px;border-radius:6px}
.skel-card{height:140px;border-radius:20px}
.skel-row{height:46px;border-radius:10px;margin-bottom:10px}
.skel-thumb{width:64px;height:64px;border-radius:14px;flex-shrink:0}
.skel-line{height:13px;border-radius:6px;margin-bottom:8px}

.bottom-pad{height:24px}
</style>
</head>
<body>

<header class="hdr">
  <button class="btn-back" onclick="history.back()" aria-label="Back">
    <svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
  </button>
  <div class="hdr-title" id="hdrType">Insights</div>
  <button class="hdr-open" id="hdrOpen" aria-label="Open post">
    <svg viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
  </button>
</header>

<div id="stateContainer" style="display:none"></div>

<div id="mainContent">

  <!-- CONTENT PREVIEW -->
  <div class="preview-card" id="previewCard">
    <div class="preview-thumb skel skel-thumb" id="previewThumb"></div>
    <div class="preview-body" id="previewBody">
      <div class="skel skel-line" style="width:80%"></div>
      <div class="skel skel-line" style="width:55%"></div>
      <div class="skel skel-line" style="width:35%;margin-bottom:0"></div>
    </div>
  </div>

  <!-- PERMANENT: always-visible link into Comment Manager, showing its latest activity -->
  <div class="cm-link-card" id="cmLinkCard">
    <div class="cm-link-icon">
      <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg>
    </div>
    <div class="cm-link-body">
      <div class="cm-link-top"><span class="cm-link-lbl">Comment Manager</span></div>
      <div class="cm-link-txt skel skel-line" style="width:90%"></div>
    </div>
    <div class="cm-link-chev"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></div>
  </div>

  <!-- STATS GRID -->
  <div class="section">
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon views">
          <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </div>
        <div class="stat-value" id="statViews"><div class="skel skel-stat-val"></div></div>
        <div class="stat-label">Views</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon engagement">
          <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>
        </div>
        <div class="stat-value" id="statEngagement"><div class="skel skel-stat-val"></div></div>
        <div class="stat-label">Engagement</div>
      </div>
    </div>
  </div>

  <!-- VIEWS TREND -->
  <div class="section">
    <div class="section-title">Views</div>
    <div class="section-sub">Daily views for this content</div>
    <div class="day-pills">
      <button class="day-pill" data-days="1" onclick="setTrendDays(1)">Today</button>
      <button class="day-pill" data-days="7" onclick="setTrendDays(7)">7 days</button>
      <button class="day-pill active" data-days="14" onclick="setTrendDays(14)">14 days</button>
      <button class="day-pill" data-days="28" onclick="setTrendDays(28)">28 days</button>
    </div>
    <div class="trend-card" id="trendCard">
      <div class="skel skel-card"></div>
    </div>
  </div>

  <!-- ENGAGEMENT BREAKDOWN -->
  <div class="section">
    <div class="section-title"><span id="engagementCount">0</span> Engagement</div>
    <div class="section-sub">Likes and comments on this content</div>
    <div class="metric-list" id="engagementList">
      <div class="skel skel-row"></div>
      <div class="skel skel-row"></div>
    </div>
  </div>

  <!-- COMMENT PULSE: the missing link back from comment-manager -->
  <div class="section" id="pulseSection" style="display:none">
    <div class="section-title">Comment Pulse</div>
    <div class="section-sub">What's happening in your comments, at a glance</div>
    <div class="metric-list" id="pulseList"></div>
  </div>

  <div class="bottom-pad"></div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js';
import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js';
import { getFirestore, doc, getDoc, collection, query, where, orderBy, limit, getDocs, enableNetwork, disableNetwork } from 'https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js';
import { createResilient, isTransient } from '/resilient.js';

const fbApp = initializeApp({
  apiKey:"AIzaSyDTn70s1_uIiSOR6lPLY_nKh8Ff1FViFCs",
  authDomain:"mindshiftbooks-c4451.firebaseapp.com",
  projectId:"mindshiftbooks-c4451",
  storageBucket:"mindshiftbooks-c4451.firebasestorage.app",
  messagingSenderId:"388697987853",
  appId: "1:388697987853:web:f023df9412c22285012e44",
  measurementId: "G-CHPJDQ4W08"
});
const auth = getAuth(fbApp);
const db   = getFirestore(fbApp, 'default');
const { resilient, reconnectFirestore } = createResilient({ db, enableNetwork, disableNetwork });

let currentTrendDays = 14;
let _dayMap = {};
const ICONS = {
  eye: `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`,
  heart: `<path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/>`,
  comment: `<path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/>`,
  repost: `<path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 014-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 01-4 4H3"/>`,
  doc: `<path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/>`
};

// ── Which content this page is scoped to (set by whatever linked here —
// a profile post card or a row in the main /insights list) ──
const params = new URLSearchParams(location.search);
const contentId   = params.get('id');
const contentType = params.get('type') === 'article' ? 'article' : 'post';
const isPost = contentType === 'post';
const idField = isPost ? 'postId' : 'articleId';   // matches comment-manager.html's schema

document.getElementById('hdrType').textContent = isPost ? 'Post Insights' : 'Article Insights';

let _ciUid = null;
let _ciState = 'idle'; // 'loading' | 'ok' | 'error'
onAuthStateChanged(auth, async user => {
  if (!user) { window.location.href = '/login'; return; }
  _ciUid = user.uid;
  await loadContentInsights(user.uid);
});

// Retry + automatic recovery (long-idle tab, network back).
window.retryInsights = async function () {
  await reconnectFirestore();
  document.getElementById('stateContainer').style.display = 'none';
  document.getElementById('mainContent').style.display = '';
  if (_ciUid) loadContentInsights(_ciUid);
};
document.addEventListener('visibilitychange', () => { if (!document.hidden && _ciState === 'error') retryInsights(); });
window.addEventListener('online', () => { if (_ciState === 'error') retryInsights(); });

async function loadContentInsights(uid) {
  if (!contentId) {
    showEmpty('Content not found', "We couldn't find this post or article.");
    return;
  }
  _ciState = 'loading';
  try {
    const contentCol = isPost ? 'posts' : 'articles';
    const metaCol     = isPost ? 'postMeta' : 'articleMeta';
    const viewsCol    = isPost ? 'postViews' : 'articleViews';

    const contentSnap = await resilient(() => getDoc(doc(db, contentCol, contentId)));
    if (!contentSnap.exists()) {
      showEmpty('Content not found', "This post or article may have been deleted.");
      return;
    }
    const content = contentSnap.data();

    // Insights are private to the author — same rule the profile page already
    // uses to decide what to show an owner vs. a visitor.
    if (content.authorUid !== uid) {
      showEmpty('Not available', "You can only view insights for your own posts and articles.");
      return;
    }

    // A network failure here used to be swallowed as "0 views / 0 likes",
    // showing a creator false zeros. Now transient failures surface the
    // "Could not load" + Try again state; only permanent errors (e.g. a
    // rules denial on an optional counter doc) still fall back to empty.
    const softGet = ref => resilient(() => getDoc(ref), { tries: 2 })
      .catch(e => { if (isTransient(e)) throw e; return null; });
    const [metaSnap, likeSnap, viewsSnap, repostSnap] = await Promise.all([
      softGet(doc(db, metaCol, contentId)),
      softGet(doc(db, 'articleLikes', contentId)),
      softGet(doc(db, viewsCol, contentId)),
      softGet(doc(db, 'repostCounts', contentId))
    ]);

    const metaData = metaSnap && metaSnap.exists() ? metaSnap.data() : {};
    const views    = metaData.viewCount || 0;
    const comments = metaData.commentCount || 0;
    const likes    = likeSnap && likeSnap.exists() ? (likeSnap.data().count || 0) : 0;
    const reposts  = repostSnap && repostSnap.exists() ? (repostSnap.data().count || 0) : 0;
    const dayMap   = viewsSnap && viewsSnap.exists() ? (viewsSnap.data().days || {}) : {};
    // Written by comment-manager.html when the creator pins a comment or replies —
    // this is the link back from comments into insights.
    const pinnedText   = metaData.pinnedCommentText || '';
    const pinnedAuthor = metaData.pinnedCommentAuthorName || '';
    const creatorReplyCount = metaData.creatorReplyCount || 0;

    renderPreview(content);
    // Permanent card — fetched separately so a hiccup in likes/views/reposts
    // never takes down the one thing that's always supposed to be there.
    renderLatestCommentCard();
    setNum('statViews', views);
    // Matches the Founding Creator weekly target's definition of
    // engagement (likes+comments+reposts) — same word, same meaning,
    // everywhere in the app.
    setNum('statEngagement', likes + comments + reposts);
    _dayMap = dayMap;
    renderTrend(_dayMap, currentTrendDays);
    renderEngagement(likes, comments, reposts);
    renderPulse(comments, creatorReplyCount, pinnedText, pinnedAuthor);
    _ciState = 'ok';

  } catch (e) {
    console.error('loadContentInsights failed:', e && e.code, e && e.message);
    _ciState = 'error';
    showEmpty('Could not load insights', 'Check your connection and try again.', true);
  }
}

function renderPreview(c) {
  const img = isPost ? (c.images && c.images[0]) : c.cover;
  const title = isPost ? '' : (c.title || 'Untitled');
  const body  = isPost ? (c.text || '') : (c.brief || '');
  const when  = fmtDate(c.publishedAt || c.createdAt);
  const readHref = isPost ? `/post-read?id=${contentId}` : `/article-read?id=${contentId}`;

  document.getElementById('previewThumb').className = 'preview-thumb';
  document.getElementById('previewThumb').innerHTML = img
    ? `<img src="${img}" alt="">`
    : `<svg viewBox="0 0 24 24">${ICONS.doc}</svg>`;

  document.getElementById('previewBody').innerHTML = `
    ${title ? `<div class="preview-title">${esc(title)}</div>` : ''}
    ${body ? `<div class="preview-text">${esc(nTrunc(body, 140))}</div>` : ''}
    <div class="preview-meta">${when}</div>
  `;

  document.getElementById('previewCard').onclick = () => location.href = readHref;
  document.getElementById('hdrOpen').onclick = () => location.href = readHref;
}

function smoothLine(pts){
  if (pts.length < 2) return `M${pts[0].x},${pts[0].y}`;
  let d = `M${pts[0].x},${pts[0].y}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i];
    const p1 = pts[i];
    const p2 = pts[i + 1];
    const p3 = pts[i + 2] || p2;
    const cp1x = p1.x + (p2.x - p0.x) / 6;
    const cp1y = p1.y + (p2.y - p0.y) / 6;
    const cp2x = p2.x - (p3.x - p1.x) / 6;
    const cp2y = p2.y - (p3.y - p1.y) / 6;
    d += ` C${cp1x.toFixed(1)},${cp1y.toFixed(1)} ${cp2x.toFixed(1)},${cp2y.toFixed(1)} ${p2.x.toFixed(1)},${p2.y.toFixed(1)}`;
  }
  return d;
}

// Exposed on window — see the matching note in insights.html: a top-level
// function inside type="module" is module-scoped, not global, so the
// inline onclick on these pills couldn't reach it without this.
window.setTrendDays = function(days){
  currentTrendDays = days;
  document.querySelectorAll('.day-pill').forEach(b => b.classList.toggle('active', Number(b.dataset.days) === days));
  renderTrend(_dayMap, days);
}

function renderTrend(dayMap, days) {
  days = days || currentTrendDays;
  const start = new Date(); start.setHours(0, 0, 0, 0); start.setDate(start.getDate() - (days - 1));
  const daySeries = [];
  for (let i = 0; i < days; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const key = `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
    daySeries.push(dayMap[key] || 0);
  }
  const total = daySeries.reduce((a, b) => a + b, 0);
  const card = document.getElementById('trendCard');

  // "Today" is a single point — no line to draw, just show the number.
  if (days === 1) {
    card.innerHTML = `
      <div class="today-summary">
        <div class="today-summary-item">
          <div class="today-summary-value">${total.toLocaleString()}</div>
          <div class="today-summary-label">View${total === 1 ? '' : 's'} today</div>
        </div>
      </div>`;
    return;
  }

  if (total === 0) {
    card.innerHTML = emptyStateHtml(ICONS.eye, "Not enough data yet.<br>Daily views will start building a trend here.");
    return;
  }

  const max = Math.max(...daySeries, 1);
  const w = 280, h = 112, padTop = 10, padBottom = 10;
  const innerH = h - padTop - padBottom;
  const step = w / (days - 1);
  const pts = daySeries.map((v, i) => ({
    x: +(i * step).toFixed(1),
    y: +(padTop + innerH - (v / max) * innerH).toFixed(1)
  }));
  const linePath = smoothLine(pts);
  const baseline = h - padBottom;
  const areaPath = `${linePath} L${pts[pts.length - 1].x},${baseline} L${pts[0].x},${baseline} Z`;

  // Four evenly-spaced date labels instead of just start/end.
  const fmt = d => d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  const labelIdx = [0, Math.round((days - 1) / 3), Math.round(2 * (days - 1) / 3), days - 1];
  const labelsHtml = labelIdx.map(i => {
    const d = new Date(start); d.setDate(d.getDate() + i);
    return `<span>${fmt(d)}</span>`;
  }).join('');

  card.innerHTML = `
    <div class="trend-chart-wrap">
      <svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
        <defs>
          <linearGradient id="ciTrendFill" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="var(--p)" stop-opacity="0.34"/>
            <stop offset="100%" stop-color="var(--p)" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <line x1="0" y1="${(h / 2).toFixed(1)}" x2="${w}" y2="${(h / 2).toFixed(1)}" stroke="var(--border2)" stroke-width="1" stroke-dasharray="3 4"/>
        <path d="${areaPath}" fill="url(#ciTrendFill)" stroke="none"/>
        <path d="${linePath}" fill="none" stroke="var(--p)" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="trend-axis">${labelsHtml}</div>
    <div class="trend-total">${total} view${total === 1 ? '' : 's'} in the last ${days} days</div>
  `;
}

function renderEngagement(likes, comments, reposts) {
  reposts = reposts || 0;
  document.getElementById('engagementCount').textContent = (likes + comments + reposts).toLocaleString();
  document.getElementById('engagementList').innerHTML = `
    <div class="metric-row">
      <div class="metric-icon like"><svg viewBox="0 0 24 24">${ICONS.heart}</svg></div>
      <div class="metric-label">Likes</div>
      <div class="metric-value">${likes.toLocaleString()}</div>
    </div>
    <div class="metric-row" style="cursor:pointer" onclick="location.href='/comment-manager?type=${contentType}&id=${encodeURIComponent(contentId)}'">
      <div class="metric-icon comment"><svg viewBox="0 0 24 24">${ICONS.comment}</svg></div>
      <div class="metric-label">Comments<div style="font-size:11px;font-weight:700;color:var(--p);margin-top:2px">Manage comments &rsaquo;</div></div>
      <div class="metric-value">${comments.toLocaleString()}</div>
    </div>
    <div class="metric-row">
      <div class="metric-icon repost"><svg viewBox="0 0 24 24">${ICONS.repost}</svg></div>
      <div class="metric-label">Reposts</div>
      <div class="metric-value">${reposts.toLocaleString()}</div>
    </div>
  `;
}

// ── PERMANENT: always shows, points into Comment Manager, and — when a
// comment exists — shows the latest thing that happened there. This is
// separate from renderPulse() below: that one only fills in once there's
// pin/reply-rate data, this one is always present as the ecosystem link. ──
async function renderLatestCommentCard() {
  const card = document.getElementById('cmLinkCard');
  const manageHref = `/comment-manager?type=${contentType}&id=${encodeURIComponent(contentId)}`;
  card.onclick = () => location.href = manageHref;

  try {
    const q = query(
      collection(db, 'comments'),
      where(idField, '==', contentId),
      orderBy('createdAt', 'desc'),
      limit(1)
    );
    const snap = await resilient(() => getDocs(q), { tries: 2 });
    const top = snap.empty ? null : snap.docs[0].data();

    if (!top) {
      card.querySelector('.cm-link-top').innerHTML = `<span class="cm-link-lbl">Comment Manager</span>`;
      card.querySelector('.cm-link-body').innerHTML = `
        <div class="cm-link-top"><span class="cm-link-lbl">Comment Manager</span></div>
        <div class="cm-link-txt" style="color:var(--mute)">No comments yet — open Manager to see them as they come in.</div>`;
      return;
    }

    const isReply = !!top.parentId;
    // Personalise: your own latest comment reads "You replied", and anyone else is shown
    // under their CURRENT profile name (comments only store the name they had when posting).
    const mine = !!(top.authorUid && top.authorUid === _ciUid);
    let who = top.authorName || 'Someone';
    if (!mine && top.authorUid) {
      try {
        const us = await resilient(() => getDoc(doc(db, 'users', top.authorUid)), { tries: 1 });
        if (us.exists() && us.data().name) who = us.data().name;
      } catch (e) { /* keep the stored name */ }
    }
    card.querySelector('.cm-link-body').innerHTML = `
      <div class="cm-link-top">
        <span class="cm-link-lbl">Comment Manager</span><span class="cm-link-dot"></span>
      </div>
      <div class="cm-link-txt"><b>${mine ? 'You' : esc(who)}</b> ${isReply ? 'replied' : 'commented'}: ${esc(nTrunc(top.text || '', 80))}</div>
      <div class="cm-link-time">${ago(top.createdAt)}</div>`;
  } catch (e) {
    // Permanent card degrades to a plain link rather than disappearing.
    // Common cause on first run: Firestore wants a composite index for
    // (idField, createdAt) — check the console for a direct "create index" link.
    console.error('renderLatestCommentCard:', e && e.code, e && e.message);
    card.querySelector('.cm-link-body').innerHTML = `
      <div class="cm-link-top"><span class="cm-link-lbl">Comment Manager</span></div>
      <div class="cm-link-txt" style="color:var(--mute)">Open Manager to view and reply to comments.</div>`;
  }
}
function ago(ts) {
  if (!ts) return '';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  const s = Math.floor((Date.now() - d.getTime()) / 1000);
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  if (s < 86400) return Math.floor(s / 3600) + 'h ago';
  return Math.floor(s / 86400) + 'd ago';
}

function renderPulse(comments, creatorReplyCount, pinnedText, pinnedAuthor) {
  const section = document.getElementById('pulseSection');
  const list = document.getElementById('pulseList');
  const manageHref = `/comment-manager?type=${contentType}&id=${encodeURIComponent(contentId)}`;
  section.style.display = '';

  // No comments at all yet — show a clear empty state instead of hiding the
  // section, so it's obvious the feature exists rather than looking broken.
  if (!comments && !pinnedText) {
    list.innerHTML = `
      <div class="pulse-row" style="cursor:pointer;text-align:center;color:var(--mute);font-size:13px" onclick="location.href='${manageHref}'">
        No comments yet. Once people comment, pin your favorite and track your reply rate here.
      </div>`;
    return;
  }

  const rows = [];
  if (pinnedText) {
    rows.push(`
      <div class="pulse-row pulse-pin" onclick="location.href='${manageHref}'">
        <div class="pulse-pin-icon">📌</div>
        <div class="pulse-pin-body">
          <div class="pulse-pin-lbl">Pinned comment</div>
          <div class="pulse-pin-txt"><strong>${esc(pinnedAuthor)}:</strong> ${esc(nTrunc(pinnedText, 100))}</div>
        </div>
      </div>`);
  } else {
    rows.push(`
      <div class="pulse-row" style="cursor:pointer;color:var(--mute);font-size:12.5px" onclick="location.href='${manageHref}'">
        No comment pinned yet — tap to pick one in Manage Comments.
      </div>`);
  }
  if (comments > 0) {
    const pct = Math.max(0, Math.min(100, Math.round((creatorReplyCount / comments) * 100)));
    rows.push(`
      <div class="pulse-row" style="cursor:pointer" onclick="location.href='${manageHref}'">
        <div class="pulse-reply-top">
          <div class="pulse-reply-lbl">Your reply rate</div>
          <div class="pulse-reply-val">${creatorReplyCount} of ${comments} (${pct}%)</div>
        </div>
        <div class="pulse-bar-track"><div class="pulse-bar-fill" style="width:${pct}%"></div></div>
      </div>`);
  }
  list.innerHTML = rows.join('');
}

function showEmpty(title, sub, retry) {
  document.getElementById('mainContent').style.display = 'none';
  const s = document.getElementById('stateContainer');
  s.innerHTML = emptyStateHtml(ICONS.eye, `<strong>${title}</strong>${sub}` +
    (retry ? `<br><button onclick="retryInsights()" style="margin-top:14px;background:var(--p,#4f46e5);color:#fff;border:none;padding:10px 22px;border-radius:99px;font-size:13.5px;font-weight:700;cursor:pointer">Try again</button>` : ''));
  s.style.display = 'block';
}

function emptyStateHtml(iconPath, html) {
  return `<div class="empty-state"><svg viewBox="0 0 24 24">${iconPath}</svg><p>${html}</p></div>`;
}

function setNum(id, val) {
  const el = document.getElementById(id);
  if (el) el.textContent = (val || 0).toLocaleString();
}
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function nTrunc(s, n) { return s.length > n ? s.slice(0, n) + '…' : s; }
function fmtDate(ts) {
  if (!ts) return '';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) +
    ' · ' + d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
}
