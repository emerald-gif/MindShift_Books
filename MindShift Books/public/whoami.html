<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Who Am I Challenge | MindShift Books</title>
<meta name="description" content="5 quick questions. 60 seconds. Find out who you are."/>
<link rel="shortcut icon" href="MINDSHIFT.jpg" type="image/jpg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: 'Inter', sans-serif;
    background-color: #f1f0ea;
    background-image: linear-gradient(90deg, rgba(15,23,42,0.035) 1px, transparent 1px);
    background-size: 34px 100%;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 22px 16px;
  }
  .wa-wrap { width: 100%; max-width: 400px; }

  .wa-stage { position: relative; }
  .wa-stage::before, .wa-stage::after {
    content: ''; position: absolute; left: 50%; border-radius: 20px; background: #fff;
    box-shadow: 0 6px 18px rgba(15,23,42,0.05);
  }
  .wa-stage::before { width: 88%; height: 100%; top: 0; bottom: auto; transform: translateX(-50%) rotate(-5.5deg); opacity: 0.55; }
  .wa-stage::after { width: 92%; height: 100%; top: 0; bottom: auto; transform: translateX(-50%) rotate(1.5deg); opacity: 0.8; }

  @keyframes waCardIn {
    from { opacity: 0; transform: translateY(16px) rotate(-1.5deg); }
    to { opacity: 1; transform: translateY(0) rotate(-1.1deg); }
  }
  .wa-card {
    animation: waCardIn 0.4s cubic-bezier(0.22, 1, 0.36, 1) both;
    transform: rotate(-1.1deg);
  }

  .wa-card {
    position: relative; background: #fff; border-radius: 20px; padding: 20px 18px;
    box-shadow: 0 20px 40px rgba(15,23,42,0.08); z-index: 2;
  }

  .wa-segs { display: flex; gap: 5px; margin-bottom: 16px; }
  .wa-seg { flex: 1; height: 4px; border-radius: 999px; background: #e7e5df; }
  .wa-seg.filled { background: #0f172a; }

  .wa-qlabel { font-size: 0.68rem; font-weight: 700; letter-spacing: 0.08em; color: #06b6d4; text-transform: uppercase; margin-bottom: 7px; }
  .wa-qtext { font-size: 1.05rem; font-weight: 800; color: #0f172a; line-height: 1.3; margin-bottom: 14px; }
  .wa-select-hint { font-size: 0.66rem; font-weight: 700; color: #94a3b8; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 9px; }

  .wa-option {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    padding: 11px 12px; border-radius: 12px; border: 1.5px solid #edece6; background: #fff;
    font-size: 0.84rem; color: #1e293b; margin-bottom: 7px; cursor: pointer; font-family: inherit; line-height: 1.32;
  }
  .wa-option .dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid #cbd5c8; flex-shrink: 0; position: relative; }
  .wa-option.selected { border-color: #0f172a; background: #f8faf8; }
  .wa-option.selected .dot { border-color: #0f172a; }
  .wa-option.selected .dot::after { content: ''; position: absolute; inset: 3px; border-radius: 50%; background: #0f172a; }

  .wa-nav-row { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; }
  .wa-back-btn { background: none; border: none; font-family: inherit; font-size: 0.85rem; font-weight: 700; color: #94a3b8; cursor: pointer; padding: 8px 4px; }
  .wa-back-btn:disabled { visibility: hidden; }
  .wa-next-btn {
    background: linear-gradient(90deg,#4f46e5,#06b6d4); color: #fff; border: none; border-radius: 999px;
    padding: 11px 24px; font-weight: 700; font-size: 0.87rem; cursor: pointer; font-family: inherit;
  }
  .wa-next-btn:disabled { opacity: 0.35; cursor: not-allowed; }

  .wa-start-title { font-size: 1.3rem; font-weight: 800; color: #0f172a; text-align: center; margin-bottom: 8px; line-height: 1.3; }
  .wa-start-sub { font-size: 0.85rem; color: #64748b; text-align: center; line-height: 1.55; margin-bottom: 20px; }
  .wa-hero-img-wrap { border-radius: 16px; overflow: hidden; margin-bottom: 16px; background: #e5e0ff; }
  .wa-hero-img { display: block; width: 100%; height: auto; }
  .wa-start-btn {
    width: 100%; background: linear-gradient(90deg,#4f46e5,#06b6d4); color: #fff; border: none;
    border-radius: 999px; padding: 14px; font-weight: 700; font-size: 0.92rem; cursor: pointer; font-family: inherit;
  }
  .wa-start-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .wa-meta-row { display: flex; justify-content: center; gap: 16px; margin-top: 16px; }
  .wa-meta-item { text-align: center; font-size: 0.7rem; color: #94a3b8; font-weight: 600; }
  .wa-meta-item b { display: block; font-size: 0.92rem; color: #0f172a; font-weight: 800; }

  .wa-name-label { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.08em; color: #06b6d4; text-transform: uppercase; margin-bottom: 8px; text-align: center; }
  .wa-name-input {
    width: 100%; padding: 13px 15px; border-radius: 12px; border: 1.5px solid #edece6;
    font-size: 0.95rem; font-family: inherit; color: #0f172a; margin-bottom: 16px; text-align: center;
  }
  .wa-name-input:focus { outline: none; border-color: #06b6d4; }

  /* Result card — same light system as question cards */
  .wa-result-card .rc-logo-wrap {
    width: 52px; height: 52px; border-radius: 14px; background: #f0f9ff; display: flex; align-items: center;
    justify-content: center; margin: 0 auto 12px; overflow: hidden;
  }
  .wa-result-card .rc-logo-wrap img { width: 100%; height: 100%; object-fit: cover; }
  .wa-result-card .rc-eyebrow { font-size: 0.68rem; font-weight: 700; letter-spacing: 0.08em; color: #06b6d4; text-transform: uppercase; text-align: center; margin-bottom: 6px; }
  .wa-result-card .rc-greeting { text-align: center; font-size: 0.8rem; color: #94a3b8; font-weight: 600; margin-bottom: 3px; }
  .wa-result-card .rc-name { font-size: 1.3rem; font-weight: 800; color: #0f172a; text-align: center; margin-bottom: 12px; }
  .wa-result-card .rc-name .rc-emoji { margin-right: 4px; }
  .wa-result-card .rc-desc { color: #64748b; font-size: 0.85rem; line-height: 1.6; text-align: center; margin-bottom: 0; }
  .wa-result-card .rc-divider { height: 1px; background: #edece6; margin: 16px 0 12px; }
  .wa-result-card .rc-footer { text-align: center; font-size: 0.72rem; color: #b7c0c9; font-weight: 600; letter-spacing: 0.02em; }

  .wa-action-row { margin-top: 16px; display: flex; flex-direction: column; gap: 9px; }
  .wa-share-btn {
    width: 100%; padding: 13px; border-radius: 999px; border: none;
    background: linear-gradient(90deg,#4f46e5,#06b6d4); color: #fff; font-weight: 700; font-size: 0.9rem; cursor: pointer; font-family: inherit;
  }
  .wa-retake-btn {
    width: 100%; padding: 12px; border-radius: 999px; border: 1.5px solid #e2e8f0; background: #fff;
    color: #0f172a; font-weight: 700; font-size: 0.86rem; cursor: pointer; font-family: inherit;
  }
  .wa-copied-note { text-align: center; font-size: 0.76rem; color: #06b6d4; font-weight: 700; margin-top: -2px; display: none; }
  .wa-download-btn {
    width: 100%; padding: 12px; border-radius: 999px; border: 1.5px solid #0f172a; background: #fff;
    color: #0f172a; font-weight: 700; font-size: 0.86rem; cursor: pointer; font-family: inherit;
    display: flex; align-items: center; justify-content: center; gap: 7px;
  }
  .wa-download-btn:disabled { opacity: 0.5; cursor: wait; }
  .wa-social-label { font-size: 0.66rem; font-weight: 700; letter-spacing: 0.06em; color: #94a3b8; text-transform: uppercase; text-align: center; margin: 6px 0 2px; }
  .wa-social-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
  .wa-social-btn {
    width: 42px; height: 42px; border-radius: 50%; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    background: #0f172a; box-shadow: 0 2px 6px rgba(15,23,42,0.15);
  }
  .wa-social-btn svg { width: 19px; height: 19px; fill: #fff; }
</style>
</head>
<body>

<div class="wa-wrap">
  <div id="waRoot"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
const QUESTIONS = [
  { q: "A big opportunity lands in your lap. Your first reaction is:",
    options: [
      { text: "\"I'll start tonight\" (you never touch it again)", type: "sprinter" },
      { text: "\"Is this even worth what they're paying?\"", type: "underpaid" },
      { text: "\"Finally, something bigger than where I am\"", type: "outgrower" },
      { text: "\"I hope they noticed my work before this\"", type: "hustler" }
    ] },
  { q: "Your friend asks how work's going. You say:",
    options: [
      { text: "\"I've got 5 things going, don't ask which ones are actually moving\"", type: "sprinter" },
      { text: "\"Busy. Underpaid. You know how it is\"", type: "underpaid" },
      { text: "\"Same people, same conversations, I need something different\"", type: "outgrower" },
      { text: "\"Grinding, waiting for the right person to notice\"", type: "hustler" }
    ] },
  { q: "Someone asks what you charge. You:",
    options: [
      { text: "Change the subject — haven't finished the last thing to prove it", type: "sprinter" },
      { text: "Say a number lower than what you meant", type: "underpaid" },
      { text: "Realize you've never actually asked for more", type: "outgrower" },
      { text: "Wish they'd just refer you instead of asking", type: "hustler" }
    ] },
  { q: "Your ideal Saturday:",
    options: [
      { text: "Finally finishing that one thing you started in March", type: "sprinter" },
      { text: "Anything that doesn't remind you of money", type: "underpaid" },
      { text: "Somewhere completely different from your usual crowd", type: "outgrower" },
      { text: "Working quietly, hoping the right person sees it", type: "hustler" }
    ] },
  { q: "The thought that keeps showing up at 1am:",
    options: [
      { text: "\"Why can't I just finish what I start?\"", type: "sprinter" },
      { text: "\"Am I ever going to get paid what I'm worth?\"", type: "underpaid" },
      { text: "\"Am I stuck here because of me, or everything around me?\"", type: "outgrower" },
      { text: "\"Why does everyone else find it easier to get clients?\"", type: "hustler" }
    ] }
];

const ARCHETYPES = {
  sprinter: { name: "The Sprinter", emoji: "\ud83c\udfc3",
    desc: "All momentum, no follow-through. You start everything with real energy — the hard part is still being there for the finish." },
  underpaid: { name: "The Underpaid Expert", emoji: "\ud83d\udcb0",
    desc: "You deliver real results but still feel broke or unseen for it. The skill isn't the problem — the pricing conversation is." },
  outgrower: { name: "The Outgrower", emoji: "\ud83c\udf31",
    desc: "You've outgrown your circle or environment but haven't left it yet. You already know — this just confirms it." },
  hustler: { name: "The Quiet Hustler", emoji: "\ud83e\udd14",
    desc: "Skilled, hardworking, invisible. You've been hoping to get noticed instead of going and getting clients directly." }
};

let currentQ = 0;
let answers = [];
let userName = '';
const waRoot = document.getElementById('waRoot');

function renderIntro() {
  waRoot.innerHTML = `
    <div class="wa-stage">
      <div class="wa-card">
        <div class="wa-hero-img-wrap"><img src="whoami-hero.png" alt="" class="wa-hero-img"></div>
        <div class="wa-start-title">The Who Am I Challenge</div>
        <div class="wa-start-sub">5 quick questions. Pick whatever feels most like you — your gut answer is the accurate one.</div>
        <button type="button" class="wa-start-btn" id="waIntroBtn">Start the Challenge</button>
        <div class="wa-meta-row">
          <div class="wa-meta-item"><b>${QUESTIONS.length}</b>Questions</div>
          <div class="wa-meta-item"><b>60s</b>Takes About</div>
          <div class="wa-meta-item"><b>0</b>Sign-ups Needed</div>
        </div>
      </div>
    </div>`;
  document.getElementById('waIntroBtn').addEventListener('click', renderNameStep);
}

function renderNameStep() {
  waRoot.innerHTML = `
    <div class="wa-stage">
      <div class="wa-card">
        <div class="wa-name-label">Before We Start</div>
        <div class="wa-start-title" style="font-size:1.15rem;">What should we call you?</div>
        <input type="text" class="wa-name-input" id="waNameInput" placeholder="Your first name" maxlength="24" autocomplete="given-name">
        <button type="button" class="wa-start-btn" id="waNameBtn" disabled>Let's Go</button>
      </div>
    </div>`;

  const input = document.getElementById('waNameInput');
  const btn = document.getElementById('waNameBtn');
  input.addEventListener('input', () => { btn.disabled = input.value.trim().length === 0; });
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !btn.disabled) btn.click(); });
  input.focus();

  btn.addEventListener('click', () => {
    userName = input.value.trim().slice(0, 24);
    currentQ = 0; answers = [];
    renderQuestion();
  });
}

function renderQuestion() {
  const item = QUESTIONS[currentQ];
  const selected = answers[currentQ];
  let segs = '';
  for (let i = 0; i < QUESTIONS.length; i++) segs += `<div class="wa-seg ${i <= currentQ ? 'filled' : ''}"></div>`;

  waRoot.innerHTML = `
    <div class="wa-stage">
      <div class="wa-card">
        <div class="wa-segs">${segs}</div>
        <div class="wa-qlabel">Question ${String(currentQ + 1).padStart(2, '0')}</div>
        <div class="wa-qtext">${item.q}</div>
        <div class="wa-select-hint">Select only one</div>
        ${item.options.map((opt, i) => `
          <button type="button" class="wa-option ${selected === i ? 'selected' : ''}" data-index="${i}">
            <span class="dot"></span><span>${opt.text}</span>
          </button>`).join('')}
        <div class="wa-nav-row">
          <button type="button" class="wa-back-btn" id="waBackBtn">Back</button>
          <button type="button" class="wa-next-btn" id="waNextBtn" ${selected === undefined ? 'disabled' : ''}>
            ${currentQ === QUESTIONS.length - 1 ? 'See My Result' : 'Next'}
          </button>
        </div>
      </div>
    </div>`;

  document.querySelectorAll('.wa-option').forEach(btn => {
    btn.addEventListener('click', () => {
      answers[currentQ] = Number(btn.dataset.index);
      // Update selection state in place — no re-render, so the card
      // doesn't replay its entrance animation on every tap.
      document.querySelectorAll('.wa-option').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      document.getElementById('waNextBtn').disabled = false;
    });
  });

  document.getElementById('waBackBtn').addEventListener('click', () => {
    if (currentQ > 0) { currentQ--; renderQuestion(); } else { renderNameStep(); }
  });

  document.getElementById('waNextBtn').addEventListener('click', () => {
    if (answers[currentQ] === undefined) return;
    if (currentQ < QUESTIONS.length - 1) { currentQ++; renderQuestion(); }
    else renderResult();
  });
}

function getWinningArchetype() {
  const scores = { sprinter: 0, underpaid: 0, outgrower: 0, hustler: 0 };
  answers.forEach((ansIndex, qIndex) => { scores[QUESTIONS[qIndex].options[ansIndex].type]++; });
  let best = 'sprinter', bestScore = -1;
  Object.keys(scores).forEach(k => { if (scores[k] > bestScore) { bestScore = scores[k]; best = k; } });
  return best;
}

function renderResult() {
  const key = getWinningArchetype();
  const a = ARCHETYPES[key];
  const shareUrl = window.location.origin + '/whoami';
  const displayName = userName || 'You';
  const caption = `I'm ${a.name} ${a.emoji} — took me 60 seconds to find out. What are you? ${shareUrl}`;

  const encUrl = encodeURIComponent(shareUrl);
  const encCaption = encodeURIComponent(caption);

  waRoot.innerHTML = `
    <div class="wa-stage">
      <div class="wa-card wa-result-card" id="waResultCard">
        <div class="rc-logo-wrap"><img src="MINDSHIFT.jpg" alt="MindShift Books" crossorigin="anonymous"></div>
        <div class="rc-eyebrow">Who Am I Challenge</div>
        <div class="rc-greeting">${displayName}, you are</div>
        <div class="rc-name"><span class="rc-emoji">${a.emoji}</span>${a.name}</div>
        <p class="rc-desc">${a.desc}</p>
        <div class="rc-divider"></div>
        <div class="rc-footer">mindshiftbooks.shop/whoami</div>
      </div>
    </div>
    <div class="wa-action-row">
      <button type="button" class="wa-download-btn" id="waDownloadBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Download My Card
      </button>
      <button type="button" class="wa-share-btn" id="waShareBtn">Share My Result</button>
      <div class="wa-copied-note" id="waCopiedNote">Copied! Paste it anywhere \ud83c\udf89</div>

      <div class="wa-social-label">Or Share Directly</div>
      <div class="wa-social-grid">
        <button type="button" class="wa-social-btn" id="waSbInstagram" title="Instagram" aria-label="Share to Instagram">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.2" cy="6.8" r="1" fill="#fff" stroke="none"/></svg>
        </button>
        <button type="button" class="wa-social-btn" id="waSbFacebook" title="Facebook" aria-label="Share to Facebook">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"><path d="M15 3h-2.5A3.5 3.5 0 0 0 9 6.5V9H6.5v3.5H9V21h3.5v-8.5H15l.5-3.5h-3V6.8c0-.7.3-1.3 1.2-1.3H15V3z"/></svg>
        </button>
        <button type="button" class="wa-social-btn" id="waSbX" title="X" aria-label="Share to X">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18.5 4h2.9l-6.35 7.26L22.5 20h-5.86l-4.6-6-5.26 6H3.9l6.8-7.77L3 4h6l4.15 5.5L18.5 4z"/></svg>
        </button>
        <button type="button" class="wa-social-btn" id="waSbPinterest" title="Pinterest" aria-label="Share to Pinterest">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M9 20c.6-2.3 1.3-5 1.9-7.6.4 1 1.5 1.6 2.6 1.6 2.2 0 3.7-2 3.7-4.4 0-2-1.7-3.9-4.3-3.9-3.3 0-5 2.3-5 4.6 0 1 .5 2.3 1.3 2.7"/></svg>
        </button>
        <button type="button" class="wa-social-btn" id="waSbWhatsapp" title="WhatsApp" aria-label="Share to WhatsApp">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 20.5 4.7 16A8.4 8.4 0 1 1 8 19.3l-4.5 1.2z"/><path d="M9 9.3c0 3.4 2.7 6.1 6.1 6.1.4 0 .8-.4.8-.9v-1.1c0-.3-.2-.5-.4-.6l-1.7-.6c-.2 0-.4 0-.5.2l-.5.7c-1.1-.5-2-1.4-2.5-2.5l.7-.5c.2-.1.2-.3.2-.5l-.6-1.7c-.1-.2-.3-.4-.6-.4H8.6c-.4 0-.7.4-.7.8"/></svg>
        </button>
        <button type="button" class="wa-social-btn" id="waSbLinkedin" title="LinkedIn" aria-label="Share to LinkedIn">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><line x1="7.5" y1="10" x2="7.5" y2="17"/><circle cx="7.5" cy="6.7" r="0.9" fill="#fff" stroke="none"/><path d="M12 17v-4.3c0-1.5 1-2.4 2.3-2.4s2.2.9 2.2 2.4V17"/><line x1="12" y1="10" x2="12" y2="17"/></svg>
        </button>
        <button type="button" class="wa-social-btn" id="waSbTelegram" title="Telegram" aria-label="Share to Telegram">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 3.5 2.7 11c-.9.4-.9 1.4.1 1.7l4.4 1.4 1.7 5.4c.2.6.9.7 1.4.3l2.4-2.7 4.4 3.3c.6.5 1.5.1 1.7-.6l3-14.4c.2-.9-.6-1.5-1.3-1.2z"/><path d="M7.2 14.1 17 6.5 9.9 13.5v3.2z"/></svg>
        </button>
      </div>
      <button type="button" class="wa-retake-btn" id="waRetakeBtn" style="margin-top: 4px;">Take It Again</button>
    </div>
  `;

  document.getElementById('waShareBtn').addEventListener('click', async () => {
    if (navigator.share) {
      try { await navigator.share({ text: caption, url: shareUrl }); return; }
      catch (e) { /* cancelled — fall through to copy */ }
    }
    try { await navigator.clipboard.writeText(caption); document.getElementById('waCopiedNote').style.display = 'block'; }
    catch (e) { alert(caption); }
  });

  document.getElementById('waDownloadBtn').addEventListener('click', async () => {
    const btn = document.getElementById('waDownloadBtn');
    const cardEl = document.getElementById('waResultCard');
    btn.disabled = true;
    const originalText = btn.innerHTML;
    btn.innerHTML = 'Preparing\u2026';
    try {
      const canvas = await html2canvas(cardEl, { scale: 2, backgroundColor: '#ffffff', useCORS: true, allowTaint: true });
      const link = document.createElement('a');
      link.download = `who-am-i-${key}.png`;
      link.href = canvas.toDataURL('image/png');
      document.body.appendChild(link);
      link.click();
      link.remove();
    } catch (e) {
      alert('Could not generate the image — try a screenshot instead.');
    } finally {
      btn.disabled = false;
      btn.innerHTML = originalText;
    }
  });

  document.getElementById('waSbFacebook').addEventListener('click', () => {
    window.open(`https://www.facebook.com/sharer/sharer.php?u=${encUrl}`, '_blank', 'noopener,width=600,height=500');
  });
  document.getElementById('waSbX').addEventListener('click', () => {
    window.open(`https://twitter.com/intent/tweet?text=${encCaption}`, '_blank', 'noopener,width=600,height=500');
  });
  document.getElementById('waSbWhatsapp').addEventListener('click', () => {
    window.open(`https://api.whatsapp.com/send?text=${encCaption}`, '_blank', 'noopener');
  });
  document.getElementById('waSbPinterest').addEventListener('click', () => {
    window.open(`https://pinterest.com/pin/create/button/?url=${encUrl}&description=${encCaption}`, '_blank', 'noopener,width=750,height=500');
  });
  document.getElementById('waSbLinkedin').addEventListener('click', () => {
    window.open(`https://www.linkedin.com/sharing/share-offsite/?url=${encUrl}`, '_blank', 'noopener,width=600,height=500');
  });
  document.getElementById('waSbTelegram').addEventListener('click', () => {
    window.open(`https://t.me/share/url?url=${encUrl}&text=${encodeURIComponent(caption.replace(shareUrl, '').trim())}`, '_blank', 'noopener');
  });
  document.getElementById('waSbInstagram').addEventListener('click', async () => {
    // Instagram has no web share-intent URL — the reliable path on both
    // mobile and desktop is: save the card image + copy the caption, then
    // let the person paste it into their Story/DM inside the Instagram app.
    document.getElementById('waDownloadBtn').click();
    try { await navigator.clipboard.writeText(caption); } catch (e) { /* ignore */ }
    setTimeout(() => alert('Card saved and caption copied! Open Instagram and paste it into your Story or post.'), 300);
  });

  document.getElementById('waRetakeBtn').addEventListener('click', renderIntro);
}

renderIntro();
</script>
</body>
</html>
