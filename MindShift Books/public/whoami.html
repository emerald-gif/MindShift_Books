<script>
// ── First-party page-view tracking (no third-party pixels/cookies) ─────────
// Same beacon main.js sends on every other page, added here since this page
// doesn't load main.js. Guarded two ways against double-counting a single
// visit: a module-scope flag stops it firing twice if this script ever runs
// more than once, and forcing a real reload on a bfcache (back/forward)
// restore — same as main.js — stops the browser silently reusing a frozen
// page instance and never re-sending a beacon for the "new" view, or a
// stray extra beacon firing from restored JS state.
window.addEventListener('pageshow', function (event) {
  if (event.persisted) window.location.reload();
});
(function trackWhoAmIPageView() {
  if (window.__waTracked) return;
  window.__waTracked = true;
  try {
    const payload = JSON.stringify({ type: 'page', path: '/whoami', ref: document.referrer || null });
    if (navigator.sendBeacon) {
      navigator.sendBeacon('/api/track', new Blob([payload], { type: 'application/json' }));
    } else {
      fetch('/api/track', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: payload, keepalive: true }).catch(() => {});
    }
  } catch (e) { /* analytics must never break the page */ }
})();

// Fires the funnel events the admin dashboard's "Who Am I Challenge" panel
// reads: a result revealed, a card downloaded, or a result shared. Each
// call is fire-and-forget and never allowed to interrupt the quiz itself.
function trackWhoAmI(type, archetype) {
  try {
    const payload = JSON.stringify({ type, archetype });
    if (navigator.sendBeacon) {
      navigator.sendBeacon('/api/track', new Blob([payload], { type: 'application/json' }));
    } else {
      fetch('/api/track', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: payload, keepalive: true }).catch(() => {});
    }
  } catch (e) { /* analytics must never break the page */ }
}

// Fisher–Yates shuffle, non-mutating — used so a retake or a friend taking
// it right after doesn't land on the exact same 5 questions.
function shuffled(arr) {
  const copy = arr.slice();
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function getWinningArchetype() {
  const scores = {};
  Object.keys(ARCHETYPES).forEach(k => { scores[k] = 0; });
  answers.forEach((ansIndex, qIndex) => { scores[QUESTIONS[qIndex].options[ansIndex].type]++; });
  let best = Object.keys(ARCHETYPES)[0], bestScore = -1;
  Object.keys(scores).forEach(k => { if (scores[k] > bestScore) { bestScore = scores[k]; best = k; } });
  return best;
}

      alert('Could not generate the image — try a screenshot instead.');
    } finally {
      btn.disabled = false;
      btn.innerHTML = originalText;
    }
  });

  document.getElementById('waSbFacebook').addEventListener('click', () => {
    window.open(`https://www.facebook.com/sharer/sharer.php?u=${encUrl}`, '_blank', 'noopener,width=600,height=500');
    trackWhoAmI('whoami_share', key);
  });
  document.getElementById('waSbX').addEventListener('click', () => {
    window.open(`https://twitter.com/intent/tweet?text=${encCaption}`, '_blank', 'noopener,width=600,height=500');
    trackWhoAmI('whoami_share', key);
  });
  document.getElementById('waSbWhatsapp').addEventListener('click', () => {
    window.open(`https://api.whatsapp.com/send?text=${encCaption}`, '_blank', 'noopener');
    trackWhoAmI('whoami_share', key);
  });
  document.getElementById('waSbPinterest').addEventListener('click', () => {
    window.open(`https://pinterest.com/pin/create/button/?url=${encUrl}&description=${encCaption}`, '_blank', 'noopener,width=750,height=500');
    trackWhoAmI('whoami_share', key);
  });
  document.getElementById('waSbLinkedin').addEventListener('click', () => {
    window.open(`https://www.linkedin.com/sharing/share-offsite/?url=${encUrl}`, '_blank', 'noopener,width=600,height=500');
    trackWhoAmI('whoami_share', key);
  });
  document.getElementById('waSbTelegram').addEventListener('click', () => {
    window.open(`https://t.me/share/url?url=${encUrl}&text=${encodeURIComponent(caption.replace(shareUrl, '').trim())}`, '_blank', 'noopener');
    trackWhoAmI('whoami_share', key);
  });
  document.getElementById('waSbInstagram').addEventListener('click', async () => {
    // Instagram has no web share-intent URL — the reliable path on both
    // mobile and desktop is: save the card image + copy the caption, then
    // let the person paste it into their Story/DM inside the Instagram app.
    document.getElementById('waDownloadBtn').click();
    try { await navigator.clipboard.writeText(caption); } catch (e) { /* ignore */ }
    trackWhoAmI('whoami_share', key);
    setTimeout(() => alert('Card saved and caption copied! Open Instagram and paste it into your Story or post.'), 300);
  });

  document.getElementById('waRetakeBtn').addEventListener('click', () => {
    try { localStorage.removeItem(WA_RESULT_KEY); } catch (e) { /* storage may be unavailable */ }
    renderIntro();
  });
  scrollCardIntoView();
}

// On load, resume a completed result instead of restarting the quiz —
// only cleared when the person explicitly taps "Take It Again".
(function bootstrapWhoAmI() {
  try {
    const saved = JSON.parse(localStorage.getItem(WA_RESULT_KEY) || 'null');
    if (saved && saved.key && ARCHETYPES[saved.key]) {
      renderResult(saved);
      return;
    }
  } catch (e) { /* corrupt/unavailable storage — fall through to intro */ }
  renderIntro();
})();
</script>
</body>
</html>
