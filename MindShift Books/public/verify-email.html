<!doctype html>
<html lang="en">
<head>
<script>(function(){try{var c=localStorage.getItem('msb_theme'),d=c==='dark'||(c!=='light'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.setAttribute('data-theme',d?'dark':'light');}catch(e){}})();</script>
<script src="/theme.js" defer></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verify your email | MindShift Books</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" href="/MINDSHIFT.jpg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/theme.css?v=1">
<style>
:root{--ink:#0f172a;--sub:#64748b;--mute:#94a3b8;--line:#e2e8f0;--bg:#ffffff;--page:#f8fafc;--ind:#4f46e5;--cy:#06b6d4;--ok:#059669;--err:#dc2626}
[data-theme="dark"]{--ink:#f1f5f9;--sub:#94a3b8;--mute:#64748b;--line:#334155;--bg:#1e293b;--page:#0f172a}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',Arial,sans-serif;background:var(--page);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:440px;background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:30px 24px 24px;box-shadow:0 12px 40px rgba(15,23,42,.06)}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px;letter-spacing:.02em;margin-bottom:26px}
.brand img{width:26px;height:26px;border-radius:6px}
.secure{margin-left:auto;display:flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--ok);background:rgba(5,150,105,.1);padding:5px 9px;border-radius:999px}
.secure svg{width:12px;height:12px}
.badge{width:68px;height:68px;border-radius:50%;margin:0 auto 18px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 30% 25%,rgba(6,182,212,.18),rgba(79,70,229,.12) 70%);transition:background .3s}
.badge svg{width:32px;height:32px;color:var(--ind)}
.badge.ok{background:rgba(5,150,105,.14)}.badge.ok svg{color:var(--ok)}
.eyebrow{text-align:center;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ind)}
h1{text-align:center;font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.25;margin-top:6px}
.sub{text-align:center;font-size:14px;line-height:1.6;color:var(--sub);margin-top:10px}
.sub b{color:var(--ink);font-weight:700;word-break:break-all}
.codebox{display:flex;justify-content:center;gap:9px;margin:26px 0 6px}
.digit{width:100%;max-width:54px;height:62px;border:1.5px solid var(--line);border-radius:14px;background:var(--page);color:var(--ink);font:inherit;font-size:26px;font-weight:800;text-align:center;outline:none;caret-color:var(--ind);transition:border-color .15s,box-shadow .15s,transform .15s}
.digit:focus{border-color:var(--ind);box-shadow:0 0 0 4px rgba(79,70,229,.12);background:var(--bg)}
.digit.filled{border-color:var(--ind)}
.codebox.error .digit{border-color:var(--err);animation:shake .4s}
.codebox.success .digit{border-color:var(--ok);background:rgba(5,150,105,.08)}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.msg{min-height:20px;text-align:center;font-size:13px;font-weight:600;margin:10px 0 2px}
.msg.err{color:var(--err)}.msg.ok{color:var(--ok)}.msg.info{color:var(--sub)}
.timer{text-align:center;font-size:12.5px;color:var(--mute);margin-bottom:16px}
.timer b{color:var(--ink);font-variant-numeric:tabular-nums}
.btn{width:100%;border:none;border-radius:14px;padding:15px;font:inherit;font-size:15px;font-weight:700;color:#fff;cursor:pointer;background:linear-gradient(90deg,var(--ind),var(--cy));transition:opacity .15s,transform .1s}
.btn:active{transform:scale(.99)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.resend{text-align:center;font-size:13.5px;color:var(--sub);margin-top:18px}
.link{background:none;border:none;font:inherit;font-size:13.5px;font-weight:700;color:var(--ind);cursor:pointer;padding:0}
.link:disabled{color:var(--mute);cursor:default}
.foot{display:flex;justify-content:space-between;gap:10px;margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.foot .link{font-size:12.5px;color:var(--sub);font-weight:600}
.note{display:flex;gap:10px;margin-top:18px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;font-size:12px;line-height:1.5;color:var(--sub)}
.note svg{flex:none;width:16px;height:16px;color:var(--ind);margin-top:1px}
.hidden{display:none}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.5);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
@media(max-width:380px){.codebox{gap:6px}.digit{height:56px;font-size:22px}}
</style>
</head>
<body>
<main class="card" id="card">
  <div class="brand">
    <img src="/MINDSHIFT.jpg" alt="">MINDSHIFT BOOKS
    <span class="secure"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>Secure</span>
  </div>

  <div class="badge" id="badge">
    <svg id="badgeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
  </div>

  <div class="eyebrow">Email verification</div>
  <h1 id="title">Enter your code</h1>
  <p class="sub" id="sub">Sending a 6-digit code to your email…</p>

  <div class="codebox" id="codebox" role="group" aria-label="6-digit verification code">
    <input class="digit" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="one-time-code" aria-label="Digit 1">
    <input class="digit" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Digit 2">
    <input class="digit" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Digit 3">
    <input class="digit" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Digit 4">
    <input class="digit" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Digit 5">
    <input class="digit" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Digit 6">
  </div>

  <div class="msg info" id="msg" aria-live="polite"></div>
  <div class="timer" id="timer"></div>

  <button class="btn" id="verifyBtn" disabled>Verify email</button>

  <div class="resend">Didn’t get it? <button class="link" id="resendBtn" disabled>Resend code</button></div>

  <div class="note">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
    <span>Check your spam or promotions folder too. We’ll never ask you to share this code with anyone.</span>
  </div>

  <div class="foot">
    <button class="link" id="wrongBtn">Wrong email? Start over</button>
    <button class="link" id="laterBtn">I’ll do this later</button>
  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="/auth.js"></script>
<script>
(function () {
  const params = new URLSearchParams(location.search);
  const returnTo = params.get('returnTo') || '/';
  const isNew = params.get('new') === '1';
  const uname = params.get('u') || '';

  const boxes = Array.from(document.querySelectorAll('.digit'));
  const codebox = document.getElementById('codebox');
  const msg = document.getElementById('msg');
  const timerEl = document.getElementById('timer');
  const verifyBtn = document.getElementById('verifyBtn');
  const resendBtn = document.getElementById('resendBtn');
  const subEl = document.getElementById('sub');
  const titleEl = document.getElementById('title');

  let expiresAt = 0, resendAt = 0, busy = false, done = false, tick = null;

  function nextUrl() {
    if (isNew) return '/welcome?returnTo=' + encodeURIComponent(returnTo) + (uname ? '&u=' + encodeURIComponent(uname) : '');
    return returnTo;
  }
  function setMsg(text, kind) { msg.textContent = text || ''; msg.className = 'msg ' + (kind || 'info'); }
  function getCode() { return boxes.map(b => b.value).join(''); }
  function clearBoxes(focus) { boxes.forEach(b => { b.value = ''; b.classList.remove('filled'); }); updateBtn(); if (focus) boxes[0].focus(); }
  function updateBtn() { verifyBtn.disabled = busy || done || getCode().length !== 6; }
  const fmt = s => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');

  function render() {
    const now = Date.now();
    const exp = Math.max(0, Math.round((expiresAt - now) / 1000));
    timerEl.innerHTML = expiresAt ? (exp > 0 ? 'Code expires in <b>' + fmt(exp) + '</b>' : 'This code has expired. Request a new one.') : '';
    const rs = Math.max(0, Math.ceil((resendAt - now) / 1000));
    resendBtn.disabled = busy || done || rs > 0;
    resendBtn.textContent = rs > 0 ? 'Resend in ' + fmt(rs) : 'Resend code';
  }
  function startTick() { if (tick) clearInterval(tick); tick = setInterval(render, 500); render(); }

  async function api(path, body) {
    const token = await window.MSBAuth.getIdToken();
    const res = await fetch(path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
      body: JSON.stringify(body || {})
    });
    const data = await res.json().catch(() => ({}));
    return { ok: res.ok, status: res.status, data };
  }

  async function sendCode(isResend) {
    busy = true; render(); updateBtn();
    setMsg(isResend ? 'Sending a new code…' : '', 'info');
    try {
      const r = await api('/api/verify-email/send');
      if (r.ok && r.data.alreadyVerified) { return success(); }
      if (r.ok) {
        expiresAt = Date.now() + (r.data.expiresInSeconds || 600) * 1000;
        resendAt = Date.now() + (r.data.cooldownSeconds || 60) * 1000;
        subEl.innerHTML = 'We sent a 6-digit code to <b>' + (r.data.sentTo || 'your email') + '</b>. Enter it below to confirm it’s you.';
        titleEl.textContent = 'Enter your code';
        clearBoxes(true);
        setMsg(isResend ? 'New code sent. Check your inbox.' : '', isResend ? 'ok' : 'info');
      } else {
        if (r.data.retryAfter) resendAt = Date.now() + r.data.retryAfter * 1000;
        if (r.data.retryAfter && !isResend) {
          // Page was reloaded right after a code went out — keep using that one.
          subEl.textContent = 'We just sent a 6-digit code to your email. Enter it below.';
          setMsg('', 'info');
        } else {
          subEl.textContent = 'We couldn’t send your code yet.';
          setMsg(r.data.error || 'Could not send the code. Please try again.', 'err');
        }
      }
    } catch (e) {
      setMsg('Network problem. Check your connection and tap Resend.', 'err');
    } finally { busy = false; render(); updateBtn(); startTick(); }
  }

  async function verify() {
    if (busy || done || getCode().length !== 6) return;
    busy = true; updateBtn(); render();
    verifyBtn.innerHTML = '<span class="spin"></span>Verifying…';
    setMsg('', 'info'); codebox.classList.remove('error');
    try {
      const r = await api('/api/verify-email/confirm', { code: getCode() });
      if (r.ok) return success();
      codebox.classList.remove('error'); void codebox.offsetWidth; codebox.classList.add('error');
      setMsg(r.data.error || 'That code didn’t work.', 'err');
      if (r.data.code === 'expired' || r.data.code === 'locked' || r.data.code === 'no_code') { expiresAt = 0; resendAt = Math.min(resendAt, Date.now()); }
      clearBoxes(true);
    } catch (e) {
      setMsg('Network problem. Please try again.', 'err');
    } finally {
      if (!done) { busy = false; verifyBtn.textContent = 'Verify email'; updateBtn(); render(); }
    }
  }

  async function success() {
    done = true; busy = false;
    codebox.classList.remove('error'); codebox.classList.add('success');
    document.getElementById('badge').classList.add('ok');
    document.getElementById('badgeIcon').innerHTML = '<path d="M5 12.5l4.5 4.5L19 7.5"/>';
    titleEl.textContent = 'Email verified';
    subEl.textContent = 'You’re all set. Taking you in…';
    timerEl.textContent = ''; setMsg('', 'ok');
    verifyBtn.textContent = 'Verified ✓'; verifyBtn.disabled = true; render();
    try { await window.MSBAuth.getUser().getIdToken(true); } catch (e) {}
    setTimeout(() => { location.href = nextUrl(); }, 1300);
  }

  boxes.forEach((b, i) => {
    b.addEventListener('input', () => {
      b.value = b.value.replace(/\D/g, '').slice(-1);
      b.classList.toggle('filled', !!b.value);
      codebox.classList.remove('error');
      if (b.value && i < 5) boxes[i + 1].focus();
      updateBtn();
      if (getCode().length === 6) verify();
    });
    b.addEventListener('keydown', e => {
      if (e.key === 'Backspace' && !b.value && i > 0) { boxes[i - 1].value = ''; boxes[i - 1].classList.remove('filled'); boxes[i - 1].focus(); updateBtn(); }
      else if (e.key === 'ArrowLeft' && i > 0) boxes[i - 1].focus();
      else if (e.key === 'ArrowRight' && i < 5) boxes[i + 1].focus();
      else if (e.key === 'Enter') verify();
    });
    b.addEventListener('focus', () => b.select());
    b.addEventListener('paste', e => {
      const t = ((e.clipboardData || window.clipboardData).getData('text') || '').replace(/\D/g, '').slice(0, 6);
      if (!t) return;
      e.preventDefault();
      boxes.forEach((x, k) => { x.value = t[k] || ''; x.classList.toggle('filled', !!x.value); });
      boxes[Math.min(t.length, 5)].focus(); updateBtn();
      if (t.length === 6) verify();
    });
  });

  verifyBtn.addEventListener('click', verify);
  resendBtn.addEventListener('click', () => sendCode(true));
  document.getElementById('laterBtn').addEventListener('click', () => { location.href = nextUrl(); });
  document.getElementById('wrongBtn').addEventListener('click', async () => {
    try { await window.MSBAuth.signOut(); } catch (e) {}
    location.href = '/signup?returnTo=' + encodeURIComponent(returnTo);
  });

  window.MSBAuth.onAuthReady(user => {
    if (!user) { location.href = '/login?returnTo=' + encodeURIComponent('/verify-email' + location.search); return; }
    if (user.emailVerified) { location.href = nextUrl(); return; }
    startTick();
    sendCode(false);
  });
})();
</script>
</body>
</html>
