<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Become an Affiliate | MindShift Books</title>
  <meta name="robots" content="noindex, follow" />
  <link rel="shortcut icon" href="MINDSHIFT.jpg" type="image/jpg">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
:root{ --primary:#0f172a; --accent:#06b6d4; --indigo:#4f46e5; }
*{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',sans-serif}
body{background:#f8fafc;color:var(--primary);}

header{
  position:sticky;top:0;background:white;z-index:100;
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 20px;border-bottom:1px solid #f1f5f9;
}
header .brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--primary);font-weight:800;font-size:1rem;}
header .brand img{width:30px;height:30px;border-radius:7px;}
header a.back{font-size:0.82rem;font-weight:700;color:#64748b;text-decoration:none;}

.wrap{max-width:460px;margin:0 auto;padding:36px 22px 60px;}

.top{text-align:center;margin-bottom:22px;}
.top .icon{
  width:46px;height:46px;border-radius:14px;margin:0 auto 14px;
  background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;
}
.top .icon svg{width:22px;height:22px;}
.top h1{font-size:1.4rem;font-weight:900;letter-spacing:-0.01em;}
.top p{color:#64748b;font-size:0.88rem;margin-top:6px;line-height:1.5;}

.card{background:#fff;border:1px solid #eef2f6;border-radius:18px;padding:26px 22px;text-align:left;}
.card .sub{font-size:0.85rem;color:#6b7280;margin-bottom:20px;}
.field{margin-bottom:15px;}
.field label{display:block;font-size:0.8rem;font-weight:700;color:#374151;margin-bottom:6px;}
.field input, .field select{
  width:100%;padding:12px 13px;border-radius:10px;border:1.5px solid #e2e8f0;font-size:0.92rem;
  font-family:inherit;background:#fff;color:var(--primary);
}
.field input:focus, .field select:focus{outline:none;border-color:var(--indigo);}
.field-row{display:flex;gap:12px;}
.field-row .field{flex:1;}
.error-box{
  display:none;background:#fef2f2;color:#991b1b;padding:11px 14px;border-radius:10px;
  font-size:0.85rem;margin-bottom:16px;align-items:center;gap:8px;
}
.error-box svg{width:16px;height:16px;flex-shrink:0;}
.submit-btn{
  width:100%;padding:14px;border-radius:12px;border:none;
  background:linear-gradient(90deg,var(--indigo),var(--accent));color:#fff;
  font-weight:800;font-size:0.96rem;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.submit-btn:disabled{opacity:0.6;cursor:default;}
.submit-btn svg{width:18px;height:18px;}

.cta-btn-full{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;padding:16px 20px;border-radius:14px;border:none;
  background:var(--primary);color:#fff;
  font-weight:800;font-size:1rem;cursor:pointer;text-decoration:none;
}
.cta-btn-full svg{width:18px;height:18px;}

.rate-line{
  display:flex;align-items:center;justify-content:center;gap:8px;
  margin-top:18px;color:#64748b;font-size:0.82rem;font-weight:600;
}
.rate-line svg{width:15px;height:15px;color:#4f46e5;}

.state{text-align:center;padding:60px 0;color:#94a3b8;}
.loader{width:26px;height:26px;border:4px solid rgba(0,0,0,0.06);border-top:4px solid var(--accent);border-radius:50%;animation:spin 0.7s linear infinite;margin:0 auto 14px;}
@keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>

<header>
  <a class="brand" href="/">
    <img src="MINDSHIFT.jpg" alt="MindShift Books logo">
    MindShift Books
  </a>
  <a class="back" href="/affiliate">← Back</a>
</header>

<div class="wrap" id="wrap">
  <div class="state"><div class="loader"></div>Loading…</div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="/auth.js"></script>
<script>
  const wrap = document.getElementById('wrap');

  const ICONS = {
    spark: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.6 5.4L19 9l-5.4 1.6L12 16l-1.6-5.4L5 9l5.4-1.6z"/></svg>`,
    arrow: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>`,
    link: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 15l6-6"/><path d="M11 5l1-1a4 4 0 015.7 5.7l-2 2"/><path d="M13 19l-1 1a4 4 0 01-5.7-5.7l2-2"/></svg>`,
    alert: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>`
  };

  function renderJoinPrompt() {
    wrap.innerHTML = `
      <div class="top">
        <div class="icon">${ICONS.link}</div>
        <h1>Get your affiliate link</h1>
        <p>Sign in (or create a free account) to generate your unique referral link and start earning.</p>
      </div>
      <a href="/signup?returnTo=${encodeURIComponent('/affiliate/apply')}" class="cta-btn-full">
        Continue ${ICONS.arrow}
      </a>
      <div class="rate-line">${ICONS.spark} Free to join · 15% commission on every sale</div>
    `;
  }

  function renderApplicationForm() {
    wrap.innerHTML = `
      <div class="top">
        <div class="icon">${ICONS.link}</div>
        <h1>One quick step</h1>
        <p>Just enough info to get you your link and pay you correctly.</p>
      </div>
      <div class="card">
        <div class="error-box" id="affError"><span>${ICONS.alert}</span><span id="affErrorText"></span></div>
        <form id="affForm">
          <div class="field">
            <label for="affPhone">Phone number</label>
            <input id="affPhone" type="tel" placeholder="e.g. 0803 123 4567" required>
          </div>
          <div class="field">
            <label for="affPlatform">Where will you promote?</label>
            <select id="affPlatform">
              <option>Instagram</option>
              <option>TikTok</option>
              <option>WhatsApp</option>
              <option>YouTube</option>
              <option>Other</option>
            </select>
          </div>
          <div class="field">
            <label for="affHandle">Your handle or channel link (optional)</label>
            <input id="affHandle" type="text" placeholder="@yourhandle or a link">
          </div>
          <div class="field-row">
            <div class="field">
              <label for="affBankName">Bank name</label>
              <input id="affBankName" type="text" placeholder="e.g. GTBank" required>
            </div>
            <div class="field">
              <label for="affAccNum">Account number</label>
              <input id="affAccNum" type="text" inputmode="numeric" placeholder="10 digits" required>
            </div>
          </div>
          <div class="field">
            <label for="affAccName">Account name</label>
            <input id="affAccName" type="text" placeholder="Name on the account" required>
          </div>
          <button type="submit" class="submit-btn" id="affSubmitBtn">Get My Affiliate Link ${ICONS.arrow}</button>
        </form>
      </div>
    `;

    const form = document.getElementById('affForm');
    const errorBox = document.getElementById('affError');
    const errorText = document.getElementById('affErrorText');
    const submitBtn = document.getElementById('affSubmitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.innerHTML = 'Setting up your link…';
      try {
        const token = await window.MSBAuth.getIdToken();
        const res = await fetch('/api/affiliate/apply', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
          body: JSON.stringify({
            phone: document.getElementById('affPhone').value.trim(),
            platform: document.getElementById('affPlatform').value,
            handle: document.getElementById('affHandle').value.trim(),
            bankName: document.getElementById('affBankName').value.trim(),
            accountNumber: document.getElementById('affAccNum').value.trim(),
            accountName: document.getElementById('affAccName').value.trim()
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Something went wrong. Please try again.');
        window.location.href = '/affiliate/dashboard';
      } catch (err) {
        errorText.textContent = err.message;
        errorBox.style.display = 'flex';
        submitBtn.disabled = false;
        submitBtn.innerHTML = `Get My Affiliate Link ${ICONS.arrow}`;
      }
    });
  }

  window.MSBAuth.onAuthReady(async (user) => {
    if (!user) { renderJoinPrompt(); return; }
    try {
      const token = await window.MSBAuth.getIdToken();
      const res = await fetch('/api/affiliate/me', { headers: { Authorization: `Bearer ${token}` } });
      const data = await res.json();
      if (data && data.affiliate) {
        window.location.href = '/affiliate/dashboard';
        return;
      }
      renderApplicationForm();
    } catch (e) {
      renderApplicationForm();
    }
  });
</script>

</body>
</html>
