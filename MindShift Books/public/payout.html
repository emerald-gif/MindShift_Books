<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Payout | MindShift Books</title>
  <meta name="robots" content="noindex, follow" />
  <link rel="shortcut icon" href="/MINDSHIFT.jpg" type="image/jpg">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
:root{ --primary:#0f172a; --accent:#06b6d4; --indigo:#4f46e5; }
*{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',sans-serif}
body{background:#fff;color:var(--primary);}
svg.ico{width:19px;height:19px;flex-shrink:0;}
svg.ico-sm{width:14px;height:14px;flex-shrink:0;}

header{
  position:sticky;top:0;background:white;z-index:100;
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 20px;border-bottom:1px solid #f1f5f9;
}
header .left{display:flex;align-items:center;gap:12px;}
.menu-btn{
  width:36px;height:36px;border-radius:10px;border:1.5px solid #e2e8f0;background:#fff;
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;color:var(--primary);
}
.menu-btn svg{width:18px;height:18px;}
header .brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--primary);font-weight:800;font-size:1rem;}
header .brand img{width:30px;height:30px;border-radius:7px;}

.wrap{max-width:460px;margin:0 auto;}

/* ── SIDEBAR ── */
.sidebar-overlay{
  position:fixed;inset:0;background:rgba(15,23,42,0.45);z-index:199;
  opacity:0;pointer-events:none;transition:opacity 0.2s;
}
.sidebar-overlay.open{opacity:1;pointer-events:auto;}
.sidebar{
  position:fixed;top:0;left:0;bottom:0;width:270px;background:#fff;z-index:200;
  transform:translateX(-100%);transition:transform 0.25s ease;
  display:flex;flex-direction:column;box-shadow:2px 0 24px rgba(0,0,0,0.08);
}
.sidebar.open{transform:translateX(0);}
.sidebar-head{padding:20px 20px 16px;border-bottom:1px solid #f1f5f9;display:flex;align-items:center;gap:10px;}
.sidebar-head img{width:28px;height:28px;border-radius:7px;}
.sidebar-head .name{font-weight:800;font-size:0.94rem;}
.sidebar-nav{padding:14px 12px;flex:1;}
.nav-item{
  display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;
  color:#475569;font-weight:700;font-size:0.9rem;cursor:pointer;margin-bottom:4px;
  border:none;background:none;width:100%;text-align:left;text-decoration:none;
}
.nav-item svg{width:19px;height:19px;flex-shrink:0;}
.nav-item.active{background:#eef2ff;color:var(--indigo);}
.sidebar-foot{padding:14px 12px 20px;border-top:1px solid #f1f5f9;}
.sidebar-foot a{
  display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;
  color:#94a3b8;font-weight:700;font-size:0.86rem;text-decoration:none;
}
.sidebar-foot a svg{width:17px;height:17px;}

/* ── HERO ── */
.hero{padding:32px 22px 4px;}
.hero .eyebrow{
  display:inline-flex;align-items:center;gap:6px;
  font-size:0.76rem;font-weight:800;color:#4f46e5;letter-spacing:0.04em;
  text-transform:uppercase;margin-bottom:10px;
}
.hero h1{font-size:1.55rem;font-weight:900;letter-spacing:-0.02em;line-height:1.2;}
.hero .sub{color:#64748b;font-size:0.88rem;margin-top:8px;line-height:1.5;}

/* ── BALANCE STRIP ── */
.balance-strip{
  margin:22px 22px 0;padding:16px 18px;border-radius:16px;
  background:#f0fdf4;border:1px solid #dcfce7;
  display:flex;align-items:center;gap:12px;
}
.balance-strip .b-icon{
  width:38px;height:38px;border-radius:11px;background:#16a34a;color:#fff;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.balance-strip .b-val{font-size:1.15rem;font-weight:900;line-height:1.1;}
.balance-strip .b-lbl{font-size:0.76rem;color:#4b5563;font-weight:600;margin-top:1px;}

/* ── PAYOUT META GRID ── */
.payout-grid{margin:14px 22px 0;display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.payout-cell{
  border:1px solid #f1f5f9;border-radius:14px;padding:13px 14px;
}
.payout-cell .p-lbl{font-size:0.72rem;color:#94a3b8;font-weight:700;text-transform:uppercase;letter-spacing:0.02em;margin-bottom:4px;}
.payout-cell .p-val{font-size:0.98rem;font-weight:800;}
.status-pill{
  display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;
  font-size:0.76rem;font-weight:800;
}
.status-pill.waiting{background:#f1f5f9;color:#64748b;}
.status-pill.pending{background:#fef3c7;color:#92400e;}
.status-pill.paid{background:#dcfce7;color:#166534;}

/* ── SECTION ── */
.section{padding:30px 22px 60px;}
.section-eyebrow{
  display:flex;align-items:center;gap:6px;
  font-size:0.76rem;font-weight:800;color:#4f46e5;letter-spacing:0.04em;text-transform:uppercase;margin-bottom:8px;
}
.section h2{font-size:1.25rem;font-weight:900;letter-spacing:-0.01em;}

/* ── PAYOUT HISTORY ── */
.history-card{margin-top:18px;border:1px solid #f1f5f9;border-radius:18px;padding:2px 18px;}
.history-row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid #f1f5f9;}
.history-row:last-child{border-bottom:none;}
.history-row .h-icon{
  width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.history-row .h-icon.pending{background:#fef3c7;color:#92400e;}
.history-row .h-icon.paid{background:#dcfce7;color:#166534;}
.history-row .h-info{flex:1;min-width:0;}
.history-row .h-amt{font-weight:800;font-size:0.92rem;}
.history-row .h-date{font-size:0.76rem;color:#94a3b8;margin-top:1px;}

.empty{padding:30px 18px;text-align:center;color:#94a3b8;font-size:0.86rem;border:1px solid #f1f5f9;border-radius:18px;margin-top:18px;}

.loader{width:26px;height:26px;border:4px solid rgba(0,0,0,0.06);border-top:4px solid var(--accent);border-radius:50%;animation:spin 0.7s linear infinite;margin:70px auto;}
@keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>

<div class="sidebar-overlay" id="sidebarOverlay"></div>
<div class="sidebar" id="sidebar">
  <div class="sidebar-head">
    <img src="/MINDSHIFT.jpg" alt="MindShift Books logo">
    <div class="name">MindShift Books</div>
  </div>
  <div class="sidebar-nav">
    <a class="nav-item" href="/affiliate/dashboard">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>
      Overview
    </a>
    <a class="nav-item active" href="/affiliate/payout">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 012-2h13a2 2 0 012 2v11a2 2 0 01-2 2H5a2 2 0 01-2-2V7z"/><path d="M16 12h4"/></svg>
      Payout
    </a>
    <a class="nav-item" href="/affiliate/dashboard?view=account">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20a8 8 0 0116 0"/></svg>
      My Account
    </a>
  </div>
  <div class="sidebar-foot">
    <a href="/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
      Back to store
    </a>
  </div>
</div>

<header>
  <div class="left">
    <button class="menu-btn" id="menuBtn" aria-label="Open menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <a class="brand" href="/">
      <img src="/MINDSHIFT.jpg" alt="MindShift Books logo">
      MindShift Books
    </a>
  </div>
</header>

<div class="wrap">
  <div id="mainContent">
    <div class="loader"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="/auth.js"></script>
<script>
  const main = document.getElementById('mainContent');
  const nf = new Intl.NumberFormat('en-NG');
  let AFFILIATE = null, PAYOUTS = null;

  const ICON = {
    spark: `<svg class="ico-sm" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.6 5.4L19 9l-5.4 1.6L12 16l-1.6-5.4L5 9l5.4-1.6z"/></svg>`,
    wallet: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;"><path d="M3 7a2 2 0 012-2h13a2 2 0 012 2v11a2 2 0 01-2 2H5a2 2 0 01-2-2V7z"/><path d="M16 12h4"/></svg>`,
    checkCircle: `<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12.5l2.3 2.3L16 9.6"/></svg>`,
    clock: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:17px;height:17px;"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>`
  };

  function fmtDate(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    return d.toLocaleDateString('en-NG', { day: 'numeric', month: 'short', year: 'numeric' });
  }

  // ── Sidebar ──
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebarOverlay');
  function openSidebar() { sidebar.classList.add('open'); overlay.classList.add('open'); }
  function closeSidebar() { sidebar.classList.remove('open'); overlay.classList.remove('open'); }
  document.getElementById('menuBtn').addEventListener('click', openSidebar);
  overlay.addEventListener('click', closeSidebar);

  function statusPillFor(affiliate) {
    if (PAYOUTS && PAYOUTS.some(p => p.status === 'pending')) {
      return `<span class="status-pill pending">Pending transfer</span>`;
    }
    if (affiliate.availableBalance >= affiliate.minPayout) {
      return `<span class="status-pill pending">Queued for Monday</span>`;
    }
    return `<span class="status-pill waiting">Below minimum</span>`;
  }

  // ── Payout view ──
  function renderPayout() {
    const affiliate = AFFILIATE;

    main.innerHTML = `
      <div class="hero">
        <span class="eyebrow">${ICON.spark} Payout</span>
        <h1>Your balance and payout schedule</h1>
        <div class="sub">Payouts from the books you've sold run automatically every Monday once your balance clears the minimum — no requests needed.</div>
      </div>

      <div class="balance-strip">
        <div class="b-icon">${ICON.wallet}</div>
        <div>
          <div class="b-val">₦${nf.format(affiliate.availableBalance)}</div>
          <div class="b-lbl">Available balance</div>
        </div>
      </div>

      <div class="payout-grid">
        <div class="payout-cell">
          <div class="p-lbl">Minimum payout</div>
          <div class="p-val">₦${nf.format(affiliate.minPayout)}</div>
        </div>
        <div class="payout-cell">
          <div class="p-lbl">Next payout</div>
          <div class="p-val">${fmtDate(affiliate.nextPayoutDate)}</div>
        </div>
        <div class="payout-cell" style="grid-column:1 / -1;">
          <div class="p-lbl">Payout status</div>
          <div class="p-val">${statusPillFor(affiliate)}</div>
        </div>
      </div>

      <div class="section">
        <div class="section-eyebrow">${ICON.clock} History</div>
        <h2>Payout history</h2>
        <div id="historyWrap"></div>
      </div>
    `;

    const historyWrap = document.getElementById('historyWrap');
    if (!PAYOUTS || PAYOUTS.length === 0) {
      historyWrap.innerHTML = `<div class="empty">No payouts yet — once your balance reaches ₦${nf.format(affiliate.minPayout)}, you'll be queued for the next Monday payout automatically.</div>`;
    } else {
      historyWrap.innerHTML = `<div class="history-card">` + PAYOUTS.map(p => `
        <div class="history-row">
          <div class="h-icon ${p.status}">${p.status === 'paid' ? ICON.checkCircle : ICON.clock}</div>
          <div class="h-info">
            <div class="h-amt">₦${nf.format(p.amount)}</div>
            <div class="h-date">${p.status === 'paid' ? 'Paid ' + fmtDate(p.paidAt) : 'Queued ' + fmtDate(p.createdAt)}</div>
          </div>
          <span class="status-pill ${p.status}">${p.status === 'paid' ? 'Paid' : 'Pending'}</span>
        </div>
      `).join('') + `</div>`;
    }
  }

  window.MSBAuth.onAuthReady(async (user) => {
    if (!user) {
      window.location.href = '/login?returnTo=' + encodeURIComponent('/affiliate/payout');
      return;
    }
    try {
      const token = await window.MSBAuth.getIdToken();
      const [meRes, payoutsRes] = await Promise.all([
        fetch('/api/affiliate/me', { headers: { Authorization: `Bearer ${token}` } }),
        fetch('/api/affiliate/payouts', { headers: { Authorization: `Bearer ${token}` } })
      ]);
      const meData = await meRes.json();
      const payoutsData = await payoutsRes.json().catch(() => ({ payouts: [] }));
      if (!meData || !meData.affiliate) {
        window.location.href = '/affiliate';
        return;
      }
      AFFILIATE = meData.affiliate;
      PAYOUTS = payoutsData.payouts || [];
      renderPayout();
    } catch (e) {
      main.innerHTML = `<div class="empty">Could not load your payout details. Please refresh the page.</div>`;
    }
  });
</script>

</body>
</html>
