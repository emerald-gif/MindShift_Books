<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Page Not Found | MindShift Books</title>
  <link rel="shortcut icon" href="MINDSHIFT.jpg" type="image/jpg">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .notfound-wrap {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; text-align: center;
      min-height: 60vh; padding: 40px 24px;
    }
    .notfound-code {
      font-size: 5rem; font-weight: 800; color: #eef2f7;
      letter-spacing: -0.04em; line-height: 1; margin-bottom: 8px;
    }
    .notfound-title {
      font-size: 1.3rem; font-weight: 800; color: var(--primary);
      margin-bottom: 10px;
    }
    .notfound-sub {
      color: #64748b; font-size: 0.92rem; max-width: 320px;
      line-height: 1.6; margin-bottom: 28px;
    }
    .notfound-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
    .notfound-actions .btn { width: auto; padding: 12px 22px; }
  </style>
</head>
<body>

<header>
  <div class="header-top">
    <h1 style="display:flex;align-items:center;gap:10px;margin:0;">
      <img src="MINDSHIFT.jpg" alt="MindShift logo" style="width:36px;height:36px;border-radius:6px;">
      <span>MindShift Books</span>
    </h1>
    <div style="display:flex;align-items:center;gap:6px;">
      <span class="acct-nav-slot"></span>
      <button type="button" class="icon-btn" onclick="toggleSidebar()" aria-label="Open menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="22" height="22"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
      </button>
    </div>
  </div>
</header>

<aside class="sidebar" id="sidebar" aria-hidden="true" data-open="false">
  <div class="logo-row">
    <img src="MINDSHIFT.jpg" alt="logo">
    <div style="font-weight:700">MindShift Books</div>
  </div>
  <ul>
    <li onclick="window.location.href='/'">Browse Books</li>
    <li onclick="openMyOrders()">My Account</li>
    <li onclick="window.location.href='/support'">Support</li>
    <li onclick="openContact()">Contact Us</li>
  </ul>
</aside>

<main>
  <div class="notfound-wrap">
    <div class="notfound-code">404</div>
    <div class="notfound-title">This page doesn't exist</div>
    <p class="notfound-sub">The link might be broken or the page may have moved. Head back to the store — the books are still there.</p>
    <div class="notfound-actions">
      <button class="btn buy-btn" onclick="window.location.href='/'">Browse Books</button>
      <button class="btn review-btn" onclick="window.location.href='/support'">Get Help</button>
    </div>
  </div>
</main>

<script>
function adjustMainPadding(){
  const header = document.querySelector('header');
  const main = document.querySelector('main');
  if (!header || !main) return;
  main.style.paddingTop = (header.getBoundingClientRect().height + 24) + 'px';
}
window.addEventListener('load', adjustMainPadding);
window.addEventListener('resize', adjustMainPadding);
adjustMainPadding();
</script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="/main.js"></script>
<script src="/auth.js"></script>

</body>
</html>
