<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" href="/MINDSHIFT.jpg">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MindShift Books · Official</title>
<meta name="description" content="MindShift Books' official profile."/>
<meta name="robots" content="noindex, nofollow"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --p:#4f46e5;--p2:#06b6d4;--g:linear-gradient(90deg,#4f46e5,#06b6d4);
  --txt:#0f172a;--sub:#6b7280;--mute:#9ca3af;
  --bg:#f8fafc;--card:#fff;--border:#e5e7eb;
  --red:#ef4444;--green:#10b981;--radius:16px;
}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}

/* ── HEADER ── */
.hdr{position:sticky;top:0;z-index:100;background:rgba(248,247,255,.92);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--border);
  padding:0 16px;height:56px;display:flex;align-items:center;justify-content:space-between}
.btn-back{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--border);
  background:var(--card);display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--txt);text-decoration:none}
.btn-back svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.5;
  stroke-linecap:round;stroke-linejoin:round}
.hdr-title{font-size:15px;font-weight:800;color:var(--txt);flex:1;text-align:center;
  display:flex;align-items:center;justify-content:center;gap:5px}
.hdr-badge{width:16px;height:16px;border-radius:50%;background:var(--g);
  display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;
  box-shadow:0 1px 5px rgba(37,99,235,.4)}
.hdr-badge svg{width:8px;height:8px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.hdr-r{width:36px;display:flex;justify-content:flex-end}

/* You tag in follower list */
.you-tag{display:inline-flex;align-items:center;background:rgba(37,99,235,.12);
  color:var(--p);font-size:9.5px;font-weight:800;padding:2px 7px;
  border-radius:99px;margin-left:5px;vertical-align:middle;letter-spacing:.2px}

/* ── COVER ── */
.cover{width:100%;height:210px;background:var(--g);position:relative;overflow:hidden}
.cover img{width:100%;height:100%;object-fit:cover;object-position:center;display:block}
.cover-overlay{position:absolute;inset:0;
  background:linear-gradient(to bottom,transparent 40%,rgba(15,10,30,.38))}

/* ── PROFILE CARD ── */
.profile-card{background:var(--card);border-radius:0 0 28px 28px;
  padding:0 16px 22px;border-bottom:1.5px solid var(--border);margin-bottom:2px;
  position:relative;z-index:1;overflow:visible;
  box-shadow:0 12px 32px -18px rgba(15,23,42,.18)}

/* Avatar sits ON the cover — Pinterest style */
.avatar-wrap{position:absolute;top:-44px;left:16px;z-index:10}
.avatar{width:84px;height:84px;border-radius:50%;border:3.5px solid var(--card);
  overflow:hidden;background:var(--g);
  box-shadow:0 6px 24px rgba(37,99,235,.3),0 0 0 5px rgba(79,70,229,.08)}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}

/* ── VERIFIED BADGE — Pinterest style, pinned to avatar corner ── */
.avatar-badge{position:absolute;bottom:3px;right:3px;
  width:20px;height:20px;border-radius:50%;
  background:var(--g);border:2.5px solid var(--card);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 1px 6px rgba(37,99,235,.5)}
.avatar-badge svg{width:9px;height:9px;fill:none;stroke:#fff;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}

.avatar-row{display:flex;align-items:flex-start;justify-content:flex-end;
  padding-top:14px;margin-bottom:6px}

/* Follow button */
.btn-follow{padding:9px 22px;border-radius:99px;background:var(--g);border:none;
  color:#fff;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;
  box-shadow:0 4px 14px rgba(37,99,235,.3);transition:all .2s;display:flex;align-items:center;gap:6px}
.btn-follow:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(37,99,235,.4)}
.btn-follow.following{background:var(--card);color:var(--txt);border:1.5px solid var(--border);box-shadow:none}
.btn-follow.following:hover{border-color:var(--red);color:var(--red)}
.btn-follow svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round}

/* Name */
.name-row{display:flex;align-items:center;gap:7px;margin-bottom:3px;flex-wrap:wrap;padding-left:2px}
.profile-name{font-size:22px;font-weight:900;color:var(--txt);letter-spacing:-.3px}

/* ── VERIFIED BADGE (brand standard, matches feed cards) ── */
.vbadge{display:inline-flex;align-items:center;justify-content:center;
  width:19px;height:19px;border-radius:50%;background:var(--g);flex-shrink:0;
  box-shadow:0 1px 6px rgba(37,99,235,.4)}
.vbadge svg{width:10px;height:10px;fill:none;stroke:#fff;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}

/* Official chip */
.official-chip{display:inline-flex;align-items:center;gap:4px;
  background:#eef2ff;border:1.5px solid #e0e7ff;color:var(--p);
  font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;letter-spacing:.2px;margin-top:5px;
  box-shadow:0 2px 8px -2px rgba(79,70,229,.25)}
.official-chip svg{width:10px;height:10px}

.profile-tagline{font-size:13.5px;color:var(--p);font-weight:600;margin-bottom:8px}
.profile-bio{font-size:14px;color:var(--sub);line-height:1.65;margin-bottom:14px}

/* ── STATS ── */
.stats-row{display:flex;border-top:1px solid var(--border);padding-top:14px;gap:0}
.stat{flex:1;text-align:center;cursor:pointer}
.stat:not(:last-child){border-right:1px solid var(--border)}
.stat-num{font-size:19px;font-weight:900;color:var(--txt)}
.stat-label{font-size:11px;color:var(--mute);font-weight:500;margin-top:2px}
.stat:hover .stat-num{color:var(--p)}

/* ── DIVIDER LABEL ── */
.section-label{padding:16px 16px 10px;font-size:12px;font-weight:800;
  color:var(--mute);text-transform:uppercase;letter-spacing:.6px}

/* ── ARTICLE CARD (horizontal, matches feed) ── */
.art-list{padding:0 0 100px}
.acard{display:flex;flex-direction:row;align-items:flex-start;gap:14px;
  background:var(--card);padding:18px 16px;cursor:pointer;
  border-bottom:1px solid var(--border);transition:background .18s}
.acard:active{background:#eef2ff}
.acard-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.acard-cat{display:inline-flex;align-items:center;background:rgba(37,99,235,.1);
  color:var(--p);font-size:9.5px;font-weight:800;padding:3px 9px;
  border-radius:99px;letter-spacing:.3px;text-transform:uppercase;margin-bottom:4px;width:fit-content}
.acard-title{font-size:15px;font-weight:800;color:var(--txt);line-height:1.35;
  letter-spacing:-.2px;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden}
.acard-brief{font-size:12.5px;color:var(--sub);line-height:1.55;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.acard-read{font-size:11px;color:var(--mute);font-weight:600;margin-top:6px}
.acard-img{width:90px;height:80px;border-radius:10px;overflow:hidden;
  flex-shrink:0;background:linear-gradient(135deg,#e0e7ff,#eef2ff);align-self:flex-start}
.acard-img img{width:100%;height:100%;object-fit:cover;display:block}

/* ── POST CARD (matches profile.html's own post rendering) ── */
.acard-author{display:flex;align-items:center;gap:7px;margin-bottom:7px;width:fit-content}
.acard-av{width:24px;height:24px;border-radius:50%;object-fit:cover;flex-shrink:0;background:var(--g);border:1.5px solid var(--border)}
.acard-author-name{font-size:12.5px;font-weight:700;color:var(--txt)}
.acard-author-dot{font-size:11px;color:var(--mute)}
.acard-author-date{font-size:11.5px;color:var(--mute)}
.pcard-text{font-size:14.5px;color:var(--txt);line-height:1.5;white-space:pre-wrap;word-break:break-word;
  display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.pcard-single{margin-top:8px;display:flex;justify-content:center}
.pcard-single img{max-width:100%;max-height:340px;width:auto;height:auto;object-fit:contain;
  border-radius:14px;display:block;cursor:pointer;background:#f1f5f9}
.pcard-carousel{position:relative;margin-top:8px;max-width:100%;overflow:hidden}
.pcard-track{display:flex;gap:4px;overflow-x:auto;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;height:340px;max-height:60vh}
.pcard-track::-webkit-scrollbar{display:none}
.pcard-slide{flex:0 0 auto;height:100%;scroll-snap-align:start;border-radius:14px;overflow:hidden;background:#f1f5f9}
.pcard-slide img{height:100%;width:auto;max-width:none;object-fit:contain;display:block;cursor:pointer}
.pcard-count{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;
  font-weight:700;padding:2px 8px;border-radius:99px}
.pcard-video{position:relative;margin:8px auto 0;border-radius:14px;overflow:hidden;cursor:pointer;
  background:#0f0e17;width:max-content;max-width:100%}
.pcard-video video{display:block;max-width:100%;max-height:460px;width:auto;height:auto}
.pcard-video-mute{position:absolute;bottom:8px;left:8px;width:30px;height:30px;border-radius:50%;
  background:rgba(15,14,23,.55);border:none;display:flex;align-items:center;justify-content:center;
  color:#fff;cursor:pointer;-webkit-tap-highlight-color:transparent}
.pcard-video-mute svg{width:15px;height:15px}
.pcard-video-mute.unmuted{background:rgba(79,70,229,.75)}
.pcard-video-dur{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;
  font-weight:700;padding:2px 8px;border-radius:99px}
.acard-foot{display:flex;align-items:center;gap:8px;margin-top:10px}
.acard-like,.pcard-comment{display:flex;align-items:center;gap:4px;background:none;border:none;cursor:pointer;padding:4px 6px;font-size:12px;font-weight:700;color:var(--mute);transition:color .18s;border-radius:8px;-webkit-tap-highlight-color:transparent}
.acard-like:hover{color:#e11d48;background:#fff1f1}
.pcard-comment:hover{color:var(--p);background:#eef2ff}
.acard-like svg,.pcard-comment svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;transition:all .2s;flex-shrink:0}
.acard-like.liked{color:#e11d48}
.acard-like.liked svg{fill:#e11d48;stroke:#e11d48}
.acard-save{background:none;border:none;cursor:pointer;padding:4px 6px;border-radius:8px;color:var(--mute);-webkit-tap-highlight-color:transparent}
.acard-save svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2}
.acard-save.saved{color:var(--p)}
.acard-save.saved svg{fill:var(--p);stroke:var(--p)}

/* ── SKELETON ── */
.skel{background:linear-gradient(90deg,#f3f4f6 25%,#e9eaec 50%,#f3f4f6 75%);
  background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:6px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.skel-card{display:flex;gap:14px;padding:18px 16px;border-bottom:1px solid var(--border)}
.skel-img{width:90px;height:80px;border-radius:10px;flex-shrink:0}
.skel-lines{flex:1;display:flex;flex-direction:column;gap:8px;padding-top:4px}

/* ── EMPTY ── */
.empty{text-align:center;padding:60px 24px}
.empty svg{width:44px;height:44px;color:#d1d5db;margin:0 auto 14px;display:block}
.empty p{font-size:14px;color:var(--mute);line-height:1.6}

/* ── TOAST ── */
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);
  background:#0f0a1e;color:#fff;padding:10px 20px;border-radius:99px;
  font-size:13px;font-weight:600;opacity:0;transition:all .3s;z-index:300;white-space:nowrap;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── FOLLOWERS — FULL SCREEN (was a bottom sheet; now a dedicated page
   like the main profile.html follow screen, entered/exited via slide) ── */
.follow-screen{position:fixed;inset:0;background:var(--bg,#fff);z-index:2000;
  transform:translateX(100%);transition:transform .35s cubic-bezier(.32,0,.15,1);
  overflow-y:auto;-webkit-overflow-scrolling:touch}
.follow-screen.show{transform:translateX(0)}
.follow-screen .hdr{position:sticky;top:0}
.follow-item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border)}
.follow-item:last-child{border-bottom:none}
.follow-av{width:42px;height:42px;border-radius:50%;background:var(--g);
  display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;
  color:#fff;overflow:hidden;flex-shrink:0;cursor:pointer}
.follow-av img{width:100%;height:100%;object-fit:cover}
.follow-name{font-size:14px;font-weight:700;color:var(--txt);cursor:pointer}
.follow-name:hover{color:var(--p)}
.follow-sub{font-size:12px;color:var(--mute);margin-top:1px}
.follow-btn{margin-left:8px;padding:6px 14px;border-radius:99px;border:1.5px solid var(--border);
  background:transparent;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;
  transition:all .2s;flex-shrink:0}
.follow-btn:hover{border-color:var(--p);color:var(--p)}
.follow-btn.ing{border-color:var(--p);color:var(--p);background:#eef2ff}
</style>
</head>
<body>

<!-- HEADER -->
<header class="hdr">
  <a class="btn-back" href="/articles" aria-label="Back">
    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
  </a>
  <div class="hdr-title">
    MindShift Books
    <span class="hdr-badge"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></span>
  </div>
  <div class="hdr-r">
    <a class="btn-back" href="/books" title="Bookstore" aria-label="Bookstore">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    </a>
  </div>
</header>

<!-- COVER -->
<div class="cover">
  <img src="COVER.jpg" alt="MindShift Books Cover" id="kvCoverImg" onerror="this.style.display='none'">
  <div class="cover-overlay"></div>
</div>

<!-- PROFILE CARD -->
<div class="profile-card">
  <!-- Avatar overlapping the cover -->
  <div class="avatar-wrap">
    <div class="avatar">
      <img src="MINDSHIFT.jpg" alt="MindShift Books" id="kvAvatarImg" onerror="this.style.background='linear-gradient(135deg,#4f46e5,#06b6d4)'">
    </div>
    <div class="avatar-badge">
      <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
    </div>
  </div>

  <!-- Row just for the follow button -->
  <div class="avatar-row">
    <button class="btn-follow" id="followBtn" onclick="toggleFollow()">
      <svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
      Follow
    </button>
  </div>

  <div class="name-row">
    <span class="profile-name" id="kvName">MindShift Books</span>
    <span class="vbadge" title="Verified"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></span>
  </div>

  <div class="profile-tagline" id="kvTagline">Your Career, Elevated.</div>
  <div>
    <span class="official-chip">
      <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 100 20A10 10 0 0012 2zm0 0"/><polyline points="9 12 11 14 15 10" stroke="#4f46e5" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
      Official Account
    </span>
  </div>

  <div class="profile-bio" id="kvBio" style="margin-top:10px;white-space:pre-line">📚 A community for readers, creators &amp; curious minds.
🧠 Share ideas. Discover people.
✨ Find books worth reading.</div>

  <div class="stats-row">
    <div class="stat" onclick="showFollowers('followers')">
      <div class="stat-num" id="statFollowers">—</div>
      <div class="stat-label">Followers</div>
    </div>
    <div class="stat">
      <div class="stat-num" id="statArticles">—</div>
      <div class="stat-label">Articles</div>
    </div>
    <div class="stat">
      <div class="stat-num" id="statPosts">—</div>
      <div class="stat-label">Posts</div>
    </div>
  </div>
</div>

<!-- CONTENT TABS -->
<div class="section-label" style="display:flex;align-items:center;gap:16px;padding-bottom:0;">
  <span class="ct-tab active" id="ctTabArticles" onclick="switchContentTab('articles')" style="cursor:pointer;color:var(--p);border-bottom:2px solid var(--p);padding-bottom:10px;">Articles</span>
  <span class="ct-tab" id="ctTabPosts" onclick="switchContentTab('posts')" style="cursor:pointer;color:var(--mute);border-bottom:2px solid transparent;padding-bottom:10px;">Posts</span>
</div>
<div class="art-list" id="artList">
  <div class="skel-card"><div class="skel-lines"><div class="skel" style="height:10px;width:60px"></div><div class="skel" style="height:14px;width:90%"></div><div class="skel" style="height:12px;width:75%"></div><div class="skel" style="height:10px;width:50px;margin-top:4px"></div></div><div class="skel skel-img"></div></div>
  <div class="skel-card"><div class="skel-lines"><div class="skel" style="height:10px;width:60px"></div><div class="skel" style="height:14px;width:85%"></div><div class="skel" style="height:12px;width:70%"></div><div class="skel" style="height:10px;width:50px;margin-top:4px"></div></div><div class="skel skel-img"></div></div>
  <div class="skel-card"><div class="skel-lines"><div class="skel" style="height:10px;width:60px"></div><div class="skel" style="height:14px;width:80%"></div><div class="skel" style="height:12px;width:65%"></div><div class="skel" style="height:10px;width:50px;margin-top:4px"></div></div><div class="skel skel-img"></div></div>
  <div class="skel-card"><div class="skel-lines"><div class="skel" style="height:10px;width:60px"></div><div class="skel" style="height:14px;width:88%"></div><div class="skel" style="height:12px;width:72%"></div><div class="skel" style="height:10px;width:50px;margin-top:4px"></div></div><div class="skel skel-img"></div></div>
</div>
<div class="art-list" id="postList" style="display:none;"></div>

<!-- FOLLOWERS — FULL SCREEN -->
<div class="follow-screen" id="followScreen">
  <header class="hdr">
    <button class="btn-back" onclick="closeFollowScreen()" aria-label="Back">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div class="hdr-title">Followers</div>
  </header>
  <div id="followList"></div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js';
import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js';
import { getFirestore, doc, getDoc, setDoc, deleteDoc, updateDoc, collection,
  query, where, getDocs, getCountFromServer, orderBy, serverTimestamp, onSnapshot, increment, limit } from 'https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js';

const fbApp = initializeApp({
  apiKey:"AIzaSyDTn70s1_uIiSOR6lPLY_nKh8Ff1FViFCs",
  authDomain:"mindshiftbooks-c4451.firebaseapp.com",
  projectId:"mindshiftbooks-c4451",
  storageBucket:"mindshiftbooks-c4451.firebasestorage.app",
  messagingSenderId:"388697987853",
  appId: "1:388697987853:web:f023df9412c22285012e44",
  measurementId: "G-CHPJDQ4W08"
});
const auth = getAuth(fbApp);
const db   = getFirestore(fbApp, 'default');

let currentUser = null;
let isFollowing  = false;
let articles     = [];

/* ── AUTH ── */
onAuthStateChanged(auth, async user => {
  currentUser = user;
  if(user){
    const followId = `${user.uid}_official`;
    try{
      const s = await getDoc(doc(db,'follows',followId));
      isFollowing = s.exists();
      updateFollowBtn();
    }catch{}
  }
});

/* ── LOAD ── */
async function init(){
  await Promise.all([loadMindshiftProfile(), loadArticles(), loadFollowerCount(), loadPosts()]);
}

// Pulls admin-edited name/avatar/cover/bio/tagline from platform/official-profile,
// falling back to the hardcoded defaults already in the HTML if nothing's been saved yet.
async function loadMindshiftProfile(){
  try{
    const snap = await getDoc(doc(db,'platform','official-profile'));
    if(!snap.exists()) return;
    const p = snap.data();
    if(p.name)    { document.getElementById('kvName').textContent = p.name; document.title = p.name + ' — MindShift Books'; }
    if(p.tagline) document.getElementById('kvTagline').textContent = p.tagline;
    if(p.bio)     document.getElementById('kvBio').textContent = p.bio;
    if(p.avatar)  document.getElementById('kvAvatarImg').src = p.avatar;
    if(p.cover)   document.getElementById('kvCoverImg').src = p.cover;
  }catch(e){ console.error('MindShift Books profile load error:', e); }
}

async function loadArticles(){
  try{
    // Was querying `userId`, but every article is actually written with
    // `authorUid` (see write.html / server.js admin routes) — `userId` never
    // matched anything, so this always fell through to a "load every
    // published article on the platform" fallback and showed other users'
    // articles under the official MindShift Books name. Query the real
    // field, and if there genuinely are none yet, just show the empty state
    // instead of borrowing everyone else's content.
    const q = query(
      collection(db,'articles'),
      where('authorUid','==','official'),
      where('status','==','published'),
      orderBy('publishedAt','desc'),
      limit(60)
    );
    const snap = await getDocs(q);
    articles = snap.docs.map(d=>({id:d.id,...d.data()}));

    document.getElementById('statArticles').textContent = articles.length;
    renderArticles();
  }catch(e){
    console.error(e);
    renderArticles();
  }
}

async function loadFollowerCount(){
  const folQ = query(collection(db,'follows'), where('followingId','==','official'));
  let followerCount;
  try{
    // getCountFromServer is an aggregation query — Firestore bills it as
    // ~1 read no matter how many follow docs match, instead of 1 read per
    // follower (which is what a plain getDocs count would cost).
    followerCount = (await getCountFromServer(folQ)).data().count;
  }catch(e){
    // Seen in production: this call can fail (permission/config quirks
    // with aggregation queries) while the exact same filter via a plain
    // getDocs — what showFollowers() uses — works fine and lists real
    // followers. Falling straight to '0' on that failure is what caused
    // the stat to read 0 while the followers screen showed real people.
    // Fall back to counting the actual docs instead.
    try{ followerCount = (await getDocs(folQ)).size; }
    catch{ document.getElementById('statFollowers').textContent = '0'; return; }
  }

  document.getElementById('statFollowers').textContent = fmtNum(followerCount);

  try{
    // Run once per page load to reconcile the cached
    // users/official.followerCount counter if it's drifted; the live
    // onSnapshot below then keeps the displayed number current for free
    // after that.
    let reconciled = false;
    onSnapshot(doc(db,'users','official'), snap=>{
      const cached = snap.exists() ? (snap.data().followerCount||0) : 0;
      if(!reconciled){
        reconciled = true;
        if(cached !== followerCount){
          setDoc(doc(db,'users','official'),{followerCount},{merge:true}).catch(()=>{});
          return; // this write re-triggers the listener with the corrected value
        }
      }
      document.getElementById('statFollowers').textContent = fmtNum(cached);
    });
  }catch{} // the count above is already correct and displayed either way
}

async function loadPosts(){
  try{
    // Single equality filter (no orderBy) — avoids needing a composite index.
    // Sorted client-side instead, which is fine at the volume the official
    // account posts at.
    const q = query(collection(db,'posts'), where('authorUid','==','official'), limit(120));
    const snap = await getDocs(q);
    posts = snap.docs.map(d=>({id:d.id,...d.data()}));
    posts.sort((a,b)=>{
      const ta = a.publishedAt?.toMillis ? a.publishedAt.toMillis() : (a.publishedAt ? new Date(a.publishedAt).getTime() : 0);
      const tb = b.publishedAt?.toMillis ? b.publishedAt.toMillis() : (b.publishedAt ? new Date(b.publishedAt).getTime() : 0);
      return tb - ta;
    });
    document.getElementById('statPosts').textContent = fmtNum(posts.length);
    renderPosts();
    await loadLikedSet();
    await loadSavedSet();
    fetchLikeCounts(posts.map(p=>p.id));
    fetchPostCommentCounts(posts.filter(p=>!p.commentsOff).map(p=>p.id));
    posts.forEach(p=>{
      const btn = document.getElementById(`lb-${p.id}`);
      if(btn) btn.classList.toggle('liked', likedSet.has(p.id));
    });
  }catch(e){
    console.error('MindShift Books posts load error:', e);
    renderPosts();
  }
}

function esc(str){
  return String(str==null?'':str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function fmtRel(ts){
  if(!ts) return '';
  const ms = ts.seconds ? ts.seconds*1000 : ts;
  const d = Date.now()-ms;
  if(d<3600000) return `${Math.floor(d/60000)||1}m ago`;
  if(d<86400000) return `${Math.floor(d/3600000)}h ago`;
  if(d<604800000) return `${Math.floor(d/86400000)}d ago`;
  return new Date(ms).toLocaleDateString('en-US',{month:'short',day:'numeric'});
}

function buildMediaGridHtml(images, postId){
  if(!images || !images.length) return '';
  if(images.length===1){
    return `<div class="pcard-single" onclick="event.stopPropagation()">
      <img src="${images[0]}" alt="" loading="lazy" onclick="location.href='/post-read?id=${postId}'">
    </div>`;
  }
  return `
    <div class="pcard-carousel" onclick="event.stopPropagation()">
      <div class="pcard-track" id="ptrack-${postId}" onscroll="onPostScroll('${postId}')">
        ${images.map(url=>`<div class="pcard-slide"><img src="${url}" alt="" loading="lazy" onclick="location.href='/post-read?id=${postId}'" onload="fitCarouselSlide(this)" onerror="fitCarouselSlide(this)"></div>`).join('')}
      </div>
      <div class="pcard-count" id="pcount-${postId}">1/${images.length}</div>
    </div>`;
}
window.fitCarouselSlide = function(img){
  const slide = img.closest('.pcard-slide');
  const track = img.closest('.pcard-track');
  if(!slide || !track) return;
  if(!track._carouselAspects) track._carouselAspects = [];
  const aspect = (img.naturalWidth && img.naturalHeight) ? (img.naturalWidth / img.naturalHeight) : 1;
  track._carouselAspects.push({ slide, aspect });
  if(track._carouselAspects.length < track.children.length) return;
  finalizeCarouselTrack(track);
};
function finalizeCarouselTrack(track){
  const baseHeight = track.clientHeight;
  const maxAllowed = track.clientWidth * 0.82;
  let finalHeight = 0;
  track._carouselAspects.forEach(({aspect})=>{
    const widthAtBase = baseHeight * aspect;
    const h = widthAtBase > maxAllowed ? (maxAllowed / aspect) : baseHeight;
    if(h > finalHeight) finalHeight = h;
  });
  if(finalHeight > 0 && finalHeight < baseHeight){
    track.style.height = finalHeight + 'px';
  }
  track._carouselAspects.forEach(({slide, aspect})=>{
    const w = Math.min(finalHeight * aspect, maxAllowed);
    slide.style.width = w + 'px';
    slide.style.flexBasis = w + 'px';
    slide.style.height = finalHeight + 'px';
    slide.style.alignSelf = 'flex-start';
    const img = slide.querySelector('img');
    if(img){ img.style.width = '100%'; img.style.height = '100%'; }
  });
}
window.onPostScroll = function(id){
  const track = document.getElementById(`ptrack-${id}`);
  if(!track) return;
  let idx = 0;
  const mid = track.scrollLeft + track.clientWidth/2;
  Array.prototype.forEach.call(track.children, (slide,i)=>{
    if(slide.offsetLeft <= mid) idx = i;
  });
  const countEl = document.getElementById(`pcount-${id}`);
  if(countEl) countEl.textContent = `${idx+1}/${track.children.length}`;
};

function fmtDuration(secs){
  secs = Math.round(secs||0);
  const m = Math.floor(secs/60), s = secs%60;
  return `${m}:${String(s).padStart(2,'0')}`;
}
function buildVideoTileHtml(p){
  if(!p.videoUrl) return '';
  return `<div class="pcard-video" onclick="event.stopPropagation();location.href='/post-read?id=${p.id}'">
    <video class="pcard-video-el" data-post-id="${p.id}" src="${p.videoUrl}" poster="${p.thumbnailUrl||''}" muted loop playsinline preload="metadata"></video>
    <button type="button" class="pcard-video-mute" onclick="event.stopPropagation();toggleFeedVideoMute('${p.id}',event)" title="Unmute">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
    </button>
    ${p.duration ? `<span class="pcard-video-dur">${fmtDuration(p.duration)}</span>` : ''}
  </div>`;
}
window.toggleFeedVideoMute = function(id, event){
  const btn = event.currentTarget;
  const vid = btn.closest('.pcard-video').querySelector('video');
  if(!vid) return;
  vid.muted = !vid.muted;
  btn.classList.toggle('unmuted', !vid.muted);
};
let _profileVideoObserver = null;
function getProfileVideoObserver(){
  if(_profileVideoObserver) return _profileVideoObserver;
  _profileVideoObserver = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      const vid = entry.target;
      if(entry.isIntersecting) vid.play().catch(()=>{});
      else vid.pause();
    });
  }, { threshold: 0.6 });
  return _profileVideoObserver;
}
function observeProfileVideos(){
  const observer = getProfileVideoObserver();
  document.querySelectorAll('.pcard-video-el').forEach(el=>observer.observe(el));
}
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden) document.querySelectorAll('.pcard-video-el').forEach(v=>v.pause());
});

let likedSet = new Set();
let savedSet = new Set();
let likeCountCache = {};
async function loadLikedSet(){
  if(!currentUser) return;
  try{
    const s = await getDoc(doc(db,'userLikes',currentUser.uid));
    likedSet.clear();
    if(s.exists()){
      const data = s.data();
      Object.keys(data).forEach(id=>{ if(data[id]) likedSet.add(id); });
    }
  }catch(e){}
}
async function loadSavedSet(){
  if(!currentUser) return;
  try{
    const s = await getDoc(doc(db,'userSaves',currentUser.uid));
    savedSet.clear();
    if(s.exists()){
      const data = s.data();
      Object.keys(data).forEach(id=>{ if(data[id]) savedSet.add(id); });
    }
  }catch(e){}
}
async function fetchLikeCounts(ids){
  if(!ids.length) return;
  try{
    const results = await Promise.all(ids.map(id => getDoc(doc(db,'articleLikes',id)).catch(()=>null)));
    results.forEach((snap,i)=>{
      const id = ids[i];
      const c = snap&&snap.exists() ? (snap.data().count||0) : 0;
      likeCountCache[id] = c;
      const el = document.getElementById(`lc-${id}`);
      if(el) el.textContent = c > 0 ? c : (likedSet.has(id) ? 1 : '');
    });
  }catch(e){}
}
let commentCountCache = {};
async function fetchPostCommentCounts(ids){
  if(!ids.length) return;
  try{
    const results = await Promise.all(ids.map(id => getDoc(doc(db,'postMeta',id)).catch(()=>null)));
    results.forEach((snap,i)=>{
      const id = ids[i];
      const c = snap&&snap.exists() ? (snap.data().commentCount||0) : 0;
      commentCountCache[id] = c;
      const el = document.getElementById(`pcc-${id}`);
      if(el) el.textContent = c > 0 ? c : '';
    });
  }catch(e){}
}
async function toggleLike(id, wasLiked){
  if(!currentUser){ window.location.href='/login'; return null; }
  const cRef = doc(db,'articleLikes',id);
  try {
    await setDoc(doc(db,'userLikes',currentUser.uid),{[id]:!wasLiked},{merge:true});
    if(wasLiked){
      try{ await updateDoc(cRef,{count:increment(-1)}); }catch{ await setDoc(cRef,{count:0},{merge:true}); }
      return false;
    } else {
      try{ await updateDoc(cRef,{count:increment(1)}); }catch{ await setDoc(cRef,{count:1},{merge:true}); }
      return true;
    }
  } catch(e) {
    showToast('Could not update like — try again.');
    return null;
  }
}
window.handleLike = function(id){
  if(!currentUser){ window.location.href='/login'; return; }
  const btn = document.getElementById(`lb-${id}`);
  const countEl = document.getElementById(`lc-${id}`);
  const wasLiked = likedSet.has(id);
  if(wasLiked){ likedSet.delete(id); } else { likedSet.add(id); }
  if(btn) btn.classList.toggle('liked', !wasLiked);
  if(countEl){
    const cur = likeCountCache[id] || 0;
    const next = Math.max(0, cur + (wasLiked ? -1 : 1));
    likeCountCache[id] = next;
    countEl.textContent = next > 0 ? next : '';
  }
  (async()=>{
    const didLike = await toggleLike(id, wasLiked);
    if(didLike === null){
      if(wasLiked){ likedSet.add(id); } else { likedSet.delete(id); }
      if(btn) btn.classList.toggle('liked', wasLiked);
      if(countEl){
        const cur = likeCountCache[id] || 0;
        const rolled = Math.max(0, cur + (wasLiked ? 1 : -1));
        likeCountCache[id] = rolled;
        countEl.textContent = rolled > 0 ? rolled : '';
      }
    }
  })();
};
window.handleSave = function(id){
  if(!currentUser){ window.location.href='/login'; return; }
  const wasSaved = savedSet.has(id);
  if(wasSaved){ savedSet.delete(id); } else { savedSet.add(id); }
  const btn = document.getElementById(`sv-${id}`);
  if(btn) btn.classList.toggle('saved', !wasSaved);
  showToast(!wasSaved ? 'Saved! 🔖' : 'Removed from saves');
  (async()=>{
    try{
      await setDoc(doc(db,'userSaves',currentUser.uid),{[id]:!wasSaved},{merge:true});
      const sRef = doc(db,'articleSaves',id);
      if(wasSaved){
        try{ await updateDoc(sRef,{count:increment(-1)}); }catch{ await setDoc(sRef,{count:0},{merge:true}); }
      } else {
        try{ await updateDoc(sRef,{count:increment(1)}); }catch{ await setDoc(sRef,{count:1},{merge:true}); }
      }
    }catch(e){
      if(wasSaved){ savedSet.add(id); } else { savedSet.delete(id); }
      if(btn) btn.classList.toggle('saved', wasSaved);
      showToast('Could not save — try again.');
    }
  })();
};

window.toggleFollow = async function(){
  if(!currentUser){
    showToast('Sign in to follow MindShift Books');
    setTimeout(()=>location.href='login.html',1400);
    return;
  }
  const followId = `${currentUser.uid}_official`;
  const ref = doc(db,'follows',followId);
  try{
    if(isFollowing){
      await deleteDoc(ref);
      setDoc(doc(db,'users','official'),{followerCount:increment(-1)},{merge:true}).catch(()=>{});
      isFollowing = false;
      showToast('Unfollowed MindShift Books');
    } else {
      await setDoc(ref,{
        followerId: currentUser.uid,
        followingId: 'official',
        createdAt: serverTimestamp()
      });
      setDoc(doc(db,'users','official'),{followerCount:increment(1)},{merge:true}).catch(()=>{});
      isFollowing = true;
      showToast('Following MindShift Books ✓');

    updateFollowBtn();
    // No re-subscribe needed — loadFollowerCount()'s listener (attached once,
    // on page load) already updates the instant the increment above commits.
    // Calling loadFollowerCount() again here, like before, would stack a
    // fresh live listener on every single click without ever closing the
    // old one.
  }catch(e){ showToast('Something went wrong'); }
};

    }).join('');
  }catch{ document.getElementById('followList').innerHTML=`<div style="padding:20px;color:var(--mute)">Could not load.</div>`; }
};
window.closeFollowScreen = function(){
  document.getElementById('followScreen').classList.remove('show');
  document.body.style.overflow = '';
};

window.quickFollowSheet = async function(uid, btn){
  if(!currentUser) return;
  const id = `${currentUser.uid}_${uid}`;
  try{
    await setDoc(doc(db,'follows',id),{followerId:currentUser.uid,followingId:uid,createdAt:serverTimestamp()});
    btn.textContent='Following'; btn.classList.add('ing'); btn.disabled=true;
  }catch{}
};

/* ── HELPERS ── */
function fmtNum(n){
  if(n>=1000000) return (n/1000000).toFixed(1).replace('.0','')+'M';
  if(n>=1000) return (n/1000).toFixed(1).replace('.0','')+'K';
  return n||'0';
}
window.showToast = function(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('on');
  setTimeout(()=>t.classList.remove('on'),2800);
};

init();
</script>
