<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Founding Creator · MindShift Books</title>
<meta name="robots" content="noindex, nofollow"/>
<link rel="icon" href="/MINDSHIFT.jpg">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --p:#4f46e5;--p2:#06b6d4;--g:linear-gradient(90deg,#4f46e5,#06b6d4);
  --fg:linear-gradient(90deg,#1d4ed8,#3b82f6);
  --txt:#0f172a;--sub:#6b7280;--mute:#9ca3af;
  --bg:#f8fafc;--card:#fff;--border:#e5e7eb;--border2:#e2e8f0;
  --green:#10b981;--amber:#f59e0b;--red:#ef4444;--radius:16px;
}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;padding-bottom:50px}

.hdr{position:sticky;top:0;z-index:100;background:rgba(248,247,255,.92);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);padding:0 16px;height:56px;
  display:flex;align-items:center;gap:12px}
.btn-back{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--border);
  background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--txt);flex-shrink:0}
.btn-back svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.hdr-title{font-size:17px;font-weight:900;color:var(--txt)}

.fc-card{margin:20px 16px 0;padding:16px;border-radius:var(--radius);background:var(--card);
  border:1.5px solid var(--border)}
.fc-row{display:flex;align-items:center;gap:12px}
.fc-badge-img{width:52px;height:52px;border-radius:50%;object-fit:cover;flex-shrink:0}
.fc-badge-img.faded{filter:grayscale(1);opacity:.55}
.fc-info{flex:1;min-width:0}
.fc-name{font-size:15.5px;font-weight:900;color:var(--txt)}
.fc-meta{font-size:12.5px;font-weight:700;margin-top:2px}
.fc-meta.ok{color:var(--green)}
.fc-meta.warn{color:var(--amber)}
.fc-meta.muted{color:var(--sub)}
.fc-msg{font-size:12.5px;color:var(--sub);line-height:1.5;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}

.section{padding:22px 20px 0}
.section-title{font-size:14.5px;font-weight:900;color:var(--txt);margin-bottom:4px}
.section-sub{font-size:12.5px;color:var(--sub);margin-bottom:14px;line-height:1.5}

.req-list{display:flex;flex-direction:column;gap:12px}
.req-card{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);padding:14px 16px}
.req-top{display:flex;align-items:center;gap:12px}
.req-icon{width:38px;height:38px;border-radius:11px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.req-icon svg{width:19px;height:19px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.req-label-col{flex:1;min-width:0}
.req-label{font-size:13px;font-weight:700;color:var(--txt);margin-bottom:6px}
.req-nums{font-size:13px;font-weight:800;color:var(--sub);flex-shrink:0}
.req-nums.met{color:var(--green)}
.req-bar{height:7px;border-radius:99px;background:var(--border);overflow:hidden}
.req-bar-fill{height:100%;border-radius:99px;background:var(--fg);transition:width .4s ease}
.req-bar-fill.met{background:var(--green)}

.tips-list{display:flex;flex-direction:column;gap:10px}
.tip{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);padding:14px}
.tip-icon{width:34px;height:34px;border-radius:10px;background:#eef2ff;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.tip-icon svg{width:17px;height:17px;fill:none;stroke:var(--p);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tip-txt{font-size:13px;color:var(--txt);line-height:1.5;padding-top:2px}
.tip-txt b{display:block;font-size:13.5px;margin-bottom:2px}

.empty{margin:60px 20px;text-align:center;color:var(--sub);font-size:13.5px;line-height:1.6}
.empty a{color:var(--p);font-weight:800;text-decoration:none}

.skel{background:linear-gradient(90deg,#f0f0f0 25%,#e0e0e0 50%,#f0f0f0 75%);
  background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:8px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
</style>
</head>
<body>

<header class="hdr">
  <button class="btn-back" onclick="history.length>1?history.back():location.href='/profile'" aria-label="Back">
    <svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
  </button>
  <div class="hdr-title">Founding Creator</div>
</header>

<div id="content">
  <div class="fc-card">
    <div class="fc-row">
      <div class="skel" style="width:52px;height:52px;border-radius:50%"></div>
      <div style="flex:1"><div class="skel" style="height:14px;width:60%"></div></div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js';
import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js';

const fbApp = initializeApp({
  apiKey:"AIzaSyDTn70s1_uIiSOR6lPLY_nKh8Ff1FViFCs",
  authDomain:"mindshiftbooks-c4451.firebaseapp.com",
  projectId:"mindshiftbooks-c4451",
  storageBucket:"mindshiftbooks-c4451.firebasestorage.app",
  messagingSenderId:"388697987853",
  appId: "1:388697987853:web:f023df9412c22285012e44",
  measurementId: "G-CHPJDQ4W08"
});
const auth = getAuth(fbApp);

const TIPS = [
  { icon: '<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>', title: 'Post on a rhythm', body: "Three pieces a week is easiest spread out — aim for every couple of days rather than saving it all for one day." },
  { icon: '<svg viewBox="0 0 24 24"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 014-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 01-4 4H3"/></svg>', title: 'Engage to earn engagement', body: 'Liking and commenting on others\u2019 posts puts your name in front of people who follow back and engage on yours.' },
  { icon: '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>', title: 'Lead with a strong cover or hook', body: 'The first line or image is what earns the view — make it worth stopping for.' },
  { icon: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>', title: "Don't wait for Sunday", body: "Check your progress mid-week so you're not scrambling to hit the target on the last day." }
];

const REQ_ICONS = {
  content: { svg: '<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>', bg: 'linear-gradient(135deg,#818cf8,#4f46e5)' },
  views: { svg: '<svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>', bg: 'linear-gradient(135deg,#38bdf8,#0284c7)' },
  engagement: { svg: '<svg viewBox="0 0 24 24" style="fill:#fff;stroke:none"><path d="M12 22c4.418 0 8-3.134 8-7 0-3-2-5-3-7-.5 2-2 3-2 3 .5-3-1-6-3-8-1 3 0 5-2 7-2 2-3 3-3 5 0 3.582 2.239 7 5 7z"/></svg>', bg: 'linear-gradient(135deg,#fb923c,#ea580c)' }
};

function daysLeft(weekEndsAt){
  const ms = new Date(weekEndsAt).getTime() - Date.now();
  return Math.max(0, Math.ceil(ms / (24*60*60*1000)));
}

function fmtDate(iso){
  return new Date(iso).toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
}

function completionPct(progress, target){
  const ratios = [
    Math.min(1, progress.content / target.content),
    Math.min(1, progress.views / target.views),
    Math.min(1, progress.engagement / target.engagement)
  ];
  return Math.round((ratios.reduce((a,b) => a+b, 0) / ratios.length) * 100);
}

function reqCard(kind, label, have, target, unit){
  const met = have >= target;
  const pct = Math.min(100, Math.round((have/target)*100));
  const icon = REQ_ICONS[kind];
  return `
    <div class="req-card">
      <div class="req-top">
        <div class="req-icon" style="background:${icon.bg}">${icon.svg}</div>
        <div class="req-label-col">
          <div class="req-label">${label}</div>
          <div class="req-bar"><div class="req-bar-fill${met?' met':''}" style="width:${pct}%"></div></div>
        </div>
        <div class="req-nums${met?' met':''}">${Math.min(have,target)}/${target}${unit?` ${unit}`:''}</div>
      </div>
    </div>`;
}

function tipsHtml(){
  return `
    <div class="section">
      <div class="section-title">Tips to hit your target</div>
      <div class="tips-list">
        ${TIPS.map(t => `<div class="tip"><span class="tip-icon">${t.icon}</span><div class="tip-txt"><b>${t.title}</b>${t.body}</div></div>`).join('')}
      </div>
    </div>`;
}

function render(data){
  const el = document.getElementById('content');

  if(!data.earned){
    el.innerHTML = `<div class="empty">You haven't earned the Founding Creator badge yet.<br><br>
      Complete your profile setup to unlock it — plus a ₦2,000 ebook voucher.<br><br>
      <a href="/complete-profile">Finish your profile →</a></div>`;
    return;
  }

  // Launch grace period — real tracking hasn't started yet, nothing to
  // show progress on. Just explain when it kicks in.
  if(data.status === 'pending'){
    const startDate = data.trackingStartsAt ? fmtDate(data.trackingStartsAt) : 'next week';
    el.innerHTML = `
      <div class="fc-card">
        <div class="fc-row">
          <img class="fc-badge-img" src="/fcbadge.jpg" alt="Founding Creator badge">
          <div class="fc-info">
            <div class="fc-name">Founding Creator</div>
            <div class="fc-meta muted">Tracking starts ${startDate}</div>
          </div>
        </div>
        <div class="fc-msg">This badge just launched, so the days already gone this week won't count against you. Your first real week starts fresh on ${startDate} — this week's target list is below so you know what's coming.</div>
      </div>
      <div class="section">
        <div class="section-title">What you'll need each week</div>
        <div class="req-list">
          ${reqCard('content', 'Content posted', 0, data.target.content, '')}
          ${reqCard('views', 'Views', 0, data.target.views, '')}
          ${reqCard('engagement', 'Engagement (likes + comments + reposts)', 0, data.target.engagement, 'pts')}
        </div>
      </div>
      ${tipsHtml()}
    `;
    return;
  }

  const { status, target, progress, weekEndsAt } = data;
  const left = daysLeft(weekEndsAt);
  const pct = completionPct(progress, target);

  let metaClass = '', metaText = '', msg = '', badgeClass = '';
  if(status === 'active'){
    metaClass = 'ok';
    metaText = `${pct}% complete · ${left} day${left===1?'':'s'} left`;
    msg = 'Hit this week\u2019s target to keep your badge in full color next week.';
  } else if(status === 'faded'){
    badgeClass = 'faded';
    metaClass = 'warn';
    metaText = `${pct}% complete · ${left} day${left===1?'':'s'} left to recover`;
    msg = "You missed last week's target, so your badge faded and is hidden from other visitors. Hit this week's target and it's back to full color — miss it again and it's lost for good.";
  } else {
    badgeClass = 'faded';
    metaClass = 'muted';
    metaText = 'Badge lost';
    msg = 'You missed two weeks in a row, so the Founding Creator badge was removed. It isn\u2019t re-earnable through this checklist again — reach out to us if you think this is a mistake.';
  }

  el.innerHTML = `
    <div class="fc-card">
      <div class="fc-row">
        <img class="fc-badge-img ${badgeClass}" src="/fcbadge.jpg" alt="Founding Creator badge">
        <div class="fc-info">
          <div class="fc-name">Founding Creator</div>
          <div class="fc-meta ${metaClass}">${metaText}</div>
        </div>
      </div>
      <div class="fc-msg">${msg}</div>
    </div>
    ${status !== 'lost' ? `
    <div class="section">
      <div class="section-title">This week's target</div>
      <div class="section-sub">All three need to be met by the end of the week to keep your badge active.</div>
      <div class="req-list">
        ${reqCard('content', 'Content posted', progress.content, target.content, '')}
        ${reqCard('views', 'Views', progress.views, target.views, '')}
        ${reqCard('engagement', 'Engagement (likes + comments + reposts)', progress.engagement, target.engagement, 'pts')}
      </div>
    </div>` : ''}
    ${tipsHtml()}
  `;
}

onAuthStateChanged(auth, async (user) => {
  if(!user){ location.href = '/login'; return; }
  try{
    const idToken = await user.getIdToken();
    const resp = await fetch('/api/founding-creator/status', { headers: { Authorization: `Bearer ${idToken}` } });
    const data = await resp.json();
    if(!resp.ok) throw new Error(data.error || 'Failed to load');
    render(data);
  }catch(e){
    console.error('founding-creator status error:', e);
    document.getElementById('content').innerHTML = `<div class="empty">Couldn't load your badge status — check your connection and try again.</div>`;
  }
});
</script>
<script src="/create-picker.js"></script>
</body>
</html>
