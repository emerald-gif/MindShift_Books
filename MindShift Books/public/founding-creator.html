<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Founding Creator · MindShift Books</title>
<meta name="robots" content="noindex, nofollow"/>
<link rel="icon" href="/MINDSHIFT.jpg">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --p:#4f46e5;--p2:#06b6d4;--g:linear-gradient(90deg,#4f46e5,#06b6d4);
  --fg:linear-gradient(90deg,#1d4ed8,#3b82f6);
  --txt:#0f172a;--sub:#6b7280;--mute:#9ca3af;
  --bg:#f8fafc;--card:#fff;--border:#e5e7eb;--border2:#e2e8f0;
  --green:#10b981;--amber:#f59e0b;--red:#ef4444;--radius:16px;
}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;padding-bottom:50px}

.hdr{position:sticky;top:0;z-index:100;background:rgba(248,247,255,.92);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);padding:0 16px;height:56px;
  display:flex;align-items:center;gap:12px}
.btn-back{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--border);
  background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--txt);flex-shrink:0}
.btn-back svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.hdr-title{font-size:17px;font-weight:900;color:var(--txt)}

.hero{margin:20px 16px 0;padding:26px 18px;border-radius:var(--radius);text-align:center;
  background:var(--fg);color:#fff;position:relative;overflow:hidden;box-shadow:0 8px 24px rgba(59,130,246,.28)}
.hero.faded{background:#94a3b8}
.hero.faded .hero-icon img{filter:grayscale(1)}
.hero.lost{background:#94a3b8;opacity:.75}
.hero.lost .hero-icon img{filter:grayscale(1)}
.hero-icon{width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.2);
  display:flex;align-items:center;justify-content:center;margin:0 auto 10px;overflow:hidden}
.hero-icon img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.hero h1{font-size:18px;font-weight:900}
.hero p{font-size:13px;opacity:.95;line-height:1.5;margin-top:6px;max-width:320px;margin-left:auto;margin-right:auto}
.hero .days-left{display:inline-block;margin-top:12px;padding:5px 14px;border-radius:99px;
  background:rgba(255,255,255,.2);font-size:12px;font-weight:800}

.section{padding:22px 20px 0}
.section-title{font-size:14.5px;font-weight:900;color:var(--txt);margin-bottom:4px}
.section-sub{font-size:12.5px;color:var(--sub);margin-bottom:14px;line-height:1.5}

.req-list{display:flex;flex-direction:column;gap:12px}
.req-card{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);padding:16px}
.req-top{display:flex;align-items:center;justify-content:between;gap:10px;margin-bottom:8px}
.req-label{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:800;color:var(--txt);flex:1}
.req-label .emoji{font-size:16px}
.req-nums{font-size:13px;font-weight:800;color:var(--sub)}
.req-nums.met{color:var(--green)}
.req-bar{height:8px;border-radius:99px;background:var(--border);overflow:hidden}
.req-bar-fill{height:100%;border-radius:99px;background:var(--fg);transition:width .4s ease}
.req-bar-fill.met{background:var(--green)}

.tips-list{display:flex;flex-direction:column;gap:10px}
.tip{display:flex;gap:12px;background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);padding:14px}
.tip-emoji{font-size:18px;flex-shrink:0}
.tip-txt{font-size:13px;color:var(--txt);line-height:1.5}
.tip-txt b{display:block;font-size:13.5px;margin-bottom:2px}

.empty{margin:60px 20px;text-align:center;color:var(--sub);font-size:13.5px;line-height:1.6}
.empty a{color:var(--p);font-weight:800;text-decoration:none}

.skel{background:linear-gradient(90deg,#f0f0f0 25%,#e0e0e0 50%,#f0f0f0 75%);
  background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:8px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
</style>
</head>
<body>

<header class="hdr">
  <button class="btn-back" onclick="history.length>1?history.back():location.href='/profile'" aria-label="Back">
    <svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
  </button>
  <div class="hdr-title">Founding Creator</div>
</header>

<div id="content">
  <div class="hero">
    <div class="hero-icon"><div class="skel" style="width:28px;height:28px;border-radius:50%"></div></div>
    <div class="skel" style="height:14px;width:60%;margin:0 auto"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js';
import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js';

const fbApp = initializeApp({
  apiKey:"AIzaSyDTn70s1_uIiSOR6lPLY_nKh8Ff1FViFCs",
  authDomain:"mindshiftbooks-c4451.firebaseapp.com",
  projectId:"mindshiftbooks-c4451",
  storageBucket:"mindshiftbooks-c4451.firebasestorage.app",
  messagingSenderId:"388697987853",
  appId: "1:388697987853:web:f023df9412c22285012e44",
  measurementId: "G-CHPJDQ4W08"
});
const auth = getAuth(fbApp);

const BADGE_ICON = `<img src="/fcbadge.jpg" alt="Founding Creator badge">`;

const TIPS = [
  { emoji: '📝', title: 'Post on a rhythm', body: "Five pieces a week is easiest spread out — aim for daily rather than saving it all for one day." },
  { emoji: '🔁', title: 'Engage to earn engagement', body: 'Liking and commenting on others\u2019 posts puts your name in front of people who follow back and engage on yours.' },
  { emoji: '🖼️', title: 'Lead with a strong cover or hook', body: 'The first line or image is what earns the view — make it worth stopping for.' },
  { emoji: '⏰', title: "Don't wait for Sunday", body: "Check your progress mid-week so you're not scrambling to hit the target on the last day." }
];

function daysLeft(weekEndsAt){
  const ms = new Date(weekEndsAt).getTime() - Date.now();
  return Math.max(0, Math.ceil(ms / (24*60*60*1000)));
}

function reqCard(emoji, label, have, target, unit){
  const met = have >= target;
  const pct = Math.min(100, Math.round((have/target)*100));
  return `
    <div class="req-card">
      <div class="req-top">
        <div class="req-label"><span class="emoji">${emoji}</span>${label}</div>
        <div class="req-nums${met?' met':''}">${Math.min(have,target)}/${target}${unit?` ${unit}`:''}</div>
      </div>
      <div class="req-bar"><div class="req-bar-fill${met?' met':''}" style="width:${pct}%"></div></div>
    </div>`;
}

function tipsHtml(){
  return `
    <div class="section">
      <div class="section-title">Tips to hit your target</div>
      <div class="tips-list">
        ${TIPS.map(t => `<div class="tip"><span class="tip-emoji">${t.emoji}</span><div class="tip-txt"><b>${t.title}</b>${t.body}</div></div>`).join('')}
      </div>
    </div>`;
}

function render(data){
  const el = document.getElementById('content');

  if(!data.earned){
    el.innerHTML = `<div class="empty">You haven't earned the Founding Creator badge yet.<br><br>
      Complete your profile setup to unlock it — plus a ₦2,000 ebook voucher.<br><br>
      <a href="/complete-profile">Finish your profile →</a></div>`;
    return;
  }

  const { status, target, progress, weekEndsAt, missedAt } = data;
  const left = daysLeft(weekEndsAt);

  let heroClass = '', heroTitle = '', heroSub = '', daysHtml = '';
  if(status === 'active'){
    heroTitle = "You're Active 🎉";
    heroSub = 'Hit this week\u2019s target to keep your badge in full color next week.';
    daysHtml = `<div class="days-left">${left} day${left===1?'':'s'} left this week</div>`;
  } else if(status === 'faded'){
    heroClass = 'faded';
    heroTitle = 'Your badge is faded';
    heroSub = "You missed last week's target. Hit this week's target and it's back to full color — miss it again and the badge is lost for good.";
    daysHtml = `<div class="days-left">${left} day${left===1?'':'s'} left to recover it</div>`;
  } else {
    heroClass = 'lost';
    heroTitle = 'Badge lost';
    heroSub = 'You missed two weeks in a row, so the Founding Creator badge was removed. It isn\u2019t re-earnable through this checklist again — reach out to us if you think this is a mistake.';
  }

  el.innerHTML = `
    <div class="hero ${heroClass}">
      <div class="hero-icon">${BADGE_ICON}</div>
      <h1>${heroTitle}</h1>
      <p>${heroSub}</p>
      ${daysHtml}
    </div>
    ${status !== 'lost' ? `
    <div class="section">
      <div class="section-title">This week's target</div>
      <div class="section-sub">All three need to be met by the end of the week to keep your badge active.</div>
      <div class="req-list">
        ${reqCard('📝', 'Content posted', progress.content, target.content, '')}
        ${reqCard('👀', 'Views', progress.views, target.views, '')}
        ${reqCard('🔥', 'Engagement (likes + comments + reposts)', progress.engagement, target.engagement, 'pts')}
      </div>
    </div>` : ''}
    ${tipsHtml()}
  `;
}

onAuthStateChanged(auth, async (user) => {
  if(!user){ location.href = '/login'; return; }
  try{
    const idToken = await user.getIdToken();
    const resp = await fetch('/api/founding-creator/status', { headers: { Authorization: `Bearer ${idToken}` } });
    const data = await resp.json();
    if(!resp.ok) throw new Error(data.error || 'Failed to load');
    render(data);
  }catch(e){
    console.error('founding-creator status error:', e);
    document.getElementById('content').innerHTML = `<div class="empty">Couldn't load your badge status — check your connection and try again.</div>`;
  }
});
</script>
<script src="/create-picker.js"></script>
</body>
</html>
