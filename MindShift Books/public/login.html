<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sign In | MindShift Books</title>
  <meta name="description" content="Sign in to your MindShift Books account." />
  <meta name="robots" content="noindex, follow" />
  <link rel="shortcut icon" href="MINDSHIFT.jpg" type="image/jpg">
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
:root{ --primary:#0f172a; --accent:#06b6d4; --indigo:#4f46e5; --paper:#fdfdfc; }
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;color:var(--primary);background:var(--paper);min-height:100vh;}

.split{ display:grid; grid-template-columns: 44% 56%; min-height:100vh; }

/* ---------- LEFT: editorial / shelf panel ---------- */
.shelf{
  position:relative; overflow:hidden;
  background:
    radial-gradient(ellipse at 30% -10%, rgba(6,182,212,0.18), transparent 55%),
    linear-gradient(200deg, #0f172a 0%, #131029 55%, #0f172a 100%);
  padding:36px 40px;
  display:flex; flex-direction:column; justify-content:space-between;
}
.shelf-brand{ display:flex; align-items:center; gap:10px; }
.shelf-brand img{ width:30px; height:30px; border-radius:6px; }
.shelf-brand a{ color:#e2e8f0; font-weight:700; font-size:0.95rem; text-decoration:none; letter-spacing:0.01em; }

.stack{ position:relative; height:320px; margin:24px 0 0 6px; }
.stack img{
  position:absolute; top:0; width:120px; border-radius:3px;
  box-shadow: 0 24px 48px rgba(0,0,0,0.5), 0 2px 6px rgba(0,0,0,0.3);
  border:1px solid rgba(255,255,255,0.06);
}
.stack img:nth-child(1){ left:0px;   transform:rotate(-9deg);  z-index:1; }
.stack img:nth-child(2){ left:64px;  transform:rotate(-2deg) translateY(6px); z-index:2; }
.stack img:nth-child(3){ left:136px; transform:rotate(6deg)  translateY(-8px); z-index:3; }
.stack img:nth-child(4){ left:202px; transform:rotate(13deg) translateY(6px); z-index:1; opacity:0.92; }

.shelf-quote{ margin-top:60px; max-width:340px; }
.shelf-quote p{
  font-family:'Source Serif 4', serif; font-weight:500; font-size:1.5rem; line-height:1.35;
  color:#f1f5f9;
}
.shelf-quote span{ display:block; margin-top:14px; font-size:0.78rem; color:#67e8f9; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; }

.shelf-foot{ font-size:0.75rem; color:#475569; }

/* ---------- RIGHT: form panel ---------- */
.formside{ display:flex; align-items:center; justify-content:center; padding:40px 32px; }
.formwrap{ width:100%; max-width:380px; }

.formwrap .back{ font-size:0.8rem; color:#94a3b8; text-decoration:none; display:inline-block; margin-bottom:28px; }
.formwrap .back:hover{ color:var(--indigo); }

.formwrap h1{ font-family:'Source Serif 4', serif; font-weight:600; font-size:2rem; letter-spacing:-0.01em; }
.formwrap .sub{ color:#6b7280; font-size:0.92rem; margin-top:8px; margin-bottom:32px; }

.field{ margin-top:22px; }
.field:first-of-type{ margin-top:0; }
.field label{
  display:block; font-size:0.72rem; font-weight:700; color:#94a3b8;
  text-transform:uppercase; letter-spacing:0.07em; margin-bottom:8px;
}
.field input{
  width:100%; border:none; border-bottom:1.5px solid #e2e8f0; background:transparent;
  padding:8px 2px 10px; font-size:1rem; color:var(--primary); outline:none;
  font-family:'Inter',sans-serif; transition:border-color 0.2s;
}
.field input::placeholder{ color:#cbd5e1; }
.field input:focus{ border-bottom-color:var(--indigo); }

.error{
  display:none; margin-top:16px; padding:10px 0; border-bottom:2px solid #ef4444;
  color:#b91c1c; font-size:0.83rem;
}

.submit-row{ display:flex; align-items:center; gap:14px; margin-top:32px; }
.submit-btn{
  padding:13px 26px; border:none; border-radius:999px; cursor:pointer;
  background:linear-gradient(90deg,#4f46e5,#06b6d4); color:#fff;
  font-weight:700; font-size:0.9rem; font-family:'Inter',sans-serif;
  box-shadow:0 10px 22px rgba(79,70,229,0.24); transition:opacity 0.2s, transform 0.15s;
}
.submit-btn:hover{ opacity:0.93; transform:translateY(-1px); }
.submit-btn:disabled{ opacity:0.55; cursor:default; transform:none; }

.or-sep{ display:flex; align-items:center; gap:14px; margin:26px 0 18px; color:#cbd5e1; font-size:0.78rem; }
.or-sep::before, .or-sep::after{ content:''; flex:1; height:1px; background:#eef2f7; }

.google-btn{
  width:100%; display:flex; align-items:center; justify-content:center; gap:10px;
  padding:13px; border-radius:12px; border:1.5px solid #e2e8f0;
  background:#fff; cursor:pointer;
  box-shadow:0 1px 2px rgba(15,23,42,0.04);
  transition:border-color 0.15s, box-shadow 0.15s, transform 0.1s;
}
.google-btn:hover{ border-color:#cbd5e1; box-shadow:0 4px 14px rgba(15,23,42,0.08); }
.google-btn:active{ transform:translateY(1px); }
.google-btn svg{ width:19px; height:19px; flex-shrink:0; }
.google-btn span{ font-size:0.92rem; font-weight:600; color:var(--primary); }

.facebook-btn{
  width:100%; display:flex; align-items:center; justify-content:center; gap:10px;
  padding:13px; border-radius:12px; border:none;
  background:#1877F2; cursor:pointer; margin-top:10px;
  box-shadow:0 1px 2px rgba(15,23,42,0.04);
  transition:filter 0.15s, box-shadow 0.15s, transform 0.1s;
}
.facebook-btn:hover{ filter:brightness(1.05); box-shadow:0 4px 14px rgba(24,119,242,0.28); }
.facebook-btn:active{ transform:translateY(1px); }
.facebook-btn svg{ width:19px; height:19px; flex-shrink:0; }
.facebook-btn span{ font-size:0.92rem; font-weight:600; color:#fff; }

.switch-note{ margin-top:34px; font-size:0.87rem; color:#6b7280; }
.switch-note a{ color:var(--indigo); font-weight:700; text-decoration:none; }

/* Mobile: stack, shrink the shelf into a header strip */
@media (max-width: 860px){
  .split{ grid-template-columns:1fr; }
  .shelf{ padding:24px 24px 22px; }
  .stack{ height:150px; margin-top:14px; }
  .stack img{ width:82px; }
  .stack img:nth-child(2){ left:44px; }
  .stack img:nth-child(3){ left:92px; }
  .stack img:nth-child(4){ left:138px; }
  .shelf-quote{ margin-top:26px; max-width:none; }
  .shelf-quote p{ font-size:1.15rem; }
  .shelf-foot{ display:none; }
  .formside{ padding:32px 24px 60px; }
}
  </style>
</head>
<body>

<div class="split">

  <div class="shelf">
    <div>
      <div class="shelf-brand">
        <a href="/"><img src="MINDSHIFT.jpg" alt=""></a>
        <a href="/">MindShift Books</a>
      </div>
      <div class="stack">
        <img src="escape.jpg" alt="">
        <img src="gcwa.jpg" alt="">
        <img src="Think%20and%20grow%20rich.jpg" alt="">
        <img src="Atomic%20habit.jpg" alt="">
      </div>
    </div>
    <div class="shelf-quote">
      <p>"The books you keep returning to are the ones quietly rewriting how you think."</p>
      <span>MindShift Books</span>
    </div>
    <div class="shelf-foot">© 2026 MindShift Books</div>
  </div>

  <div class="formside">
    <div class="formwrap">
      <a class="back" href="/">← Back to browsing</a>
      <h1>Welcome back.</h1>
      <div class="sub">Sign in to check out and pick up your orders.</div>

      <form id="loginForm">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" placeholder="you@example.com" autocomplete="email" required>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" placeholder="Your password" autocomplete="current-password" required>
        </div>

        <div class="error" id="authError"></div>

        <div class="submit-row">
          <button type="submit" class="submit-btn" id="submitBtn">Sign In</button>
        </div>
      </form>

      <div class="or-sep">or</div>

      <div class="google-btn" id="googleBtn">
        <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.5 0 10.4-1.9 14-5.7l-6.5-5.4c-1.9 1.3-4.4 2.1-7.5 2.1-5.2 0-9.6-3.3-11.3-8l-6.6 5C9.7 39.7 16.3 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.3-4.1 5.7l6.5 5.4C41.5 35.9 44 30.5 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>
        <span>Continue with Google</span>
      </div>

      <div class="facebook-btn" id="facebookBtn">
        <svg viewBox="0 0 24 24"><path fill="#fff" d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
        <span>Continue with Facebook</span>
      </div>

      <div class="switch-note">Don't have an account? <a href="#" id="signupLink">Sign up</a></div>
    </div>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="/auth.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const returnTo = params.get('returnTo') || '/';
  document.getElementById('signupLink').href = '/signup?returnTo=' + encodeURIComponent(returnTo);

  const form = document.getElementById('loginForm');
  const errorBox = document.getElementById('authError');
  const submitBtn = document.getElementById('submitBtn');
  const googleBtn = document.getElementById('googleBtn');
  const facebookBtn = document.getElementById('facebookBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.style.display = 'none';
    submitBtn.disabled = true;
    submitBtn.textContent = 'Signing in…';
    try {
      await window.MSBAuth.signInEmail(
        document.getElementById('email').value.trim(),
        document.getElementById('password').value
      );
      window.MSBAuth.redirectAfterAuth();
    } catch (err) {
      errorBox.textContent = window.MSBAuth.friendlyAuthError(err);
      errorBox.style.display = 'block';
      submitBtn.disabled = false;
      submitBtn.textContent = 'Sign In';
    }
  });

  googleBtn.addEventListener('click', () => {
    errorBox.style.display = 'none';
    window.MSBAuth.signInGoogle();
  });

  facebookBtn.addEventListener('click', () => {
    errorBox.style.display = 'none';
    window.MSBAuth.signInFacebook();
  });
</script>

</body>
</html>
