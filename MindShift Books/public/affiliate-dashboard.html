  <title>Affiliate Dashboard | MindShift Books</title>

  <style>
:root{ --primary:#0f172a; --accent:#06b6d4; --indigo:#4f46e5; }
*{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',sans-serif}
body{background:var(--c-bg,#fff);color:var(--primary);}
svg.ico{width:19px;height:19px;flex-shrink:0;}
svg.ico-sm{width:14px;height:14px;flex-shrink:0;}

header{
  position:sticky;top:0;background:var(--c-bg,white);z-index:100;
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 20px;border-bottom:1px solid var(--c-line,#f1f5f9);
}
header .left{display:flex;align-items:center;gap:12px;}
.menu-btn{
  width:36px;height:36px;border-radius:10px;border:1.5px solid var(--c-line,#e2e8f0);background:var(--c-bg,#fff);
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;color:var(--primary);
}
.menu-btn svg{width:18px;height:18px;}
header .brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--primary);font-weight:800;font-size:1rem;}
header .brand img{width:30px;height:30px;border-radius:7px;}
header a.back{font-size:0.82rem;font-weight:700;color:var(--c-sub2,#64748b);text-decoration:none;}

.hdr-actions{display:flex;align-items:center;gap:8px;}
a.browse{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px 0 16px;border-radius:999px;
  background:var(--c-bg2,#f1f5f9);border:1px solid var(--c-line,#e2e8f0);color:var(--primary);
  font-weight:700;font-size:0.82rem;text-decoration:none;white-space:nowrap;transition:background .15s,transform .15s;}
a.browse:active{transform:scale(.97);}
a.browse svg{width:14px;height:14px;transition:transform .2s ease;}
a.browse:hover svg{transform:translateX(2px);}
.settings{position:relative;}
.gear{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;
  background:var(--c-bg2,#f1f5f9);border:1px solid var(--c-line,#e2e8f0);color:var(--primary);transition:transform .15s;}
.gear:active{transform:scale(.95);}
.gear svg{width:18px;height:18px;}
.gear[aria-expanded="true"]{background:var(--c-ink-bg,#0f172a);color:#fff;border-color:transparent;}
.menu{position:absolute;right:0;top:calc(100% + 10px);min-width:196px;padding:8px;z-index:200;
  background:var(--c-bg,#fff);border:1px solid var(--c-line,#e2e8f0);border-radius:18px;box-shadow:0 18px 44px rgba(15,23,42,.18);
  transform-origin:top right;animation:menuIn .16s ease-out;}
.menu[hidden]{display:none;}
@keyframes menuIn{from{opacity:0;transform:translateY(-6px) scale(.97);}to{opacity:1;transform:none;}}
.menu-label{padding:8px 12px 6px;font-size:0.7rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--c-mute,#94a3b8);}
.menu button{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border:0;background:none;border-radius:12px;
  font-size:0.92rem;font-weight:600;color:var(--primary);cursor:pointer;text-align:left;}
.menu button:active{background:var(--c-bg2,#f1f5f9);}
.menu button svg{width:18px;height:18px;flex-shrink:0;color:var(--c-sub2,#64748b);}
.menu button.on{background:rgba(79,70,229,.10);font-weight:800;}
.menu button.on svg{color:var(--indigo);}
.menu .tick{margin-left:auto;width:6px;height:11px;border:solid var(--indigo);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-2px);opacity:0;}
.menu button.on .tick{opacity:1;}
@media (max-width:400px){
  header{padding:12px 14px;}
  header .brand{font-size:0.92rem;gap:8px;}
  a.browse{padding:0 12px 0 14px;}
}
@media (max-width:360px){ a.browse .long{display:none;} }

.wrap{max-width:460px;margin:0 auto;}

/* ── SIDEBAR ── */
.sidebar-overlay{
  position:fixed;inset:0;background:rgba(15,23,42,0.45);z-index:199;
  opacity:0;pointer-events:none;transition:opacity 0.2s;
}
.sidebar-overlay.open{opacity:1;pointer-events:auto;}
.sidebar{
  position:fixed;top:0;left:0;bottom:0;width:270px;background:var(--c-bg,#fff);z-index:200;
  transform:translateX(-100%);transition:transform 0.25s ease;
  display:flex;flex-direction:column;box-shadow:2px 0 24px rgba(0,0,0,0.08);
}
.sidebar.open{transform:translateX(0);}
.sidebar-head{padding:20px 20px 16px;border-bottom:1px solid var(--c-line,#f1f5f9);display:flex;align-items:center;gap:10px;}
.sidebar-head img{width:28px;height:28px;border-radius:7px;}
.sidebar-head .name{font-weight:800;font-size:0.94rem;}
.sidebar-nav{padding:14px 12px;flex:1;}
.nav-item{
  display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;
  color:var(--c-sub,#475569);font-weight:700;font-size:0.9rem;cursor:pointer;margin-bottom:4px;
  border:none;background:none;width:100%;text-align:left;text-decoration:none;
}
.nav-item svg{width:19px;height:19px;flex-shrink:0;}
.nav-item.active{background:var(--c-tonal,#eef2ff);color:var(--indigo);}
.sidebar-foot{padding:14px 12px 20px;border-top:1px solid var(--c-line,#f1f5f9);}
.sidebar-foot a{
  display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 14px;border-radius:999px;
  background:var(--c-bg2,#f1f5f9);border:1px solid var(--c-line,#e2e8f0);
  color:var(--primary);font-weight:700;font-size:0.88rem;text-decoration:none;transition:transform .15s ease;
}
.sidebar-foot a:active{transform:scale(.98);}
.sidebar-foot a svg{width:16px;height:16px;transition:transform .2s ease;}
.sidebar-foot a:hover svg{transform:translateX(-2px);}

/* ── HERO ── */
.hero{padding:32px 22px 4px;}
.hero .eyebrow{
  display:inline-flex;align-items:center;gap:6px;
  font-size:0.76rem;font-weight:800;color:var(--c-ind,#4f46e5);letter-spacing:0.04em;
  text-transform:uppercase;margin-bottom:10px;
}
.hero h1{font-size:1.55rem;font-weight:900;letter-spacing:-0.02em;line-height:1.2;}
.hero .sub{color:var(--c-sub2,#64748b);font-size:0.88rem;margin-top:8px;line-height:1.5;}

/* ── LINK CARD ── */
.link-card{
  margin:22px 22px 0;padding:22px;border-radius:20px;color:#fff;
  background:linear-gradient(135deg,#0f172a 0%,#312e81 55%,#0891b2 100%);
}
.link-card .label{
  display:flex;align-items:center;gap:6px;
  font-size:0.74rem;color:var(--c-faint,#cbd5e1);font-weight:800;letter-spacing:0.03em;text-transform:uppercase;margin-bottom:12px;
}
.link-row{display:flex;gap:10px;align-items:center;}
.link-box{
  flex:1;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);
  border-radius:12px;padding:13px 15px;font-size:0.82rem;font-family:monospace;
  overflow-x:auto;white-space:nowrap;color:#fff;
}
.copy-btn{
  flex-shrink:0;background:var(--c-bg,#fff);color:var(--indigo);border:none;padding:13px 16px;
  border-radius:12px;font-weight:800;font-size:0.85rem;cursor:pointer;
  display:flex;align-items:center;gap:6px;
}
.copy-btn.copied{background:#22c55e;color:#fff;}

/* ── STATS LIST (single flat card, rows not boxes) ── */
.stats-card{
  margin:16px 22px 0;border:1px solid var(--c-line,#f1f5f9);border-radius:18px;padding:2px 18px;
}
.stat-row{display:flex;align-items:center;gap:13px;padding:14px 0;border-bottom:1px solid var(--c-line,#f1f5f9);}
.stat-row:last-child{border-bottom:none;}
.stat-icon{
  width:36px;height:36px;border-radius:10px;background:var(--c-bg2,#f8fafc);color:var(--indigo);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.stat-info{flex:1;min-width:0;}
.stat-val{font-size:1.05rem;font-weight:800;line-height:1.2;}
.stat-lbl{font-size:0.78rem;color:var(--c-mute,#94a3b8);font-weight:600;margin-top:1px;}
.bal-card{display:block;margin:16px 22px 0;padding:18px;border-radius:20px;text-decoration:none;color:inherit;background:var(--c-ok-bg,#f0fdf4);border:1px solid var(--c-line-ok,#dcfce7);-webkit-tap-highlight-color:transparent;transition:transform .15s}
.bal-card:active{transform:scale(.985)}
.bal-top{display:flex;align-items:center;gap:13px}
.bal-ico{width:42px;height:42px;border-radius:12px;background:#16a34a;color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.bal-ico svg{width:20px;height:20px}
.bal-info{flex:1;min-width:0}
.bal-lbl{font-size:.78rem;font-weight:700;color:var(--c-sub,#4b5563)}
.bal-val{font-size:1.6rem;font-weight:900;letter-spacing:-.02em;line-height:1.15;color:var(--primary)}
.bal-go{flex:none;display:inline-flex;align-items:center;gap:2px;font-size:.8rem;font-weight:800;color:#15803d}
.bal-go svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.bal-note{margin-top:12px;padding-top:12px;border-top:1px solid rgba(22,163,74,.18);font-size:.82rem;color:var(--c-sub,#4b5563);line-height:1.45}
.clicks-row{display:flex;align-items:center;gap:13px;margin:12px 22px 0;padding:12px 16px;background:var(--c-bg,#fff);border:1px solid var(--c-line,#f1f5f9);border-radius:18px}
.clicks-lbl{flex:1;font-size:.9rem;font-weight:700;color:var(--c-sub,#374151)}
.clicks-val{font-size:1.2rem;font-weight:900;letter-spacing:-.01em}
.clicks-row{display:flex;align-items:center;gap:13px;margin:12px 22px 0;padding:14px 16px;border-radius:18px;background:var(--c-bg,#fff);border:1px solid var(--c-line,#f1f5f9)}
.clicks-lbl{flex:1;font-size:.9rem;font-weight:700;color:var(--c-sub,#374151)}
.clicks-val{font-size:1.2rem;font-weight:900;letter-spacing:-.01em}
.earn-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 22px 0}
.earn-tile{background:var(--c-bg,#fff);border:1px solid var(--c-line,#f1f5f9);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.earn-tile .stat-icon{margin-bottom:12px}
.earn-val{font-size:1.4rem;font-weight:900;letter-spacing:-.02em;line-height:1.15;overflow:hidden;text-overflow:ellipsis}

/* ── SECTION ── */
.section{padding:30px 22px 60px;}
.section-eyebrow{
  display:flex;align-items:center;gap:6px;
  font-size:0.76rem;font-weight:800;color:var(--c-ind,#4f46e5);letter-spacing:0.04em;text-transform:uppercase;margin-bottom:8px;
}
.section h2{font-size:1.25rem;font-weight:900;letter-spacing:-0.01em;}

.referred-card{
  margin-top:18px;border:1px solid var(--c-line,#f1f5f9);border-radius:18px;padding:2px 18px;
}
.referred-row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--c-line,#f1f5f9);}
.referred-row:last-child{border-bottom:none;}
.referred-row .avatar{
  width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--indigo),var(--accent));
  color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:0.82rem;flex-shrink:0;
}
.referred-row .avatar svg{width:16px;height:16px;}
.referred-row .info{min-width:0;flex:1;}
.referred-row .name{font-weight:700;font-size:0.88rem;}
.referred-row .email{font-size:0.76rem;color:var(--c-mute,#94a3b8);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

.empty{padding:30px 18px;text-align:center;color:var(--c-mute,#94a3b8);font-size:0.86rem;border:1px solid var(--c-line,#f1f5f9);border-radius:18px;margin-top:18px;}

.loader{width:26px;height:26px;border:4px solid rgba(0,0,0,0.06);border-top:4px solid var(--accent);border-radius:50%;animation:spin 0.7s linear infinite;margin:70px auto;}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── MY ACCOUNT VIEW ── */
.card{background:var(--c-bg,#fff);border:1px solid var(--c-line,#f1f5f9);border-radius:18px;padding:22px;margin:0 22px;}
.card + .card{margin-top:16px;}
.card .card-title{font-size:0.98rem;font-weight:800;margin-bottom:16px;display:flex;align-items:center;gap:8px;}
.card .card-title svg{width:18px;height:18px;color:var(--indigo);}
.profile-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--c-line,#f8fafc);font-size:0.88rem;}
.profile-row:last-child{border-bottom:none;}
.profile-row .p-k{color:var(--c-mute,#94a3b8);font-weight:600;}
.profile-row .p-v{font-weight:700;text-align:right;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:0.8rem;font-weight:700;color:var(--c-sub,#374151);margin-bottom:6px;}
.field input{
  width:100%;padding:12px 13px;border-radius:10px;border:1.5px solid var(--c-line,#e2e8f0);font-size:0.9rem;
  font-family:inherit;background:var(--c-bg,#fff);color:var(--primary);
}
.field input:focus{outline:none;border-color:var(--indigo);}
.field input:disabled{background:var(--c-bg2,#f8fafc);color:var(--c-mute,#94a3b8);cursor:not-allowed;}
.save-btn{
  width:100%;padding:13px;border-radius:12px;border:none;margin-top:4px;
  background:linear-gradient(90deg,var(--indigo),var(--accent));color:#fff;
  font-weight:800;font-size:0.92rem;cursor:pointer;
}
.save-btn:disabled{opacity:0.6;cursor:default;}
.save-msg{font-size:0.82rem;font-weight:700;margin-top:10px;display:none;}
.save-msg.ok{color:#16a34a;display:block;}
.save-msg.err{color:var(--c-red-txt,#dc2626);display:block;}
.otp-box{border-top:1px solid var(--c-line,#eef2f7);margin-top:18px;padding-top:18px;}
.otp-box .otp-note{font-size:0.82rem;color:var(--c-sub2,#64748b);line-height:1.5;margin-bottom:12px;}
.otp-box .otp-note b{color:var(--primary);}
.otp-row{display:flex;gap:10px;}
.otp-row input{
  flex:1;padding:12px 13px;border-radius:10px;border:1.5px solid var(--c-line,#e2e8f0);font-size:1rem;
  font-family:inherit;background:var(--c-bg,#fff);color:var(--primary);letter-spacing:0.15em;text-align:center;font-weight:700;
}
.otp-row input:focus{outline:none;border-color:var(--indigo);}
.otp-actions{display:flex;align-items:center;justify-content:space-between;margin-top:12px;gap:10px;}
.otp-link{background:none;border:none;padding:0;font-size:0.8rem;font-weight:700;color:var(--indigo);cursor:pointer;}
.otp-link:disabled{color:var(--c-mute,#94a3b8);cursor:default;}
.otp-cancel{background:none;border:none;padding:0;font-size:0.8rem;font-weight:700;color:var(--c-mute,#94a3b8);cursor:pointer;}
  
  /* ── Sales funnel ── */
  .fn-card{background:var(--c-bg,#fff);border:1px solid var(--c-line,#e2e8f0);border-radius:26px;padding:20px;margin-bottom:14px;}
  .fn-tag{font-size:0.7rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--c-mute,#94a3b8);margin-bottom:14px;}
  .fn-step{margin-bottom:16px;}
  .fn-step:last-of-type{margin-bottom:0;}
  .fn-top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:7px;}
  .fn-lbl{font-size:0.86rem;font-weight:700;color:var(--c-sub,#475569);}
  .fn-val{font-size:1.15rem;font-weight:800;letter-spacing:-.02em;color:var(--primary);}
  .fn-track{height:14px;border-radius:999px;background:var(--c-bg2,#f1f5f9);overflow:hidden;}
  .fn-bar{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--indigo),#06b6d4);min-width:0;transition:width .7s cubic-bezier(.22,1,.36,1);}
  .fn-rate{display:inline-block;margin-top:7px;font-size:0.76rem;font-weight:700;color:var(--indigo);background:rgba(79,70,229,.10);padding:3px 10px;border-radius:999px;}
  .fn-hint{margin-top:16px;padding:12px 14px;border-radius:16px;background:rgba(79,70,229,.08);font-size:0.86rem;line-height:1.5;color:var(--c-sub,#475569);}
  .fn-seg{display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--c-bg2,#f1f5f9);margin-bottom:18px;}
  .fn-seg button{flex:1;border:0;background:none;padding:9px 0;border-radius:999px;font:inherit;font-size:0.84rem;font-weight:700;color:var(--c-sub2,#64748b);cursor:pointer;transition:background-color .2s,color .2s,box-shadow .2s;}
  .fn-seg button.on{background:var(--c-bg,#fff);color:var(--primary);box-shadow:0 1px 4px rgba(15,23,42,.14);}
  .fn-figs{display:flex;gap:22px;margin-bottom:14px;}
  .fn-fig b{display:block;font-size:1.45rem;font-weight:800;letter-spacing:-.03em;color:var(--primary);}
  .fn-fig span{font-size:0.78rem;font-weight:600;color:var(--c-sub2,#64748b);}
  .fn-chart{width:100%;height:96px;display:block;}
  .fn-axis{display:flex;justify-content:space-between;margin-top:6px;font-size:0.72rem;font-weight:600;color:var(--c-mute,#94a3b8);}
  .fn-empty{padding:18px 6px 6px;text-align:center;font-size:0.88rem;line-height:1.5;color:var(--c-sub2,#64748b);}
  .fn-list{display:flex;flex-direction:column;}
  .fn-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:.5px solid var(--c-line,#e2e8f0);}
  .fn-row:last-child{border-bottom:0;padding-bottom:0;}
  .fn-row:first-child{padding-top:0;}
  .fn-rank{width:24px;height:24px;border-radius:50%;background:rgba(79,70,229,.10);color:var(--indigo);font-size:0.76rem;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .fn-cover{width:34px;height:46px;border-radius:6px;object-fit:cover;background:var(--c-bg2,#f1f5f9);flex-shrink:0;}
  .fn-info{flex:1;min-width:0;}
  .fn-name{font-size:0.9rem;font-weight:700;color:var(--primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .fn-sub{font-size:0.76rem;color:var(--c-sub2,#64748b);margin-top:2px;}
  .fn-pill{font-size:0.8rem;font-weight:800;color:var(--indigo);flex-shrink:0;}
  .fn-plus{font-size:0.9rem;font-weight:800;color:#16a34a;flex-shrink:0;}

/* ── Update bank details: its own full-screen flow ── */
.bf{position:fixed;inset:0;z-index:1000;background:var(--c-bg2,#f8fafc);display:flex;flex-direction:column;animation:bfIn .28s cubic-bezier(.22,1,.36,1)}
@keyframes bfIn{from{transform:translateY(28px);opacity:0}to{transform:none;opacity:1}}
.bf-top{display:flex;align-items:center;gap:14px;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 10px}
.bf-back{flex:none;width:42px;height:42px;border-radius:50%;border:none;background:var(--c-bg,#fff);color:var(--primary);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 14px -6px rgba(15,23,42,.35)}
.bf-back svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.bf-steps{flex:1;display:flex;gap:6px}
.bf-steps i{flex:1;height:5px;border-radius:99px;background:var(--c-line,#e2e8f0);transition:background .3s}
.bf-steps i.on{background:linear-gradient(90deg,var(--indigo),var(--accent))}
.bf-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 22px calc(32px + env(safe-area-inset-bottom,0px))}
.bf-inner{max-width:440px;margin:0 auto}
.bf-ico{width:64px;height:64px;border-radius:20px;background:var(--c-tonal,#eef2ff);color:var(--indigo);display:flex;align-items:center;justify-content:center;margin:20px 0 18px}
.bf-ico svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.bf-ico.ok{background:#dcfce7;color:#16a34a}
.bf h2{font-size:1.7rem;font-weight:800;letter-spacing:-.02em;color:var(--primary);margin:0 0 8px;line-height:1.15}
.bf-sub{font-size:.95rem;color:var(--c-sub2,#64748b);line-height:1.55;margin-bottom:26px}
.bf-sub b{color:var(--primary);word-break:break-all}
.bf-digits{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:6px}
.bf-digit{width:100%;min-width:0;aspect-ratio:1/1.2;border-radius:14px;border:1.5px solid var(--c-line,#e2e8f0);background:var(--c-bg,#fff);color:var(--primary);font-family:inherit;font-size:1.55rem;font-weight:800;text-align:center;padding:0;transition:border-color .15s,box-shadow .15s}
.bf-digit:focus{outline:none;border-color:var(--indigo);box-shadow:0 0 0 4px rgba(79,70,229,.14)}
.bf-digit.filled{border-color:var(--indigo)}
.bf-digits.err .bf-digit{border-color:#dc2626;animation:bfShake .36s}
@keyframes bfShake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.bf .save-btn{padding:16px;font-size:1rem;border-radius:16px;margin-top:18px}
.bf-actions{display:flex;align-items:center;justify-content:center;margin-top:18px}
.bf-sum{background:var(--c-bg,#fff);border:1px solid var(--c-line,#e2e8f0);border-radius:18px;padding:6px 18px;margin:6px 0 4px}
.bf .field label{font-size:.82rem}
.bf .field input{padding:14px 15px;font-size:1rem;border-radius:14px}
@media (prefers-reduced-motion:reduce){.bf{animation:none}.bf-digits.err .bf-digit{animation:none}}

/* ── Skeleton loading (replaces the spinner) ── */
.sk{background:linear-gradient(90deg,var(--c-line,#eef2f7) 25%,var(--c-bg2,#f8fafc) 50%,var(--c-line,#eef2f7) 75%);background-size:200% 100%;animation:skShimmer 1.3s ease-in-out infinite;border-radius:10px}
@keyframes skShimmer{to{background-position:-200% 0}}
.sk-line{height:14px;margin-bottom:10px}
.sk-hero{padding:32px 22px 4px}
.sk-card{background:var(--c-bg,#fff);border:1px solid var(--c-line,#f1f5f9);border-radius:18px;padding:20px;margin:20px 22px 0}
.sk-row{display:flex;align-items:center;gap:13px;padding:13px 0}
.sk-ico{width:40px;height:40px;border-radius:12px;flex:none}
@media (prefers-reduced-motion:reduce){.sk{animation:none}}

<script>
  const main = document.getElementById('mainContent');
  const nf = new Intl.NumberFormat('en-NG');
  let AFFILIATE = null, REFERRED = [];
  let currentView = 'overview';

  const ICON = {
    spark: `<svg class="ico-sm" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.6 5.4L19 9l-5.4 1.6L12 16l-1.6-5.4L5 9l5.4-1.6z"/></svg>`,
    link: `<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 15l6-6"/><path d="M11 5l1-1a4 4 0 015.7 5.7l-2 2"/><path d="M13 19l-1 1a4 4 0 01-5.7-5.7l2-2"/></svg>`,
    copy: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>`,
    check: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;"><path d="M20 6L9 17l-5-5"/></svg>`,
    users: `<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20a6.5 6.5 0 0113 0"/><path d="M16 9.3a3 3 0 010 5.4"/><path d="M18.5 20a5.5 5.5 0 00-2.8-4.8"/></svg>`,
    cart: `<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1.4"/><circle cx="18" cy="21" r="1.4"/><path d="M2 3h2l2.6 12.4a2 2 0 002 1.6h8.8a2 2 0 002-1.6L22 7H6"/></svg>`,
    trend: `<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 7-8"/><path d="M15 6h5v5"/></svg>`,
    checkCircle: `<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12.5l2.3 2.3L16 9.6"/></svg>`,
    user: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20a8 8 0 0116 0"/></svg>`,
    wallet: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;"><path d="M3 7a2 2 0 012-2h13a2 2 0 012 2v11a2 2 0 01-2 2H5a2 2 0 01-2-2V7z"/><path d="M16 12h4"/></svg>`,
    bank: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;"><path d="M3 21h18"/><path d="M5 21V10M9.5 21V10M14.5 21V10M19 21V10"/><path d="M3 10l9-6 9 6"/></svg>`,
    idcard: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;"><rect x="2.5" y="5" width="19" height="14" rx="2"/><circle cx="8.5" cy="12" r="2"/><path d="M13.5 10h5M13.5 14h3.5"/></svg>`
  };

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function initials(name) {
    if (!name) return null;
    const parts = name.trim().split(/\s+/);
    return ((parts[0][0] || '') + (parts[1] ? parts[1][0] : '')).toUpperCase();
  }
  // ── Sidebar ──
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebarOverlay');
  function openSidebar() { sidebar.classList.add('open'); overlay.classList.add('open'); }
  function closeSidebar() { sidebar.classList.remove('open'); overlay.classList.remove('open'); }
  document.getElementById('menuBtn').addEventListener('click', openSidebar);
  overlay.addEventListener('click', closeSidebar);

  function setView(view) {
    currentView = view;
    document.getElementById('navOverview').classList.toggle('active', view === 'overview');
    document.getElementById('navAccount').classList.toggle('active', view === 'account');
    closeSidebar();
    if (view === 'overview') renderOverviewView();
    else renderAccountView();
  }
  document.getElementById('navOverview').addEventListener('click', () => setView('overview'));
  document.getElementById('navAccount').addEventListener('click', () => setView('account'));

  // One-line status under the available balance.
  function balanceNote(a) {
    const min = a.minPayout || 5000, avail = a.availableBalance || 0, pending = a.pendingPayout || 0;
    if (pending > 0) return `₦${nf.format(pending)} is queued for this Monday's payout.`;
    if (avail >= min) return 'You\'ve cleared the minimum — this goes out in your next Monday payout.';
    return `₦${nf.format(Math.max(0, min - avail))} more to reach the ₦${nf.format(min)} minimum payout.`;
  }

  // ── Overview view ──
  function renderOverviewView() {
    const affiliate = AFFILIATE;
    // Hardcoded to the main storefront domain, not window.location.origin —
    // this dashboard now lives on affiliate.mindshiftbooks.shop, but the
    // link itself must point where auth.js actually captures ?ref= and
    // sends people to shop, not wherever the dashboard happens to be hosted.
    const link = `https://mindshiftbooks.shop/?ref=${affiliate.code}`;

    main.innerHTML = `
      <div class="hero">
        <span class="eyebrow">${ICON.spark} Overview</span>
        <h1>Hey ${escapeHtml((affiliate.name || '').split(' ')[0] || 'there')}, here's how you're doing.</h1>
        <div class="sub">Every book sold through your link earns you 15% — tracked automatically, no codes needed.</div>
      </div>

      <div class="link-card">
        <div class="label">${ICON.link} Your referral link</div>
        <div class="link-row">
          <div class="link-box" id="linkBox">${link}</div>
          <button class="copy-btn" id="copyBtn">${ICON.copy} Copy</button>
        </div>
      </div>

      <a class="bal-card" href="/affiliate/payout" aria-label="Available balance — view payout details">
        <div class="bal-top">
          <div class="bal-ico">${ICON.wallet || ICON.trend}</div>
          <div class="bal-info">
            <div class="bal-lbl">Available balance</div>
            <div class="bal-val">₦${nf.format(affiliate.availableBalance || 0)}</div>
          </div>
          <span class="bal-go">Payout <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></span>
        </div>
        <div class="bal-note">${balanceNote(affiliate)}</div>
      </a>

      <div class="earn-grid">
        <div class="earn-tile">
          <div class="stat-icon">${ICON.trend}</div>
          <div class="earn-val">₦${nf.format(affiliate.earned || 0)}</div>
          <div class="stat-lbl">Total earned</div>
        </div>
        <div class="earn-tile">
          <div class="stat-icon">${ICON.checkCircle}</div>
          <div class="earn-val">₦${nf.format(affiliate.paidOut || 0)}</div>
          <div class="stat-lbl">Paid out</div>
        </div>
      </div>

      <div class="clicks-row">
        <div class="stat-icon">${ICON.link}</div>
        <div class="clicks-lbl">Link clicks</div>
        <div class="clicks-val">${nf.format(affiliate.clicks || 0)}</div>
      </div>

      <div class="clicks-row">
        <div class="stat-icon">${ICON.link}</div>
        <div class="clicks-lbl">Link clicks</div>
        <div class="clicks-val">${nf.format(affiliate.clicks || 0)}</div>
      </div>

      <div class="section" id="funnelSec">
        <div class="section-eyebrow">${ICON.trend} Performance</div>
        <h2>Your sales funnel</h2>
        <div id="funnelWrap"><div class="sk-card" style="margin:18px 0 0"><div class="sk sk-line" style="width:40%;height:12px"></div><div class="sk" style="height:12px;border-radius:99px;margin:12px 0"></div><div class="sk" style="height:12px;width:78%;border-radius:99px;margin:12px 0"></div><div class="sk" style="height:12px;width:46%;border-radius:99px;margin:12px 0 4px"></div></div></div>
      </div>

      <div class="section">
        <div class="section-eyebrow">${ICON.users} Community</div>
        <h2>Readers you've brought in</h2>
        <div id="referredWrap"></div>
      </div>
    `;

    // Referred
    const refWrap = document.getElementById('referredWrap');
    if (!REFERRED || REFERRED.length === 0) {
      refWrap.innerHTML = `<div class="empty">No one yet — share your link above to bring in your first reader.</div>`;
    } else {
      refWrap.innerHTML = `<div class="referred-card">` + REFERRED.map(r => {
        const init = initials(r.name);
        return `
        <div class="referred-row">
          <div class="avatar">${init ? init : ICON.user}</div>
          <div class="info">
            <div class="name">${escapeHtml(r.name || 'A new member')}</div>
            <div class="email">${escapeHtml(r.email || '')}</div>
          </div>
        </div>
      `;
      }).join('') + `</div>`;
    }

    loadFunnel(FUNNEL_DAYS);

    document.getElementById('copyBtn').addEventListener('click', () => {
      navigator.clipboard.writeText(link).then(() => {
        const btn = document.getElementById('copyBtn');
        btn.innerHTML = `${ICON.check} Copied!`;
        btn.classList.add('copied');
        setTimeout(() => { btn.innerHTML = `${ICON.copy} Copy`; btn.classList.remove('copied'); }, 1800);
      });
    });
  }

  // ── Sales funnel ──
  let FUNNEL = null, FUNNEL_DAYS = 30;
  const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function shortDate(iso) {
    const d = new Date(iso.length === 10 ? iso + 'T12:00:00' : iso);
    return d.getDate() + ' ' + MONTHS[d.getMonth()];
  }
  const ssGet = (k) => { try { return sessionStorage.getItem(k); } catch (_) { return null; } };
  const ssSet = (k, v) => { try { sessionStorage.setItem(k, v); } catch (_) {} };
  async function loadFunnel(days) {
    const wrap = document.getElementById('funnelWrap');
    if (!wrap) return;
    // Show the last numbers instantly, then refresh quietly in the background.
    const cacheKey = 'msb_aff_funnel_' + days;
    const cached = ssGet(cacheKey);
    if (cached) {
      try { FUNNEL = JSON.parse(cached); FUNNEL_DAYS = days; renderFunnel(); } catch (_) {}
    }
    try {
      const token = await window.MSBAuth.getIdToken();
      const r = await fetch('/api/affiliate/funnel?days=' + days, { headers: { Authorization: `Bearer ${token}` } });
      const j = await r.json();
      if (!r.ok || !j.funnel) throw new Error(j.error || 'failed');
      const fresh = JSON.stringify(j);
      FUNNEL = j; FUNNEL_DAYS = days;
      if (fresh !== cached) { ssSet(cacheKey, fresh); renderFunnel(); }
    } catch (e) {
      if (cached) return;  // keep showing the cached numbers if the refresh fails
      const w = document.getElementById('funnelWrap');
      if (w) w.innerHTML = `<div class="empty">We couldn't load your funnel just now. Please refresh in a moment.</div>`;
    }
  }
  function funnelHint(f) {
    if (f.clicks === 0) return 'Share your link to start filling this funnel. Every click on it is counted.';
    if (f.signups === 0) return 'People are clicking your link but not creating an account yet. Tell them what they get: free ebooks and a ₦2,000 voucher on their first book.';
    if (f.buyers === 0) return `You've brought in ${nf.format(f.signups)} reader${f.signups === 1 ? '' : 's'}. Remind them they can use their voucher on their first book. That is when your earnings start.`;
    return `${nf.format(f.buyers)} of the readers you brought in have bought a book. Keep sharing. Your best week is the one you post consistently.`;
  }
  function renderFunnel() {
    const wrap = document.getElementById('funnelWrap');
    if (!wrap || !FUNNEL) return;
    const f = FUNNEL.funnel, p = FUNNEL.period;
    const max = Math.max(f.clicks, f.signups, f.buyers, 1);
    const w = n => n > 0 ? Math.max(5, Math.round((n / max) * 100)) : 0;
    const rate = v => v === null ? '' : `<span class="fn-rate">${v}%</span>`;
    const steps = `
      <div class="fn-card">
        <div class="fn-tag">All time</div>
        <div class="fn-step"><div class="fn-top"><span class="fn-lbl">Link clicks</span><span class="fn-val">${nf.format(f.clicks)}</span></div>
          <div class="fn-track"><div class="fn-bar" style="width:${w(f.clicks)}%"></div></div></div>
        <div class="fn-step"><div class="fn-top"><span class="fn-lbl">Signed up</span><span class="fn-val">${nf.format(f.signups)}</span></div>
          <div class="fn-track"><div class="fn-bar" style="width:${w(f.signups)}%"></div></div>${f.clickToSignup === null ? '' : `<span class="fn-rate">${f.clickToSignup}% of clicks</span>`}</div>
        <div class="fn-step"><div class="fn-top"><span class="fn-lbl">Bought a book</span><span class="fn-val">${nf.format(f.buyers)}</span></div>
          <div class="fn-track"><div class="fn-bar" style="width:${w(f.buyers)}%"></div></div>${f.signupToBuyer === null ? '' : `<span class="fn-rate">${f.signupToBuyer}% of sign-ups</span>`}</div>
        <div class="fn-hint">${escapeHtml(funnelHint(f))}</div>
      </div>`;

    // Daily earnings chart
    const daily = p.daily; const maxE = Math.max(...daily.map(d => d.earned), 1);
    const n = daily.length, W = 300, H = 96, gap = n > 45 ? 1 : 3, bw = (W - gap * (n - 1)) / n;
    const bars = daily.map((d, i) => {
      const h = d.earned > 0 ? Math.max(4, Math.round((d.earned / maxE) * (H - 6))) : 2;
      return `<rect x="${(i * (bw + gap)).toFixed(2)}" y="${H - h}" width="${bw.toFixed(2)}" height="${h}" rx="${Math.min(3, bw / 2).toFixed(1)}" fill="${d.earned > 0 ? 'url(#fnGrad)' : 'currentColor'}" opacity="${d.earned > 0 ? 1 : .12}"><title>${shortDate(d.d)}: ₦${nf.format(d.earned)}</title></rect>`;
    }).join('');
    const chart = p.sales === 0
      ? `<div class="fn-empty">No sales in the last ${p.days} days yet. Share your link and your first one will show up here.</div>`
      : `<svg class="fn-chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Earnings per day">
           <defs><linearGradient id="fnGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4f46e5"/><stop offset="1" stop-color="#06b6d4"/></linearGradient></defs>${bars}</svg>
         <div class="fn-axis"><span>${shortDate(daily[0].d)}</span><span>${shortDate(daily[daily.length - 1].d)}</span></div>`;
    const seg = [7, 30, 90].map(d => `<button type="button" data-days="${d}" class="${d === p.days ? 'on' : ''}">${d} days</button>`).join('');
    const period = `
      <div class="fn-card">
        <div class="fn-seg" id="fnSeg">${seg}</div>
        <div class="fn-figs"><div class="fn-fig"><b>₦${nf.format(p.earned)}</b><span>earned</span></div><div class="fn-fig"><b>${nf.format(p.sales)}</b><span>${p.sales === 1 ? 'book sold' : 'books sold'}</span></div></div>
        ${chart}
      </div>`;

    const top = FUNNEL.topBooks.length ? `
      <div class="fn-card"><div class="fn-tag">Best sellers, last ${p.days} days</div><div class="fn-list">` +
      FUNNEL.topBooks.map((b, i) => `
        <div class="fn-row"><div class="fn-rank">${i + 1}</div>
          ${b.coverUrl ? `<img class="fn-cover" src="${escapeHtml(b.coverUrl)}" alt="" loading="lazy" onerror="this.style.display='none'">` : ''}
          <div class="fn-info"><div class="fn-name">${escapeHtml(b.title)}</div></div>
          <div class="fn-pill">${nf.format(b.units)} sold</div></div>`).join('') + `</div></div>` : '';

    const recent = FUNNEL.recent.length ? `
      <div class="fn-card"><div class="fn-tag">Recent sales</div><div class="fn-list">` +
      FUNNEL.recent.map(r => `
        <div class="fn-row"><div class="fn-info"><div class="fn-name">${escapeHtml(r.titles.join(', ') || 'A book')}</div><div class="fn-sub">${shortDate(r.at)}</div></div>
          <div class="fn-plus">+₦${nf.format(r.commission)}</div></div>`).join('') + `</div></div>` : '';

    wrap.innerHTML = steps + period + top + recent;
    document.getElementById('fnSeg').addEventListener('click', e => {
      const b = e.target.closest('button[data-days]'); if (!b) return;
      const d = Number(b.dataset.days); if (d === FUNNEL_DAYS) return;
      loadFunnel(d);
    });
  }

  // ── My Account view ──
  // The Account view only shows the current bank details. Changing them happens
  // in a separate full-screen flow (see openBankFlow below): verify code → new
  // details → done.

  function renderAccountView() {
    const affiliate = AFFILIATE;
    const locked = (affiliate.pendingPayout || 0) > 0;

    main.innerHTML = `
      <div class="hero">
        <span class="eyebrow">${ICON.spark} My account</span>
        <h1>Your affiliate profile</h1>
        <div class="sub">Keep your payout bank details up to date — this is where your Monday transfers go.</div>
      </div>

      <div class="card" style="margin-top:20px;">
        <div class="card-title">${ICON.idcard} Profile</div>
        <div class="profile-row"><span class="p-k">Name</span><span class="p-v">${escapeHtml(affiliate.name || '')}</span></div>
        <div class="profile-row"><span class="p-k">Referral code</span><span class="p-v">${escapeHtml(affiliate.code || '')}</span></div>
        <div class="profile-row"><span class="p-k">Platform</span><span class="p-v">${escapeHtml(affiliate.platform || '—')}</span></div>
        ${affiliate.phone ? `<div class="profile-row"><span class="p-k">Phone</span><span class="p-v">${escapeHtml(affiliate.phone)}</span></div>` : ''}
      </div>

      <div class="card" id="bankCard">
        <div class="card-title">${ICON.bank} Bank account details</div>
        ${locked ? `<div class="save-msg err" style="display:block;margin-bottom:14px;">You have a payout of ₦${nf.format(affiliate.pendingPayout)} queued for this Monday, so these details are locked until it's paid out — you'll be able to edit them right after.</div>` : ''}
        <div id="bankCardBody"></div>
      </div>
    `;

    renderBankView();
  }

  // ── Screen 1: read-only details + entry point ──
  function renderBankView() {
    const bank = AFFILIATE.bank || {};
    const locked = (AFFILIATE.pendingPayout || 0) > 0;
    document.getElementById('bankCardBody').innerHTML = `
      <div class="profile-row"><span class="p-k">Bank name</span><span class="p-v">${escapeHtml(bank.bankName || '—')}</span></div>
      <div class="profile-row"><span class="p-k">Account name</span><span class="p-v">${escapeHtml(bank.accountName || '—')}</span></div>
      <div class="profile-row"><span class="p-k">Account number</span><span class="p-v">${escapeHtml(bank.accountNumber || '—')}</span></div>
      <button type="button" class="save-btn" id="bankUpdateBtn" style="margin-top:16px;" ${locked ? 'disabled' : ''}>Update bank details</button>
      <div class="save-msg" id="bankViewMsg"></div>
    `;
    if (locked) return;
    document.getElementById('bankUpdateBtn').addEventListener('click', () => requestOtpAndGoToVerify());
  }

  // ══ Update bank details — its own full-screen flow ══
  //   1. Verify: 6-digit code emailed to the affiliate
  //   2. Details: new bank name / account name / number
  //   3. Done: confirmation
  // The save call carries no code; the server checks its own short verified
  // window, so nothing in this flow can be replayed to skip verification.
  let bankFlowEl = null, bankFlowTimer = null;

  function bfApi(path, method, body, token) {
    return fetch(path, {
      method,
      headers: Object.assign({ 'Content-Type': 'application/json', Authorization: `Bearer ${token}` }),
      body: body ? JSON.stringify(body) : undefined
    }).then(async res => {
      const data = await res.json().catch(() => ({}));
      return { ok: res.ok, data };
    });
  }

  // Entry point from the Account card: send the code, then open the flow.
  async function requestOtpAndGoToVerify() {
    const btn = document.getElementById('bankUpdateBtn');
    const msg = document.getElementById('bankViewMsg');
    msg.className = 'save-msg';
    btn.disabled = true;
    btn.textContent = 'Sending code…';
    try {
      const token = await window.MSBAuth.getIdToken();
      const r = await bfApi('/api/affiliate/bank/otp', 'POST', null, token);
      if (!r.ok) throw new Error(r.data.error || 'Could not send a verification code.');
      openBankFlow(r.data.sentTo);
    } catch (err) {
      msg.textContent = err.message;
      msg.className = 'save-msg err';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Update bank details';
    }
  }

  function openBankFlow(sentTo) {
    if (bankFlowEl) return;
    bankFlowEl = document.createElement('div');
    bankFlowEl.className = 'bf';
    bankFlowEl.setAttribute('role', 'dialog');
    bankFlowEl.setAttribute('aria-modal', 'true');
    bankFlowEl.setAttribute('aria-label', 'Update bank details');
    document.body.appendChild(bankFlowEl);
    document.body.style.overflow = 'hidden';
    history.pushState({ bankFlow: true }, '');
    bfVerify(sentTo);
  }

  // Close from the UI → pop our history entry; the popstate handler tears down.
  function closeBankFlow() {
    if (!bankFlowEl) return;
    if (history.state && history.state.bankFlow) history.back();
    else teardownBankFlow();
  }

  function teardownBankFlow() {
    if (!bankFlowEl) return;
    clearInterval(bankFlowTimer);
    bankFlowEl.remove();
    bankFlowEl = null;
    document.body.style.overflow = '';
    if (document.getElementById('bankCardBody')) renderBankView();
  }

  window.addEventListener('popstate', () => {
    if (bankFlowEl && !(history.state && history.state.bankFlow)) teardownBankFlow();
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && bankFlowEl) closeBankFlow(); });

  function bfFrame(step, inner) {
    bankFlowEl.innerHTML = `
      <div class="bf-top">
        <button type="button" class="bf-back" id="bfBack" aria-label="${step === 3 ? 'Close' : 'Back'}">
          <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <div class="bf-steps" aria-hidden="true">
          <i class="${step >= 1 ? 'on' : ''}"></i><i class="${step >= 2 ? 'on' : ''}"></i><i class="${step >= 3 ? 'on' : ''}"></i>
        </div>
      </div>
      <div class="bf-scroll"><div class="bf-inner">${inner}</div></div>`;
    document.getElementById('bfBack').addEventListener('click', closeBankFlow);
  }

  // ── Step 1: verify code ──
  function bfVerify(sentTo, note) {
    clearInterval(bankFlowTimer);
    bfFrame(1, `
      <div class="bf-ico"><svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 4.5-3.2 8.2-8 9-4.8-.8-8-4.5-8-9V6l8-3z"/><polyline points="8.5 12 11 14.5 15.5 9.5"/></svg></div>
      <h2>Verify it's you</h2>
      <div class="bf-sub">${note ? escapeHtml(note) + ' ' : ''}${sentTo ? `We sent a 6-digit code to <b>${escapeHtml(sentTo)}</b>. Enter it below to continue.` : 'Enter the 6-digit code we sent to your email to continue.'}</div>
      <div class="bf-digits" id="bfDigits">
        ${[0,1,2,3,4,5].map(n => `<input class="bf-digit" type="text" inputmode="numeric" maxlength="${n === 0 ? 6 : 1}" ${n === 0 ? 'autocomplete="one-time-code"' : 'autocomplete="off"'} aria-label="Digit ${n + 1}">`).join('')}
      </div>
      <div class="save-msg" id="bfMsg"></div>
      <button type="button" class="save-btn" id="bfVerifyBtn">Verify code</button>
      <div class="bf-actions"><button type="button" class="otp-link" id="bfResend" disabled>Resend code (60s)</button></div>
    `);

    const wrap = document.getElementById('bfDigits');
    const boxes = Array.from(wrap.querySelectorAll('.bf-digit'));
    const msg = document.getElementById('bfMsg');
    const verifyBtn = document.getElementById('bfVerifyBtn');
    const resendBtn = document.getElementById('bfResend');
    let busy = false;

    const getCode = () => boxes.map(b => b.value).join('');
    const paint = () => boxes.forEach(b => b.classList.toggle('filled', !!b.value));
    const fill = (digits) => {
      const d = String(digits).replace(/\D/g, '').slice(0, 6);
      boxes.forEach((b, i) => { b.value = d[i] || ''; });
      paint();
      const next = boxes.find(b => !b.value);
      (next || boxes[5]).focus();
      if (d.length === 6) submit();
    };

    boxes.forEach((b, i) => {
      b.addEventListener('input', () => {
        wrap.classList.remove('err');
        const v = b.value.replace(/\D/g, '');
        if (v.length > 1) { fill(v); return; }          // SMS/email autofill or paste
        b.value = v;
        paint();
        if (v && i < 5) boxes[i + 1].focus();
        if (getCode().length === 6) submit();
      });
      b.addEventListener('keydown', e => {
        if (e.key === 'Backspace' && !b.value && i > 0) { boxes[i - 1].value = ''; boxes[i - 1].focus(); paint(); }
        if (e.key === 'Enter') submit();
      });
      b.addEventListener('focus', () => b.select());
    });
    wrap.addEventListener('paste', e => {
      const t = (e.clipboardData || window.clipboardData).getData('text');
      if (t) { e.preventDefault(); fill(t); }
    });
    boxes[0].focus();

    let cooldown = 60;
    const tick = () => {
      cooldown -= 1;
      if (cooldown <= 0) { clearInterval(bankFlowTimer); resendBtn.disabled = false; resendBtn.textContent = 'Resend code'; }
      else resendBtn.textContent = `Resend code (${cooldown}s)`;
    };
    bankFlowTimer = setInterval(tick, 1000);

    resendBtn.addEventListener('click', async () => {
      if (resendBtn.disabled) return;
      resendBtn.disabled = true;
      try {
        const token = await window.MSBAuth.getIdToken();
        const r = await bfApi('/api/affiliate/bank/otp', 'POST', null, token);
        if (!r.ok) throw new Error(r.data.error || 'Could not resend the code.');
        bfVerify(r.data.sentTo, 'New code sent.');
      } catch (err) {
        msg.textContent = err.message;
        msg.className = 'save-msg err';
        resendBtn.disabled = false;
      }
    });

    async function submit() {
      if (busy) return;
      const code = getCode();
      if (code.length < 6) {
        msg.textContent = 'Enter all 6 digits of the code we emailed you.';
        msg.className = 'save-msg err';
        return;
      }
      busy = true;
      msg.className = 'save-msg';
      verifyBtn.disabled = true;
      verifyBtn.textContent = 'Verifying…';
      try {
        const token = await window.MSBAuth.getIdToken();
        const r = await bfApi('/api/affiliate/bank/otp/verify', 'POST', { otp: code }, token);
        if (!r.ok) throw new Error(r.data.error || 'Could not verify that code.');
        clearInterval(bankFlowTimer);
        bfDetails();
      } catch (err) {
        msg.textContent = err.message;
        msg.className = 'save-msg err';
        wrap.classList.add('err');
        boxes.forEach(b => { b.value = ''; });
        paint();
        boxes[0].focus();
        busy = false;
        verifyBtn.disabled = false;
        verifyBtn.textContent = 'Verify code';
      }
    }
    verifyBtn.addEventListener('click', submit);
  }

  // ── Step 2: new bank details ──
  function bfDetails() {
    const bank = AFFILIATE.bank || {};
    bfFrame(2, `
      <div class="bf-ico"><svg viewBox="0 0 24 24"><path d="M3 10l9-6 9 6"/><line x1="5" y1="10" x2="5" y2="18"/><line x1="10" y1="10" x2="10" y2="18"/><line x1="14" y1="10" x2="14" y2="18"/><line x1="19" y1="10" x2="19" y2="18"/><line x1="3" y1="21" x2="21" y2="21"/></svg></div>
      <h2>Your new bank details</h2>
      <div class="bf-sub">Code verified. Enter the account your Monday payouts should go to.</div>
      <form id="bfForm" novalidate>
        <div class="field">
          <label for="bfBankName">Bank name</label>
          <input id="bfBankName" type="text" value="${escapeHtml(bank.bankName || '')}" placeholder="e.g. GTBank" autocomplete="off" required>
        </div>
        <div class="field">
          <label for="bfAccName">Account name</label>
          <input id="bfAccName" type="text" value="${escapeHtml(bank.accountName || '')}" placeholder="Name on the account" autocomplete="off" required>
        </div>
        <div class="field">
          <label for="bfAccNum">Account number</label>
          <input id="bfAccNum" type="text" inputmode="numeric" maxlength="10" value="${escapeHtml(bank.accountNumber || '')}" placeholder="10 digits" autocomplete="off" required>
        </div>
        <div class="save-msg" id="bfSaveMsg"></div>
        <button type="submit" class="save-btn" id="bfSaveBtn">Save bank details</button>
      </form>
    `);

    const form = document.getElementById('bfForm');
    const saveBtn = document.getElementById('bfSaveBtn');
    const saveMsg = document.getElementById('bfSaveMsg');
    document.getElementById('bfBankName').focus();

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        bankName: document.getElementById('bfBankName').value.trim(),
        accountName: document.getElementById('bfAccName').value.trim(),
        accountNumber: document.getElementById('bfAccNum').value.trim()
      };
      saveMsg.className = 'save-msg';
      if (!payload.bankName || !payload.accountName || !payload.accountNumber) {
        saveMsg.textContent = 'Fill in all three fields.'; saveMsg.className = 'save-msg err'; return;
      }
      if (!/^\d{10}$/.test(payload.accountNumber)) {
        saveMsg.textContent = 'Account number should be exactly 10 digits.'; saveMsg.className = 'save-msg err'; return;
      }
      saveBtn.disabled = true;
      saveBtn.textContent = 'Saving…';
      try {
        const token = await window.MSBAuth.getIdToken();
        const r = await bfApi('/api/affiliate/bank', 'PUT', payload, token);
        if (!r.ok) {
          // The verified window can lapse (5 min): send a fresh code and go back to step 1.
          if (r.data.needsVerification) {
            const o = await bfApi('/api/affiliate/bank/otp', 'POST', null, token);
            bfVerify(o.ok ? o.data.sentTo : '', r.data.error || 'Your verification expired.');
            return;
          }
          throw new Error(r.data.error || 'Could not save your bank details.');
        }
        AFFILIATE.bank = r.data.bank;
        bfDone();
      } catch (err) {
        saveMsg.textContent = err.message;
        saveMsg.className = 'save-msg err';
        saveBtn.disabled = false;
        saveBtn.textContent = 'Save bank details';
      }
    });
  }

  // ── Step 3: done ──
  function bfDone() {
    const bank = AFFILIATE.bank || {};
    bfFrame(3, `
      <div class="bf-ico ok"><svg viewBox="0 0 24 24"><polyline points="5 12.5 10 17.5 19 7.5"/></svg></div>
      <h2>Bank details updated</h2>
      <div class="bf-sub">Your next Monday payout will go to this account.</div>
      <div class="bf-sum">
        <div class="profile-row"><span class="p-k">Bank name</span><span class="p-v">${escapeHtml(bank.bankName || '—')}</span></div>
        <div class="profile-row"><span class="p-k">Account name</span><span class="p-v">${escapeHtml(bank.accountName || '—')}</span></div>
        <div class="profile-row"><span class="p-k">Account number</span><span class="p-v">${escapeHtml(bank.accountNumber || '—')}</span></div>
      </div>
      <button type="button" class="save-btn" id="bfDoneBtn">Done</button>
    `);
    document.getElementById('bfDoneBtn').addEventListener('click', closeBankFlow);
  }

  // First paint: if we've loaded this dashboard in this tab before, show it instantly
  // from the saved copy, then refresh it quietly once we're signed in.
  const ME_KEY = 'msb_aff_me';
  const wantsAccount = new URLSearchParams(window.location.search).get('view') === 'account';
  let cachedMe = null, cachedRaw = ssGet(ME_KEY);
  if (cachedRaw) {
    try {
      cachedMe = JSON.parse(cachedRaw);
      if (cachedMe && cachedMe.affiliate) {
        AFFILIATE = cachedMe.affiliate;
        REFERRED = cachedMe.referred || [];
        setView(wantsAccount ? 'account' : 'overview');
      } else { cachedMe = null; }
    } catch (_) { cachedMe = null; }
  }

  function clearAffCache() {
    try {
      sessionStorage.removeItem(ME_KEY);
      Object.keys(sessionStorage).filter(k => k.indexOf('msb_aff_funnel_') === 0).forEach(k => sessionStorage.removeItem(k));
    } catch (_) {}
  }

  window.MSBAuth.onAuthReady(async (user) => {
    if (!user) {
      clearAffCache();
      window.location.href = '/login?returnTo=' + encodeURIComponent('/affiliate/dashboard');
      return;
    }
    // A saved copy that belongs to someone else must never linger on screen.
    if (cachedMe && cachedMe.uid && cachedMe.uid !== user.uid) {
      clearAffCache();
      cachedMe = null; cachedRaw = null;
      location.reload();
      return;
    }
    try {
      const token = await window.MSBAuth.getIdToken();
      const meRes = await fetch('/api/affiliate/me', { headers: { Authorization: `Bearer ${token}` } });
      const meData = await meRes.json();
      if (!meData || !meData.affiliate) {
        clearAffCache();
        window.location.href = '/affiliate';
        return;
      }
      const payload = JSON.stringify({ uid: user.uid, affiliate: meData.affiliate, referred: meData.referred || [] });
      AFFILIATE = meData.affiliate;
      REFERRED = meData.referred || [];
      ssSet(ME_KEY, payload);
      // Lets the storefront skip counting this affiliate's own visits to their link.
      try { if (AFFILIATE.code) localStorage.setItem('msb_own_aff_code', AFFILIATE.code); } catch (_) {}
      // Only redraw if something actually changed (and never under the bank flow).
      if (payload !== cachedRaw && !bankFlowEl) {
        setView(cachedMe ? currentView : (wantsAccount ? 'account' : 'overview'));
      }
    } catch (e) {
      if (!cachedMe) main.innerHTML = `<div class="empty">Could not load your dashboard. Please refresh the page.</div>`;
    }
  });
</script>

<script>
/* Appearance menu: Light / Dark / System (uses the site-wide theme.js, same choice as Settings) */
(function(){
  var btn=document.getElementById('settingsBtn'), menu=document.getElementById('settingsMenu');
  if(!btn||!menu) return;
  function cur(){ return (window.MSBTheme && window.MSBTheme.get) ? window.MSBTheme.get() : 'system'; }
  function sync(){
    var c=cur();
    menu.querySelectorAll('[data-theme-choice]').forEach(function(b){
      var on=b.getAttribute('data-theme-choice')===c; b.classList.toggle('on',on); b.setAttribute('aria-checked',on?'true':'false');
    });
  }
  function open(){ menu.hidden=false; btn.setAttribute('aria-expanded','true'); sync(); }
  function close(){ menu.hidden=true; btn.setAttribute('aria-expanded','false'); }
  btn.addEventListener('click',function(e){ e.stopPropagation(); if(menu.hidden) open(); else close(); });
  menu.addEventListener('click',function(e){
    var b=e.target.closest('[data-theme-choice]'); if(!b) return;
    if(window.MSBTheme && window.MSBTheme.set) window.MSBTheme.set(b.getAttribute('data-theme-choice'));
    sync(); setTimeout(close,140);
  });
  document.addEventListener('click',function(e){ if(!menu.hidden && !menu.contains(e.target) && !btn.contains(e.target)) close(); });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape' && !menu.hidden){ close(); btn.focus(); } });
  window.addEventListener('msb-theme',sync);
})();
</script>
</body>
