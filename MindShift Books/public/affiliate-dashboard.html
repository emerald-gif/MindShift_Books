<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Affiliate Dashboard | MindShift Books</title>
  <meta name="robots" content="noindex, follow" />
  <link rel="shortcut icon" href="MINDSHIFT.jpg" type="image/jpg">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
:root{ --primary:#0f172a; --accent:#06b6d4; --indigo:#4f46e5; }
*{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',sans-serif}
body{background:#fff;color:var(--primary);}
svg.ico{width:19px;height:19px;flex-shrink:0;}
svg.ico-sm{width:14px;height:14px;flex-shrink:0;}

header{
  position:sticky;top:0;background:white;z-index:100;
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 20px;border-bottom:1px solid #f1f5f9;
}
header .brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--primary);font-weight:800;font-size:1rem;}
header .brand img{width:30px;height:30px;border-radius:7px;}
header a.back{font-size:0.82rem;font-weight:700;color:#64748b;text-decoration:none;}

.wrap{max-width:460px;margin:0 auto;}

/* ── HERO ── */
.hero{padding:32px 22px 4px;}
.hero .eyebrow{
  display:inline-flex;align-items:center;gap:6px;
  font-size:0.76rem;font-weight:800;color:#4f46e5;letter-spacing:0.04em;
  text-transform:uppercase;margin-bottom:10px;
}
.hero h1{font-size:1.55rem;font-weight:900;letter-spacing:-0.02em;line-height:1.2;}
.hero .sub{color:#64748b;font-size:0.88rem;margin-top:8px;line-height:1.5;}

/* ── LINK CARD ── */
.link-card{
  margin:22px 22px 0;padding:22px;border-radius:20px;color:#fff;
  background:linear-gradient(135deg,#0f172a 0%,#312e81 55%,#0891b2 100%);
}
.link-card .label{
  display:flex;align-items:center;gap:6px;
  font-size:0.74rem;color:#cbd5e1;font-weight:800;letter-spacing:0.03em;text-transform:uppercase;margin-bottom:12px;
}
.link-row{display:flex;gap:10px;align-items:center;}
.link-box{
  flex:1;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);
  border-radius:12px;padding:13px 15px;font-size:0.82rem;font-family:monospace;
  overflow-x:auto;white-space:nowrap;color:#fff;
}
.copy-btn{
  flex-shrink:0;background:#fff;color:var(--indigo);border:none;padding:13px 16px;
  border-radius:12px;font-weight:800;font-size:0.85rem;cursor:pointer;
  display:flex;align-items:center;gap:6px;
}
.copy-btn.copied{background:#22c55e;color:#fff;}

/* ── BALANCE STRIP ── */
.balance-strip{
  margin:14px 22px 0;padding:16px 18px;border-radius:16px;
  background:#f0fdf4;border:1px solid #dcfce7;
  display:flex;align-items:center;gap:12px;
}
.balance-strip .b-icon{
  width:38px;height:38px;border-radius:11px;background:#16a34a;color:#fff;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.balance-strip .b-val{font-size:1.15rem;font-weight:900;line-height:1.1;}
.balance-strip .b-lbl{font-size:0.76rem;color:#4b5563;font-weight:600;margin-top:1px;}

/* ── STATS LIST (single flat card, rows not boxes) ── */
.stats-card{
  margin:16px 22px 0;border:1px solid #f1f5f9;border-radius:18px;padding:2px 18px;
}
.stat-row{display:flex;align-items:center;gap:13px;padding:14px 0;border-bottom:1px solid #f1f5f9;}
.stat-row:last-child{border-bottom:none;}
.stat-icon{
  width:36px;height:36px;border-radius:10px;background:#f8fafc;color:var(--indigo);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.stat-info{flex:1;min-width:0;}
.stat-val{font-size:1.05rem;font-weight:800;line-height:1.2;}
.stat-lbl{font-size:0.78rem;color:#94a3b8;font-weight:600;margin-top:1px;}

/* ── SECTION ── */
.section{padding:30px 22px 60px;}
.section-eyebrow{
  display:flex;align-items:center;gap:6px;
  font-size:0.76rem;font-weight:800;color:#4f46e5;letter-spacing:0.04em;text-transform:uppercase;margin-bottom:8px;
}
.section h2{font-size:1.25rem;font-weight:900;letter-spacing:-0.01em;}

.referred-card{
  margin-top:18px;border:1px solid #f1f5f9;border-radius:18px;padding:2px 18px;
}
.referred-row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid #f1f5f9;}
.referred-row:last-child{border-bottom:none;}
.referred-row .avatar{
  width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--indigo),var(--accent));
  color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:0.82rem;flex-shrink:0;
}
.referred-row .avatar svg{width:16px;height:16px;}
.referred-row .info{min-width:0;flex:1;}
.referred-row .name{font-weight:700;font-size:0.88rem;}
.referred-row .email{font-size:0.76rem;color:#94a3b8;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.empty{padding:30px 18px;text-align:center;color:#94a3b8;font-size:0.86rem;border:1px solid #f1f5f9;border-radius:18px;margin-top:18px;}

.loader{width:26px;height:26px;border:4px solid rgba(0,0,0,0.06);border-top:4px solid var(--accent);border-radius:50%;animation:spin 0.7s linear infinite;margin:70px auto;}
@keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>

<header>
  <a class="brand" href="/">
    <img src="MINDSHIFT.jpg" alt="MindShift Books logo">
    MindShift Books
  </a>
  <a class="back" href="/account">My Account</a>
</header>

<div class="wrap">
  <div id="mainContent">
    <div class="loader"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="/auth.js"></script>
<script>
  const main = document.getElementById('mainContent');
  const nf = new Intl.NumberFormat('en-NG');

  const ICON = {
    spark: `<svg class="ico-sm" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.6 5.4L19 9l-5.4 1.6L12 16l-1.6-5.4L5 9l5.4-1.6z"/></svg>`,
    link: `<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 15l6-6"/><path d="M11 5l1-1a4 4 0 015.7 5.7l-2 2"/><path d="M13 19l-1 1a4 4 0 01-5.7-5.7l2-2"/></svg>`,
    copy: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>`,
    check: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;"><path d="M20 6L9 17l-5-5"/></svg>`,
    wallet: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;"><path d="M3 7a2 2 0 012-2h13a2 2 0 012 2v11a2 2 0 01-2 2H5a2 2 0 01-2-2V7z"/><path d="M16 12h4"/></svg>`,
    users: `<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20a6.5 6.5 0 0113 0"/><path d="M16 9.3a3 3 0 010 5.4"/><path d="M18.5 20a5.5 5.5 0 00-2.8-4.8"/></svg>`,
    cart: `<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1.4"/><circle cx="18" cy="21" r="1.4"/><path d="M2 3h2l2.6 12.4a2 2 0 002 1.6h8.8a2 2 0 002-1.6L22 7H6"/></svg>`,
    trend: `<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 7-8"/><path d="M15 6h5v5"/></svg>`,
    checkCircle: `<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12.5l2.3 2.3L16 9.6"/></svg>`,
    user: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20a8 8 0 0116 0"/></svg>`
  };

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function initials(name) {
    if (!name) return null;
    const parts = name.trim().split(/\s+/);
    return ((parts[0][0] || '') + (parts[1] ? parts[1][0] : '')).toUpperCase();
  }

  function render(affiliate, referred) {
    const link = `${window.location.origin}/?ref=${affiliate.code}`;

    main.innerHTML = `
      <div class="hero">
        <span class="eyebrow">${ICON.spark} Your dashboard</span>
        <h1>Hey ${escapeHtml((affiliate.name || '').split(' ')[0] || 'there')}, here's how you're doing.</h1>
        <div class="sub">Every sale made through your link earns you 15% — tracked automatically, no codes needed.</div>
      </div>

      <div class="link-card">
        <div class="label">${ICON.link} Your referral link</div>
        <div class="link-row">
          <div class="link-box" id="linkBox">${link}</div>
          <button class="copy-btn" id="copyBtn">${ICON.copy} Copy</button>
        </div>
      </div>

      <div class="balance-strip">
        <div class="b-icon">${ICON.wallet}</div>
        <div>
          <div class="b-val">₦${nf.format(affiliate.outstanding)}</div>
          <div class="b-lbl">Owed to you right now</div>
        </div>
      </div>

      <div class="stats-card">
        <div class="stat-row">
          <div class="stat-icon">${ICON.link}</div>
          <div class="stat-info">
            <div class="stat-val">${nf.format(affiliate.clicks)}</div>
            <div class="stat-lbl">Link clicks</div>
          </div>
        </div>
        <div class="stat-row">
          <div class="stat-icon">${ICON.users}</div>
          <div class="stat-info">
            <div class="stat-val">${nf.format(affiliate.signups)}</div>
            <div class="stat-lbl">Sign-ups</div>
          </div>
        </div>
        <div class="stat-row">
          <div class="stat-icon">${ICON.cart}</div>
          <div class="stat-info">
            <div class="stat-val">${nf.format(affiliate.sales)}</div>
            <div class="stat-lbl">Sales</div>
          </div>
        </div>
        <div class="stat-row">
          <div class="stat-icon">${ICON.trend}</div>
          <div class="stat-info">
            <div class="stat-val">₦${nf.format(affiliate.earned)}</div>
            <div class="stat-lbl">Total earned, all time</div>
          </div>
        </div>
        <div class="stat-row">
          <div class="stat-icon">${ICON.checkCircle}</div>
          <div class="stat-info">
            <div class="stat-val">₦${nf.format(affiliate.paidOut)}</div>
            <div class="stat-lbl">Already paid out</div>
          </div>
        </div>
      </div>

      <div class="section">
        <div class="section-eyebrow">${ICON.users} Community</div>
        <h2>People you've referred</h2>
        <div id="referredWrap"></div>
      </div>
    `;

    const wrap = document.getElementById('referredWrap');
    if (!referred || referred.length === 0) {
      wrap.innerHTML = `<div class="empty">No one yet — share your link above to get your first referral.</div>`;
    } else {
      wrap.innerHTML = `<div class="referred-card">` + referred.map(r => {
        const init = initials(r.name);
        return `
        <div class="referred-row">
          <div class="avatar">${init ? init : ICON.user}</div>
          <div class="info">
            <div class="name">${escapeHtml(r.name || 'A new member')}</div>
            <div class="email">${escapeHtml(r.email || '')}</div>
          </div>
        </div>
      `;
      }).join('') + `</div>`;
    }

    document.getElementById('copyBtn').addEventListener('click', () => {
      navigator.clipboard.writeText(link).then(() => {
        const btn = document.getElementById('copyBtn');
        btn.innerHTML = `${ICON.check} Copied!`;
        btn.classList.add('copied');
        setTimeout(() => { btn.innerHTML = `${ICON.copy} Copy`; btn.classList.remove('copied'); }, 1800);
      });
    });
  }

  window.MSBAuth.onAuthReady(async (user) => {
    if (!user) {
      window.location.href = '/login?returnTo=' + encodeURIComponent('/affiliate/dashboard');
      return;
    }
    try {
      const token = await window.MSBAuth.getIdToken();
      const res = await fetch('/api/affiliate/me', { headers: { Authorization: `Bearer ${token}` } });
      const data = await res.json();
      if (!data || !data.affiliate) {
        window.location.href = '/affiliate';
        return;
      }
      render(data.affiliate, data.referred);
    } catch (e) {
      main.innerHTML = `<div class="empty">Could not load your dashboard. Please refresh the page.</div>`;
    }
  });
</script>

</body>
</html>
