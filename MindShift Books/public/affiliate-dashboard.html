<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Affiliate Dashboard | MindShift Books</title>
  <meta name="robots" content="noindex, follow" />
  <link rel="shortcut icon" href="/MINDSHIFT.jpg" type="image/jpg">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
:root{ --primary:#0f172a; --accent:#06b6d4; --indigo:#4f46e5; }
*{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',sans-serif}
body{background:#fff;color:var(--primary);}
svg.ico{width:19px;height:19px;flex-shrink:0;}
svg.ico-sm{width:14px;height:14px;flex-shrink:0;}

header{
  position:sticky;top:0;background:white;z-index:100;
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 20px;border-bottom:1px solid #f1f5f9;
}
header .left{display:flex;align-items:center;gap:12px;}
.menu-btn{
  width:36px;height:36px;border-radius:10px;border:1.5px solid #e2e8f0;background:#fff;
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;color:var(--primary);
}
.menu-btn svg{width:18px;height:18px;}
header .brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--primary);font-weight:800;font-size:1rem;}
header .brand img{width:30px;height:30px;border-radius:7px;}
header a.back{font-size:0.82rem;font-weight:700;color:#64748b;text-decoration:none;}

.wrap{max-width:460px;margin:0 auto;}

/* ── SIDEBAR ── */
.sidebar-overlay{
  position:fixed;inset:0;background:rgba(15,23,42,0.45);z-index:199;
  opacity:0;pointer-events:none;transition:opacity 0.2s;
}
.sidebar-overlay.open{opacity:1;pointer-events:auto;}
.sidebar{
  position:fixed;top:0;left:0;bottom:0;width:270px;background:#fff;z-index:200;
  transform:translateX(-100%);transition:transform 0.25s ease;
  display:flex;flex-direction:column;box-shadow:2px 0 24px rgba(0,0,0,0.08);
}
.sidebar.open{transform:translateX(0);}
.sidebar-head{padding:20px 20px 16px;border-bottom:1px solid #f1f5f9;display:flex;align-items:center;gap:10px;}
.sidebar-head img{width:28px;height:28px;border-radius:7px;}
.sidebar-head .name{font-weight:800;font-size:0.94rem;}
.sidebar-nav{padding:14px 12px;flex:1;}
.nav-item{
  display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;
  color:#475569;font-weight:700;font-size:0.9rem;cursor:pointer;margin-bottom:4px;
  border:none;background:none;width:100%;text-align:left;text-decoration:none;
}
.nav-item svg{width:19px;height:19px;flex-shrink:0;}
.nav-item.active{background:#eef2ff;color:var(--indigo);}
.sidebar-foot{padding:14px 12px 20px;border-top:1px solid #f1f5f9;}
.sidebar-foot a{
  display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;
  color:#94a3b8;font-weight:700;font-size:0.86rem;text-decoration:none;
}
.sidebar-foot a svg{width:17px;height:17px;}

/* ── HERO ── */
.hero{padding:32px 22px 4px;}
.hero .eyebrow{
  display:inline-flex;align-items:center;gap:6px;
  font-size:0.76rem;font-weight:800;color:#4f46e5;letter-spacing:0.04em;
  text-transform:uppercase;margin-bottom:10px;
}
.hero h1{font-size:1.55rem;font-weight:900;letter-spacing:-0.02em;line-height:1.2;}
.hero .sub{color:#64748b;font-size:0.88rem;margin-top:8px;line-height:1.5;}

/* ── LINK CARD ── */
.link-card{
  margin:22px 22px 0;padding:22px;border-radius:20px;color:#fff;
  background:linear-gradient(135deg,#0f172a 0%,#312e81 55%,#0891b2 100%);
}
.link-card .label{
  display:flex;align-items:center;gap:6px;
  font-size:0.74rem;color:#cbd5e1;font-weight:800;letter-spacing:0.03em;text-transform:uppercase;margin-bottom:12px;
}
.link-row{display:flex;gap:10px;align-items:center;}
.link-box{
  flex:1;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);
  border-radius:12px;padding:13px 15px;font-size:0.82rem;font-family:monospace;
  overflow-x:auto;white-space:nowrap;color:#fff;
}
.copy-btn{
  flex-shrink:0;background:#fff;color:var(--indigo);border:none;padding:13px 16px;
  border-radius:12px;font-weight:800;font-size:0.85rem;cursor:pointer;
  display:flex;align-items:center;gap:6px;
}
.copy-btn.copied{background:#22c55e;color:#fff;}

/* ── STATS LIST (single flat card, rows not boxes) ── */
.stats-card{
  margin:16px 22px 0;border:1px solid #f1f5f9;border-radius:18px;padding:2px 18px;
}
.stat-row{display:flex;align-items:center;gap:13px;padding:14px 0;border-bottom:1px solid #f1f5f9;}
.stat-row:last-child{border-bottom:none;}
.stat-icon{
  width:36px;height:36px;border-radius:10px;background:#f8fafc;color:var(--indigo);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.stat-info{flex:1;min-width:0;}
.stat-val{font-size:1.05rem;font-weight:800;line-height:1.2;}
.stat-lbl{font-size:0.78rem;color:#94a3b8;font-weight:600;margin-top:1px;}

/* ── SECTION ── */
.section{padding:30px 22px 60px;}
.section-eyebrow{
  display:flex;align-items:center;gap:6px;
  font-size:0.76rem;font-weight:800;color:#4f46e5;letter-spacing:0.04em;text-transform:uppercase;margin-bottom:8px;
}
.section h2{font-size:1.25rem;font-weight:900;letter-spacing:-0.01em;}

.referred-card{
  margin-top:18px;border:1px solid #f1f5f9;border-radius:18px;padding:2px 18px;
}
.referred-row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid #f1f5f9;}
.referred-row:last-child{border-bottom:none;}
.referred-row .avatar{
  width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--indigo),var(--accent));
  color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:0.82rem;flex-shrink:0;
}
.referred-row .avatar svg{width:16px;height:16px;}
.referred-row .info{min-width:0;flex:1;}
.referred-row .name{font-weight:700;font-size:0.88rem;}
.referred-row .email{font-size:0.76rem;color:#94a3b8;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

.empty{padding:30px 18px;text-align:center;color:#94a3b8;font-size:0.86rem;border:1px solid #f1f5f9;border-radius:18px;margin-top:18px;}

.loader{width:26px;height:26px;border:4px solid rgba(0,0,0,0.06);border-top:4px solid var(--accent);border-radius:50%;animation:spin 0.7s linear infinite;margin:70px auto;}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── MY ACCOUNT VIEW ── */
.card{background:#fff;border:1px solid #f1f5f9;border-radius:18px;padding:22px;margin:0 22px;}
.card + .card{margin-top:16px;}
.card .card-title{font-size:0.98rem;font-weight:800;margin-bottom:16px;display:flex;align-items:center;gap:8px;}
.card .card-title svg{width:18px;height:18px;color:var(--indigo);}
.profile-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #f8fafc;font-size:0.88rem;}
.profile-row:last-child{border-bottom:none;}
.profile-row .p-k{color:#94a3b8;font-weight:600;}
.profile-row .p-v{font-weight:700;text-align:right;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:0.8rem;font-weight:700;color:#374151;margin-bottom:6px;}
.field input{
  width:100%;padding:12px 13px;border-radius:10px;border:1.5px solid #e2e8f0;font-size:0.9rem;
  font-family:inherit;background:#fff;color:var(--primary);
}
.field input:focus{outline:none;border-color:var(--indigo);}
.field input:disabled{background:#f8fafc;color:#94a3b8;cursor:not-allowed;}
.save-btn{
  width:100%;padding:13px;border-radius:12px;border:none;margin-top:4px;
  background:linear-gradient(90deg,var(--indigo),var(--accent));color:#fff;
  font-weight:800;font-size:0.92rem;cursor:pointer;
}
.save-btn:disabled{opacity:0.6;cursor:default;}
.save-msg{font-size:0.82rem;font-weight:700;margin-top:10px;display:none;}
.save-msg.ok{color:#16a34a;display:block;}
.save-msg.err{color:#dc2626;display:block;}
.otp-box{border-top:1px solid #eef2f7;margin-top:18px;padding-top:18px;}
.otp-box .otp-note{font-size:0.82rem;color:#64748b;line-height:1.5;margin-bottom:12px;}
.otp-box .otp-note b{color:var(--primary);}
.otp-row{display:flex;gap:10px;}
.otp-row input{
  flex:1;padding:12px 13px;border-radius:10px;border:1.5px solid #e2e8f0;font-size:1rem;
  font-family:inherit;background:#fff;color:var(--primary);letter-spacing:0.15em;text-align:center;font-weight:700;
}
.otp-row input:focus{outline:none;border-color:var(--indigo);}
.otp-actions{display:flex;align-items:center;justify-content:space-between;margin-top:12px;gap:10px;}
.otp-link{background:none;border:none;padding:0;font-size:0.8rem;font-weight:700;color:var(--indigo);cursor:pointer;}
.otp-link:disabled{color:#94a3b8;cursor:default;}
.otp-cancel{background:none;border:none;padding:0;font-size:0.8rem;font-weight:700;color:#94a3b8;cursor:pointer;}
  </style>
</head>
<body>

<div class="sidebar-overlay" id="sidebarOverlay"></div>
<div class="sidebar" id="sidebar">
  <div class="sidebar-head">
    <img src="/MINDSHIFT.jpg" alt="MindShift Books logo">
    <div class="name">MindShift Books</div>
  </div>
  <div class="sidebar-nav">
    <button class="nav-item active" data-view="overview" id="navOverview">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>
      Overview
    </button>
    <a class="nav-item" href="/affiliate/payout">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 012-2h13a2 2 0 012 2v11a2 2 0 01-2 2H5a2 2 0 01-2-2V7z"/><path d="M16 12h4"/></svg>
      Payout
    </a>
    <button class="nav-item" data-view="account" id="navAccount">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20a8 8 0 0116 0"/></svg>
      My Account
    </button>
  </div>
  <div class="sidebar-foot">
    <a href="/books">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
      Back to store
    </a>
  </div>
</div>

<header>
  <div class="left">
    <button class="menu-btn" id="menuBtn" aria-label="Open menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <a class="brand" href="/">
      <img src="/MINDSHIFT.jpg" alt="MindShift Books logo">
      MindShift Books
    </a>
  </div>
</header>

<div class="wrap">
  <div id="mainContent">
    <div class="loader"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="/auth.js"></script>
<script>
  const main = document.getElementById('mainContent');
  const nf = new Intl.NumberFormat('en-NG');
  let AFFILIATE = null, REFERRED = [];
  let currentView = 'overview';

  const ICON = {
    spark: `<svg class="ico-sm" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.6 5.4L19 9l-5.4 1.6L12 16l-1.6-5.4L5 9l5.4-1.6z"/></svg>`,
    link: `<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 15l6-6"/><path d="M11 5l1-1a4 4 0 015.7 5.7l-2 2"/><path d="M13 19l-1 1a4 4 0 01-5.7-5.7l2-2"/></svg>`,
    copy: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>`,
    check: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;"><path d="M20 6L9 17l-5-5"/></svg>`,
    users: `<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20a6.5 6.5 0 0113 0"/><path d="M16 9.3a3 3 0 010 5.4"/><path d="M18.5 20a5.5 5.5 0 00-2.8-4.8"/></svg>`,
    cart: `<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1.4"/><circle cx="18" cy="21" r="1.4"/><path d="M2 3h2l2.6 12.4a2 2 0 002 1.6h8.8a2 2 0 002-1.6L22 7H6"/></svg>`,
    trend: `<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 7-8"/><path d="M15 6h5v5"/></svg>`,
    checkCircle: `<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12.5l2.3 2.3L16 9.6"/></svg>`,
    user: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20a8 8 0 0116 0"/></svg>`,
    bank: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;"><path d="M3 21h18"/><path d="M5 21V10M9.5 21V10M14.5 21V10M19 21V10"/><path d="M3 10l9-6 9 6"/></svg>`,
    idcard: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;"><rect x="2.5" y="5" width="19" height="14" rx="2"/><circle cx="8.5" cy="12" r="2"/><path d="M13.5 10h5M13.5 14h3.5"/></svg>`
  };

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function initials(name) {
    if (!name) return null;
    const parts = name.trim().split(/\s+/);
    return ((parts[0][0] || '') + (parts[1] ? parts[1][0] : '')).toUpperCase();
  }
  // ── Sidebar ──
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebarOverlay');
  function openSidebar() { sidebar.classList.add('open'); overlay.classList.add('open'); }
  function closeSidebar() { sidebar.classList.remove('open'); overlay.classList.remove('open'); }
  document.getElementById('menuBtn').addEventListener('click', openSidebar);
  overlay.addEventListener('click', closeSidebar);

  function setView(view) {
    currentView = view;
    document.getElementById('navOverview').classList.toggle('active', view === 'overview');
    document.getElementById('navAccount').classList.toggle('active', view === 'account');
    closeSidebar();
    if (view === 'overview') renderOverviewView();
    else renderAccountView();
  }
  document.getElementById('navOverview').addEventListener('click', () => setView('overview'));
  document.getElementById('navAccount').addEventListener('click', () => setView('account'));

  // ── Overview view ──
  function renderOverviewView() {
    const affiliate = AFFILIATE;
    // Hardcoded to the main storefront domain, not window.location.origin —
    // this dashboard now lives on affiliate.mindshiftbooks.shop, but the
    // link itself must point where auth.js actually captures ?ref= and
    // sends people to shop, not wherever the dashboard happens to be hosted.
    const link = `https://mindshiftbooks.shop/?ref=${affiliate.code}`;

    main.innerHTML = `
      <div class="hero">
        <span class="eyebrow">${ICON.spark} Overview</span>
        <h1>Hey ${escapeHtml((affiliate.name || '').split(' ')[0] || 'there')}, here's how you're doing.</h1>
        <div class="sub">Every book sold through your link earns you 15% — tracked automatically, no codes needed.</div>
      </div>

      <div class="link-card">
        <div class="label">${ICON.link} Your referral link</div>
        <div class="link-row">
          <div class="link-box" id="linkBox">${link}</div>
          <button class="copy-btn" id="copyBtn">${ICON.copy} Copy</button>
        </div>
      </div>

      <div class="stats-card">
        <div class="stat-row">
          <div class="stat-icon">${ICON.link}</div>
          <div class="stat-info">
            <div class="stat-val">${nf.format(affiliate.clicks)}</div>
            <div class="stat-lbl">Link clicks</div>
          </div>
        </div>
        <div class="stat-row">
          <div class="stat-icon">${ICON.users}</div>
          <div class="stat-info">
            <div class="stat-val">${nf.format(affiliate.signups)}</div>
            <div class="stat-lbl">Sign-ups</div>
          </div>
        </div>
        <div class="stat-row">
          <div class="stat-icon">${ICON.cart}</div>
          <div class="stat-info">
            <div class="stat-val">${nf.format(affiliate.sales)}</div>
            <div class="stat-lbl">Books sold</div>
          </div>
        </div>
        <div class="stat-row">
          <div class="stat-icon">${ICON.trend}</div>
          <div class="stat-info">
            <div class="stat-val">₦${nf.format(affiliate.earned)}</div>
            <div class="stat-lbl">Total earned, all time</div>
          </div>
        </div>
        <div class="stat-row">
          <div class="stat-icon">${ICON.checkCircle}</div>
          <div class="stat-info">
            <div class="stat-val">₦${nf.format(affiliate.paidOut)}</div>
            <div class="stat-lbl">Already paid out</div>
          </div>
        </div>
      </div>

      <div class="section">
        <div class="section-eyebrow">${ICON.users} Community</div>
        <h2>Readers you've brought in</h2>
        <div id="referredWrap"></div>
      </div>
    `;

    // Referred
    const refWrap = document.getElementById('referredWrap');
    if (!REFERRED || REFERRED.length === 0) {
      refWrap.innerHTML = `<div class="empty">No one yet — share your link above to bring in your first reader.</div>`;
    } else {
      refWrap.innerHTML = `<div class="referred-card">` + REFERRED.map(r => {
        const init = initials(r.name);
        return `
        <div class="referred-row">
          <div class="avatar">${init ? init : ICON.user}</div>
          <div class="info">
            <div class="name">${escapeHtml(r.name || 'A new member')}</div>
            <div class="email">${escapeHtml(r.email || '')}</div>
          </div>
        </div>
      `;
      }).join('') + `</div>`;
    }

    document.getElementById('copyBtn').addEventListener('click', () => {
      navigator.clipboard.writeText(link).then(() => {
        const btn = document.getElementById('copyBtn');
        btn.innerHTML = `${ICON.check} Copied!`;
        btn.classList.add('copied');
        setTimeout(() => { btn.innerHTML = `${ICON.copy} Copy`; btn.classList.remove('copied'); }, 1800);
      });
    });
  }

  // ── My Account view ──
  // Bank card has three sub-screens within the Account view:
  //   'view'   — current details (read-only) + "Update bank details" button
  //   'verify' — OTP entry only; nothing about the new bank details lives here
  //   'edit'   — the actual editable form, only reachable after verify succeeds
  let bankScreen = 'view';

  function renderAccountView() {
    const affiliate = AFFILIATE;
    const locked = (affiliate.pendingPayout || 0) > 0;
    if (locked) bankScreen = 'view';

    main.innerHTML = `
      <div class="hero">
        <span class="eyebrow">${ICON.spark} My account</span>
        <h1>Your affiliate profile</h1>
        <div class="sub">Keep your payout bank details up to date — this is where your Monday transfers go.</div>
      </div>

      <div class="card" style="margin-top:20px;">
        <div class="card-title">${ICON.idcard} Profile</div>
        <div class="profile-row"><span class="p-k">Name</span><span class="p-v">${escapeHtml(affiliate.name || '')}</span></div>
        <div class="profile-row"><span class="p-k">Referral code</span><span class="p-v">${escapeHtml(affiliate.code || '')}</span></div>
        <div class="profile-row"><span class="p-k">Platform</span><span class="p-v">${escapeHtml(affiliate.platform || '—')}</span></div>
        ${affiliate.phone ? `<div class="profile-row"><span class="p-k">Phone</span><span class="p-v">${escapeHtml(affiliate.phone)}</span></div>` : ''}
      </div>

      <div class="card" id="bankCard">
        <div class="card-title">${ICON.bank} Bank account details</div>
        ${locked ? `<div class="save-msg err" style="display:block;margin-bottom:14px;">You have a payout of ₦${nf.format(affiliate.pendingPayout)} queued for this Monday, so these details are locked until it's paid out — you'll be able to edit them right after.</div>` : ''}
        <div id="bankCardBody"></div>
      </div>
    `;

    if (locked) {
      renderBankView();
      return;
    }

    if (bankScreen === 'verify') renderBankVerify();
    else if (bankScreen === 'edit') renderBankEdit();
    else renderBankView();
  }

  // ── Screen 1: read-only details + entry point ──
  function renderBankView() {
    const bank = AFFILIATE.bank || {};
    const locked = (AFFILIATE.pendingPayout || 0) > 0;
    document.getElementById('bankCardBody').innerHTML = `
      <div class="profile-row"><span class="p-k">Bank name</span><span class="p-v">${escapeHtml(bank.bankName || '—')}</span></div>
      <div class="profile-row"><span class="p-k">Account name</span><span class="p-v">${escapeHtml(bank.accountName || '—')}</span></div>
      <div class="profile-row"><span class="p-k">Account number</span><span class="p-v">${escapeHtml(bank.accountNumber || '—')}</span></div>
      <button type="button" class="save-btn" id="bankUpdateBtn" style="margin-top:16px;" ${locked ? 'disabled' : ''}>Update bank details</button>
      <div class="save-msg" id="bankViewMsg"></div>
    `;
    if (locked) return;
    document.getElementById('bankUpdateBtn').addEventListener('click', () => requestOtpAndGoToVerify());
  }

  // ── Sends the code, then switches to the verify screen ──
  async function requestOtpAndGoToVerify() {
    const btn = document.getElementById('bankUpdateBtn');
    const msg = document.getElementById('bankViewMsg');
    msg.className = 'save-msg';
    btn.disabled = true;
    btn.textContent = 'Sending code…';
    try {
      const token = await window.MSBAuth.getIdToken();
      const res = await fetch('/api/affiliate/bank/otp', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` }
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Could not send a verification code.');
      bankScreen = 'verify';
      renderBankVerify(data.sentTo);
    } catch (err) {
      msg.textContent = err.message;
      msg.className = 'save-msg err';
      btn.disabled = false;
      btn.textContent = 'Update bank details';
    }
  }

  // ── Screen 2: OTP entry only — nothing about the new bank details here ──
  function renderBankVerify(sentTo) {
    document.getElementById('bankCardBody').innerHTML = `
      <div class="otp-note" id="otpNote">${sentTo ? `We sent a 6-digit code to <b>${escapeHtml(sentTo)}</b>. Enter it below to continue.` : 'Enter the 6-digit code we sent to your email to continue.'}</div>
      <div class="otp-row">
        <input id="otpInput" type="text" inputmode="numeric" maxlength="6" placeholder="••••••" autocomplete="one-time-code">
      </div>
      <button type="button" class="save-btn" id="otpVerifyBtn" style="margin-top:12px;">Verify code</button>
      <div class="otp-actions">
        <button type="button" class="otp-link" id="otpResendBtn" disabled>Resend code (60s)</button>
        <button type="button" class="otp-cancel" id="otpCancelBtn">Cancel</button>
      </div>
      <div class="save-msg" id="otpMsg"></div>
    `;

    const otpInput = document.getElementById('otpInput');
    const otpMsg = document.getElementById('otpMsg');
    const verifyBtn = document.getElementById('otpVerifyBtn');
    const resendBtn = document.getElementById('otpResendBtn');
    const cancelBtn = document.getElementById('otpCancelBtn');
    otpInput.focus();

    let resendCooldown = 60;
    const cooldownTimer = setInterval(() => {
      resendCooldown -= 1;
      if (resendCooldown <= 0) {
        clearInterval(cooldownTimer);
        resendBtn.disabled = false;
        resendBtn.textContent = 'Resend code';
      } else {
        resendBtn.textContent = `Resend code (${resendCooldown}s)`;
      }
    }, 1000);

    cancelBtn.addEventListener('click', () => {
      clearInterval(cooldownTimer);
      bankScreen = 'view';
      renderBankView();
    });

    resendBtn.addEventListener('click', async () => {
      if (resendBtn.disabled) return;
      resendBtn.disabled = true;
      try {
        const token = await window.MSBAuth.getIdToken();
        const res = await fetch('/api/affiliate/bank/otp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` }
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Could not resend the code.');
        clearInterval(cooldownTimer);
        renderBankVerify(data.sentTo);
      } catch (err) {
        otpMsg.textContent = err.message;
        otpMsg.className = 'save-msg err';
        resendBtn.disabled = false;
      }
    });

    verifyBtn.addEventListener('click', async () => {
      const code = otpInput.value.trim();
      if (!code) {
        otpMsg.textContent = 'Enter the code we emailed you.';
        otpMsg.className = 'save-msg err';
        return;
      }
      otpMsg.className = 'save-msg';
      verifyBtn.disabled = true;
      verifyBtn.textContent = 'Verifying…';
      try {
        const token = await window.MSBAuth.getIdToken();
        const res = await fetch('/api/affiliate/bank/otp/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
          body: JSON.stringify({ otp: code })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Could not verify that code.');
        clearInterval(cooldownTimer);
        bankScreen = 'edit';
        renderBankEdit();
      } catch (err) {
        otpMsg.textContent = err.message;
        otpMsg.className = 'save-msg err';
      } finally {
        verifyBtn.disabled = false;
        verifyBtn.textContent = 'Verify code';
      }
    });
  }

  // ── Screen 3: the actual edit form — only reachable after verify succeeds.
  // The save call below carries no code at all; the server checks its own
  // short verified window instead, so there's nothing in this screen a
  // client could replay to skip verification. ──
  function renderBankEdit() {
    const bank = AFFILIATE.bank || {};
    document.getElementById('bankCardBody').innerHTML = `
      <div class="otp-note">Code verified. Enter and save your new bank details below.</div>
      <form id="bankForm">
        <div class="field">
          <label for="accBankName">Bank name</label>
          <input id="accBankName" type="text" value="${escapeHtml(bank.bankName || '')}" placeholder="e.g. GTBank" required>
        </div>
        <div class="field">
          <label for="accAccName">Account name</label>
          <input id="accAccName" type="text" value="${escapeHtml(bank.accountName || '')}" placeholder="Name on the account" required>
        </div>
        <div class="field">
          <label for="accAccNum">Account number</label>
          <input id="accAccNum" type="text" inputmode="numeric" value="${escapeHtml(bank.accountNumber || '')}" placeholder="10 digits" required>
        </div>
        <button type="submit" class="save-btn" id="bankSaveBtn">Save bank details</button>
        <button type="button" class="otp-cancel" id="bankEditCancelBtn" style="margin-top:10px;">Cancel</button>
        <div class="save-msg" id="bankSaveMsg"></div>
      </form>
    `;

    const form = document.getElementById('bankForm');
    const saveBtn = document.getElementById('bankSaveBtn');
    const saveMsg = document.getElementById('bankSaveMsg');
    const cancelBtn = document.getElementById('bankEditCancelBtn');

    cancelBtn.addEventListener('click', () => {
      bankScreen = 'view';
      renderBankView();
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      saveMsg.className = 'save-msg';
      saveBtn.disabled = true;
      saveBtn.textContent = 'Saving…';
      try {
        const token = await window.MSBAuth.getIdToken();
        const res = await fetch('/api/affiliate/bank', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
          body: JSON.stringify({
            bankName: document.getElementById('accBankName').value.trim(),
            accountName: document.getElementById('accAccName').value.trim(),
            accountNumber: document.getElementById('accAccNum').value.trim()
          })
        });
        const data = await res.json();
        if (!res.ok) {
          // The verified window can lapse (5 min) — send them back to
          // request a fresh code rather than showing a dead form.
          if (data.needsVerification) {
            bankScreen = 'view';
            renderBankView();
            const msg = document.getElementById('bankViewMsg');
            msg.textContent = data.error;
            msg.className = 'save-msg err';
            return;
          }
          throw new Error(data.error || 'Could not save your bank details.');
        }
        AFFILIATE.bank = data.bank;
        bankScreen = 'view';
        renderBankView();
        const msg = document.getElementById('bankViewMsg');
        msg.textContent = 'Bank details updated.';
        msg.className = 'save-msg ok';
      } catch (err) {
        saveMsg.textContent = err.message;
        saveMsg.className = 'save-msg err';
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = 'Save bank details';
      }
    });
  }

  window.MSBAuth.onAuthReady(async (user) => {
    if (!user) {
      window.location.href = '/login?returnTo=' + encodeURIComponent('/affiliate/dashboard');
      return;
    }
    try {
      const token = await window.MSBAuth.getIdToken();
      const meRes = await fetch('/api/affiliate/me', { headers: { Authorization: `Bearer ${token}` } });
      const meData = await meRes.json();
      if (!meData || !meData.affiliate) {
        window.location.href = '/affiliate';
        return;
      }
      AFFILIATE = meData.affiliate;
      REFERRED = meData.referred || [];
      const wantsAccount = new URLSearchParams(window.location.search).get('view') === 'account';
      setView(wantsAccount ? 'account' : 'overview');
    } catch (e) {
      main.innerHTML = `<div class="empty">Could not load your dashboard. Please refresh the page.</div>`;
    }
  });
</script>

</body>
</html>
