<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="robots" content="noindex, nofollow"/>
<meta name="theme-color" content="#ffffff"/>
<title>Messages | MindShift Books</title>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin/>
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin/>
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js"/>
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js"/>
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --p:#4f46e5;--p2:#06b6d4;--g:linear-gradient(135deg,#4f46e5,#06b6d4);--gm:linear-gradient(135deg,#4f46e5,#2563eb);
  --txt:#0f172a;--sub:#6b7280;--mute:#9ca3af;
  --bg:#f8fafc;--card:#fff;--border:#e5e7eb;--red:#ef4444;
}
html,body{height:100%}
body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;background:var(--bg);color:var(--txt);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

.view{display:none;height:100dvh;flex-direction:column;background:var(--bg)}
.view.on{display:flex}

/* ── top bar ── */
.bar{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;background:#fff;border-bottom:1px solid var(--border);flex-shrink:0}
.back{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--txt)}
.back:active{background:#f1f5f9}
.back svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.bar-title{font-size:20px;font-weight:800;letter-spacing:-.02em}

/* ── inbox ── */
.list{flex:1;overflow-y:auto;background:#fff}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;width:100%;text-align:left;border-bottom:1px solid #f1f5f9}
.row:active{background:#f8fafc}
.av{position:relative;width:50px;height:50px;border-radius:50%;flex-shrink:0;background:var(--g);color:#fff;font-weight:800;font-size:18px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.row-main{flex:1;min-width:0}
.row-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.row-name{font-size:15.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-time{font-size:12px;color:var(--mute);flex-shrink:0}
.row-bot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:2px}
.row-last{font-size:14px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.unread .row-last{color:var(--txt);font-weight:600}
.row.unread .row-time{color:var(--p);font-weight:700}
.pill{min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--g);color:#fff;font-size:11.5px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}

.skel-row{display:flex;align-items:center;gap:12px;padding:14px 16px}
.skel{background:linear-gradient(90deg,#eef2ff 25%,#f8fafc 50%,#eef2ff 75%);background-size:200% 100%;animation:sh 1.3s infinite;border-radius:8px}
@keyframes sh{to{background-position:-200% 0}}
.skel.c{border-radius:50%;width:50px;height:50px;flex-shrink:0}

.empty{padding:70px 28px;text-align:center;color:var(--sub)}
.empty .ic{width:68px;height:68px;border-radius:50%;background:#eef2ff;color:var(--p);display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
.empty .ic svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.empty h2{font-size:18px;font-weight:800;color:var(--txt);margin-bottom:6px}
.empty p{font-size:14.5px;line-height:1.5;max-width:300px;margin:0 auto}
.btn{display:inline-block;margin-top:18px;padding:12px 26px;border-radius:99px;background:var(--g);color:#fff;font-weight:700;font-size:14.5px;text-decoration:none;box-shadow:0 4px 14px rgba(79,70,229,.3)}

.kebab{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-left:auto;color:var(--txt)}
.kebab:active{background:#f1f5f9}
.kebab svg{width:22px;height:22px;fill:currentColor}
.pin-ic{width:13px;height:13px;fill:var(--mute);margin-right:4px;vertical-align:-1px;flex-shrink:0}
.sheet-bg{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:60}
.sheet{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:22px 22px 0 0;padding:8px 10px calc(12px + env(safe-area-inset-bottom));z-index:61;max-height:82dvh;overflow-y:auto;animation:sheetUp .22s ease}
@keyframes sheetUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet::before{content:'';display:block;width:38px;height:4px;border-radius:99px;background:#d9dee7;margin:6px auto 10px}
.sheet-title{text-align:center;font-weight:800;font-size:15.5px;padding:0 12px 6px}
.sheet-text{text-align:center;color:var(--sub);font-size:14px;line-height:1.45;padding:0 16px 12px}
.sheet-item{display:block;width:100%;text-align:left;padding:15px 16px;font-size:16px;font-weight:600;border-radius:14px}
.sheet-item:active{background:#f1f5f9}
.sheet-item.danger{color:var(--red)}
.sheet-item.cancel{text-align:center;color:var(--sub);margin-top:4px;background:#f8fafc}
.sheet[hidden],.sheet-bg[hidden]{display:none}
.blockbar{padding:14px 16px calc(14px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--border);text-align:center;font-size:14px;color:var(--sub);flex-shrink:0}
.blockbar[hidden]{display:none}
.blockbar button{margin-left:8px;font-weight:800;color:var(--p)}
.people{display:flex;gap:14px;overflow-x:auto;padding:12px 16px 10px;background:#fff;border-bottom:1px solid #f1f5f9;flex-shrink:0;scrollbar-width:none;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.people::-webkit-scrollbar{display:none}
.people[hidden]{display:none}
.pp{flex:0 0 auto;width:62px;text-align:center;scroll-snap-align:start}
.pp .av{width:58px;height:58px;margin:0 auto;font-size:20px;overflow:visible}
.pp .av img{border-radius:50%}
.pp.add .av{background:#eef2ff;color:var(--p);border:2px dashed #c7d2fe}
.pp.add .av svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}
.pp-name{font-size:12px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--txt)}
.pp-sub{font-size:10.5px;color:var(--mute);margin-top:-1px}
.psq{width:100%;border:1.5px solid var(--border);border-radius:14px;padding:12px 14px;font:inherit;font-size:15px;outline:none;background:#f8fafc;margin:2px 0 8px}
.psq:focus{border-color:var(--p);background:#fff}
.pres{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 6px;border-radius:12px}
.pres:active{background:#f1f5f9}
.pres .av{width:44px;height:44px;font-size:16px}
.pres-name{font-size:15px;font-weight:700}
.pres-sub{font-size:12.5px;color:var(--mute)}
.pnote{text-align:center;color:var(--mute);font-size:13.5px;padding:14px 8px}
.tabs{display:flex;gap:8px;padding:10px 16px;background:#fff;border-bottom:1px solid #f1f5f9;flex-shrink:0}
.tab{padding:7px 16px;border-radius:99px;background:#f1f5f9;font-size:13.5px;font-weight:700;color:var(--sub);transition:all .15s}
.tab.on{background:#eef2ff;color:var(--p)}
.tab .n{margin-left:6px;font-weight:800}

/* ── chat ── */
.chat-head{display:flex;align-items:center;gap:10px;min-width:0;flex:1;text-align:left}
.chat-head .av{width:40px;height:40px;font-size:15px}
.chat-id{min-width:0}
.chat-name{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-sub{font-size:12px;color:var(--mute);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:15px}
.chat-sub.live{color:#10b981;font-weight:600}
.on-dot{position:absolute;right:1px;bottom:1px;width:11px;height:11px;border-radius:50%;background:#10b981;border:2px solid #fff}
.chat-head .av{overflow:visible}
.chat-head .av img{border-radius:50%}
.intro{align-self:stretch;text-align:center;padding:26px 16px 22px}
.intro .av{width:84px;height:84px;font-size:30px;margin:0 auto 12px}
.intro-name{font-size:18px;font-weight:800;letter-spacing:-.01em}
.intro-sub{font-size:13.5px;color:var(--sub);margin-top:3px}
.vp{margin-top:14px;padding:9px 22px;border-radius:99px;background:#e5e9f0;font-size:14px;font-weight:700;color:var(--txt)}
.vp:active{background:#d8dde6}
.msgs{flex:1;overflow-y:auto;padding:14px 12px 8px;display:flex;flex-direction:column;gap:4px;background:var(--bg);overscroll-behavior:contain}
.older{align-self:center;margin:2px 0 10px;padding:7px 16px;border-radius:99px;background:#fff;border:1px solid var(--border);font-size:12.5px;font-weight:600;color:var(--sub)}
.day{align-self:center;margin:12px 0 6px;padding:3px 12px;border-radius:99px;background:#e9edf5;color:var(--sub);font-size:11.5px;font-weight:600}
.msg{max-width:78%;padding:9px 13px 7px;border-radius:18px;font-size:15px;line-height:1.4;white-space:pre-wrap;word-break:break-word;position:relative}
.msg{touch-action:pan-y;transition:transform .18s}
.msg.flash{animation:flash 1.3s ease}
@keyframes flash{0%,60%{box-shadow:0 0 0 3px rgba(79,70,229,.35)}100%{box-shadow:0 0 0 3px rgba(79,70,229,0)}}
.quote{margin:-2px -4px 6px;padding:6px 10px;border-radius:10px;border-left:3px solid var(--p);background:rgba(15,23,42,.06);cursor:pointer;max-width:100%}
.msg.me .quote{background:rgba(255,255,255,.18);border-left-color:#fff}
.q-name{font-size:12px;font-weight:800;opacity:.9}
.q-text{font-size:13px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60vw}
.swipe-ic{position:absolute;left:-40px;top:50%;margin-top:-15px;width:30px;height:30px;border-radius:50%;background:#e5e9f0;color:var(--sub);display:flex;align-items:center;justify-content:center;pointer-events:none}
.swipe-ic svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.replybar{display:flex;align-items:center;gap:10px;padding:8px 14px;background:#fff;border-top:1px solid var(--border);flex-shrink:0}
.replybar[hidden]{display:none}
.rb-main{flex:1;min-width:0;border-left:3px solid var(--p);padding-left:10px}
.rb-name{font-size:12.5px;font-weight:800;color:var(--p)}
.rb-text{font-size:13.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rb-x{width:30px;height:30px;border-radius:50%;background:#f1f5f9;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.rb-x svg{width:14px;height:14px;fill:none;stroke:var(--sub);stroke-width:2.6;stroke-linecap:round}
.msg.them{align-self:flex-start;background:#fff;border:1px solid var(--border);border-bottom-left-radius:6px}
.msg.me{align-self:flex-end;background:var(--gm);color:#fff;border-bottom-right-radius:6px}
.msg .t{display:block;text-align:right;font-size:10.5px;margin-top:3px;opacity:.65}
.msg.pending{opacity:.65}
.stat{align-self:flex-end;font-size:11.5px;color:var(--mute);margin:0 6px 6px;line-height:1.2}
.stat.err{color:var(--red);font-weight:700;cursor:pointer}
.msg.failed{border:1.5px solid var(--red);opacity:1}
.empty-chat{margin:auto;text-align:center;color:var(--mute);font-size:14px;padding:20px}

.composer{display:flex;align-items:flex-end;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--border);flex-shrink:0}
.composer textarea{flex:1;resize:none;border:1.5px solid var(--border);border-radius:22px;padding:10px 15px;font:inherit;font-size:15px;line-height:1.35;max-height:120px;outline:none;background:#f8fafc;color:var(--txt)}
.composer textarea:focus{border-color:var(--p);background:#fff}
.send{width:44px;height:44px;border-radius:50%;background:var(--g);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:opacity .15s,transform .1s}
.send:active{transform:scale(.94)}
.send[disabled]{opacity:.4;cursor:default}
.send svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#0f172a;color:#fff;padding:10px 18px;border-radius:99px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:all .25s;z-index:50;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<!-- ── INBOX ── -->
<section class="view on" id="listView">
  <div class="bar">
    <button class="back" id="listBack" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="bar-title">Messages</div>
    <button class="kebab" id="listMenuBtn" aria-label="More options"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg></button>
  </div>
  <div class="people" id="people" hidden></div>
  <div class="tabs" id="tabs">
    <button class="tab on" data-f="all">All</button>
    <button class="tab" data-f="unread">Unread<span class="n" id="unreadN"></span></button>
  </div>
  <div class="list" id="list"><div class="skel-row"><div class="skel c"></div><div style="flex:1"><div class="skel" style="height:14px;width:42%;margin-bottom:9px"></div><div class="skel" style="height:12px;width:78%"></div></div></div><div class="skel-row"><div class="skel c"></div><div style="flex:1"><div class="skel" style="height:14px;width:42%;margin-bottom:9px"></div><div class="skel" style="height:12px;width:78%"></div></div></div><div class="skel-row"><div class="skel c"></div><div style="flex:1"><div class="skel" style="height:14px;width:42%;margin-bottom:9px"></div><div class="skel" style="height:12px;width:78%"></div></div></div><div class="skel-row"><div class="skel c"></div><div style="flex:1"><div class="skel" style="height:14px;width:42%;margin-bottom:9px"></div><div class="skel" style="height:12px;width:78%"></div></div></div><div class="skel-row"><div class="skel c"></div><div style="flex:1"><div class="skel" style="height:14px;width:42%;margin-bottom:9px"></div><div class="skel" style="height:12px;width:78%"></div></div></div><div class="skel-row"><div class="skel c"></div><div style="flex:1"><div class="skel" style="height:14px;width:42%;margin-bottom:9px"></div><div class="skel" style="height:12px;width:78%"></div></div></div></div>
</section>

<!-- ── CHAT ── -->
<section class="view" id="chatView">
  <div class="bar">
    <button class="back" id="chatBack" aria-label="Back to messages"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <button class="chat-head" id="chatHead" aria-label="View profile">
      <div class="av" id="chatAv"></div>
      <div class="chat-id"><div class="chat-name" id="chatName"></div><div class="chat-sub" id="chatSub"></div></div>
    </button>
    <button class="kebab" id="chatMenuBtn" aria-label="Chat options"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg></button>
  </div>
  <div class="msgs" id="msgs"><div class="empty-chat">Loading…</div></div>
  <div class="replybar" id="replyBar" hidden>
    <div class="rb-main"><div class="rb-name" id="rbName"></div><div class="rb-text" id="rbText"></div></div>
    <button class="rb-x" id="rbX" aria-label="Cancel reply"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="blockbar" id="blockBar" hidden><span id="blockMsg">You blocked this user.</span><button id="unblockBtn">Unblock</button></div>
  <div class="composer" id="composer">
    <textarea id="input" rows="1" placeholder="Message…" maxlength="2000" aria-label="Type a message"></textarea>
    <button class="send" id="sendBtn" disabled aria-label="Send"><svg viewBox="0 0 24 24"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/></svg></button>
  </div>
</section>

<div class="toast" id="toast"></div>
<div class="sheet-bg" id="sheetBg" hidden></div>
<div class="sheet" id="sheet" hidden><div class="sheet-title" id="sheetTitle"></div><div id="sheetBody"></div></div>

<script>
/* Opened straight into a chat (?with=…)? show the chat shell on the very first paint, not the inbox. */
if(/[?&]with=/.test(location.search)){ document.getElementById('listView').classList.remove('on'); document.getElementById('chatView').classList.add('on'); }
</script>

<script type="module">
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PAGE = 30;

let me = null;                 // { uid, name, photo }
let dbReady = false;           // true once the Firebase SDK has loaded (the page paints from saved copies before that)
let threads = [];              // current inbox rows
let unsubInbox = null, unsubPinned = null;
let recentRows = [], pinnedRows = [];        // raw inbox rows: the 30 most recent, and pinned ones (≤5, even if old)
let blockedSet = new Set(), blockedInfo = new Map();
let chat = null;               // { other:{uid,name,photo}, cid, msgs:Map, oldest, hasMore, lastTs, unsubLive, pending:[] }
let hiddenTimer = null, detached = false;
let lastMark = 0, markTimer = null;
let filter = 'all';            // inbox tab: 'all' | 'unread' (filtering is done on rows already loaded — no extra reads)

/* ───────── helpers ───────── */
function toast(t){ const el=$('toast'); el.textContent=t; el.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove('on'),2600); }
function convId(a,b){ return [a,b].sort().join('_'); }
function initials(n){ return (String(n||'?').trim()[0]||'?').toUpperCase(); }
function avatarHtml(name, photo){
  return photo ? `<img src="${esc(photo)}" alt="" onerror="this.remove()">` + esc(initials(name)) : esc(initials(name));
}
function ms(ts){ return ts && ts.toMillis ? ts.toMillis() : (typeof ts === 'number' ? ts : 0); }
function fmtListTime(t){
  if(!t) return '';
  const d = new Date(t), now = new Date();
  const day = x => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const diff = (day(now) - day(d)) / 86400000;
  if(diff <= 0) return d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
  if(diff === 1) return 'Yesterday';
  if(diff < 7) return d.toLocaleDateString([], {weekday:'short'});
  return d.toLocaleDateString([], {month:'short', day:'numeric'});
}
function fmtDay(t){
  const d = new Date(t), now = new Date();
  const day = x => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const diff = (day(now) - day(d)) / 86400000;
  if(diff <= 0) return 'Today';
  if(diff === 1) return 'Yesterday';
  return d.toLocaleDateString([], {weekday:'long', month:'short', day:'numeric'});
}
function activeLabel(t){
  if(!t) return { text:'', live:false };
  const mins = (Date.now() - t) / 60000;
  if(mins < 7)   return { text:'Active now', live:true };
  if(mins < 60)  return { text:`Active ${Math.round(mins)}m ago`, live:false };
  if(mins < 1440) return { text:`Active ${Math.round(mins/60)}h ago`, live:false };
  if(mins < 2880) return { text:'Active yesterday', live:false };
  return { text:'', live:false };
}
function clearBadgeCache(){ try{ sessionStorage.removeItem('msb_unread_v1'); }catch(e){} }

/* ───────── views / navigation ───────── */
function show(view){ $('listView').classList.toggle('on', view==='list'); $('chatView').classList.toggle('on', view==='chat'); }
function leaveMessages(){
  let same = false; try{ same = !!document.referrer && new URL(document.referrer).origin === location.origin; }catch(e){}
  if(history.length > 1 && same){ history.back(); } else { location.href = '/'; }
}
$('listBack').onclick = leaveMessages;
function backToList(){
  if(history.state && history.state.chat && !history.state.direct) history.back();
  else { closeChat(); history.replaceState({}, '', '/messages'); showList(); }
}
$('chatBack').onclick = backToList;
$('chatHead').onclick = () => { if(chat) location.href = `/profile?uid=${encodeURIComponent(chat.other.uid)}`; };
window.addEventListener('popstate', e => {
  const st = e.state || {};
  if(st.chat) openChat(st.chat, { push:false });
  else { closeChat(); showList(); }
});

/* ───────── signed-out ───────── */
function showSignedOut(){
  show('list');

/* ───────── my profile (cached 10 min) ───────── */
async function loadMe(user){
  try{
    const c = JSON.parse(sessionStorage.getItem('msb_me_v1'));
    if(c && c.uid === user.uid && Date.now() - c.t < 600000) return { uid:c.uid, name:c.name, photo:c.photo };
  }catch(e){}
  let name = user.displayName || 'MindShift Books User', photo = user.photoURL || '';
  try{
    const s = await getDoc(doc(db,'users',user.uid));
    if(s.exists()){ const d = s.data(); name = d.name || name; photo = d.photo || photo; }
  }catch(e){}
  try{ sessionStorage.setItem('msb_me_v1', JSON.stringify({ uid:user.uid, name, photo, t:Date.now() })); }catch(e){}
  return { uid:user.uid, name, photo };
}

/* ───────── INBOX ───────── */
function skeletonList(){
  $('list').innerHTML = Array(6).fill('<div class="skel-row"><div class="skel c"></div><div style="flex:1"><div class="skel" style="height:14px;width:42%;margin-bottom:9px"></div><div class="skel" style="height:12px;width:78%"></div></div></div>').join('');
}
/* A row is hidden when the chat was deleted (and nothing new has arrived since) or the person is blocked. */
function isVisible(t){
  if(blockedSet.has(t.otherUid)) return false;
  if(t.deleted && ms(t.lastAt) <= ms(t.clearedAt)) return false;
  return true;
}
function rebuildThreads(){
  const map = new Map();
  recentRows.concat(pinnedRows).forEach(t => map.set(t.otherUid, t));
  threads = [...map.values()].filter(isVisible).sort((a,b) =>
    (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0) ||
    (b.pinned ? ms(b.pinnedAt) - ms(a.pinnedAt) : 0) ||
    ms(b.lastAt) - ms(a.lastAt));
}
const PIN_SVG = '<svg class="pin-ic" viewBox="0 0 24 24"><path d="M16 3l5 5-3 1-3.5 3.5.5 4.5-1.5 1.5L10 14l-6 6-1-1 6-6-4.5-4.5L6 7.5l4.5.5L14 4.5z"/></svg>';
function renderList(){
  const el = $('list');
  const unreadCount = threads.filter(t => t.unread > 0).length;
  $('unreadN').textContent = unreadCount ? ` ${unreadCount}` : '';
  if(filter === 'unread' && threads.length && !unreadCount){
    el.innerHTML = `<div class="empty"><div class="ic"><svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg></div><h2>You're all caught up</h2><p>No unread messages right now.</p></div>`;
    return;
  }
  const shown = filter === 'unread' ? threads.filter(t => t.unread > 0) : threads;
  if(!threads.length){
    el.innerHTML = `<div class="empty"><div class="ic"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg></div>
      <h2>No messages yet</h2><p>Tap someone in the row above, or the + to find anyone, to start a conversation.</p></div>`;
    renderPeople();
    return;
  }
  el.innerHTML = shown.map(t => {
    const un = t.unread > 0;
    const last = (t.lastSender === me.uid ? 'You: ' : '') + (t.lastText || '') + (t.lastSender === me.uid && t.seenAt && ms(t.seenAt) >= ms(t.lastAt) ? ' · Seen' : '');
    return `<button class="row ${un?'unread':''}" data-uid="${esc(t.otherUid)}">
      <div class="av">${avatarHtml(t.name, t.photo)}</div>
      <div class="row-main">
        <div class="row-top"><span class="row-name">${esc(t.name || 'MindShift Books User')}</span><span class="row-time">${t.pinned ? PIN_SVG : ''}${fmtListTime(ms(t.lastAt))}</span></div>
        <div class="row-bot"><span class="row-last">${esc(last)}</span>${un ? `<span class="pill">${t.unread > 99 ? '99+' : t.unread}</span>` : ''}</div>
      </div></button>`;
  }).join('');
  renderPeople();
  el.querySelectorAll('.row').forEach(b => {
    let timer = null, fired = false;
    const t = threads.find(x => x.otherUid === b.dataset.uid);
    b.onclick = () => { if(fired){ fired = false; return; } openChat(b.dataset.uid, { push:true }); };
    b.addEventListener('pointerdown', () => { fired = false; timer = setTimeout(() => { fired = true; if(t) openRowMenu(t); }, 450); });
    ['pointerup','pointermove','pointercancel','pointerleave'].forEach(ev => b.addEventListener(ev, () => clearTimeout(timer)));
    b.addEventListener('contextmenu', e => { e.preventDefault(); if(t) openRowMenu(t); });
  });
}
document.querySelectorAll('.tab').forEach(b => b.onclick = () => {
  filter = b.dataset.f;
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === b));
  _peopleSig = '';
  renderList();
});
function startInbox(){
  if(!dbReady || !me) return;
  stopInbox();
  const col = collection(db,'inbox',me.uid,'threads');
  const rowOf = d => { const x = d.data({ serverTimestamps:'estimate' }); return { id:d.id, ...x, otherUid: x.otherUid || d.id }; };
  const failed = () => { $('list').innerHTML = `<div class="empty"><h2>Couldn't load messages</h2><p>Check your connection and try again.</p><button class="btn" onclick="location.reload()">Try again</button></div>`; };
  unsubInbox = onSnapshot(query(col, orderBy('lastAt','desc'), limit(PAGE)), snap => {
    recentRows = snap.docs.map(rowOf); rebuildThreads(); renderList(); saveInboxCache();
  }, failed);
  // pinned chats are fetched on their own so a pinned chat stays at the top even when it's old (≤5 reads)
  unsubPinned = onSnapshot(query(col, where('pinned','==',true), limit(5)), snap => {
    pinnedRows = snap.docs.map(rowOf); rebuildThreads(); renderList(); saveInboxCache();
  }, () => {});
}
function stopInbox(){
  if(unsubInbox){ unsubInbox(); unsubInbox = null; }
  if(unsubPinned){ unsubPinned(); unsubPinned = null; }
}
function showList(){
  show('list');
  document.title = 'Messages | MindShift Books';
  if(!unsubInbox){ if(!threads.length) skeletonList(); startInbox(); }
}

/* ───────── who they are + when they were last active (2 reads per chat open) ───────── */
function paintOther(){
  if(!chat) return;
  $('chatName').textContent = chat.other.name;
  const lab = activeLabel(chat.other.lastActive);
  $('chatSub').textContent = lab.text;
  $('chatSub').classList.toggle('live', lab.live);
  $('chatAv').innerHTML = avatarHtml(chat.other.name, chat.other.photo) + (lab.live ? '<span class="on-dot"></span>' : '');
}
async function fetchOtherExtras(c){
  const o = c.other;
  const [u, p] = await Promise.all([
    getDoc(doc(db,'users',o.uid)).catch(() => null),
    getDoc(doc(db,'presence',o.uid)).catch(() => null)
  ]);
  if(u && u.exists()){ const d = u.data(); o.name = d.name || o.name; o.photo = d.photo || o.photo || ''; o.jobTitle = d.jobTitle || ''; o.msgPrivacy = d.msgPrivacy || 'everyone'; }
  if(p && p.exists()) o.lastActive = ms(p.data().lastActive);
  c.extrasAt = Date.now();
}

/* ───────── CHAT ───────── */
function toMsg(d){
  const x = d.data({ serverTimestamps:'estimate' });
  return { id:d.id, senderUid:x.senderUid, text:x.text, replyTo:x.replyTo || null, ts: ms(x.createdAt), raw:x.createdAt, confirmed: !d.metadata.hasPendingWrites };
}
/* Every one of my messages carries its own status in its time line:  3:07 PM · Sending… / Delivered / Seen
   "Delivered" = saved on our server and in their inbox (a website can't know more than that).
   "Seen"      = they opened the chat after this message arrived (their phone writes seenAt into my inbox row).
   A message that failed gets a red "Not delivered · Tap to retry" under it. */
function statusFor(m){
  if(m.silent) return { text:'Sent' };                    // the server refused it on purpose (e.g. they blocked you): no retry prompt, never Delivered/Seen
  if(m.failed) return { text:'Not delivered · Tap to retry', err:true };
  const acked = m.confirmed || (chat && chat.ack.has(m.id));
  if(m.pendingLocal && !acked) return { text: navigator.onLine ? 'Sending…' : 'Waiting for connection' };
  const seen = ms(chat && chat.row && chat.row.seenAt);
  if(seen && m.ts && seen >= m.ts) return { text:'Seen' };
  return { text: acked ? 'Delivered' : 'Sending…' };
}
function renderMsgs(stick){
  const box = $('msgs'); if(!chat) return;
  const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 140;
  const prevH = box.scrollHeight, prevTop = box.scrollTop;
  const items = [...chat.msgs.values(), ...chat.pending.filter(p => !chat.msgs.has(p.id))].sort((a,b) => (a.ts||Infinity) - (b.ts||Infinity));
  let html = chat.hasMore ? `<button class="older" id="olderBtn">Load earlier messages</button>` : `
    <div class="intro">
      <div class="av">${avatarHtml(chat.other.name, chat.other.photo)}</div>
      <div class="intro-name">${esc(chat.other.name)}</div>
      ${chat.other.jobTitle ? `<div class="intro-sub">${esc(chat.other.jobTitle)}</div>` : ''}
      <button class="vp" id="vpBtn">View profile</button>
    </div>`;
  if(!items.length) html += `<div class="empty-chat">Say hi to ${esc(chat.other.name)} 👋</div>`;
  let lastDay = '';
  items.forEach(m => {
    const dk = m.ts ? new Date(m.ts).toDateString() : lastDay;
    if(dk && dk !== lastDay){ html += `<div class="day">${esc(fmtDay(m.ts))}</div>`; lastDay = dk; }
    const mine = m.senderUid === me.uid;
    const st = mine ? statusFor(m) : null;
    const time = m.ts ? new Date(m.ts).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}) : '';
    const q = m.replyTo ? `<div class="quote" data-qid="${esc(m.replyTo.id)}"><div class="q-name">${esc(m.replyTo.senderUid === me.uid ? 'You' : chat.other.name)}</div><div class="q-text">${esc(m.replyTo.text)}</div></div>` : '';
    html += `<div class="msg ${mine?'me':'them'} ${m.pendingLocal && !m.failed && !m.silent && !chat.ack.has(m.id)?'pending':''} ${m.failed?'failed':''}" data-mid="${esc(m.id)}">${q}${esc(m.text)}<span class="t">${time}${st && !st.err ? ' · ' + esc(st.text) : ''}</span></div>`;
    if(st && st.err) html += `<div class="stat err" data-retry="${esc(m.id)}">${esc(st.text)}</div>`;
  });
  box.innerHTML = html;
  box.querySelectorAll('[data-retry]').forEach(el => el.onclick = () => { const pm = chat && chat.pending.find(x => x.id === el.dataset.retry); if(pm) send(pm); });
  box.querySelectorAll('.quote').forEach(el => el.onclick = () => jumpTo(el.dataset.qid));
  const ob = $('olderBtn'); if(ob) ob.onclick = loadOlder;
  const vp = $('vpBtn'); if(vp) vp.onclick = () => { location.href = `/profile?uid=${encodeURIComponent(chat.other.uid)}`; };
  if(stick || nearBottom) box.scrollTop = box.scrollHeight;
  else box.scrollTop = prevTop + (box.scrollHeight - prevH) * (chat.prepended ? 1 : 0);
  chat.prepended = false;
}
// Messages query for the open chat. If the chat was cleared/deleted, only messages after that moment are ever read.
function mq(...constraints){
  const base = collection(db,'conversations',chat.cid,'messages');
  return chat.clearedAt ? query(base, where('createdAt','>',chat.clearedAt), ...constraints) : query(base, ...constraints);
}
async function loadOlder(){
  if(!dbReady || !chat || !chat.hasMore || chat.loadingOlder || !chat.oldest) return;
  chat.loadingOlder = true;
  try{
    const q = mq(orderBy('createdAt','desc'), startAfter(chat.oldest), limit(PAGE));
    const snap = await getDocs(q);
    snap.docs.forEach(d => { const m = toMsg(d); chat.msgs.set(m.id, m); });
    if(snap.docs.length) chat.oldest = snap.docs[snap.docs.length - 1];
    chat.hasMore = snap.docs.length === PAGE;
    chat.prepended = true;
    renderMsgs(false);
  }catch(e){ toast('Couldn’t load earlier messages'); }
  chat.loadingOlder = false;
}
function attachLive(){
  if(!chat) return;
  detachLive();
  // Only messages newer than what's already on screen — so re-attaching never re-reads old ones.
  const q = chat.lastTs ? mq(orderBy('createdAt','asc'), startAfter(chat.lastTs)) : mq(orderBy('createdAt','asc'));
  const cid = chat.cid;
  chat.unsubLive = onSnapshot(q, { includeMetadataChanges:true }, snap => {
    if(!chat || chat.cid !== cid) return;
    snap.docChanges({ includeMetadataChanges:true }).forEach(ch => {
      if(ch.type === 'removed'){ chat.msgs.delete(ch.doc.id); return; }
      const m = toMsg(ch.doc);
      chat.msgs.set(m.id, m);
      if(m.raw && (!chat.lastTs || m.raw.toMillis() > chat.lastTs.toMillis()) && !ch.doc.metadata.hasPendingWrites) chat.lastTs = m.raw;
      if(m.senderUid === me.uid){
        const i = chat.pending.findIndex(p => p.id === m.id);            // the real copy arrived → drop our placeholder
        if(i > -1) chat.pending.splice(i, 1);
      }
    });
    renderMsgs(false);
    saveChatCacheSoon();
  }, () => toast('Connection problem — messages may be delayed'));
  // My own inbox row for this chat: tells me (a) there's something unread to mark as read, and
  // (b) when they last saw my messages. 1 read to start, then 1 per change — replaces the old read-before-write.
  chat.unsubRow = onSnapshot(doc(db,'inbox',me.uid,'threads',chat.other.uid), s => {
    if(!chat || chat.cid !== cid) return;
    chat.row = s.exists() ? s.data() : null;
    if(chat.row && !_reloading && ms(chat.row.clearedAt) > ms(chat.clearedAt)){ reloadChat(); return; }   // cleared elsewhere
    renderMsgs(false);
    if(chat.row && chat.row.unread > 0 && !document.hidden) markReadSoon(!chat.rowSeen);
    chat.rowSeen = true;
  }, () => {});
}
function detachLive(){
  if(chat && chat.unsubLive){ chat.unsubLive(); chat.unsubLive = null; }
  if(chat && chat.unsubRow){ chat.unsubRow(); chat.unsubRow = null; chat.rowSeen = false; }
}

async function openChat(otherUid, { push = true, reload = false } = {}){
  if(!me) return;
  if(!otherUid || otherUid === me.uid){ history.replaceState({}, '', '/messages'); showList(); return; }
  if(otherUid.includes('_') || me.uid.includes('_')){ toast('This conversation isn’t available'); return; }
  const same = chat && chat.other.uid === otherUid && !chat.provisional;
  show('chat');
  if(!reload){
    if(push) history.pushState({ chat:otherUid }, '', `/messages?with=${encodeURIComponent(otherUid)}`);
    else history.replaceState({ chat:otherUid, direct:!history.state }, '', `/messages?with=${encodeURIComponent(otherUid)}`);
  }
  if(same){ attachLive(); markReadSoon(); return; }

  const prov = (chat && chat.provisional && chat.other.uid === otherUid) ? chat : null;   // already painted from the saved copy
  if(!prov) closeChat();
  // who is it? — the inbox row if we have it, otherwise their profile (1 read)
  let other = null;
  const t = threads.find(x => x.otherUid === otherUid) || (prov && prov.other.name ? prov.other : null) || people.find(x => x.uid === otherUid) || null;
  if(prov) other = prov.other;
  else if(t) other = { uid:otherUid, name:t.name, photo:t.photo };
  else other = { uid:otherUid, name:'MindShift Books User', photo:'' };
  if(prov){
    chat = Object.assign(prov, { provisional:false, pending:[], ack:new Set(), unsubLive:null, unsubRow:null, rowSeen:false, loaded:false, extrasAt:0 });
  } else {
    chat = { other, cid:convId(me.uid, otherUid), msgs:new Map(), oldest:null, hasMore:false, lastTs:null, unsubLive:null, pending:[], extrasAt:0, loaded:false, ack:new Set(), row:null, unsubRow:null, rowSeen:false };
  }
  // Was this chat cleared/deleted before? Use the row we already have; only ask the server when we don't (or on reload).
  let rowDoc = recentRows.concat(pinnedRows).find(x => x.otherUid === otherUid) || (prov && prov.rowInfo) || null;
  const rowP = (!rowDoc || reload) ? getDoc(doc(db,'inbox',me.uid,'threads',otherUid)).catch(() => null) : null;
  chat.blocked = blockedSet.has(otherUid);
  chat.pending.push(...loadSilent(chat.cid));
  const mine = chat;
  const extras = fetchOtherExtras(mine).then(() => { if(chat === mine){ updateRestricted(); paintOther(); if(mine.loaded) renderMsgs(false); document.title = `${mine.other.name} | Messages`; } });
  if(!t) await extras;                       // no inbox row yet (opened from a profile) → wait so the header isn't a placeholder
  if(rowP){ const rs = await rowP; rowDoc = rs && rs.exists() ? rs.data({ serverTimestamps:'estimate' }) : null; }
  if(chat !== mine) return;
  updateRestricted();
  chat.clearedAt = rowDoc && ms(rowDoc.clearedAt) ? new Date(ms(rowDoc.clearedAt)) : null;
  if(reload){ chat.msgs.clear(); chat.lastTs = null; chat.oldest = null; chat.hasMore = false; }
  applyBlockUI();
  paintOther();
  document.title = `${other.name} | Messages`;
  if(!prov || !prov.msgs.size) $('msgs').innerHTML = '<div class="empty-chat">Loading…</div>';
  const cid = chat.cid;
  try{
    const snap = await getDocs(mq(orderBy('createdAt','desc'), limit(PAGE)));
    if(!chat || chat.cid !== cid) return;
    snap.docs.forEach(d => { const m = toMsg(d); chat.msgs.set(m.id, m); });
    if(snap.docs.length){
      chat.oldest = snap.docs[snap.docs.length - 1];
      chat.lastTs = snap.docs[0].data().createdAt;
    }
    chat.hasMore = snap.docs.length === PAGE;
    chat.loaded = true;
    _reloading = false;
    renderMsgs(true);
    saveChatCacheSoon();
    attachLive();
    markReadSoon(true);
  }catch(e){
    $('msgs').innerHTML = '<div class="empty-chat">Couldn’t load this conversation.<br>Check your connection and try again.</div>';
  }
  setTimeout(() => { if(matchMedia('(pointer:fine)').matches) $('input').focus(); }, 50);
}
function closeChat(){ detachLive(); chat = null; $('input').value = ''; autosize(); hideReplyBar(); applyBlockUI(); }

/* ───────── read receipts (unread → 0) ───────── */
function receiptsOn(){ try{ return localStorage.getItem('msb_receipts') !== 'off'; }catch(e){ return true; } }   // a "Read receipts" switch in message settings can flip this later
function markReadSoon(now){
  clearTimeout(markTimer);
  const wait = now ? 0 : Math.max(0, 4000 - (Date.now() - lastMark));
  markTimer = setTimeout(markRead, wait);
}
async function markRead(){
  if(!chat || document.hidden) return;
  const row = chat.row;
  if(!row || !(row.unread > 0)) return;          // nothing unread → nothing to write
  lastMark = Date.now();
  const other = chat.other.uid;
  try{
    await updateDoc(doc(db,'inbox',me.uid,'threads',other), { unread:0 });
    clearBadgeCache();
  }catch(e){ return; }
  // let them know it's been seen (best effort — never blocks my own unread reset)
  if(receiptsOn()){ updateDoc(doc(db,'inbox',other,'threads',me.uid), { seenAt:serverTimestamp() }).catch(() => {}); }
}

/* ───────── reply to a specific message (swipe right on it) ───────── */
function setReply(m){
  if(!chat) return;
  chat.reply = { id:m.id, senderUid:m.senderUid, text:String(m.text || '').slice(0, 140) };
  $('rbName').textContent = m.senderUid === me.uid ? 'Replying to yourself' : 'Replying to ' + chat.other.name;
  $('rbText').textContent = chat.reply.text;
  $('replyBar').hidden = false;
  input.focus();
}
function hideReplyBar(){ $('replyBar').hidden = true; }
function clearReply(){ if(chat) chat.reply = null; hideReplyBar(); }
$('rbX').onclick = clearReply;
function jumpTo(id){
  const box = $('msgs');
  const t = [...box.querySelectorAll('[data-mid]')].find(el => el.dataset.mid === id);
  if(!t){ toast('That message is further up — scroll up to find it'); return; }
  t.scrollIntoView({ block:'center', behavior:'smooth' });
  t.classList.add('flash'); setTimeout(() => t.classList.remove('flash'), 1400);
}
(function enableSwipeReply(){
  const box = $('msgs');
  const ICON = '<svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 016 6v3"/></svg>';
  let st = null;
  const msgOf = id => chat && (chat.msgs.get(id) || chat.pending.find(p => p.id === id));
  box.addEventListener('pointerdown', e => {
    const el = e.target.closest('.msg');
    if(!el || e.target.closest('.quote')) return;
    st = { el, x:e.clientX, y:e.clientY, dx:0, locked:false, id:e.pointerId, ic:null };
  });
  box.addEventListener('pointermove', e => {
    if(!st || e.pointerId !== st.id) return;
    const dx = e.clientX - st.x, dy = e.clientY - st.y;
    if(!st.locked){
      if(Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)){ st = null; return; }          // it's a scroll, not a swipe
      if(dx > 10 && dx > Math.abs(dy)){
        st.locked = true;
        try{ box.setPointerCapture(e.pointerId); }catch(_){}
        st.el.style.transition = 'none';
        st.ic = document.createElement('span'); st.ic.className = 'swipe-ic'; st.ic.innerHTML = ICON; st.ic.style.opacity = '0';
        st.el.appendChild(st.ic);
      } else return;
    }
    st.dx = Math.max(0, Math.min(dx, 90));
    st.el.style.transform = `translateX(${st.dx}px)`;
    if(st.ic) st.ic.style.opacity = String(Math.min(1, st.dx / 56));
  });
  const end = () => {
    if(!st) return;
    const s = st; st = null;
    s.el.style.transition = 'transform .18s'; s.el.style.transform = '';
    if(s.ic) s.ic.remove();
    if(s.locked && s.dx > 56){
      const m = msgOf(s.el.dataset.mid);
      if(m){ setReply(m); try{ navigator.vibrate && navigator.vibrate(12); }catch(_){} }
    }
  };
  box.addEventListener('pointerup', end);
  box.addEventListener('pointercancel', end);
  // desktop: double-click a message to reply
  box.addEventListener('dblclick', e => {
    const el = e.target.closest('.msg'); if(!el || e.target.closest('.quote')) return;
    const m = msgOf(el.dataset.mid); if(m) setReply(m);
  });
})();

/* ───────── composer ───────── */
const input = $('input'), sendBtn = $('sendBtn');
function autosize(){ input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 120) + 'px'; sendBtn.disabled = !input.value.trim(); }
input.addEventListener('input', autosize);
input.addEventListener('keydown', e => {
  if(e.key === 'Enter' && !e.shiftKey && matchMedia('(pointer:fine)').matches){ e.preventDefault(); send(); }
});
sendBtn.onclick = () => send();
async function send(retryItem){
  if(retryItem && !retryItem.pendingLocal) retryItem = undefined;   // only a real failed message counts as a retry (never a click event)
  if(!chat || !me) return;
  if(!dbReady){ toast('Connecting… try again in a second'); return; }
  if(chat.blocked){ toast('Unblock this user to send messages'); return; }
  if(chat.restricted){ toast('This person isn’t accepting messages right now'); return; }
  let text;
  if(retryItem) text = retryItem.text;
  else { text = input.value.trim().slice(0, 2000); if(!text) return; }
  const c = chat;
  pingActive();
  const replyTo = retryItem ? (retryItem.replyTo || null) : (c.reply || null);
  // The message id is fixed up front, so a retry can never create a second copy of the same message.
  const msgRef = retryItem ? doc(db,'conversations',c.cid,'messages',retryItem.id) : doc(collection(db,'conversations',c.cid,'messages'));
  let temp = retryItem;
  if(!temp){
    input.value = ''; autosize(); input.focus();
    temp = { id:msgRef.id, senderUid:me.uid, text, replyTo, ts:Date.now(), pendingLocal:true };
    c.pending.push(temp);
    c.reply = null; hideReplyBar();
  } else { temp.failed = false; temp.ts = Date.now(); }
  renderMsgs(true);
  try{
    if(retryItem){                                     // maybe the first attempt actually went through
      const ex = await getDoc(msgRef);
      if(ex.exists()){ c.ack.add(temp.id); if(chat === c) renderMsgs(false); return; }
    }
    const batch = writeBatch(db);
    const payload = { senderUid:me.uid, text, createdAt:serverTimestamp() };
    if(replyTo) payload.replyTo = replyTo;
    batch.set(msgRef, payload);
    const last = text.slice(0, 120);
    batch.set(doc(db,'inbox',me.uid,'threads',c.other.uid),
      { otherUid:c.other.uid, name:c.other.name, photo:c.other.photo || '', lastText:last, lastAt:serverTimestamp(), lastSender:me.uid, unread:0 }, { merge:true });
    batch.set(doc(db,'inbox',c.other.uid,'threads',me.uid),
      { otherUid:me.uid, name:me.name, photo:me.photo || '', lastText:last, lastAt:serverTimestamp(), lastSender:me.uid, unread:increment(1) }, { merge:true });
    await batch.commit();
    c.ack.add(temp.id);                                // server has it → "Delivered"
    if(chat === c) renderMsgs(false);
  }catch(e){
    try{ const ex = await getDoc(msgRef); if(ex.exists()){ c.ack.add(temp.id); if(chat === c) renderMsgs(false); return; } }catch(_){}
    if(e && e.code === 'permission-denied'){
      // The server refused this on purpose — most often because the other person has blocked you. Like other apps,
      // that stays silent: the message just shows "Sent" (kept on this device), with no red label and no retry prompt.
      temp.failed = false; temp.silent = true;
      saveSilent(c);
      if(chat === c) renderMsgs(false);
      console.warn('[messages] send refused by the server (permission-denied)', e);
      return;
    }
    temp.failed = true;
    if(chat === c) renderMsgs(false);
    toast('Couldn’t send — tap the message to retry');
  }
}
window.addEventListener('online',  () => { if(chat) renderMsgs(false); });
window.addEventListener('offline', () => { if(chat) renderMsgs(false); });

/* ───────── save reads: pause listeners while the tab is hidden ───────── */
document.addEventListener('visibilitychange', () => {
  if(document.hidden){
    clearTimeout(hiddenTimer);
    hiddenTimer = setTimeout(() => { stopInbox(); detachLive(); detached = true; }, 60000);
  } else {
    clearTimeout(hiddenTimer);
    if(detached && me){
      detached = false;
      if($('listView').classList.contains('on')) startInbox();
      if(chat) attachLive();          // only fetches what arrived while away
    }
    if(chat) markReadSoon();
    if(chat && Date.now() - chat.extrasAt > 120000){
      const c = chat;
      getDoc(doc(db,'presence',c.other.uid)).then(p => { if(chat === c && p.exists()){ c.other.lastActive = ms(p.data().lastActive); c.extrasAt = Date.now(); paintOther(); } }).catch(() => {});
    }
    pingActive();
  }
});

/* ───────── my activity (for "Active now") — one small write at most every 5 minutes ───────── */
function pingActive(){
  if(!me || !dbReady || document.hidden) return;
  try{
    const last = Number(localStorage.getItem('msb_ping_v1') || 0);
    if(Date.now() - last < 300000) return;
    localStorage.setItem('msb_ping_v1', String(Date.now()));
  }catch(e){}
  setDoc(doc(db,'presence',me.uid), { lastActive:serverTimestamp() }).catch(() => {});
}
setInterval(pingActive, 300000);

/* Messages the server silently refused (see send()). Kept per chat on this device only, so they stay visible as "Sent". */
const SILENT_KEY = cid => 'msb_silent_v1_' + cid;
function loadSilent(cid){
  try{
    const v = JSON.parse(localStorage.getItem(SILENT_KEY(cid)));
    return Array.isArray(v) ? v.map(m => ({ id:m.id, senderUid:me.uid, text:m.text, replyTo:m.replyTo || null, ts:m.ts, pendingLocal:true, silent:true })) : [];
  }catch(e){ return []; }
}
function saveSilent(c){
  try{
    const items = c.pending.filter(p => p.silent).slice(-100).map(p => ({ id:p.id, text:p.text, replyTo:p.replyTo || null, ts:p.ts }));
    localStorage.setItem(SILENT_KEY(c.cid), JSON.stringify(items));
  }catch(e){}
}

/* ───────── chat actions: pin · clear · delete · block · mark all as read ───────── */
let _reloading = false;
function closeSheet(){ $('sheet').hidden = true; $('sheetBg').hidden = true; }
function openSheet(title, items){
  $('sheetTitle').textContent = title || ''; $('sheetTitle').style.display = title ? '' : 'none';
  const body = $('sheetBody'); body.innerHTML = '';
  items.filter(Boolean).forEach(it => {
    const b = document.createElement('button');
    b.className = 'sheet-item' + (it.danger ? ' danger' : '');
    b.textContent = it.label;
    b.onclick = () => { closeSheet(); if(it.run) it.run(); };
    body.appendChild(b);
  });
  const c = document.createElement('button'); c.className = 'sheet-item cancel'; c.textContent = 'Cancel'; c.onclick = closeSheet; body.appendChild(c);
  $('sheetBg').onclick = closeSheet; $('sheetBg').hidden = false; $('sheet').hidden = false;
}
function confirmSheet(title, text, label){
  return new Promise(resolve => {
    $('sheetTitle').textContent = title; $('sheetTitle').style.display = '';
    const body = $('sheetBody'); body.innerHTML = '';
    const p = document.createElement('div'); p.className = 'sheet-text'; p.textContent = text; body.appendChild(p);
    const ok = document.createElement('button'); ok.className = 'sheet-item danger'; ok.style.textAlign = 'center'; ok.textContent = label;
    ok.onclick = () => { closeSheet(); resolve(true); };
    const no = document.createElement('button'); no.className = 'sheet-item cancel'; no.textContent = 'Cancel';
    no.onclick = () => { closeSheet(); resolve(false); };
    body.appendChild(ok); body.appendChild(no);
    $('sheetBg').onclick = () => { closeSheet(); resolve(false); };
    $('sheetBg').hidden = false; $('sheet').hidden = false;
  });
}
const myRow = uid => doc(db,'inbox',me.uid,'threads',uid);
const rowFor = uid => recentRows.concat(pinnedRows).find(t => t.otherUid === uid) || (chat && chat.other.uid === uid ? chat.row : null);
function removeChatCache(cid){ try{ localStorage.removeItem(CHAT_KEY(cid)); }catch(e){} }

async function setPinned(uid, on){
  if(!rowFor(uid)){ toast('Send a message first to pin this chat'); return; }
  if(on && threads.filter(t => t.pinned).length >= 3){ toast('You can pin up to 3 chats'); return; }
  try{
    await updateDoc(myRow(uid), on ? { pinned:true, pinnedAt:serverTimestamp() } : { pinned:false });
    toast(on ? 'Chat pinned' : 'Chat unpinned');
  }catch(e){ toast('Couldn’t update this chat'); }
}
async function markRowRead(uid){
  try{ await updateDoc(myRow(uid), { unread:0 }); clearBadgeCache(); }catch(e){ toast('Couldn’t update this chat'); }
}
async function markAllRead(){
  if(!dbReady) return;
  try{
    // ask the server for every unread row (not just the 30 on screen); it only reads rows that are actually unread
    const snap = await getDocs(query(collection(db,'inbox',me.uid,'threads'), where('unread','>',0), limit(100)));
    if(snap.empty){ toast('Nothing unread'); return; }
    const batch = writeBatch(db);
    snap.docs.forEach(d => batch.update(d.ref, { unread:0 }));       // clears the counters only — no "Seen" is sent to anyone
    await batch.commit();
    clearBadgeCache();
    toast(snap.size === 1 ? 'Marked 1 chat as read' : `Marked ${snap.size} chats as read`);
  }catch(e){ toast('Couldn’t mark as read'); }
}
async function reloadChat(){
  if(!chat || _reloading) return;
  _reloading = true;
  const uid = chat.other.uid;
  closeChat();
  await openChat(uid, { push:false, reload:true });
  _reloading = false;
}
async function clearChat(){
  if(!chat) return;
  const uid = chat.other.uid, cid = chat.cid;
  if(!rowFor(uid)){ toast('Nothing to clear yet'); return; }
  if(!await confirmSheet('Clear this chat?', 'The messages are removed for you only. The other person keeps their copy and the chat stays in your inbox.', 'Clear chat')) return;
  try{
    await updateDoc(myRow(uid), { clearedAt:serverTimestamp(), lastText:'', unread:0 });
    removeChatCache(cid);
    toast('Chat cleared');
    await reloadChat();
  }catch(e){ toast('Couldn’t clear this chat'); }
}
async function deleteChat(uid){
  if(!rowFor(uid)){ if(chat && chat.other.uid === uid) backToList(); return; }
  if(!await confirmSheet('Delete this chat?', 'It disappears from your inbox and the messages are cleared for you. The other person keeps their copy. If they message you again, a fresh chat starts.', 'Delete chat')) return;
  try{
    await updateDoc(myRow(uid), { deleted:true, clearedAt:serverTimestamp(), lastText:'', unread:0, pinned:false });
    removeChatCache(convId(me.uid, uid));
    recentRows = recentRows.filter(t => t.otherUid !== uid); pinnedRows = pinnedRows.filter(t => t.otherUid !== uid);
    rebuildThreads(); renderList(); saveInboxCache(); clearBadgeCache();
    if(chat && chat.other.uid === uid) backToList();
    toast('Chat deleted');
  }catch(e){ toast('Couldn’t delete this chat'); }
}
function applyBlockUI(){
  const b = !!(chat && chat.blocked), r = !!(chat && !chat.blocked && chat.restricted);
  $('blockBar').hidden = !(b || r);
  $('blockMsg').textContent = b ? 'You blocked this user.' : `${(chat && chat.other.name) || 'This person'} isn’t accepting messages right now.`;
  $('unblockBtn').style.display = b ? '' : 'none';
  $('composer').style.display = (b || r) ? 'none' : '';
  if(b || r) hideReplyBar();
}
async function blockUser(uid, name, photo){
  const nm = name || 'this user';
  if(!await confirmSheet(`Block ${nm}?`, 'They won’t be able to message you and you won’t see this chat. They aren’t told. You can unblock them any time from Messages → ⋮ → Blocked users.', 'Block')) return;
  try{
    await setDoc(doc(db,'blocks', me.uid + '_' + uid), { blockerUid:me.uid, blockedUid:uid, name:name || '', photo:photo || '', at:serverTimestamp() });
    blockedSet.add(uid); blockedInfo.set(uid, { name, photo });
    rebuildThreads(); renderList(); saveInboxCache();
    if(chat && chat.other.uid === uid) backToList();
    toast(`${nm} blocked`);
  }catch(e){ toast('Couldn’t block this user'); }
}
async function unblockUser(uid){
  try{
    await deleteDoc(doc(db,'blocks', me.uid + '_' + uid));
    blockedSet.delete(uid); blockedInfo.delete(uid);
    rebuildThreads(); renderList(); saveInboxCache();
    if(chat && chat.other.uid === uid){ chat.blocked = false; applyBlockUI(); }
    toast('Unblocked');
  }catch(e){ toast('Couldn’t unblock'); }
}
async function loadBlocks(){
  try{
    const s = await getDocs(query(collection(db,'blocks'), where('blockerUid','==',me.uid), limit(100)));
    blockedSet = new Set(); blockedInfo = new Map();
    s.docs.forEach(d => { const x = d.data(); blockedSet.add(x.blockedUid); blockedInfo.set(x.blockedUid, { name:x.name, photo:x.photo }); });
    rebuildThreads(); if($('listView').classList.contains('on')) renderList();
    if(chat){ chat.blocked = blockedSet.has(chat.other.uid); applyBlockUI(); }
  }catch(e){}
}
function openBlockedList(){
  if(!blockedSet.size){ toast('You haven’t blocked anyone'); return; }
  openSheet('Blocked users', [...blockedSet].map(uid => ({ label:`Unblock ${(blockedInfo.get(uid) || {}).name || 'user'}`, run:() => unblockUser(uid) })));
}
function openListMenu(){
  openSheet('', [
    { label:'Mark all as read', run:markAllRead },
    { label:'Blocked users', run:openBlockedList }
  ]);
}
function openChatMenu(){
  if(!chat) return;
  const uid = chat.other.uid, pinned = !!(chat.row && chat.row.pinned);
  openSheet(chat.other.name, [
    { label: pinned ? 'Unpin chat' : 'Pin chat', run:() => setPinned(uid, !pinned) },
    { label:'View profile', run:() => { location.href = `/profile?uid=${encodeURIComponent(uid)}`; } },
    { label:'Clear chat', run:clearChat },

                 : { label:'Block user', danger:true, run:() => blockUser(uid, chat.other.name, chat.other.photo) }

}
function openRowMenu(t){
  openSheet(t.name || 'Chat', [
    { label: t.pinned ? 'Unpin chat' : 'Pin chat', run:() => setPinned(t.otherUid, !t.pinned) },
    t.unread > 0 ? { label:'Mark as read', run:() => markRowRead(t.otherUid) } : null,
    { label:'Delete chat', danger:true, run:() => deleteChat(t.otherUid) },

}
$('listMenuBtn').onclick = openListMenu;
$('chatMenuBtn').onclick = openChatMenu;
$('unblockBtn').onclick = () => { if(chat) unblockUser(chat.other.uid); };

/* ───────── people row (top of the inbox) ─────────
   People you follow, most recently active first (green dot = active now). If you follow nobody yet, rising
   creators are suggested instead. Reads are kept small: the follow list + profiles are remembered for 30 minutes
   and last-active times for 5, so a visit usually costs nothing.
   Message privacy: each person's `msgPrivacy` field ('everyone' | 'followers' | 'none', default everyone) is honoured
   here already — the settings screen that sets it comes later, and a server rule will enforce it for real. */
let people = [], peopleMode = 'follow', followingIds = new Set(), peopleAct = {}, peopleState = 'idle', _peopleSig = '';
const PEOPLE_KEY = u => 'msb_people_v1_' + u;
function allowsMessages(u, iFollow){
  const m = (u && u.msgPrivacy) || 'everyone';
  if(m === 'none') return false;
  if(m === 'followers') return !!iFollow;       // "followers" = people who follow them; for someone I follow that's me
  return true;
}
function updateRestricted(){
  if(!chat) return;
  const uid = chat.other.uid;
  chat.restricted = !rowFor(uid) && !allowsMessages(chat.other, followingIds.has(uid) || chat.other.msgPrivacy === 'followers' && peopleMode === 'follow' && people.some(p => p.uid === uid));
  applyBlockUI();
}
const firstName = n => String(n || '').trim().split(/\s+/)[0] || 'User';
const isActiveNow = t => !!t && (Date.now() - t) < 7 * 60000;
function visiblePeople(){
  const inChat = new Set(threads.map(t => t.otherUid));
  const list = people.filter(p => p.uid !== (me && me.uid) && !inChat.has(p.uid) && !blockedSet.has(p.uid) && p.name);
  return list.sort((a, b) => (peopleAct[b.uid] || 0) - (peopleAct[a.uid] || 0)).slice(0, 15);
}
function renderPeople(){
  const el = $('people');
  if(!el || !me || filter === 'unread'){ if(el) el.hidden = true; return; }
  const list = visiblePeople();
  if(!list.length && peopleState === 'ready'){ el.hidden = true; return; }
  if(!list.length && peopleState !== 'loading'){ el.hidden = true; return; }
  const sig = peopleState + '|' + list.map(p => p.uid + (isActiveNow(peopleAct[p.uid]) ? '*' : '')).join(',');
  el.hidden = false;
  if(sig === _peopleSig) return;                      // nothing changed — don't disturb the scroll position
  _peopleSig = sig;
  const add = `<button class="pp add" data-add="1" aria-label="New message"><div class="av"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></div><div class="pp-name">New</div></button>`;
  if(!list.length){
    el.innerHTML = add + Array(5).fill('<div class="pp"><div class="skel c" style="width:58px;height:58px;margin:0 auto"></div><div class="skel" style="height:10px;width:44px;margin:8px auto 0"></div></div>').join('');
    return;
  }
  el.innerHTML = add + list.map(p => `<button class="pp" data-uid="${esc(p.uid)}" data-mode="${peopleMode}">
    <div class="av">${avatarHtml(p.name, p.photo)}${isActiveNow(peopleAct[p.uid]) ? '<span class="on-dot"></span>' : ''}</div>
    <div class="pp-name">${esc(firstName(p.name))}</div>${peopleMode === 'suggest' ? '<div class="pp-sub">Creator</div>' : ''}</button>`).join('');
}
$('people').addEventListener('click', e => {
  const b = e.target.closest('.pp'); if(!b) return;
  if(b.dataset.add){ openPeopleSearch(); return; }
  const uid = b.dataset.uid;
  if(b.dataset.mode === 'suggest') location.href = `/profile?uid=${encodeURIComponent(uid)}`;     // not following them yet → see who they are first
  else openChat(uid, { push:true });
});
function savePeopleCache(extra){
  try{
    const prev = JSON.parse(localStorage.getItem(PEOPLE_KEY(me.uid))) || {};
    localStorage.setItem(PEOPLE_KEY(me.uid), JSON.stringify({ t:prev.t || Date.now(), actT:prev.actT || 0, ...extra,
      mode:peopleMode, people, following:[...followingIds], act:peopleAct }));
  }catch(e){}
}
async function fetchProfiles(ids){
  const s = await getDocs(query(collection(db,'users'), where(documentId(), 'in', ids.slice(0, 30))));
  return s.docs.map(d => { const x = d.data(); return { uid:d.id, name:x.name || '', photo:x.photo || '', jobTitle:x.jobTitle || '', username:x.username || '', msgPrivacy:x.msgPrivacy || 'everyone' }; });
}
async function loadPeople(){
  if(!dbReady || !me) return;
  let cache = null;
  try{ cache = JSON.parse(localStorage.getItem(PEOPLE_KEY(me.uid))); }catch(e){}
  const listFresh = cache && cache.people && Date.now() - cache.t < 30 * 60000;
  if(cache && cache.people){ people = cache.people; peopleMode = cache.mode || 'follow'; followingIds = new Set(cache.following || []); peopleAct = cache.act || {}; peopleState = 'ready'; renderPeople(); }
  else { peopleState = 'loading'; renderPeople(); }
  try{
    let t = cache && cache.t, actT = cache && cache.actT;
    if(!listFresh){
      const fs = await getDocs(query(collection(db,'follows'), where('followerId','==',me.uid), limit(30)));
      const ids = [...new Set(fs.docs.map(d => d.data().followingId).filter(id => id && id !== me.uid && id !== 'official' && !id.includes('_')))];
      followingIds = new Set(ids);
      if(ids.length){
        peopleMode = 'follow';
        people = (await fetchProfiles(ids)).filter(p => allowsMessages(p, true));
      } else {
        peopleMode = 'suggest';
        let snap = null;
        try{ snap = await getDocs(query(collection(db,'users'), orderBy('followerCount','desc'), limit(24))); }catch(e){}
        if(!snap || snap.empty) snap = await getDocs(query(collection(db,'users'), limit(24)));
        people = snap.docs.map(d => { const x = d.data(); return { uid:d.id, name:x.name || '', photo:x.photo || '', jobTitle:x.jobTitle || '', username:x.username || '', msgPrivacy:x.msgPrivacy || 'everyone',
                 _score: ((x.photo || x.photoURL) ? 1 : 0) + (x.cover ? 1 : 0) + ((x.bio && String(x.bio).trim()) ? 1 : 0) + ((Array.isArray(x.categories) && x.categories.length) ? 1 : 0) + (x.username ? 1 : 0) }; })
          .filter(p => p.uid !== me.uid && p._score >= 2 && p.photo && allowsMessages(p, false)).slice(0, 15);
      }
      t = Date.now(); actT = 0; peopleAct = {};
    }
    // last-active times for the people shown (refreshed at most every 5 minutes)
    if(peopleMode === 'follow' && people.length && (!actT || Date.now() - actT > 300000)){
      const ids = people.map(p => p.uid).slice(0, 30);
      const ps = await getDocs(query(collection(db,'presence'), where(documentId(), 'in', ids)));
      peopleAct = {}; ps.docs.forEach(d => { peopleAct[d.id] = ms(d.data().lastActive); });
      actT = Date.now();
    }
    peopleState = 'ready';
    savePeopleCache({ t:t || Date.now(), actT:actT || 0 });
    renderPeople();
  }catch(e){ peopleState = 'ready'; renderPeople(); }
}

/* "+" → find anyone by name or @username and start a chat (≤ about 15 reads per search, debounced) */
function openPeopleSearch(){
  $('sheetTitle').textContent = 'New message'; $('sheetTitle').style.display = '';
  const body = $('sheetBody');
  body.innerHTML = '<input class="psq" id="psq" placeholder="Search by name or @username" autocomplete="off"><div id="psr"><div class="pnote">Type at least 2 letters</div></div>';
  const cancel = document.createElement('button'); cancel.className = 'sheet-item cancel'; cancel.textContent = 'Cancel'; cancel.onclick = closeSheet; body.appendChild(cancel);
  $('sheetBg').onclick = closeSheet; $('sheetBg').hidden = false; $('sheet').hidden = false;
  const inp = $('psq'); let timer = null, seq = 0;
  setTimeout(() => inp.focus(), 80);
  inp.addEventListener('input', () => {
    clearTimeout(timer);
    const q = inp.value.trim().replace(/^@/, '');
    if(q.length < 2){ $('psr').innerHTML = '<div class="pnote">Type at least 2 letters</div>'; return; }
    timer = setTimeout(async () => {
      const mySeq = ++seq;
      const title = q.replace(/\b\w/g, c => c.toUpperCase());
      const range = (field, v) => getDocs(query(collection(db,'users'), where(field,'>=',v), where(field,'<=',v + '\uf8ff'), limit(5))).catch(() => null);
      const [u1, n1, n2] = await Promise.all([range('username', q.toLowerCase()), range('name', q), title !== q ? range('name', title) : Promise.resolve(null)]);
      if(mySeq !== seq) return;
      const seen = new Map();
      [u1, n1, n2].forEach(sn => sn && sn.docs.forEach(d => { if(d.id !== me.uid && !blockedSet.has(d.id) && !seen.has(d.id)) seen.set(d.id, { uid:d.id, ...d.data() }); }));
      const res = [...seen.values()].filter(u => allowsMessages(u, followingIds.has(u.uid))).slice(0, 8);
      $('psr').innerHTML = res.length ? res.map(u => `<button class="pres" data-uid="${esc(u.uid)}"><div class="av">${avatarHtml(u.name, u.photo)}</div><div><div class="pres-name">${esc(u.name || 'User')}</div><div class="pres-sub">${u.username ? '@' + esc(u.username) : esc(u.jobTitle || '')}</div></div></button>`).join('')
                                  : '<div class="pnote">No one found</div>';
      $('psr').querySelectorAll('.pres').forEach(b => b.onclick = () => {
        const u = seen.get(b.dataset.uid); closeSheet();
        if(u && !people.some(p => p.uid === u.uid)) people.push({ uid:u.uid, name:u.name || '', photo:u.photo || '', jobTitle:u.jobTitle || '', msgPrivacy:u.msgPrivacy || 'everyone' });
        openChat(b.dataset.uid, { push:true });
      });
    }, 400);
  });
}

/* ───────── instant open: paint from saved copies, then load the SDK and refresh ─────────
   The inbox and the last 30 messages of recent chats are remembered on this device (per account), so the page
   shows real content immediately — before Firebase has even downloaded — and the live data quietly takes over.
   Cleared on sign-out. */
const INBOX_KEY = u => 'msb_inbox_v1_' + u;
const CHAT_KEY  = c => 'msb_chat_v1_' + c;
const _cacheTimers = {};
function saveInboxCache(){
  clearTimeout(_cacheTimers.i);
  _cacheTimers.i = setTimeout(() => {
    if(!me) return;
    try{
      localStorage.setItem(INBOX_KEY(me.uid), JSON.stringify(threads.map(t => ({
        otherUid:t.otherUid, name:t.name, photo:t.photo, lastText:t.lastText, lastAt:ms(t.lastAt),
        lastSender:t.lastSender, unread:t.unread || 0, seenAt:ms(t.seenAt),
        pinned:!!t.pinned, pinnedAt:ms(t.pinnedAt), clearedAt:ms(t.clearedAt), deleted:!!t.deleted }))));
    }catch(e){}
  }, 400);
}
function loadInboxCache(uid){ try{ const v = JSON.parse(localStorage.getItem(INBOX_KEY(uid))); return Array.isArray(v) ? v : null; }catch(e){ return null; } }
function saveChatCacheSoon(){
  clearTimeout(_cacheTimers.c);
  const c = chat; if(!c || !c.loaded) return;
  _cacheTimers.c = setTimeout(() => {
    try{
      const msgs = [...c.msgs.values()].filter(m => m.ts && m.confirmed).sort((a,b) => a.ts - b.ts).slice(-PAGE)
        .map(m => ({ id:m.id, senderUid:m.senderUid, text:m.text, replyTo:m.replyTo || null, ts:m.ts }));
      localStorage.setItem(CHAT_KEY(c.cid), JSON.stringify({ msgs, hasMore:c.hasMore, t:Date.now() }));
      const idx = JSON.parse(localStorage.getItem('msb_chat_idx') || '[]').filter(x => x !== c.cid); idx.push(c.cid);
      while(idx.length > 8) localStorage.removeItem(CHAT_KEY(idx.shift()));      // keep only the 8 most recent chats
      localStorage.setItem('msb_chat_idx', JSON.stringify(idx));
    }catch(e){}
  }, 600);
}
function loadChatCache(cid){
  try{ const v = JSON.parse(localStorage.getItem(CHAT_KEY(cid))); if(v && Array.isArray(v.msgs) && Date.now() - v.t < 14*86400000) return v; }catch(e){}
  return null;
}
function clearMsgCaches(){
  try{
    Object.keys(localStorage).filter(k => k.startsWith('msb_inbox_v1_') || k.startsWith('msb_chat_v1_') || k.startsWith('msb_silent_v1_') || k.startsWith('msb_people_v1_') || k === 'msb_chat_idx').forEach(k => localStorage.removeItem(k));
    sessionStorage.removeItem('msb_open_chat');
  }catch(e){}
}
function earlyPaint(){
  let uid = null;
  try{ const v = localStorage.getItem('mindshift_hero_last_uid'); if(v && v !== 'guest') uid = v; }catch(e){}
  if(!uid || uid.includes('_')) return;                     // signed out / unknown → the skeleton stays until we know
  me = { uid, name:'', photo:'' };
  const withUid = new URLSearchParams(location.search).get('with');
  if(withUid){
    if(withUid === uid || withUid.includes('_')) return;
    let h = null; try{ h = JSON.parse(sessionStorage.getItem('msb_open_chat')); }catch(e){}
    if(!h || h.uid !== withUid) h = null;                  // handed over by the profile page (name + photo)
    const cid = convId(uid, withUid);
    const cached = loadChatCache(cid);
    const row = (loadInboxCache(uid) || []).find(x => x.otherUid === withUid);
    const other = { uid:withUid, name:(h && h.name) || (row && row.name) || '', photo:(h && h.photo) || (row && row.photo) || '', jobTitle:(h && h.jobTitle) || '' };
    if(!other.name && !cached) return;
    chat = { other, cid, msgs:new Map(), oldest:null, hasMore:!!(cached && cached.hasMore), lastTs:null, unsubLive:null, pending:[],
             extrasAt:0, loaded:false, ack:new Set(), row:null, unsubRow:null, rowSeen:false, provisional:true, rowInfo:row || null };
    if(cached) cached.msgs.forEach(m => chat.msgs.set(m.id, { ...m, confirmed:true }));
    show('chat'); paintOther(); renderMsgs(true);
  } else {
    const rows = loadInboxCache(uid);
    if(rows && rows.length){ threads = rows; show('list'); renderList(); }
    try{
      const pc = JSON.parse(localStorage.getItem(PEOPLE_KEY(uid)));
      if(pc && pc.people){ people = pc.people; peopleMode = pc.mode || 'follow'; followingIds = new Set(pc.following || []); peopleAct = pc.act || {}; peopleState = 'ready'; renderPeople(); }
    }catch(e){}
  }
}
earlyPaint();                                               // ← real content on screen now, before any network

onAuthStateChanged(auth, async user => {
  if(!user){ me = null; threads = []; chat = null; clearMsgCaches(); showSignedOut(); return; }
  if(me && me.uid !== user.uid){ threads = []; chat = null; }         // the instant paint belonged to a different account
  me = await loadMe(user);
  pingActive();
  loadBlocks();                 // who I've blocked (1 small query)

  const withUid = new URLSearchParams(location.search).get('with');

  else showList();
  if($('listView').classList.contains('on')) startInbox();             // e.g. they tapped back before we finished loading
});
