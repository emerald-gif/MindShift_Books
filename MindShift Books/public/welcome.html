<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="/auth.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const returnTo = params.get('returnTo') || '/';
  let claimedUsername = (params.get('u') || '').trim().toLowerCase();
  document.getElementById('browseBtn').href = returnTo;

  // ── Auth guard: this page is meaningless signed out ──
  window.MSBAuth.onAuthReady(user => {
    if (!user) { location.href = '/login?returnTo=' + encodeURIComponent('/welcome' + location.search); return; }
  });

  // ── Step 1: interest pills ──
  let selected = [];
  const pillsWrap = document.getElementById('onboardCatPills');
  const continueBtn = document.getElementById('continueBtn');

  function renderPills(){
    if (!window.MSB_CATEGORIES) return;
    pillsWrap.innerHTML = window.MSB_CATEGORIES.map(c =>
      `<button type="button" class="cat-pill" data-cat="${c.code}">${c.emoji} ${c.label}</button>`
    ).join('');
    pillsWrap.querySelectorAll('.cat-pill').forEach(btn => {
      btn.addEventListener('click', () => {
        const code = btn.dataset.cat;
        const i = selected.indexOf(code);
        if (i === -1) { selected.push(code); btn.classList.add('sel'); }
        else { selected.splice(i, 1); btn.classList.remove('sel'); }
        continueBtn.disabled = selected.length === 0;
      });
    });
  }
  renderPills();

  // ── Username confirm/edit (only shown if we arrived with a claimed handle) ──
  const unameRow = document.getElementById('unameRow');
  const unameDisplay = document.getElementById('unameDisplay');
  const unameEdit = document.getElementById('unameEdit');
  const unameInput = document.getElementById('unameInput');
  const unameStatus = document.getElementById('unameStatus');

  if (claimedUsername) {
    unameRow.style.display = 'flex';
    unameDisplay.textContent = '@' + claimedUsername;
  }
  document.getElementById('unameEditBtn').addEventListener('click', () => {
    unameRow.style.display = 'none';
    unameEdit.classList.add('show');
    unameInput.value = claimedUsername;
    unameInput.focus();
  });
  document.getElementById('unameSaveBtn').addEventListener('click', async () => {
    const next = unameInput.value.trim().toLowerCase();
    if (!/^[a-z0-9_]{3,20}$/.test(next)) {
      unameStatus.style.color = '#dc2626';
      unameStatus.textContent = '3-20 characters: letters, numbers, underscores only.';
      return;
    }
    if (next === claimedUsername) { unameEdit.classList.remove('show'); unameRow.style.display = 'flex'; return; }
    unameStatus.style.color = '#6b7280';
    unameStatus.textContent = 'Saving…';
    try {
      const token = await window.MSBAuth.getIdToken();
      const r = await fetch('/api/claim-username', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
        body: JSON.stringify({ newUsername: next, oldUsername: claimedUsername })
      });
      const j = await r.json();
      if (!r.ok) { unameStatus.style.color = '#dc2626'; unameStatus.textContent = j.error || 'Could not save that username.'; return; }
      claimedUsername = next;
      unameDisplay.textContent = '@' + next;
      unameEdit.classList.remove('show');
      unameRow.style.display = 'flex';
      unameStatus.textContent = '';
    } catch (e) {
      unameStatus.style.color = '#dc2626';
      unameStatus.textContent = 'Network error — please try again.';
    }
  });

  // ── Advance to step 2, saving categories (or skipping) on the way ──
  async function goToStepDone(){
    document.getElementById('stepInterests').classList.remove('active');
    document.getElementById('stepDone').classList.add('active');
    document.getElementById('dot1').classList.remove('on');
    document.getElementById('dot2').classList.add('on');
  }

  async function saveCategoriesAndAdvance(){
    const user = window.MSBAuth.getUser();
    if (selected.length && user) {
      try {
        // Make the pick usable immediately (articles.html reads this key
        // without waiting on a fresh Firestore round trip)...
        let existing = {};
        try { existing = JSON.parse(localStorage.getItem('mindshift_user_cats_' + user.uid)) || {}; } catch(e){}
        existing.categories = selected; existing.ts = Date.now();
        localStorage.setItem('mindshift_user_cats_' + user.uid, JSON.stringify(existing));

        // ...and persist it server-side so it's there on the next device/session.
        const token = await window.MSBAuth.getIdToken();
        await fetch('/api/account/categories', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
          body: JSON.stringify({ categories: selected })
        });
      } catch (e) { /* non-fatal — Settings lets them set this later either way */ }
    }
    goToStepDone();
  }

  continueBtn.addEventListener('click', () => {
    continueBtn.disabled = true;
    continueBtn.textContent = 'Saving…';
    saveCategoriesAndAdvance();
  });
  document.getElementById('skipBtn').addEventListener('click', goToStepDone);
</script>

</body>
