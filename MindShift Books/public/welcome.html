<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Welcome | MindShift Books</title>
  <meta name="description" content="Your MindShift Books account is ready." />
  <meta name="robots" content="noindex, follow">
  <link rel="shortcut icon" href="MINDSHIFT.jpg" type="image/jpg">
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
:root{ --primary:#0f172a; --accent:#06b6d4; --indigo:#4f46e5; --paper:#fdfdfc; }
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Inter',sans-serif; color:var(--primary); background:var(--paper);
  min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
}

.card{
  width:100%; max-width:420px; text-align:center; padding:44px 32px 40px;
}

.brand{ display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:40px; }
.brand img{ width:32px; height:32px; border-radius:7px; }
.brand span{ font-weight:700; font-size:1rem; letter-spacing:0.01em; }

.icon-wrap{
  width:96px; height:96px; margin:0 auto 32px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  background:radial-gradient(circle at 30% 25%, rgba(6,182,212,0.16), rgba(79,70,229,0.1) 70%);
}
.icon-wrap svg{ width:52px; height:52px; }

h1{
  font-family:'Source Serif 4',serif; font-weight:600; font-size:1.7rem;
  line-height:1.25; margin-bottom:14px;
}
h1 .accent{ color:var(--indigo); }

.subtext{ color:#64748b; font-size:0.96rem; line-height:1.6; margin-bottom:36px; }
.subtext b{ color:var(--primary); }

.browse-btn{
  display:block; width:100%; padding:15px 20px; border-radius:12px; border:none;
  background:linear-gradient(90deg,var(--indigo),var(--accent)); color:#fff;
  font-weight:700; font-size:1rem; text-decoration:none; cursor:pointer;
  box-shadow:0 10px 26px rgba(79,70,229,0.25);
}
.browse-btn:hover{ filter:brightness(1.05); }

.footer-links{ margin-top:26px; font-size:0.82rem; color:#94a3b8; }
.footer-links a{ color:#64748b; text-decoration:underline; }
  </style>
</head>
<body>

<div class="card">
  <div class="brand">
    <img src="MINDSHIFT.jpg" alt="MindShift Books logo">
    <span>MindShift Books</span>
  </div>

  <div class="icon-wrap">
    <svg viewBox="0 0 24 24" fill="none" stroke="#4f46e5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 21C12 21 4 16.5 4 10.5C4 7.46 6.24 5 9.2 5C10.86 5 12 6 12 6C12 6 13.14 5 14.8 5C17.76 5 20 7.46 20 10.5C20 16.5 12 21 12 21Z"/>
    </svg>
  </div>

  <h1>You're all set, <span class="accent">welcome in</span></h1>
  <p class="subtext">Your account is ready. <b>Browse the store</b> whenever you like — everything you save gets kept on your account from here on.</p>

  <a href="/" id="browseBtn" class="browse-btn">Browse Store</a>

  <div class="footer-links">
    <a href="/support">Support</a> &nbsp;|&nbsp; <a href="/legal">Terms &amp; Privacy</a>
  </div>
</div>

<script>
  const params = new URLSearchParams(location.search);
  const returnTo = params.get('returnTo') || '/';
  document.getElementById('browseBtn').href = returnTo;
</script>

</body>
</html>
