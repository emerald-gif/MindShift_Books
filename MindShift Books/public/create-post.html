<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" href="/MINDSHIFT.jpg">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Create a Post · MindShift Books</title>
<meta name="description" content="Share a quick update with the MindShift Books community."/>
<meta name="robots" content="noindex, nofollow"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --p:#4f46e5;--p2:#06b6d4;--g:linear-gradient(90deg,#4f46e5,#06b6d4);
  --txt:#0f172a;--sub:#6b7280;--mute:#9ca3af;
  --bg:#f8fafc;--card:#fff;--border:#e5e7eb;
  --green:#10b981;--yellow:#f59e0b;--red:#ef4444;
  --radius:16px;
}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}

/* ── HEADER ── */
.hdr{position:sticky;top:0;z-index:100;background:rgba(248,247,255,.92);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);padding:0 16px;height:56px;
  display:flex;align-items:center;justify-content:space-between;gap:12px}
.hdr-left{display:flex;align-items:center;gap:10px}
.btn-back{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--border);background:var(--card);
  display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--txt)}
.btn-back svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.hdr-title{font-size:16px;font-weight:800;color:var(--txt)}
.btn-post{padding:9px 20px;border-radius:99px;border:none;background:var(--g);color:#fff;
  font-size:13.5px;font-weight:800;cursor:pointer;transition:opacity .2s}
.btn-post:disabled{opacity:.45;cursor:not-allowed}
.hdr-right{display:flex;align-items:center;gap:8px}
.btn-draft{padding:8px 14px;border-radius:99px;border:1.5px solid var(--border);background:var(--card);
  font-size:13px;font-weight:600;color:var(--sub);cursor:pointer;transition:all .2s}
.btn-draft:hover{border-color:var(--p);color:var(--p)}
/* "Saving… / Saved just now" sits just under the header so it never crowds the buttons on narrow phones */
.autosave-status{position:absolute;right:16px;top:calc(100% + 5px);font-size:11px;color:var(--mute);font-weight:600;
  opacity:0;transition:opacity .3s;white-space:nowrap;pointer-events:none}
.autosave-status.show{opacity:1}

/* ── MAIN ── */
.main{max-width:640px;margin:0 auto;padding:20px 16px 60px}

.composer{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);padding:16px}
.composer-author{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.composer-av{width:38px;height:38px;border-radius:50%;object-fit:cover;background:linear-gradient(135deg,#4f46e5,#06b6d4)}
.composer-name{font-size:14px;font-weight:800;color:var(--txt)}
.composer-sub{font-size:11.5px;color:var(--mute)}

.post-textarea{width:100%;border:none;outline:none;resize:none;font-family:inherit;font-size:16px;line-height:1.55;
  color:var(--txt);min-height:120px;background:transparent}
.post-textarea::placeholder{color:var(--mute)}

.ta-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:4px}
.ta-hist{display:flex;gap:4px}
.ta-btn{width:34px;height:34px;border:none;background:none;border-radius:10px;color:var(--sub);display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
.ta-btn:active{background:#eef2ff;color:var(--p)}
.ta-btn:disabled{opacity:.3;cursor:default}
.ta-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.char-count{text-align:right;font-size:11.5px;color:var(--mute)}
.char-count.over{color:var(--red);font-weight:700}

/* ── PHOTO PREVIEW — mirrors how photos look in the feed (single = big, several = swipeable strip with a 1/N counter) ── */
.pv{margin-top:14px}
.pv-single{display:flex;justify-content:center}
.pv-box{position:relative;width:max-content;max-width:100%;border-radius:14px;overflow:hidden;background:#f1f5f9}
.pv-box img{max-width:100%;max-height:340px;width:auto;height:auto;object-fit:contain;display:block}
.pv-carousel{position:relative}
.pv-track{display:flex;gap:4px;overflow-x:auto;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:none;height:340px;max-height:60vh}
.pv-track::-webkit-scrollbar{display:none}
.pv-slide{position:relative;flex:0 0 auto;height:100%;scroll-snap-align:start;border-radius:14px;overflow:hidden;background:#f1f5f9}
.pv-slide img{width:100%;height:100%;object-fit:contain;display:block}
.pv-count{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;pointer-events:none;z-index:3}
.pv-actions{position:absolute;top:8px;right:8px;display:flex;gap:8px;z-index:3}
.pv-btn{width:34px;height:34px;border-radius:50%;background:rgba(15,10,30,.68);border:none;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
.pv-btn:active{background:rgba(15,10,30,.9)}
.pv-btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.pv-box.uploading::before,.pv-slide.uploading::before{content:'';position:absolute;inset:0;background:rgba(255,255,255,.55);z-index:1}
.pv-box.uploading::after,.pv-slide.uploading::after{content:'';position:absolute;top:50%;left:50%;width:26px;height:26px;margin:-13px 0 0 -13px;
  border:3px solid #e0e7ff;border-top-color:#4f46e5;border-radius:50%;animation:spin .72s linear infinite;z-index:2}
@keyframes spin{to{transform:rotate(360deg)}}

.img-hint{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;color:var(--p);
  margin-top:12px;padding:10px 14px;border-radius:99px;background:#eef2ff;border:none;cursor:pointer;width:fit-content}
.img-hint:active{background:#e0e7ff}
.img-hint svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ── TOAST ── */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
  background:#0f172a;color:#fff;padding:12px 20px;border-radius:99px;font-size:13.5px;font-weight:600;
  opacity:0;pointer-events:none;transition:all .3s;z-index:999;white-space:nowrap;max-width:90vw;
  overflow:hidden;text-overflow:ellipsis}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── SUCCESS OVERLAY ── */
.success-overlay{position:fixed;inset:0;background:rgba(15,10,30,.6);z-index:2000;
  display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s;padding:20px}
.success-overlay.show{opacity:1;pointer-events:all}
.success-card{background:#fff;border-radius:20px;padding:32px 24px;max-width:340px;width:100%;text-align:center}
.success-icon{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#4f46e5,#06b6d4);
  display:flex;align-items:center;justify-content:center;margin:0 auto 16px;color:#fff}
.success-icon svg{width:32px;height:32px}
.success-card h3{font-size:18px;font-weight:800;margin-bottom:8px;color:var(--txt)}
.success-card p{font-size:13.5px;color:var(--sub);margin-bottom:22px;line-height:1.5}
.btn-done{width:100%;padding:13px;border:none;border-radius:14px;background:var(--g);color:#fff;
  font-size:14.5px;font-weight:800;cursor:pointer}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-left">
    <button class="btn-back" onclick="history.back()">
      <svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    </button>
    <span class="hdr-title" id="hdrTitle">Create Post</span>
  </div>
  <div class="hdr-right">
    <button class="btn-draft" id="saveDraftBtn" onclick="saveDraft()">Save Draft</button>
    <button class="btn-post" id="postBtn" onclick="submitPost()" disabled>Post</button>
  </div>
  <span class="autosave-status" id="autosaveStatus"></span>
</div>

<main class="main">
  <div class="composer">
    <div class="composer-author">
      <img class="composer-av" id="composerAv" src="" alt="">
      <div>
        <div class="composer-name" id="composerName">You</div>
        <div class="composer-sub">Posting publicly · goes live immediately</div>
      </div>
    </div>
    <div class="ta-wrap" id="taWrap">
      <div class="ta-mirror" id="taMirror" aria-hidden="true"></div>
      <div class="ta-mirror ta-probe" id="taProbe" aria-hidden="true"></div>
      <textarea class="post-textarea" id="postText" placeholder="What's on your mind?" oninput="onTextInput()" maxlength="2000"></textarea>
      <div class="mention-pop" id="mentionPop" role="listbox" aria-label="Mention suggestions" style="display:none"></div>
    </div>
    <div class="ta-row">
      <div class="ta-hist">
        <button type="button" class="ta-btn" id="undoBtn" aria-label="Undo" title="Undo" onmousedown="event.preventDefault()" onclick="undoText()" disabled>
          <svg viewBox="0 0 24 24"><polyline points="7 6 3 10 7 14"/><path d="M3 10h10a5 5 0 0 1 5 5v1a5 5 0 0 1-5 5H9"/></svg>
        </button>
        <button type="button" class="ta-btn" id="redoBtn" aria-label="Redo" title="Redo" onmousedown="event.preventDefault()" onclick="redoText()" disabled>
          <svg viewBox="0 0 24 24"><polyline points="17 6 21 10 17 14"/><path d="M21 10H11a5 5 0 0 0-5 5v1a5 5 0 0 0 5 5h4"/></svg>
        </button>
        <button type="button" class="ta-btn ta-at" id="atBtn" aria-label="Mention someone" title="Mention someone" onmousedown="event.preventDefault()" onclick="insertAtSymbol()">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-3.92 7.94"/></svg>
          <span class="ta-new" id="atNew">NEW</span>
        </button>
      </div>
      <div class="char-count" id="charCount">0 / 2000</div>
    </div>

    <div class="mention-intro" id="mentionIntro" role="button" tabindex="0" onmousedown="event.preventDefault()" onclick="insertAtSymbol()">
      <div class="mi-ico">@</div>
      <div class="mi-txt"><span class="mi-new">NEW</span><b>Mention your favorite creators</b><br>Tap here or type @ to tag someone.</div>
      <button type="button" class="mi-x" aria-label="Dismiss" onmousedown="event.preventDefault()" onclick="event.stopPropagation();dismissMentionIntro()">
        <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="pv" id="imgGrid" style="display:none"></div>
    <div class="video-tile" id="videoTile" style="display:none"></div>
    <div class="composer-media-hints" id="composerMediaHints">
      <button type="button" class="img-hint" id="imgHint" onclick="openImagePicker()">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        Add up to 5 photos
      </button>
      <button type="button" class="img-hint" id="videoHint" onclick="openVideoPicker()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
        Add a video
      </button>
    </div>

    <input type="file" id="fileInput" accept="image/*" multiple style="display:none">
    <input type="file" id="videoInput" accept="video/mp4,video/quicktime" style="display:none">
  </div>
</main>

<style>
  .composer-media-hints{display:flex;gap:10px}
  .composer-media-hints .img-hint{flex:1}
  .video-tile{position:relative;border-radius:14px;overflow:hidden;background:#0f0e17;margin:10px auto 0;width:max-content;max-width:100%}
  .video-tile img,.video-tile video{display:block;max-width:100%;max-height:300px;width:auto;height:auto}
  .video-tile .rm-btn{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;background:rgba(15,14,23,.65);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .video-tile .rm-btn svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2}
  .video-tile .vt-progress-wrap{position:absolute;left:0;right:0;bottom:0;background:rgba(15,14,23,.55);padding:10px 12px;display:flex;align-items:center;gap:10px}
  .video-tile .vt-progress-bar{flex:1;height:5px;border-radius:99px;background:rgba(255,255,255,.25);overflow:hidden}
  .video-tile .vt-progress-fill{height:100%;background:linear-gradient(135deg,#4f46e5,#06b6d4);width:0%;transition:width .15s}
  .video-tile .vt-progress-txt{color:#fff;font-size:12px;font-weight:700;min-width:34px;text-align:right}

/* ── @MENTIONS: coloured @handles while typing + Instagram/X-style suggestion list ── */
.ta-wrap{position:relative}
/* The textarea and its "mirror" must share identical text metrics or the colours drift out of line. */
.ta-mirror,.post-textarea{box-sizing:border-box;width:100%;margin:0;padding:2px;border:0;font-family:inherit;font-size:16px;line-height:1.55;letter-spacing:normal;word-spacing:normal;white-space:pre-wrap;overflow-wrap:break-word;word-wrap:break-word;word-break:normal;text-align:left}
.ta-mirror{display:none;position:absolute;left:0;top:0;right:0;bottom:0;overflow:hidden;pointer-events:none;color:var(--txt,#0f172a)}
.ta-wrap.mirror-on .ta-mirror{display:block}
.ta-wrap.mirror-on .ta-probe{visibility:hidden;bottom:auto}
.ta-wrap.mirror-on .post-textarea{display:block;position:relative;z-index:1;overflow:hidden;background:transparent;color:transparent;-webkit-text-fill-color:transparent;caret-color:var(--txt,#0f172a)}
.ta-wrap.mirror-on .post-textarea::placeholder{color:var(--mute,#94a3b8);-webkit-text-fill-color:var(--mute,#94a3b8)}
.ta-wrap.mirror-on .post-textarea::selection{background:rgba(79,70,229,.22)}
.ta-mirror .mn{color:#4f46e5}

.mention-pop{position:absolute;z-index:60;width:min(340px,100%);max-height:min(324px,42vh);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;background:#fff;border:1px solid #e8ecf3;border-radius:16px;box-shadow:0 14px 44px -10px rgba(15,23,42,.32);animation:mpop .14s ease-out}
.mention-pop.fixed{position:fixed;left:0;right:0;width:auto;border:none;border-top:1px solid #eef1f6;border-radius:20px 20px 0 0;box-shadow:0 -12px 32px -14px rgba(15,23,42,.28);padding-bottom:env(safe-area-inset-bottom,0px)}
@keyframes mpop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.mention-hint{padding:12px 16px 4px;font-size:12px;font-weight:800;letter-spacing:.4px;color:#94a3b8}
.mention-row{display:flex;align-items:center;gap:12px;padding:8px 16px;min-height:58px;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .1s}
.mention-row.active{background:#f4f6ff}
.mention-row:active{background:#e9edff}
.mention-av{width:42px;height:42px;border-radius:50%;flex-shrink:0;overflow:hidden;background:linear-gradient(135deg,#4f46e5,#06b6d4);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800}
.mention-av img{width:100%;height:100%;object-fit:cover;display:block}
.mention-txt{min-width:0;flex:1;display:flex;flex-direction:column;gap:1px}
.mention-name{font-size:15px;font-weight:800;color:#0f172a;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mention-user{font-size:14px;color:#64748b;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mention-flw{flex-shrink:0;font-size:12px;font-weight:700;color:#64748b;background:#f1f5f9;padding:4px 10px;border-radius:99px}
.mention-empty{padding:18px 16px;font-size:14px;color:#64748b;text-align:center}
@media (prefers-reduced-motion:reduce){.mention-pop{animation:none}}

/* ── "NEW: mention creators" intro + @ toolbar button ── */
.ta-at{position:relative}
.ta-new{display:none;position:absolute;top:-5px;right:-9px;background:linear-gradient(135deg,#4f46e5,#06b6d4);color:#fff;font-size:8.5px;font-weight:800;letter-spacing:.4px;padding:2px 5px;border-radius:99px;line-height:1.2;pointer-events:none;box-shadow:0 2px 6px -1px rgba(79,70,229,.5)}
.ta-at.fresh .ta-new{display:block;animation:atpulse 2s ease-in-out infinite}
.ta-at.fresh{color:var(--p)}
@keyframes atpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.mention-intro{display:none;align-items:center;gap:12px;margin:10px 0 12px;padding:11px 10px 11px 12px;border-radius:16px;background:linear-gradient(135deg,#eef2ff 0%,#ecfeff 100%);border:1px solid #dfe4fb;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .12s}
.mention-intro.show{display:flex;animation:mpop .25s ease-out}
.mention-intro:active{transform:scale(.99)}
.mi-ico{width:34px;height:34px;border-radius:50%;flex-shrink:0;background:linear-gradient(135deg,#4f46e5,#06b6d4);color:#fff;font-size:17px;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px -3px rgba(79,70,229,.5)}
.mi-txt{flex:1;min-width:0;font-size:12.5px;line-height:1.4;color:#475569}
.mi-txt b{font-size:13.5px;font-weight:800;color:#312e81}
.mi-new{display:inline-block;margin-right:7px;vertical-align:1px;background:#4f46e5;color:#fff;font-size:9px;font-weight:800;letter-spacing:.5px;padding:2px 6px;border-radius:99px}
.mi-x{flex-shrink:0;width:28px;height:28px;border:none;background:rgba(255,255,255,.7);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#64748b}
.mi-x svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}
@media (prefers-reduced-motion:reduce){.ta-at.fresh .ta-new,.mention-intro.show{animation:none}}
</style>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js';
import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js';
import { getFirestore, collection, doc, setDoc, getDoc, getDocs, query, where, orderBy, limit, serverTimestamp, enableNetwork, disableNetwork }
  from 'https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js';
import { createResilient } from '/resilient.js';
import { sendMentionNotifications } from '/notifications.js';

const fbApp = initializeApp({
  apiKey:"AIzaSyDTn70s1_uIiSOR6lPLY_nKh8Ff1FViFCs",
  authDomain:"mindshiftbooks-c4451.firebaseapp.com",
  projectId:"mindshiftbooks-c4451",
  storageBucket:"mindshiftbooks-c4451.firebasestorage.app",
  messagingSenderId:"388697987853",
  appId: "1:388697987853:web:f023df9412c22285012e44",
  measurementId: "G-CHPJDQ4W08"
});
const auth = getAuth(fbApp);
const db   = getFirestore(fbApp, 'default');
const { resilient, reconnectFirestore } = createResilient({ db, enableNetwork, disableNetwork });

let currentUser = null;
let userProfile = {};
// Each item: {url, uploading} — url filled in once /api/upload-image responds
let images = [];
const MAX_IMAGES = 5;

/* ── DRAFT STATE (logic lives in the DRAFTS block above SUBMIT) ── */
const DRAFT_KEY = 'mindshift_post_draft';
let _draftReady = false;      // true once the saved draft (if any) has been restored — autosave stays off until then
let _draftInitDone = false;   // initDraft() runs once, even if the auth listener fires again
let _lastDraftJson = '';      // what's currently saved, so unchanged state never re-saves
let _autosaveTimer = null, _autosaveFadeTimer = null;

/* ── VIDEO ──
   Per the video architecture spec: the file goes straight from this device
   to Cloudinary. Render only ever sees a small signing request — never the
   video bytes — so this never touches /api/upload-image's base64 pattern. */
let video = null; // {url, thumbnailUrl, duration, publicId, uploading, progress} | null
const VIDEO_MAX_BYTES = 200 * 1024 * 1024;   // 200MB — spec section 9
const VIDEO_MAX_DURATION = 5 * 60;           // 5 minutes — spec section 9

/* ── EDIT MODE ── /create-post?edit=<postId> loads the existing post instead
   of a blank composer, and submitPost() below updates that doc in place. */
const editId = new URLSearchParams(location.search).get('edit');
// Drafts are for NEW posts only — an edit already has its own saved copy in Firestore.
if(editId){ const _b = document.getElementById('saveDraftBtn'); if(_b) _b.style.display = 'none'; }

onAuthStateChanged(auth, async user => {
  currentUser = user;
  if(!user){ window.location.href = '/login'; return; }
  initDraft(); // instant + local — must not wait on the network profile read below
  try{
    const s = await resilient(()=>getDoc(doc(db,'users',user.uid)));
    userProfile = s.exists() ? s.data() : {};
    _profileLoaded = true;
  }catch(e){ console.warn('profile load failed:', e && e.code); } // submitPost() retries before publishing
  document.getElementById('composerName').textContent = userProfile.name || user.displayName || (user.email||'').split('@')[0] || 'You';
  const av = document.getElementById('composerAv');
  av.src = userProfile.photo || user.photoURL || '';
  av.onerror = () => { av.style.background = 'linear-gradient(135deg,#4f46e5,#06b6d4)'; };
  if(editId) loadPostForEdit(editId);
});

let _profileLoaded = false; // author name/photo/username for NEW posts — see submitPost()

// Editing an item that failed to load must NOT be saveable: the form would be
// blank and saving would overwrite the real content. Show why, with a retry.
function showEditLoadError(what, retryFn){
  let b = document.getElementById('editLoadBanner');
  if(!b){
    b = document.createElement('div');
    b.id = 'editLoadBanner';
    b.style.cssText = 'position:fixed;left:12px;right:12px;top:64px;z-index:400;background:#fff1f2;border:1.5px solid #fecdd3;color:#9f1239;border-radius:14px;padding:12px 14px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:10px;box-shadow:0 6px 24px rgba(0,0,0,.12)';
    document.body.appendChild(b);
  }
  b.innerHTML = `<span style="flex:1">Couldn't load your ${what}. Saving is disabled until it loads.</span><button style="background:#e11d48;color:#fff;border:none;padding:8px 14px;border-radius:99px;font-size:12.5px;font-weight:700;cursor:pointer">Try again</button>`;
  b.querySelector('button').onclick = retryFn;
}
function hideEditLoadError(){ const b = document.getElementById('editLoadBanner'); if(b) b.remove(); }
let _editRetryable = false; // true only after a network-type failure (not 'not found')
let _editLoaded = false; // stays false until the post really loaded — see submitPost()
async function loadPostForEdit(id){
  try{
    const snap = await resilient(()=>getDoc(doc(db,'posts',id)));
    if(!snap.exists()){ showToast('Post not found'); return; }
    const p = snap.data();
    if(p.authorUid !== currentUser.uid){ showToast("You can't edit this post"); location.href='/profile'; return; }
    document.getElementById('hdrTitle').textContent = 'Edit Post';
    document.getElementById('postBtn').textContent = 'Save';
    document.getElementById('postText').value = p.text||'';
    resetTextHistory();
    images = (p.images||[]).map(url=>({ url, uploading:false }));
    if(p.videoUrl){
      video = { url: p.videoUrl, thumbnailUrl: p.thumbnailUrl||'', duration: p.duration||0, publicId: p.cloudinaryPublicId||'', uploading:false };
    }
    onTextInput();
    renderImages();
    renderVideoTile();
    _editLoaded = true; _editRetryable = false;
    hideEditLoadError();
  }catch(e){
    console.error('loadPostForEdit failed:', e);
    _editRetryable = true;
    showEditLoadError('post', async ()=>{ await reconnectFirestore(); loadPostForEdit(id); });
  }
}
// Coming back to a long-idle tab / network back: retry a failed edit-load automatically.
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && editId && _editRetryable && !_editLoaded && currentUser) loadPostForEdit(editId); });
window.addEventListener('online', ()=>{ if(editId && _editRetryable && !_editLoaded && currentUser) loadPostForEdit(editId); });

/* ── UNDO / REDO (text) ──
   The browser's own undo is hidden on phones and gets wiped whenever the text is set from
   code (restoring a draft), so the composer keeps its own history: a snapshot of the text +
   caret after every pause in typing. */
const th = { stack:[], idx:-1, timer:null, restoring:false };
function _ta(){ return document.getElementById('postText'); }
function _thButtons(){
  const cur = th.stack[th.idx];
  const dirty = !!cur && _ta().value !== cur.v;
  document.getElementById('undoBtn').disabled = !(th.idx > 0 || dirty);
  document.getElementById('redoBtn').disabled = !(th.idx < th.stack.length - 1);
}
function thPush(){
  if(th.restoring) return;
  clearTimeout(th.timer); th.timer = null;
  const t = _ta(), cur = th.stack[th.idx];
  if(cur && cur.v === t.value){ cur.s = t.selectionStart; cur.e = t.selectionEnd; _thButtons(); return; }
  th.stack = th.stack.slice(0, th.idx + 1);
  th.stack.push({ v:t.value, s:t.selectionStart, e:t.selectionEnd });
  if(th.stack.length > 200) th.stack.shift();
  th.idx = th.stack.length - 1;
  _thButtons();
}
function resetTextHistory(){
  clearTimeout(th.timer); th.timer = null;
  const t = _ta();
  th.stack = [{ v:t.value, s:t.selectionStart, e:t.selectionEnd }];
  th.idx = 0;
  _thButtons();
}
function _thApply(s){
  const t = _ta();
  th.restoring = true;
  t.value = s.v;
  t.focus();
  try{ t.setSelectionRange(s.s, s.e); }catch{}
  t.dispatchEvent(new Event('input', { bubbles:true }));   // counter, Post button, autosave
  th.restoring = false;
  _thButtons();
}
window.undoText = function(){ thPush(); if(th.idx > 0){ th.idx--; _thApply(th.stack[th.idx]); } };
window.redoText = function(){ thPush(); if(th.idx < th.stack.length - 1){ th.idx++; _thApply(th.stack[th.idx]); } };
_ta().addEventListener('input', () => {
  if(th.restoring) return;
  clearTimeout(th.timer);
  th.timer = setTimeout(thPush, 450);   // one step per pause in typing
  _thButtons();
});
// Ctrl/Cmd+Z, the phone keyboard's undo/redo and shake-to-undo:
_ta().addEventListener('beforeinput', e => {
  if(e.inputType === 'historyUndo'){ e.preventDefault(); undoText(); }
  else if(e.inputType === 'historyRedo'){ e.preventDefault(); redoText(); }
});
resetTextHistory();

/* ── TEXT ── */
window.onTextInput = function(){
  const val = document.getElementById('postText').value;
  const cc = document.getElementById('charCount');
  cc.textContent = `${val.length} / 2000`;
  cc.classList.toggle('over', val.length > 2000);
  updatePostBtn();
};

function updatePostBtn(){
  const val = document.getElementById('postText').value.trim();
  const stillUploading = images.some(i => i.uploading) || (video && video.uploading);
  document.getElementById('postBtn').disabled = (!val && !images.length && !video) || stillUploading;
  scheduleAutosave(); // text, photo and video changes all pass through here
}

/* ── IMAGES ──
   Each item: { url, uploading, preview, orig, baseUrl, editState }
     url       = hosted URL that gets saved with the post
     preview   = local data URL shown instantly while/after uploading
     orig      = the untouched compressed original (fresh picks) — edits always start from this
     baseUrl   = the hosted URL of the untouched original, so "Original" filter + no crop
                 simply switches back to it with no re-upload
     editState = the editor's last settings, so reopening the pen keeps your edits */
const ICON_PEN = '<svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>';
const ICON_X   = '<svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';

async function uploadDataUrl(dataUrl){
  const token = await currentUser.getIdToken();
  const res = await fetch('/api/upload-image', {
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
    body: JSON.stringify({dataUrl})
  });
  const json = await res.json();
  if(!res.ok) throw new Error(json.error || 'Upload failed');
  if(window.MindshiftUploads) window.MindshiftUploads.remember(json.url, json.deleteToken);
  return json.url;
}
// Uploads from this session that nothing needs any more (replaced by an edit, removed, or the
// untouched original of an edited photo). They're only QUEUED here and actually deleted by
// flushDiscards() once it's certain nothing still points at them — after the draft has been
// re-saved without them, or after the post is published — so an unsaved draft can never end up
// with a broken picture. Anything not uploaded in this session has no token and is never touched.
const _pendingDiscards = new Set();
function discardUpload(url){ if(url) _pendingDiscards.add(url); }
function flushDiscards(published){
  if(!window.MindshiftUploads || !_pendingDiscards.size) return;
  const inUse = new Set();
  images.forEach(i => { if(i.url) inUse.add(i.url); if(!published && i.baseUrl) inUse.add(i.baseUrl); });
  Array.from(_pendingDiscards).forEach(u => {
    if(inUse.has(u)) return;                       // still referenced — keep it queued
    _pendingDiscards.delete(u);
    window.MindshiftUploads.discard(u, () => currentUser.getIdToken());
  });
}

document.getElementById('fileInput').addEventListener('change', async (e) => {
  const files = Array.from(e.target.files || []).slice(0, MAX_IMAGES - images.length);
  e.target.value = '';
  const uploads = [];
  for(const file of files){
    if(images.length >= MAX_IMAGES) break;
    const item = { url:'', uploading:true };   // referenced by object, not index, so removing photos mid-upload can't mix them up
    images.push(item);
    renderImages();
    try{
      // Resize/re-encode client-side (see image-compress.js) instead of a
      // hard 5MB reject — also normalizes odd source MIME types (e.g.
      // images saved out of ChatGPT) into a clean image/jpeg.
      const dataUrl = await window.MindshiftImage.compress(file);
      item.preview = dataUrl;   // show it immediately while the real upload happens
      item.orig = dataUrl;
      renderImages();
      // Upload runs in the background so the next photo can start compressing right away.
      uploads.push(uploadDataUrl(dataUrl).then(url => {
        item.url = url; item.baseUrl = url; item.uploading = false;
      }).catch(() => {
        showToast('Image upload failed — removed');
        const k = images.indexOf(item); if(k > -1) images.splice(k,1);
      }).then(renderImages));
    }catch(err){
      showToast('Image upload failed — removed');
      const k = images.indexOf(item); if(k > -1) images.splice(k,1);
      renderImages();
    }
  }
  await Promise.all(uploads);
});

window.openImagePicker = function(){
  if(video){ showToast('Remove the video first — one video or up to 5 photos, not both'); return; }
  if(images.length >= MAX_IMAGES){ showToast(`Max ${MAX_IMAGES} photos per post`); return; }
  document.getElementById('fileInput').click();
};

window.removeImage = function(idx){
  const [gone] = images.splice(idx,1);
  if(gone){ discardUpload(gone.url); if(gone.baseUrl !== gone.url) discardUpload(gone.baseUrl); }
  renderImages();
};

// The pen: opens the photo editor on the ORIGINAL, keeps the last settings, and
// only re-uploads if something actually changed.
window.editImage = async function(idx){
  const item = images[idx];
  if(!item || item.uploading) return;
  if(!window.MindshiftPhotoEditor){ showToast('Photo editor is not available right now'); return; }
  if(!item.baseUrl) item.baseUrl = item.url;   // photos loaded from an existing post/draft: their hosted copy is the original
  let res;
  try{
    res = await window.MindshiftPhotoEditor.open({ src: item.orig || item.baseUrl, state: item.editState });
  }catch(err){
    showToast("Couldn't open this photo for editing");
    return;
  }
  if(!res) return;                    // cancelled
  item.editState = res.state;
  if(!res.changed){                   // back to the untouched original — no upload needed
    if(item.url !== item.baseUrl){ const edited = item.url; item.url = item.baseUrl; item.preview = item.orig || ''; discardUpload(edited); }
    renderImages();
    return;
  }
  const prev = { url:item.url, preview:item.preview };
  item.preview = res.dataUrl;         // instant visual, real upload follows
  item.uploading = true;
  renderImages();
  try{
    item.url = await uploadDataUrl(res.dataUrl);
    if(prev.url && prev.url !== item.baseUrl) discardUpload(prev.url);   // the earlier edited copy is now unused (the original is kept for "revert")
  }catch(err){
    item.url = prev.url; item.preview = prev.preview;
    showToast("Couldn't save your edit — try again");
  }
  item.uploading = false;
  renderImages();
};

function pvButtons(i, item){
  return `<div class="pv-actions">` +
    (item.uploading ? '' : `<button type="button" class="pv-btn" aria-label="Edit photo" onclick="editImage(${i})">${ICON_PEN}</button>`) +
    `<button type="button" class="pv-btn" aria-label="Remove photo" onclick="removeImage(${i})">${ICON_X}</button>` +
  `</div>`;
}

// Same sizing rules as the feed's carousel (slides keep their own shape; nothing is cropped).
function layoutPvTrack(){
  const track = document.getElementById('pvTrack');
  if(!track) return;
  track.style.height = '';
  const baseH = track.clientHeight, maxAllowed = track.clientWidth * 0.82;
  let finalH = 0;
  images.forEach(it => {
    const a = it.aspect || 1;
    const h = (baseH * a) > maxAllowed ? (maxAllowed / a) : baseH;
    if(h > finalH) finalH = h;
  });
  if(finalH > 0 && finalH < baseH) track.style.height = finalH + 'px';
  Array.prototype.forEach.call(track.children, (slide, i) => {
    const a = (images[i] && images[i].aspect) || 1;
    const w = Math.min(finalH * a, maxAllowed);
    slide.style.width = w + 'px'; slide.style.flexBasis = w + 'px'; slide.style.height = finalH + 'px'; slide.style.alignSelf = 'flex-start';
  });
}
window.pvFit = function(img, i){
  const it = images[i]; if(!it || !img.naturalWidth || !img.naturalHeight) return;
  const a = img.naturalWidth / img.naturalHeight;
  if(it.aspect !== a){ it.aspect = a; layoutPvTrack(); }
};
window.onPvScroll = function(){
  const track = document.getElementById('pvTrack'), count = document.getElementById('pvCount');
  if(!track || !count) return;
  let idx = 0; const mid = track.scrollLeft + track.clientWidth/2;
  Array.prototype.forEach.call(track.children, (slide,i)=>{ if(slide.offsetLeft <= mid) idx = i; });
  count.textContent = `${idx+1}/${track.children.length}`;
};

function renderImages(){
  const grid = document.getElementById('imgGrid');
  const hint = document.getElementById('imgHint');
  const videoHint = document.getElementById('videoHint');
  if(!images.length){ grid.style.display='none'; grid.innerHTML=''; videoHint.style.display = video ? 'none' : ''; hint.style.display = video ? 'none' : 'flex'; updatePostBtn(); return; }
  grid.style.display = 'block';
  hint.style.display = 'none';
  videoHint.style.display = 'none'; // one video OR photos, not both
  const prevTrack = document.getElementById('pvTrack');
  const prevScroll = prevTrack ? prevTrack.scrollLeft : 0;   // keep your place in the strip when a photo finishes uploading
  const src = it => it.preview || it.url || '';
  let html;
  if(images.length === 1){
    const it = images[0];
    html = `<div class="pv-single"><div class="pv-box${it.uploading?' uploading':''}"><img src="${src(it)}" alt="">${pvButtons(0,it)}</div></div>`;
  }else{
    html = `<div class="pv-carousel"><div class="pv-track" id="pvTrack" onscroll="onPvScroll()">` +
      images.map((it,i)=>`<div class="pv-slide${it.uploading?' uploading':''}"><img src="${src(it)}" alt="" onload="pvFit(this,${i})">${pvButtons(i,it)}</div>`).join('') +
      `</div><div class="pv-count" id="pvCount">1/${images.length}</div></div>`;
  }
  if(images.length < MAX_IMAGES){
    html += `<button type="button" class="img-hint" onclick="openImagePicker()">
      <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Add photo (${images.length}/${MAX_IMAGES})</button>`;
  }
  grid.innerHTML = html;
  if(images.length > 1){
    layoutPvTrack();
    const t = document.getElementById('pvTrack');
    if(t && prevScroll){ t.scrollLeft = prevScroll; onPvScroll(); }
  }
  updatePostBtn();
}
// Show the "Add" hint from the start so a bare textarea isn't the only entry point.
renderImages();

/* ── VIDEO ── */
window.openVideoPicker = function(){
  if(images.length){ showToast('Remove your photos first — one video or up to 5 photos, not both'); return; }
  document.getElementById('videoInput').click();
};

window.removeVideo = function(){
  if(video && video.xhr) video.xhr.abort();
  video = null;
  renderVideoTile();
};

function renderVideoTile(){
  const tile = document.getElementById('videoTile');
  const imgHint = document.getElementById('imgHint');
  const videoHint = document.getElementById('videoHint');
  if(!video){ tile.style.display='none'; tile.innerHTML=''; imgHint.style.display = images.length?'none':'flex'; videoHint.style.display='flex'; updatePostBtn(); return; }
  imgHint.style.display='none';
  videoHint.style.display='none';
  tile.style.display='block';
  const pct = Math.round(video.progress||0);
  tile.innerHTML = `
    ${video.uploading
      ? `<img src="${video.preview||''}" alt="">`
      : `<video src="${video.url}" poster="${video.thumbnailUrl||''}" muted playsinline controls></video>`}
    <button type="button" class="rm-btn" onclick="removeVideo()">
      <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    ${video.uploading ? `
    <div class="vt-progress-wrap">
      <div class="vt-progress-bar"><div class="vt-progress-fill" style="width:${pct}%"></div></div>
      <div class="vt-progress-txt">${pct}%</div>
    </div>` : ''}
  `;
  updatePostBtn();
}

document.getElementById('videoInput').addEventListener('change', async (e) => {
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if(!file) return;
  if(!/^video\/(mp4|quicktime)$/.test(file.type)){ showToast('Please choose an MP4 (or MOV) video'); return; }
  if(file.size > VIDEO_MAX_BYTES){ showToast('Video must be under 200MB'); return; }

  // Read duration client-side before uploading anything — cheaper to reject
  // a too-long clip locally than after spending the upload.
  let duration = 0;
  try{
    duration = await new Promise((resolve, reject) => {
      const v = document.createElement('video');
      v.preload = 'metadata';
      v.onloadedmetadata = () => resolve(v.duration);
      v.onerror = () => reject(new Error('Could not read video'));
      v.src = URL.createObjectURL(file);
    });
  }catch{ showToast('Could not read that video file'); return; }
  if(duration > VIDEO_MAX_DURATION){ showToast('Video must be 5 minutes or under'); return; }

  video = { url:'', thumbnailUrl:'', duration: Math.round(duration), publicId:'', uploading:true, progress:0, preview: URL.createObjectURL(file) };
  renderVideoTile();

  try{
    const token = await currentUser.getIdToken();
    const sigRes = await fetch('/api/video/upload-signature', {
      method:'POST',
      headers:{'Authorization':'Bearer '+token}
    });
    const sig = await sigRes.json();
    if(!sigRes.ok || !sig.ok) throw new Error(sig.error || 'Could not start video upload');

    const form = new FormData();
    form.append('file', file);
    form.append('api_key', sig.apiKey);
    form.append('timestamp', sig.timestamp);
    form.append('folder', sig.folder);
    form.append('eager', sig.eager);
    form.append('signature', sig.signature);

    const result = await new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest();
      video.xhr = xhr;
      xhr.upload.onprogress = (evt) => {
        if(!evt.lengthComputable || !video) return;
        video.progress = (evt.loaded / evt.total) * 100;
        renderVideoTile();
      };
      xhr.onload = () => {
        if(xhr.status >= 200 && xhr.status < 300) resolve(JSON.parse(xhr.responseText));
        else reject(new Error('Cloudinary upload failed'));
      };
      xhr.onerror = () => reject(new Error('Network error during upload'));
      xhr.onabort = () => reject(new Error('aborted'));
      xhr.open('POST', `https://api.cloudinary.com/v1_1/${sig.cloudName}/video/upload`);
      xhr.send(form);
    });

    if(!video) return; // removed mid-upload
    video.url = result.secure_url;
    video.publicId = result.public_id;
    video.duration = Math.round(result.duration || duration);
    // eager[0] is the f_jpg,so_0 poster frame requested in the signature.
    video.thumbnailUrl = (result.eager && result.eager[0] && result.eager[0].secure_url)
      || result.secure_url.replace(/\.(mp4|mov)$/i, '.jpg');
    video.uploading = false;
    delete video.xhr;
    renderVideoTile();
  }catch(err){
    if(err.message !== 'aborted'){
      showToast('Video upload failed — try again');
      video = null;
      renderVideoTile();
    }
  }
});

/* ── DRAFTS ──
   Same idea as write.html: autosaves ~2.5s after you stop typing, plus a manual
   Save Draft button. Extras for posts: uploaded photos/video are kept (only the
   already-uploaded URLs — never an in-progress upload), the draft is tied to the
   signed-in account, and it's flushed the moment the tab is hidden so switching
   apps on a phone can't lose the last few words. */
function draftSnapshot(){
  const vid = (video && video.url && !video.uploading)
    ? { url: video.url, thumbnailUrl: video.thumbnailUrl || '', duration: video.duration || 0, publicId: video.publicId || '' }
    : null;
  return {
    uid: currentUser ? currentUser.uid : '',
    text: document.getElementById('postText').value,
    images: images.filter(i => i.url && !i.uploading).map(i => i.url),
    video: vid
  };
}
function draftIsEmpty(d){ return !d.text.trim() && !d.images.length && !d.video; }

function clearDraft(){
  try{ localStorage.removeItem(DRAFT_KEY); }catch(e){}
  _lastDraftJson = JSON.stringify(draftSnapshot());
  flushDiscards();
}

window.saveDraft = function(silent = false){
  if(editId || !currentUser || !_draftReady) return;
  const d = draftSnapshot();
  if(draftIsEmpty(d)){
    // Composer was emptied out — don't keep an empty draft around.
    clearDraft();
    if(!silent) showToast('Nothing to save yet');
    return;
  }
  try{
    localStorage.setItem(DRAFT_KEY, JSON.stringify({ ...d, saved: Date.now() }));
    _lastDraftJson = JSON.stringify(d);
    flushDiscards();   // the saved draft no longer points at anything queued for deletion
  }catch(e){
    // Private mode / storage full — say so on a manual save, stay quiet on autosave.
    if(!silent) showToast("Couldn't save draft on this device");
    return;
  }
  if(silent){
    const el = document.getElementById('autosaveStatus');
    el.textContent = 'Saved just now';
    el.classList.add('show');
    clearTimeout(_autosaveFadeTimer);
    _autosaveFadeTimer = setTimeout(() => el.classList.remove('show'), 2500);
  } else {
    showToast('Draft saved ✓');
  }
};

function scheduleAutosave(){
  if(!_draftReady || editId || !currentUser) return;
  // Only when something actually changed — upload-progress redraws etc. don't count.
  if(JSON.stringify(draftSnapshot()) === _lastDraftJson) return;
  const el = document.getElementById('autosaveStatus');
  el.textContent = 'Saving…';
  el.classList.add('show');
  clearTimeout(_autosaveTimer);
  _autosaveTimer = setTimeout(() => saveDraft(true), 2500);
}

function flushDraft(){
  if(!_draftReady || editId || !currentUser) return;
  clearTimeout(_autosaveTimer);
  if(JSON.stringify(draftSnapshot()) !== _lastDraftJson) saveDraft(true);
}
document.addEventListener('visibilitychange', () => { if(document.hidden) flushDraft(); });
window.addEventListener('pagehide', flushDraft);

function initDraft(){
  if(_draftInitDone) return;
  _draftInitDone = true;
  if(editId) return; // edit mode: no drafts
  let restored = false;
  try{
    const d = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null');
    // Ignore a draft that belongs to a different account on this device.
    if(d && (!d.uid || d.uid === currentUser.uid) && ((d.text || '').trim() || (d.images || []).length || d.video)){
      document.getElementById('postText').value = d.text || '';
      resetTextHistory();
      if(d.video && d.video.url){
        // one video OR photos, never both
        video = { url: d.video.url, thumbnailUrl: d.video.thumbnailUrl || '', duration: d.video.duration || 0, publicId: d.video.publicId || '', uploading: false };
        images = [];
      } else {
        images = (d.images || []).slice(0, MAX_IMAGES).map(url => ({ url, uploading: false }));
      }
      onTextInput();
      renderImages();
      renderVideoTile();
      restored = true;
    }
  }catch(e){ console.warn('draft restore failed:', e && e.message); }
  _draftReady = true;
  _lastDraftJson = JSON.stringify(draftSnapshot());
  if(restored) showToast('Draft restored');
}

/* ── @MENTIONS ──
   Type @ and a few letters → matching usernames appear (people you follow first); tap one and it
   fills in. While typing, @handles are drawn in colour via a "mirror" layer behind the (transparent-text)
   textarea. On publish every @handle is verified against usernames/{handle} and saved on the post as
   mentions:[{uid,username}] — only those become clickable links where the post is shown. */
const MENTION_MAX = 10;
const mentionMap = new Map();            // username -> uid, for handles picked from the list
const _mentionCache = new Map();         // query -> results
let _mentionFollowing = null, _followingIds = new Set();   // "people you follow" (cached)
let _mentionSeq = 0, _mentionTimer = null, _mentionList = [], _mentionActive = 0, _mentionRange = null;

/* mirror layer: same text, but @handles wrapped in a coloured span */
function _escHtml(x){ return x.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function mirrorHtml(text){
  // colour from the first letter typed (X style); only 3+ char handles can actually be saved as mentions
  return _escHtml(text).replace(/(^|[^a-z0-9_])@([a-z0-9_]{1,20})(?![a-z0-9_])/gi, (all, pre, h) => pre + '<span class="mn">@' + h + '</span>')
    + (text.endsWith('\n') ? ' ' : '');   // trailing newline needs a spacer line, like a textarea
}
function syncMirror(){
  const t = _ta(), wrap = document.getElementById('taWrap');
  if(!wrap) return;
  wrap.classList.add('mirror-on');
  // auto-grow (so the mirror never needs its own scrolling): one line more than the content, min 120px
  t.style.height = 'auto';
  t.style.height = Math.max(120, t.scrollHeight) + 'px';
  document.getElementById('taMirror').innerHTML = mirrorHtml(t.value);
}
{ // keep the mirror in step with every path that changes the text (typing, draft restore, undo, edit-load)
  const prev = window.onTextInput;
  window.onTextInput = function(){ prev && prev(); syncMirror(); };
  window.addEventListener('resize', syncMirror);
  syncMirror();
}

function mentionPop(){ return document.getElementById('mentionPop'); }
function hideMentionPop(){
  const pop = mentionPop(); if(!pop) return;
  pop.style.display = 'none'; pop.innerHTML = ''; _mentionList = []; _mentionRange = null; _mentionSeq++;
}
// Caret position inside the text box, measured on the hidden probe layer.
function caretXY(pos){
  const probe = document.getElementById('taProbe'), t = _ta();
  probe.style.height = 'auto';
  probe.innerHTML = _escHtml(t.value.slice(0, pos)) + '<span id="mProbeMark">\u200b</span>';
  const m = document.getElementById('mProbeMark');
  return { x: m.offsetLeft, y: m.offsetTop };
}
// Phones: docked right above the keyboard (Instagram style). Desktop: floats under the caret (X style).
function placeMentionPop(){
  const pop = mentionPop(), wrap = document.getElementById('taWrap');
  if(!pop || pop.style.display === 'none') return;
  const vv = window.visualViewport;
  if(matchMedia('(pointer:coarse)').matches && vv){
    pop.classList.add('fixed');
    pop.style.top = ''; pop.style.left = '';
    pop.style.bottom = Math.max(0, window.innerHeight - (vv.height + vv.offsetTop)) + 'px';
  } else {
    pop.classList.remove('fixed');
    pop.style.bottom = '';
    const c = caretXY(_mentionRange ? _mentionRange.start : _ta().selectionStart);
    const w = pop.offsetWidth || 340;
    pop.style.left = Math.max(0, Math.min(c.x, wrap.clientWidth - w)) + 'px';
    pop.style.top = (c.y + 30) + 'px';
  }
}
if(window.visualViewport){
  visualViewport.addEventListener('resize', placeMentionPop);
  visualViewport.addEventListener('scroll', placeMentionPop);
}

// Finds "@partial" ending exactly at the caret.
function currentMentionTrigger(){
  const t = _ta();
  if(t.selectionStart !== t.selectionEnd) return null;
  const caret = t.selectionStart;
  const m = /(^|[\s(])@([a-z0-9_]{0,20})$/i.exec(t.value.slice(0, caret));
  if(!m) return null;
  const q = m[2].toLowerCase();
  return { q, start: caret - q.length - 1, end: caret };
}

function renderMentionPop(items, hint, emptyFor, emptyMsg){
  const pop = mentionPop();
  pop.innerHTML = '';
  if(!items.length){
    if(!emptyFor && !emptyMsg){ hideMentionPop(); return; }
    _mentionList = [];
    const e = document.createElement('div'); e.className = 'mention-empty'; e.textContent = emptyMsg || ('No one found for “@' + emptyFor + '”');
    pop.appendChild(e); pop.style.display = 'block'; placeMentionPop();
    return;
  }
  _mentionList = items; _mentionActive = 0;
  if(hint){ const h = document.createElement('div'); h.className = 'mention-hint'; h.textContent = hint; pop.appendChild(h); }
  items.forEach((u, i) => {
    const row = document.createElement('div');
    row.className = 'mention-row' + (i === 0 ? ' active' : '');
    row.setAttribute('role', 'option');
    const av = document.createElement('div'); av.className = 'mention-av';
    const initial = (u.name || u.username || '?').charAt(0).toUpperCase();
    if(u.photo){ const im = document.createElement('img'); im.src = u.photo; im.alt = ''; im.onerror = () => { im.remove(); av.textContent = initial; }; av.appendChild(im); }
    else av.textContent = initial;
    const tx = document.createElement('div'); tx.className = 'mention-txt';
    const nm = document.createElement('span'); nm.className = 'mention-name'; nm.textContent = u.name || u.username;
    const un = document.createElement('span'); un.className = 'mention-user'; un.textContent = '@' + u.username;
    tx.appendChild(nm); tx.appendChild(un); row.appendChild(av); row.appendChild(tx);
    if(u.following){ const f = document.createElement('span'); f.className = 'mention-flw'; f.textContent = 'Following'; row.appendChild(f); }
    // pointerdown + preventDefault: picking must not blur the textarea (that would close the keyboard)
    row.addEventListener('pointerdown', e => { e.preventDefault(); pickMention(i); });
    pop.appendChild(row);
  });
  pop.style.display = 'block';
  placeMentionPop();
}

function userToItem(id, d){ return { uid:id, username:(d.username||'').toLowerCase(), name:d.name||d.displayName||'', photo:d.photo||d.photoURL||'', following:_followingIds.has(id) }; }

async function followingForMentions(){
  if(_mentionFollowing) return _mentionFollowing;
  if(!currentUser) return [];
  const fs = await resilient(() => getDocs(query(collection(db,'follows'), where('followerId','==',currentUser.uid), limit(8))), { tries:1, timeoutMs:6000 });
  const ids = fs.docs.map(d => d.data().followingId);
  ids.forEach(id => _followingIds.add(id));
  const docs = await Promise.all(ids.map(id => getDoc(doc(db,'users',id)).catch(() => null)));
  _mentionFollowing = docs.filter(x => x && x.exists() && x.data().username).map(x => userToItem(x.id, x.data()));
  return _mentionFollowing;
}
async function searchMentionUsers(q){
  if(_mentionCache.has(q)) return _mentionCache.get(q);
  const [snap] = await Promise.all([
    resilient(() => getDocs(query(collection(db,'users'), where('username','>=',q), where('username','<=',q+'\uf8ff'), orderBy('username'), limit(8))), { tries:1, timeoutMs:6000 }),
    followingForMentions().catch(() => null)    // so people you follow can be tagged + ranked first
  ]);
  let out = snap.docs.filter(d => d.id !== (currentUser && currentUser.uid) && d.data().username).map(d => userToItem(d.id, d.data()));
  out = out.filter(u => u.following).concat(out.filter(u => !u.following)).slice(0, 6);
  _mentionCache.set(q, out);
  return out;
}

function updateMentionPop(){
  const trig = currentMentionTrigger();
  if(!trig){ hideMentionPop(); return; }
  _mentionRange = trig;
  const seq = ++_mentionSeq;
  clearTimeout(_mentionTimer);
  _mentionTimer = setTimeout(async () => {
    try{
      if(trig.q === ''){
        const items = await followingForMentions();
        if(seq !== _mentionSeq) return;
        if(!items.length){ renderMentionPop([], '', '', 'Type a name to find someone to mention'); return; }
        renderMentionPop(items, 'People you follow');
      } else {
        const items = await searchMentionUsers(trig.q);
        if(seq !== _mentionSeq) return;                 // typing moved on — drop stale results
        renderMentionPop(items, '', trig.q.length >= 2 ? trig.q : '');
      }
    }catch(e){ if(seq === _mentionSeq) hideMentionPop(); }
  }, trig.q === '' ? 0 : 140);
}

function pickMention(i){
  const u = _mentionList[i], r = _mentionRange, t = _ta();
  if(!u || !r) return;
  const ins = '@' + u.username + ' ';
  const next = t.value.slice(0, r.start) + ins + t.value.slice(r.end);
  if(next.length > 2000){ showToast('Post is at the character limit'); hideMentionPop(); return; }
  t.value = next;
  const pos = r.start + ins.length;
  try{ t.setSelectionRange(pos, pos); }catch{}
  mentionMap.set(u.username, u.uid);
  markMentionIntroSeen();
  hideMentionPop();
  t.focus();
  t.dispatchEvent(new Event('input', { bubbles:true }));   // counter, Post button, autosave, undo history, colour
}

(function wireMentions(){
  const t = _ta();
  t.addEventListener('input', updateMentionPop);
  t.addEventListener('click', updateMentionPop);
  t.addEventListener('keyup', e => { if(!['ArrowDown','ArrowUp','Enter','Tab','Escape'].includes(e.key)) updateMentionPop(); });
  t.addEventListener('blur', () => setTimeout(hideMentionPop, 180));
  t.addEventListener('keydown', e => {
    const pop = mentionPop();
    if(!pop || pop.style.display === 'none' || !_mentionList.length) return;
    const rows = () => pop.querySelectorAll('.mention-row');
    const setActive = n => {
      _mentionActive = (n + _mentionList.length) % _mentionList.length;
      rows().forEach((r, k) => r.classList.toggle('active', k === _mentionActive));
      const cur = rows()[_mentionActive]; if(cur && cur.scrollIntoView) cur.scrollIntoView({ block:'nearest' });
    };
    if(e.key === 'ArrowDown'){ e.preventDefault(); setActive(_mentionActive + 1); }
    else if(e.key === 'ArrowUp'){ e.preventDefault(); setActive(_mentionActive - 1); }
    else if(e.key === 'Enter' || e.key === 'Tab'){ e.preventDefault(); pickMention(_mentionActive); }
    else if(e.key === 'Escape'){ e.preventDefault(); hideMentionPop(); }
  });
})();

/* ── "NEW: mention creators" intro ──
   Shown until the person uses mentions once (or dismisses it); remembered in localStorage. */
const MENTION_INTRO_KEY = 'msb_mention_intro_v1';
function _mentionIntroSeen(){ try{ return !!localStorage.getItem(MENTION_INTRO_KEY); }catch(e){ return false; } }
function markMentionIntroSeen(){
  try{ localStorage.setItem(MENTION_INTRO_KEY, '1'); }catch(e){}
  const box = document.getElementById('mentionIntro'); if(box) box.classList.remove('show');
  const btn = document.getElementById('atBtn'); if(btn) btn.classList.remove('fresh');
}
window.dismissMentionIntro = markMentionIntroSeen;
if(!_mentionIntroSeen()){
  document.getElementById('mentionIntro').classList.add('show');
  document.getElementById('atBtn').classList.add('fresh');
}
// Tapping the @ button (or the intro card) types an "@" at the cursor and opens the suggestions.
window.insertAtSymbol = function(){
  const t = _ta();
  t.focus();
  const end = t.selectionEnd == null ? t.value.length : t.selectionEnd;
  const before = t.value.slice(0, end), after = t.value.slice(end);
  const ins = (before && !/\s$/.test(before) ? ' ' : '') + '@';   // a mention needs a space (or start) before it
  if(t.value.length + ins.length > 2000){ showToast('Post is at the character limit'); return; }
  t.value = before + ins + after;
  const pos = end + ins.length;
  try{ t.setSelectionRange(pos, pos); }catch{}
  markMentionIntroSeen();
  t.dispatchEvent(new Event('input', { bubbles:true }));   // colour, counter, autosave, and it opens the list
};

// Tell each mentioned person. Waits briefly (max 4s) so the request isn't cut off by the redirect,
// but a slow/failed notification never blocks or fails the post itself.
async function notifyMentioned(mentions, targetId, text){
  if(!mentions.length) return;
  try{
    await Promise.race([
      sendMentionNotifications({ db, fs:{ doc, getDoc, setDoc, serverTimestamp }, currentUser, profile:userProfile, mentions, targetId, targetType:'post', snippet:text }),
      new Promise(r => setTimeout(r, 4000))
    ]);
  }catch(e){ console.warn('mention notify failed:', e); }
}

// Publish-time: turn every @handle in the text into a verified {uid, username}. Handles picked from
// the list are already known; typed-by-hand ones are looked up in usernames/{handle}. Unknown ones are ignored.
async function resolveMentions(text){
  const seen = new Set(), handles = [];
  const re = /(^|[^a-z0-9_])@([a-z0-9_]{3,20})(?![a-z0-9_])/gi;
  let m;
  while((m = re.exec(text)) && handles.length < MENTION_MAX){
    const h = m[2].toLowerCase();
    if(!seen.has(h)){ seen.add(h); handles.push(h); }
  }
  const out = await Promise.all(handles.map(async h => {
    try{
      let uid = mentionMap.get(h);
      if(!uid){ const s = await resilient(() => getDoc(doc(db,'usernames',h)), { tries:1, timeoutMs:5000 }); uid = s.exists() ? s.data().uid : null; }
      return (uid && uid !== (currentUser && currentUser.uid)) ? { uid, username: h } : null;
    }catch(e){ return null; }
  }));
  return out.filter(Boolean);
}

/* ── SUBMIT ── */
window.submitPost = async function(){
  if(!currentUser) return;
  if(editId && !_editLoaded){ showToast("Your post hasn't loaded yet — tap Try again"); return; }
  const text = document.getElementById('postText').value.trim();
  const urls = images.filter(i=>i.url).map(i=>i.url);
  const hasVideo = !!(video && video.url && !video.uploading);
  if(!text && !urls.length && !hasVideo){ showToast('Write something, add a photo, or add a video first'); return; }

  const btn = document.getElementById('postBtn');
  btn.disabled = true;
  btn.textContent = editId ? 'Saving…' : 'Posting…';
  let mentions = [];
  try{ mentions = await resolveMentions(text); }catch(e){ mentions = []; }

  // videoFields per the Firebase/Firestore data model in the video spec —
  // Firebase stores the reference (URL/duration/publicId), never the binary.
  const videoFields = hasVideo ? {
    type: 'video',
    videoUrl: video.url,
    thumbnailUrl: video.thumbnailUrl,
    duration: video.duration,
    cloudinaryPublicId: video.publicId
  } : { type: 'text', videoUrl: '', thumbnailUrl: '', duration: 0, cloudinaryPublicId: '' };

  try{
    if(editId){
      // Editing an existing post — update in place, keep id/author/dates and
      // any commentsOff/hideLikeCount settings untouched.
      await setDoc(doc(db,'posts',editId),{
        text, mentions, images: urls, ...videoFields,
        updatedAt: serverTimestamp()
      }, { merge: true });
      await notifyMentioned(mentions, editId, text);
      images.forEach(i => { if(i.baseUrl && i.baseUrl !== i.url) discardUpload(i.baseUrl); });
      flushDiscards(true);
      showToast('Post updated');
      setTimeout(()=>{ location.href = `/post-read?id=${editId}`; }, 700);
      return;
    }
    // New post: make sure the author's profile really loaded — otherwise the
    // post would be saved with no username/photo (broken author links).
    if(!_profileLoaded){
      const s = await resilient(()=>getDoc(doc(db,'users',currentUser.uid)));
      userProfile = s.exists() ? s.data() : {};
      _profileLoaded = true;
    }
    const id = `post_${currentUser.uid}_${Date.now()}`;
    await setDoc(doc(db,'posts',id),{
      id, authorUid: currentUser.uid,
      authorName: userProfile.name || currentUser.displayName || (currentUser.email||'').split('@')[0] || 'MindShift Books User',
      authorPhoto: userProfile.photo || currentUser.photoURL || '',
      authorUsername: userProfile.username || '',
      text, mentions, images: urls, ...videoFields,
      status: 'published',
      likeCount: 0, commentCount: 0, saveCount: 0,
      createdAt: serverTimestamp(),
      publishedAt: serverTimestamp()
    });
    await notifyMentioned(mentions, id, text);
    // Published — the draft has served its purpose. Stop autosave first so a
    // pending timer can't write it straight back.
    clearTimeout(_autosaveTimer);
    _draftReady = false;
    try{ localStorage.removeItem(DRAFT_KEY); }catch(e){}
    // Published: for photos that were edited, the untouched original upload is no longer needed.
    images.forEach(i => { if(i.baseUrl && i.baseUrl !== i.url) discardUpload(i.baseUrl); });
    flushDiscards(true);
    document.getElementById('successOverlay').classList.add('show');
  }catch(e){
    console.error(e);
    showToast((editId?'Update':'Post')+' failed — try again');
    btn.disabled = false;
    btn.textContent = editId ? 'Save' : 'Post';
  }
};

/* ── TOAST ── */
window.showToast = function(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('on');
  setTimeout(()=>t.classList.remove('on'),2800);
};
</script>
