<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" href="/MINDSHIFT.jpg">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Manage Comments · MindShift Books</title>
<meta name="robots" content="noindex, nofollow"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --p:#6366f1;--p2:#06b6d4;--p3:#8b5cf6;
  --g:linear-gradient(135deg,#6366f1 0%,#8b5cf6 55%,#06b6d4 100%);
  --txt:#0f172a;--sub:#64748b;--mute:#94a3b8;
  --bg:#f4f4fb;--card:#fff;--border2:#edeef5;
  --green:#10b981;--red:#ef4444;--amber:#f59e0b;--radius:20px;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 10px 28px -12px rgba(76,60,190,.16);
  --shadow-sm:0 1px 2px rgba(15,23,42,.04),0 4px 14px -6px rgba(15,23,42,.08);
}
body{font-family:'Segoe UI',system-ui,sans-serif;color:var(--txt);min-height:100vh;
  background:radial-gradient(circle at 12% 0%, rgba(99,102,241,.10), transparent 42%),
    radial-gradient(circle at 88% 6%, rgba(6,182,212,.08), transparent 46%),var(--bg);
  background-attachment:fixed}
button{font-family:inherit}

.hdr{position:sticky;top:0;z-index:100;background:rgba(248,247,255,.92);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border2);padding:0 16px;height:56px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.hbtn{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--border2);background:var(--card);
  display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--txt);flex-shrink:0}
.hbtn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.hbtn.spin svg{animation:spin .8s linear infinite}
.hbtn.primary{background:var(--p);border-color:var(--p);color:#fff}
@keyframes spin{to{transform:rotate(360deg)}}
.hdr-title{font-size:15px;font-weight:800;flex:1;text-align:center}

.preview{margin:16px;border-radius:16px;background:var(--card);box-shadow:var(--shadow-sm);padding:13px 15px;cursor:pointer}
.preview-title{font-weight:800;font-size:13.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.preview-meta{font-size:11.5px;color:var(--mute);font-weight:600;margin-top:4px}

.pills{display:flex;gap:8px;padding:0 16px 12px;overflow-x:auto}
.pill{padding:7px 15px;border-radius:99px;border:1.5px solid var(--border2);background:var(--card);
  font-size:12.5px;font-weight:700;color:var(--sub);cursor:pointer;white-space:nowrap}
.pill.active{background:var(--txt);color:#fff;border-color:var(--txt)}

.list{padding:0 16px}
.cm{background:var(--card);border-radius:18px;box-shadow:var(--shadow-sm);padding:14px;margin-bottom:12px}
.cm.hidden-c{background:#fafaff;border:1.5px dashed #c7d2fe}
.cm.busy{opacity:.45;pointer-events:none}
.cm-top{display:flex;gap:10px;align-items:flex-start}
.av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#e0e7ff,#c7d2fe);color:var(--p);
  font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}
.av img{width:100%;height:100%;object-fit:cover}
.cm-body{flex:1;min-width:0}
.cm-name{font-size:13px;font-weight:800}
.cm-time{font-size:11.5px;color:var(--mute);font-weight:600;margin-left:6px}
.badge{display:inline-block;font-size:10px;font-weight:800;padding:2px 7px;border-radius:99px;margin-left:6px;vertical-align:middle}
.badge.h{background:#e0e7ff;color:#4338ca}
.badge.m{background:#dcfce7;color:#15803d}
.cm-text{font-size:13.5px;line-height:1.5;margin-top:4px;white-space:pre-wrap;word-break:break-word}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}
.act{padding:6px 12px;border-radius:99px;border:1.5px solid var(--border2);background:#fff;font-size:12px;font-weight:700;color:var(--sub);cursor:pointer}
.act.danger{color:var(--red)}
.act.primary{color:var(--p);border-color:#c7d2fe}
.act.pinned{color:var(--amber);border-color:#fde68a;background:#fffbeb}
.act.liked{color:var(--red);border-color:#fecaca;background:#fef2f2}
.badge.pin{background:#fef3c7;color:#b45309}
.pinned-card{margin:0 16px 12px;border-radius:16px;background:#fffbeb;border:1.5px solid #fde68a;padding:12px 14px;cursor:pointer}
.pinned-card-lbl{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:800;color:#b45309;margin-bottom:4px}
.pinned-card-txt{font-size:13px;color:var(--txt);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cm.sel-mode .cm-top{padding-left:0}
.sel-box{width:20px;height:20px;border-radius:6px;border:2px solid var(--border2);flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-top:6px;cursor:pointer}
.sel-box.on{background:var(--p);border-color:var(--p)}
.sel-box svg{width:13px;height:13px;stroke:#fff;stroke-width:3;fill:none;display:none}
.sel-box.on svg{display:block}
.bulk-bar{position:fixed;left:0;right:0;bottom:0;background:#0f172a;padding:12px 16px;display:none;
  align-items:center;gap:10px;z-index:200;padding-bottom:calc(12px + env(safe-area-inset-bottom))}
.bulk-bar.on{display:flex}
.bulk-count{color:#fff;font-size:13px;font-weight:700;flex:1}
.bulk-btn{padding:9px 16px;border-radius:99px;border:none;font-size:12.5px;font-weight:800;cursor:pointer}
.bulk-btn.hide{background:#334155;color:#fff}
.bulk-btn.del{background:var(--red);color:#fff}
.bulk-btn.cancel{background:transparent;color:#94a3b8}
.replies{margin:10px 0 0 44px;border-left:2px solid var(--border2);padding-left:12px}
.rp{padding:9px 0;border-bottom:1px solid var(--border2)}
.rp:last-child{border-bottom:none}
.rp.hidden-c .cm-text{opacity:.6}
.ri-row{display:none;gap:8px;margin-top:10px;align-items:flex-end}
.ri-row.on{display:flex}
.ri{flex:1;border:1.5px solid var(--border2);border-radius:14px;padding:9px 12px;font:inherit;font-size:13.5px;resize:none;outline:none;min-height:40px;max-height:120px}
.ri:focus{border-color:var(--p)}
.ri-send{padding:9px 15px;border-radius:99px;border:none;background:var(--g);color:#fff;font-weight:800;font-size:12.5px;cursor:pointer}
.ri-send:disabled{opacity:.45}

.more{display:block;margin:6px auto 0;padding:11px 26px;border-radius:99px;border:1.5px solid var(--border2);background:var(--card);font-weight:800;font-size:13px;color:var(--p);cursor:pointer}
.note{text-align:center;font-size:12px;color:var(--mute);padding:12px 24px 0}
.empty{text-align:center;padding:50px 24px;color:var(--mute);font-size:13.5px;line-height:1.6}
.empty strong{display:block;font-size:15px;color:var(--txt);margin-bottom:6px}
.empty button{margin-top:14px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:#0f172a;color:#fff;padding:10px 18px;border-radius:99px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:all .25s;z-index:300}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.skel{background:linear-gradient(90deg,#f0f0f0 25%,#e0e0e0 50%,#f0f0f0 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:14px;height:96px;margin-bottom:12px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
</style>
</head>
<body>

<header class="hdr">
  <button class="hbtn" onclick="history.back()" aria-label="Back">
    <svg viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg>
  </button>
  <div class="hdr-title">Manage Comments</div>
  <button class="hbtn" id="selectBtn" aria-label="Select" onclick="toggleSelectMode()" style="display:none">
    <svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
  </button>
  <button class="hbtn" id="refreshBtn" aria-label="Refresh" onclick="refreshNew()">
    <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 11-3-6.7"/><polyline points="21 3 21 9 15 9"/></svg>
  </button>
</header>

<div class="preview" id="preview" style="display:none"></div>
<div class="pinned-card" id="pinnedCard" style="display:none"></div>
<div class="pills" id="pills" style="display:none">
  <button class="pill active" data-f="all" onclick="setFilter('all')">All</button>
  <button class="pill" data-f="unreplied" onclick="setFilter('unreplied')">Unreplied</button>
  <button class="pill" data-f="liked" onclick="setFilter('liked')">Most liked</button>
  <button class="pill" data-f="hidden" onclick="setFilter('hidden')">Hidden</button>
</div>
<div class="list" id="list"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
<div id="moreWrap"></div>
<div class="note" id="note"></div>
<div style="height:80px"></div>
<div class="toast" id="toast"></div>
<div class="bulk-bar" id="bulkBar">
  <div class="bulk-count" id="bulkCount">0 selected</div>
  <button class="bulk-btn hide" onclick="bulkHide()">Hide</button>
  <button class="bulk-btn del" onclick="bulkDelete()">Delete</button>
  <button class="bulk-btn cancel" onclick="toggleSelectMode()">Cancel</button>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js';
import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js';
import { getFirestore, doc, getDoc, updateDoc, deleteDoc, setDoc, increment, collection, query, where, orderBy,
         limit, startAfter, addDoc, serverTimestamp, getDocs, Timestamp, writeBatch, enableNetwork, disableNetwork }
  from 'https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js';
import { createResilient, isTransient } from '/resilient.js';

const fbApp = initializeApp({
  apiKey:"AIzaSyDTn70s1_uIiSOR6lPLY_nKh8Ff1FViFCs",
  authDomain:"mindshiftbooks-c4451.firebaseapp.com",
  projectId:"mindshiftbooks-c4451",
  storageBucket:"mindshiftbooks-c4451.firebasestorage.app",
  messagingSenderId:"388697987853",
  appId:"1:388697987853:web:f023df9412c22285012e44",
  measurementId:"G-CHPJDQ4W08"
});
const auth = getAuth(fbApp);
const db   = getFirestore(fbApp, 'default');
const { resilient, reconnectFirestore } = createResilient({ db, enableNetwork, disableNetwork });

/* ── Which content this page manages (same params as content-insights) ── */
const params  = new URLSearchParams(location.search);
const contentId = params.get('id');
const isPost  = params.get('type') !== 'article';
const idField = isPost ? 'postId' : 'articleId';
const contentCol = isPost ? 'posts' : 'articles';
const metaCol = isPost ? 'postMeta' : 'articleMeta';
const readHref = isPost ? `/post-read?id=${contentId}` : `/article-read?id=${contentId}`;

const PAGE = 15;               // top-level comments per fetch
const CACHE_TTL = 10 * 60e3;   // session cache lifetime
const CACHE_KEY = `cm_${isPost ? 'p' : 'a'}_${contentId}`;

let me = null, myProfile = null, content = null;
let pinnedId = null, pinnedSnapshot = null;   // pinnedSnapshot: cached {text,authorName} for instant paint
let selectMode = false;
let selected = new Set();
let items = [];                // top-level comments loaded so far (newest → oldest), plain objects
let replies = {};              // parentId -> array of replies (fetched once per expand)
let openReplies = new Set();
// Cursors are kept as full {seconds,nanoseconds} pairs, not millisecond numbers.
// A millisecond-only cursor throws away Firestore's sub-millisecond precision,
// so startAfter(Timestamp.fromMillis(x)) can land BEFORE the actual last-read
// document if that document's real timestamp had a nonzero microsecond
// remainder — which re-fetches that same document on the next page/refresh.
// Storing the exact {seconds,nanoseconds} and rebuilding a real Timestamp from
// it removes that gap entirely.
let oldestCursor = null;       // {seconds,nanoseconds} of the OLDEST loaded item — "Load more" pages further back
let newestCursor = null;       // {seconds,nanoseconds} of the NEWEST loaded item — "Refresh" checks for anything past this
let exhausted = false;
let filter = 'all';

/* ── helpers ── */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('on'),2200); }
function ms(ts){ return ts && ts.toMillis ? ts.toMillis() : (typeof ts === 'number' ? ts : Date.now()); }
// Exact {seconds,nanoseconds} pair for a comment's createdAt, used for cursors.
// Falls back to "now" only in the impossible case a doc is missing createdAt.
function tsParts(ts){ return ts && typeof ts.seconds === 'number' ? { seconds: ts.seconds, nanoseconds: ts.nanoseconds || 0 } : { seconds: Math.floor(Date.now()/1000), nanoseconds: 0 }; }
function tsFromParts(p){ return new Timestamp(p.seconds, p.nanoseconds); }
function ago(t){
  const s = Math.max(1, Math.floor((Date.now() - t) / 1000));
  if (s < 60) return 'now'; const m = Math.floor(s/60); if (m < 60) return m + 'm';
  const h = Math.floor(m/60); if (h < 24) return h + 'h'; const d = Math.floor(h/24);
  if (d < 30) return d + 'd'; return new Date(t).toLocaleDateString(undefined,{month:'short',day:'numeric'});
}
// Firestore doc → plain object with createdAt as millis (JSON-safe for the session cache)
function plain(d){ const x = d.data(); return { id:d.id, parentId:x.parentId||null, authorUid:x.authorUid||'', authorName:x.authorName||'User',
  authorPhoto:x.authorPhoto||'', authorUsername:x.authorUsername||'', text:x.text||'', likeCount:x.likeCount||0,
  liked: !!(x.likedBy && x.likedBy[me.uid] === true),
  replyCount:x.replyCount||0, hidden:x.hidden===true, createdAt: ms(x.createdAt), createdAtParts: tsParts(x.createdAt) }; }

/* ── session cache: reopening within 10 min costs 0 reads ── */
function saveCache(){
  try { sessionStorage.setItem(CACHE_KEY, JSON.stringify({ t:Date.now(), items, replies, oldestCursor, newestCursor, exhausted })); } catch {}
}
function loadCache(){
  try {
    const c = JSON.parse(sessionStorage.getItem(CACHE_KEY) || 'null');
    if (!c || Date.now() - c.t > CACHE_TTL) return false;
    items = c.items || []; replies = c.replies || {}; oldestCursor = c.oldestCursor || null; newestCursor = c.newestCursor || null; exhausted = !!c.exhausted;
    return true;
  } catch { return false; }
}

/* ── boot ── */
onAuthStateChanged(auth, async user => {
  if (!user) { location.href = '/login?redirect=' + encodeURIComponent(location.pathname + location.search); return; }
  me = user;
  await boot();
});

async function boot(){
  if (!contentId) return showEmpty('Content not found', "We couldn't find this post or article.");
  try {
    const snap = await resilient(() => getDoc(doc(db, contentCol, contentId)), { tries: 2 });
    if (!snap.exists()) return showEmpty('Content not found', 'This may have been deleted.');
    content = snap.data();
    if (content.authorUid !== me.uid) return showEmpty('Not available', 'You can only manage comments on your own posts and articles.');
    renderPreview();
    $('pills').style.display = '';
    $('selectBtn').style.display = '';
    // Pull the pin + reply-rate fields from the same meta doc content-insights reads —
    // this is the one place both pages agree on, so a pin made here shows up there instantly.
    try {
      const metaSnap = await resilient(() => getDoc(doc(db, metaCol, contentId)), { tries: 2 });
      if (metaSnap.exists()) {
        const m = metaSnap.data();
        pinnedId = m.pinnedCommentId || null;
        pinnedSnapshot = pinnedId ? { text: m.pinnedCommentText || '', authorName: m.pinnedCommentAuthorName || 'User' } : null;
      }
    } catch {}
    renderPinned();
    if (loadCache()) { render(); return; }
    await fetchPage(true);
  } catch (e) {
    console.error('comment-manager boot:', e && e.code, e && e.message);
    showEmpty('Could not load comments', 'Check your connection and try again.', true);
  }
}

function renderPreview(){
  const title = isPost ? (content.text || 'Post') : (content.title || 'Untitled');
  const p = $('preview'); p.style.display = '';
  p.innerHTML = `<div class="preview-title">${esc(title.length > 120 ? title.slice(0,120)+'…' : title)}</div><div class="preview-meta">${isPost ? 'Post' : 'Article'} · tap to open</div>`;
  p.onclick = () => location.href = readHref;
}

/* ── data: exactly `PAGE` reads per fetch, cursor-based, newest-first ──
   Newest-first (not oldest-first) so the comments that actually need a
   reply are on page one, not buried behind however many old ones came
   before them. */
function topQuery(afterParts){
  const parts = [collection(db,'comments'), where(idField,'==',contentId), where('parentId','==',null), orderBy('createdAt','desc')];
  if (afterParts != null) parts.push(startAfter(tsFromParts(afterParts)));
  return query(...parts);
}
function mergeNoDupes(got){
  const have = new Set(items.map(i => i.id));
  const fresh = got.filter(g => !have.has(g.id));
  items = items.concat(fresh);
  return fresh;
}
async function fetchPage(first){
  const q = query(topQuery(first ? null : oldestCursor), limit(PAGE));
  const snap = await resilient(() => getDocs(q), { tries: 2 });
  const got = snap.docs.map(plain);
  mergeNoDupes(got);
  if (got.length) {
    oldestCursor = got[got.length-1].createdAtParts;
    if (first || newestCursor == null) newestCursor = got[0].createdAtParts;
  }
  if (got.length < PAGE) exhausted = true;
  saveCache(); render();
}
window.loadMore = async function(btn){
  if (btn) { btn.disabled = true; btn.textContent = 'Loading…'; }
  try { await fetchPage(false); } catch (e) { toast('Could not load more — try again'); render(); }
};
// Refresh reads ONLY comments newer than what's cached (1 read if there are none).
// Ascending + '>' on the newest cursor, then reversed, since the main list is
// newest-first but "give me everything after X" is naturally an ascending scan.
window.refreshNew = async function(){
  const b = $('refreshBtn'); b.classList.add('spin');
  try {
    if (newestCursor == null) { items = []; replies = {}; oldestCursor = null; exhausted = false; await fetchPage(true); }
    else {
      const q = query(collection(db,'comments'), where(idField,'==',contentId), where('parentId','==',null),
        where('createdAt','>', tsFromParts(newestCursor)), orderBy('createdAt','asc'), limit(50));
      const snap = await resilient(() => getDocs(q), { tries: 2 });
      const got = snap.docs.map(plain).reverse();   // back to newest-first before merging
      const have = new Set(items.map(i => i.id));
      const fresh = got.filter(g => !have.has(g.id));
      if (fresh.length) {
        items = fresh.concat(items);
        newestCursor = fresh[0].createdAtParts;
        if (oldestCursor == null) oldestCursor = items[items.length-1].createdAtParts;
      }
      saveCache(); render();
      toast(fresh.length ? `${fresh.length} new comment${fresh.length>1?'s':''}` : 'No new comments');
    }
  } catch { toast('Could not refresh — try again'); }
  b.classList.remove('spin');
};

/* ── render ── */
window.setFilter = function(f){
  filter = f;
  document.querySelectorAll('.pill').forEach(p => p.classList.toggle('active', p.dataset.f === f));
  render();
};
function visible(){
  let list = items;
  if (filter === 'hidden')    list = items.filter(c => c.hidden);
  else if (filter === 'unreplied') list = items.filter(c => !c.hidden && c.authorUid !== me.uid && (c.replyCount || 0) === 0);
  else if (filter === 'liked') list = items.slice().sort((a,b) => (b.likeCount||0) - (a.likeCount||0));
  return list;
}
function avatar(c){
  const i = esc((c.authorName || 'U').charAt(0).toUpperCase());
  return `<div class="av">${c.authorPhoto ? `<img src="${esc(c.authorPhoto)}" alt="" onerror="this.remove()">` : i}</div>`;
}
/* ── pinned comment: this is the field content-insights reads to show its "Comment Pulse" card ── */
function renderPinned(){
  const el = $('pinnedCard');
  if (!pinnedId || !pinnedSnapshot) { el.style.display = 'none'; return; }
  el.style.display = '';
  el.innerHTML = `<div class="pinned-card-lbl">📌 Pinned comment</div>
    <div class="pinned-card-txt"><strong>${esc(pinnedSnapshot.authorName)}:</strong> ${esc(pinnedSnapshot.text)}</div>`;
  el.onclick = () => { const t = document.getElementById('ci-' + pinnedId); if (t) t.scrollIntoView({behavior:'smooth', block:'center'}); };
}
function commentHTML(c, isReply){
  const mine = c.authorUid === me.uid;
  const isPinned = !isReply && c.id === pinnedId;
  const badges = (c.hidden ? '<span class="badge h">Hidden</span>' : '') + (mine ? '<span class="badge m">You</span>' : '') + (isPinned ? '<span class="badge pin">Pinned</span>' : '');
  const acts = [];
  if (!isReply) acts.push(`<button class="act primary" onclick="openReply('${c.id}')">Reply</button>`);
  acts.push(`<button class="act${c.liked ? ' liked' : ''}" onclick="toggleCommentLike('${c.id}','${c.authorUid}')">${c.liked ? '♥' : '♡'} ${c.likeCount > 0 ? c.likeCount : 'Like'}</button>`);
  if (!isReply) acts.push(`<button class="act${isPinned ? ' pinned' : ''}" onclick="togglePin('${c.id}')">${isPinned ? 'Unpin' : 'Pin'}</button>`);
  if (!mine) acts.push(`<button class="act" onclick="toggleHide('${c.id}','${c.parentId||''}')">${c.hidden ? 'Unhide' : 'Hide'}</button>`);
  acts.push(`<button class="act danger" onclick="delComment('${c.id}','${c.parentId||''}')">Delete</button>`);
  if (!isReply && c.replyCount > 0) acts.push(`<button class="act" onclick="toggleReplies('${c.id}')">${openReplies.has(c.id) ? 'Hide' : 'View'} ${c.replyCount} ${c.replyCount===1?'reply':'replies'}</button>`);
  const rep = isReply ? '' : `<div class="replies" id="rep-${c.id}" style="display:${openReplies.has(c.id)?'block':'none'}">${openReplies.has(c.id) ? repliesHTML(c.id) : ''}</div>
    <div class="ri-row" id="rir-${c.id}"><textarea class="ri" id="ri-${c.id}" rows="1" placeholder="Reply to ${esc(c.authorName)}…" oninput="riInput('${c.id}',this)"></textarea><button class="ri-send" id="ris-${c.id}" onclick="sendReply('${c.id}')" disabled>Send</button></div>`;
  const checkbox = (!isReply && selectMode) ? `<div class="sel-box${selected.has(c.id) ? ' on' : ''}" onclick="toggleSelect('${c.id}')"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>` : '';
  return `<div class="${isReply ? 'rp' : 'cm'}${c.hidden ? ' hidden-c' : ''}" id="ci-${c.id}">
    <div class="cm-top">${checkbox}${avatar(c)}<div class="cm-body">
      <div><span class="cm-name">${esc(c.authorName)}</span><span class="cm-time">${ago(c.createdAt)}</span>${badges}</div>
      <div class="cm-text">${esc(c.text)}</div>
      <div class="acts">${acts.join('')}</div>
    </div></div>${rep}</div>`;
}
function repliesHTML(pid){
  const r = replies[pid];
  if (!r) return '<div style="padding:8px 0;font-size:12px;color:#94a3b8">Loading…</div>';
  return r.length ? r.map(x => commentHTML(x, true)).join('') : '<div style="padding:8px 0;font-size:12px;color:#94a3b8">No replies.</div>';
}
function render(){
  const list = visible();
  const total = items.length;
  if (!total) {
    $('list').innerHTML = `<div class="empty"><strong>No comments yet</strong>When people comment, you can reply, hide or delete them here.</div>`;
    $('moreWrap').innerHTML = ''; $('note').textContent = ''; return;
  }
  $('list').innerHTML = list.length ? list.map(c => commentHTML(c, false)).join('')
    : `<div class="empty"><strong>${filter === 'hidden' ? 'Nothing hidden' : 'All caught up'}</strong>${filter === 'hidden' ? 'Comments you hide will show up here.' : 'No unreplied comments in what\'s loaded.'}</div>`;
  $('moreWrap').innerHTML = exhausted ? '' : `<button class="more" onclick="loadMore(this)">Load more</button>`;
  $('note').textContent = filter === 'all' ? '' : 'Filters apply to comments loaded so far' + (exhausted ? '.' : ' — load more to see older ones.');
}

/* ── select mode: bulk hide / delete across whatever's loaded ── */
window.toggleSelectMode = function(){
  selectMode = !selectMode;
  selected.clear();
  $('selectBtn').classList.toggle('primary', selectMode);
  updateBulkBar();
  render();
};
window.toggleSelect = function(cid){
  if (selected.has(cid)) selected.delete(cid); else selected.add(cid);
  updateBulkBar(); render();
};
function updateBulkBar(){
  $('bulkBar').classList.toggle('on', selectMode && selected.size > 0);
  $('bulkCount').textContent = `${selected.size} selected`;
}
window.bulkHide = async function(){
  const ids = Array.from(selected);
  for (const cid of ids) {
    const c = items.find(x => x.id === cid);
    if (!c || c.hidden) continue;
    try { await updateDoc(doc(db,'comments',cid), { hidden: true }); c.hidden = true; } catch {}
  }
  selected.clear(); selectMode = false; updateBulkBar(); saveCache(); render();
  toast(`${ids.length} comment${ids.length===1?'':'s'} hidden`);
};
window.bulkDelete = async function(){
  const ids = Array.from(selected);
  if (!confirm(`Delete ${ids.length} comment${ids.length===1?'':'s'}? Any replies on them go too. This can't be undone.`)) return;
  let totalRemoved = 0;
  for (const cid of ids) {
    try {
      let replyIds = (replies[cid] || []).map(r => r.id);
      if (!replies[cid]) {
        try {
          const rq = query(collection(db,'comments'), where(idField,'==',contentId), where('parentId','==',cid));
          const rsnap = await resilient(() => getDocs(rq), { tries: 1 });
          replyIds = rsnap.docs.map(d => d.id);
        } catch {}
      }
      const batch = writeBatch(db);
      batch.delete(doc(db,'comments',cid));
      replyIds.forEach(rid => batch.delete(doc(db,'comments',rid)));
      await batch.commit();
      totalRemoved += 1 + replyIds.length;
      delete replies[cid]; openReplies.delete(cid);
      if (cid === pinnedId) { pinnedId = null; pinnedSnapshot = null; setDoc(doc(db, metaCol, contentId), { pinnedCommentId: null }, { merge: true }).catch(() => {}); }
    } catch {}
  }
  if (totalRemoved) updateDoc(doc(db, metaCol, contentId), { commentCount: increment(-totalRemoved) }).catch(() => {});
  items = items.filter(x => !selected.has(x.id));
  selected.clear(); selectMode = false; updateBulkBar(); saveCache(); render(); renderPinned();
  toast(`${ids.length} comment${ids.length===1?'':'s'} deleted`);
};

/* ── pin: single slot per post/article, written to the SAME meta doc content-insights reads ── */
window.togglePin = async function(cid){
  const c = items.find(x => x.id === cid); if (!c) return;
  const wasPinned = pinnedId === cid;
  try {
    if (wasPinned) {
      await setDoc(doc(db, metaCol, contentId), { pinnedCommentId: null, pinnedCommentText: null, pinnedCommentAuthorName: null }, { merge: true });
      pinnedId = null; pinnedSnapshot = null;
      toast('Unpinned');
    } else {
      await setDoc(doc(db, metaCol, contentId), {
        pinnedCommentId: cid, pinnedCommentText: c.text.slice(0, 200),
        pinnedCommentAuthorName: c.authorName || 'User', pinnedAt: serverTimestamp()
      }, { merge: true });
      pinnedId = cid; pinnedSnapshot = { text: c.text.slice(0,200), authorName: c.authorName || 'User' };
      toast('Pinned — this will show on your Insights page');
    }
    renderPinned(); render();
  } catch (e) {
    console.error('togglePin:', e && e.code);
    toast(e && e.code === 'permission-denied' ? 'Not allowed yet — Firestore rules need updating' : 'Could not update pin — try again');
  }
};
/* ── like: same likedBy/{uid} + likeCount schema post-read.html and article-read.html use,
   so a like from here shows up there and vice versa ── */
window.toggleCommentLike = async function(cid, authorUid){
  const list = items.find(x => x.id === cid) ? items : (Object.values(replies).flat());
  const c = list.find(x => x.id === cid); if (!c) return;
  const wasLiked = !!c.liked;
  c.liked = !wasLiked; c.likeCount = (c.likeCount || 0) + (wasLiked ? -1 : 1);
  render();
  try {
    const ref = doc(db, 'comments', cid);
    if (wasLiked) {
      await updateDoc(ref, { [`likedBy.${me.uid}`]: false, likeCount: increment(-1) });
    } else {
      await updateDoc(ref, { [`likedBy.${me.uid}`]: true, likeCount: increment(1) });
      if (authorUid && authorUid !== me.uid) {
        // Matches notifications.js's notifyComment schema and its dedup pattern for
        // comment_like specifically: same deterministic doc ID on repeat like/unlike
        // so it never piles up duplicate "liked your comment" notifications.
        const p = await ensureProfile();
        const dedupId = `clike_${me.uid}_${cid}`;
        setDoc(doc(db, 'notifications', dedupId), {
          recipientUid: authorUid, type: 'comment_like', actorUid: me.uid,
          actorName: p.name, actorPhoto: p.photo, actorUsername: p.username,
          targetId: contentId, targetTitle: isPost ? '' : (content.title || ''),
          commentId: cid, targetType: isPost ? 'post' : 'article',
          read: false, createdAt: serverTimestamp(), lastAt: serverTimestamp()
        }).catch(() => {});
      }
    }
    saveCache();
  } catch (e) {
    c.liked = wasLiked; c.likeCount = (c.likeCount || 0) + (wasLiked ? 1 : -1);
    render();
    console.error('toggleCommentLike:', e && e.code);
    toast(e && e.code === 'permission-denied' ? 'Could not like — check Firestore rules' : 'Could not update — try again');
  }
};

function showEmpty(title, sub, retry){
  $('pills').style.display = 'none'; $('preview').style.display = 'none';
  $('list').innerHTML = `<div class="empty"><strong>${esc(title)}</strong>${esc(sub)}${retry ? '<br><button class="act primary" onclick="retryBoot()">Try again</button>' : ''}</div>`;
}
window.retryBoot = async function(){ await reconnectFirestore(); $('list').innerHTML = '<div class="skel"></div><div class="skel"></div>'; boot(); };

/* ── replies (fetched once per thread, then cached) ── */
window.toggleReplies = async function(cid){
  if (openReplies.has(cid)) { openReplies.delete(cid); render(); return; }
  openReplies.add(cid);
  if (replies[cid]) { render(); return; }
  render();
  try {
    const q = query(collection(db,'comments'), where(idField,'==',contentId), where('parentId','==',cid), orderBy('createdAt','asc'));
    const snap = await resilient(() => getDocs(q), { tries: 2 });
    replies[cid] = snap.docs.map(plain); saveCache(); render();
  } catch { openReplies.delete(cid); render(); toast('Could not load replies'); }
};

/* ── actions ── */
window.riInput = function(cid, el){
  el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  $('ris-' + cid).disabled = !el.value.trim();
};
window.openReply = function(cid){
  const row = $('rir-' + cid); if (!row) return;
  row.classList.toggle('on'); if (row.classList.contains('on')) $('ri-' + cid).focus();
};
async function ensureProfile(){
  if (myProfile) return myProfile;
  let name = me.displayName || 'Someone', photo = me.photoURL || '', username = '';
  try {
    const s = await resilient(() => getDoc(doc(db,'users',me.uid)), { tries: 2 });
    if (s.exists()) { const u = s.data(); name = u.name || u.displayName || name; photo = u.photo || u.photoURL || photo; username = u.username || ''; }
  } catch {}
  return (myProfile = { name, photo, username });
}
// Reply = 4 writes: the reply, parent's replyCount, content's commentCount, and one notification.
window.sendReply = async function(pid){
  const inp = $('ri-' + pid), btn = $('ris-' + pid);
  const text = (inp.value || '').trim(); if (!text) return;
  btn.disabled = true; btn.textContent = '…';
  try {
    const p = await ensureProfile();
    const ref = await addDoc(collection(db,'comments'), { [idField]: contentId, parentId: pid, authorUid: me.uid,
      authorName: p.name, authorPhoto: p.photo, authorUsername: p.username, text, likeCount: 0, replyCount: 0, hidden: false, createdAt: serverTimestamp() });
    updateDoc(doc(db,'comments',pid), { replyCount: increment(1) }).catch(() => {});
    updateDoc(doc(db, metaCol, contentId), { commentCount: increment(1) }).catch(() => setDoc(doc(db, metaCol, contentId), { commentCount: 1 }, { merge: true }).catch(() => {}));
    // Only the content owner can reach this page (boot() checks authorUid === me.uid),
    // so every reply sent here is a creator reply — feeds the reply-rate stat on Insights.
    updateDoc(doc(db, metaCol, contentId), { creatorReplyCount: increment(1) }).catch(() => setDoc(doc(db, metaCol, contentId), { creatorReplyCount: 1 }, { merge: true }).catch(() => {}));
    const parent = items.find(i => i.id === pid);
    if (parent) {
      parent.replyCount = (parent.replyCount || 0) + 1;
      if (parent.authorUid && parent.authorUid !== me.uid) {
        addDoc(collection(db,'notifications'), { recipientUid: parent.authorUid, type: 'comment_reply', actorUid: me.uid,
          actorName: p.name, actorPhoto: p.photo, actorUsername: p.username, targetId: contentId,
          targetTitle: isPost ? '' : (content.title || ''), commentId: pid, targetType: isPost ? 'post' : 'article',
          read: false, createdAt: serverTimestamp(), lastAt: serverTimestamp() }).catch(() => {});
      }
    }
    const nr = { id: ref.id, parentId: pid, authorUid: me.uid, authorName: p.name, authorPhoto: p.photo, authorUsername: p.username,
      text, likeCount: 0, replyCount: 0, hidden: false, createdAt: Date.now() };
    // Only append locally if that thread's replies were already loaded; otherwise the next expand fetches them fresh.
    if (replies[pid]) { replies[pid].push(nr); openReplies.add(pid); }
    saveCache(); render();
    toast('Reply posted');
  } catch (e) { console.error('sendReply:', e && e.code); btn.disabled = false; btn.textContent = 'Send'; toast('Could not post reply — try again'); }
};

// Hide/unhide = 1 write. Deliberately does NOT touch commentCount.
window.toggleHide = async function(cid, pid){
  const list = pid ? (replies[pid] || []) : items;
  const c = list.find(x => x.id === cid); if (!c) return;
  const next = !c.hidden;
  const el = $('ci-' + cid); el && el.classList.add('busy');
  try {
    await updateDoc(doc(db,'comments',cid), { hidden: next });
    c.hidden = next; saveCache(); render();
    toast(next ? 'Comment hidden from readers' : 'Comment visible again');
  } catch (e) {
    el && el.classList.remove('busy');
    console.error('toggleHide:', e && e.code);
    toast(e && e.code === 'permission-denied' ? 'Not allowed yet — Firestore rules need updating' : 'Could not update — try again');
  }
};

// Delete: for a reply, 1 delete + parent replyCount(-1) + content commentCount(-1).
// For a top-level comment, its replies are gone too once it's deleted (they'd be
// orphaned — visible nowhere, replyable to nothing) so this fetches and batch-
// deletes them along with it, and drops commentCount by 1 + however many replies
// went with it, not just 1.
window.delComment = async function(cid, pid){
  const list = pid ? (replies[pid] || []) : items;
  const c = list.find(x => x.id === cid); if (!c) return;
  const warn = (!pid && c.replyCount > 0) ? `Delete this comment and its ${c.replyCount} ${c.replyCount===1?'reply':'replies'}?` : 'Delete this comment?';
  if (!confirm(warn)) return;
  const el = $('ci-' + cid); el && el.classList.add('busy');
  try {
    let removedCount = 1;
    if (pid) {
      await deleteDoc(doc(db,'comments',cid));
      updateDoc(doc(db,'comments',pid), { replyCount: increment(-1) }).catch(() => {});
      replies[pid] = (replies[pid] || []).filter(x => x.id !== cid);
      const parent = items.find(i => i.id === pid); if (parent) parent.replyCount = Math.max(0, (parent.replyCount || 0) - 1);
    } else {
      // Fetch this comment's replies first so they can be batch-deleted with it —
      // Firestore batches cap at 500 writes, comfortably above what a single
      // comment thread here will ever have.
      let replyIds = (replies[cid] || []).map(r => r.id);
      if (!replies[cid]) {
        try {
          const rq = query(collection(db,'comments'), where(idField,'==',contentId), where('parentId','==',cid));
          const rsnap = await resilient(() => getDocs(rq), { tries: 2 });
          replyIds = rsnap.docs.map(d => d.id);
        } catch {}
      }
      const batch = writeBatch(db);
      batch.delete(doc(db,'comments',cid));
      replyIds.forEach(rid => batch.delete(doc(db,'comments',rid)));
      await batch.commit();
      removedCount = 1 + replyIds.length;
      items = items.filter(x => x.id !== cid); delete replies[cid]; openReplies.delete(cid);
      if (cid === pinnedId) {
        pinnedId = null; pinnedSnapshot = null; renderPinned();
        setDoc(doc(db, metaCol, contentId), { pinnedCommentId: null, pinnedCommentText: null, pinnedCommentAuthorName: null }, { merge: true }).catch(() => {});
      }
    }
    updateDoc(doc(db, metaCol, contentId), { commentCount: increment(-removedCount) }).catch(() => {});
    saveCache(); render();
    toast(removedCount > 1 ? `Comment and ${removedCount-1} ${removedCount-1===1?'reply':'replies'} deleted` : 'Comment deleted');
  } catch (e) {
    el && el.classList.remove('busy');
    console.error('delComment:', e && e.code);
    toast(e && e.code === 'permission-denied' ? 'Not allowed yet — Firestore rules need updating' : 'Could not delete — try again');
  }
};

window.addEventListener('online', () => { if (!content && me) retryBoot(); });
</script>
</body>
</html>
