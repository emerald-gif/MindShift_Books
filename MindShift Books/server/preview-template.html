<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <!-- Template for /preview?id=<productId> (served by server/bookstore.js, NOT statically — it lives outside public/ on purpose).
       The server replaces the marker below with the book's <title>, description, Open Graph/Twitter tags and boot data. -->
  <!--PREVIEW_HEAD-->
  <link rel="icon" href="/MINDSHIFT.jpg">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #0f172a;
      --accent: #06b6d4;
      --indigo: #4f46e5;
      --bg: #f8fafc;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background: var(--bg); color: var(--primary); min-height: 100vh; }

    /* ── HEADER ── */
    header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      background: white;
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 20px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.07);
    }
    .hd-brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--primary); }
    .hd-brand img { width: 32px; height: 32px; border-radius: 6px; }
    .hd-brand span { font-weight: 700; font-size: 1rem; }
    .hd-back {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 0.88rem; font-weight: 600; color: #6b7280;
      text-decoration: none; padding: 6px 12px; border-radius: 8px;
      border: 1.5px solid #e5e7eb; background: white;
      transition: border-color 0.2s, color 0.2s;
    }
    .hd-back:hover { border-color: var(--accent); color: var(--accent); }

    /* ── HERO BANNER ── */
    .preview-hero {
      margin-top: 64px;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
      padding: 36px 20px 28px;
      text-align: center;
      color: white;
    }
    .preview-hero .badge {
      display: inline-block;
      background: rgba(6,182,212,0.18);
      border: 1px solid rgba(6,182,212,0.4);
      color: #67e8f9; font-size: 0.78rem; font-weight: 700;
      letter-spacing: 0.06em; text-transform: uppercase;
      padding: 4px 12px; border-radius: 20px; margin-bottom: 14px;
    }
    .preview-hero h1 {
      font-size: 1.55rem; font-weight: 800; line-height: 1.25;
      margin-bottom: 10px; color: white;
    }
    .preview-hero p {
      color: #94a3b8; font-size: 0.92rem; max-width: 420px; margin: 0 auto 18px;
      line-height: 1.6;
    }
    .progress-bar-wrap {
      max-width: 320px; margin: 0 auto;
      background: rgba(255,255,255,0.1); border-radius: 20px; height: 6px;
    }
    .progress-bar-fill {
      height: 6px; border-radius: 20px;
      background: linear-gradient(90deg, #4f46e5, #06b6d4);
      width: 0%; transition: width 0.4s ease;
    }
    .progress-label {
      color: #64748b; font-size: 0.8rem; margin-top: 8px;
      font-weight: 600;
    }

    /* ── PDF VIEWER ── */
    .pdf-viewer {
      max-width: 700px; margin: 0 auto;
      padding: 24px 16px 0;
    }

    .page-wrap {
      margin-bottom: 20px;
      border-radius: 12px; overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.1);
      background: white;
      position: relative;
    }
    .page-wrap canvas {
      display: block; width: 100%; height: auto;
    }
    /* Overlay to prevent long-press save on mobile */
    .page-wrap::after {
      content: '';
      position: absolute; inset: 0;
      z-index: 2; cursor: default;
    }

    /* ── LOADING ── */
    .loader-wrap {
      display: flex; flex-direction: column; align-items: center;
      gap: 14px; padding: 60px 20px; text-align: center;
    }
    .spinner {
      width: 40px; height: 40px; border-radius: 50%;
      border: 3px solid #e5e7eb;
      border-top-color: var(--indigo);
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loader-wrap p { color: #6b7280; font-size: 0.9rem; }

    /* ── FADE GATE ── */
    .fade-gate {
      position: relative; margin-bottom: 0;
    }
    .fade-gate::after {
      content: '';
      position: absolute; bottom: 0; left: 0; right: 0;
      height: 160px;
      background: linear-gradient(to bottom, transparent, var(--bg));
      pointer-events: none; z-index: 3;
    }

    /* ── PURCHASE CTA ── */
    .cta-section {
      max-width: 700px; margin: 0 auto;
      padding: 0 16px 60px;
    }
    .cta-card {
      background: linear-gradient(135deg, #0f172a, #1e1b4b);
      border-radius: 20px;
      padding: 36px 28px;
      text-align: center;
      color: white;
      box-shadow: 0 20px 60px rgba(79,70,229,0.25);
      border: 1px solid rgba(255,255,255,0.06);
    }
    .cta-card .lock-icon {
      width: 52px; height: 52px; border-radius: 14px;
      background: rgba(79,70,229,0.2);
      border: 1px solid rgba(79,70,229,0.4);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 20px;
    }
    .cta-card h2 {
      font-size: 1.45rem; font-weight: 800; margin-bottom: 10px;
      line-height: 1.3;
    }
    .cta-card h2 span { color: #67e8f9; }
    .cta-card .sub {
      color: #94a3b8; font-size: 0.92rem;
      line-height: 1.6; margin-bottom: 28px;
      max-width: 380px; margin-left: auto; margin-right: auto;
    }
    .cta-bullets {
      list-style: none; text-align: left;
      display: flex; flex-direction: column; gap: 10px;
      margin-bottom: 28px; max-width: 340px; margin-left: auto; margin-right: auto;
    }
    .cta-bullets li {
      display: flex; align-items: flex-start; gap: 10px;
      font-size: 0.9rem; color: #e2e8f0; line-height: 1.5;
    }
    .cta-bullets li .tick {
      width: 20px; height: 20px; border-radius: 50%;
      background: linear-gradient(135deg, #4f46e5, #06b6d4);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; margin-top: 1px;
    }
    .cta-price-row {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      margin-bottom: 22px;
    }
    .cta-price {
      font-size: 2rem; font-weight: 800; color: white;
    }
    .cta-price-old {
      font-size: 1.1rem; color: #6b7280;
      text-decoration: line-through;
    }
    .cta-price-badge {
      background: rgba(6,182,212,0.15);
      border: 1px solid rgba(6,182,212,0.4);
      color: #67e8f9; font-size: 0.78rem; font-weight: 700;
      letter-spacing: 0.04em; padding: 3px 10px; border-radius: 20px;
    }
    .cta-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; max-width: 340px;
      padding: 16px 24px; border-radius: 12px; border: none;
      background: linear-gradient(90deg, #4f46e5, #06b6d4);
      color: white; font-size: 1rem; font-weight: 700; cursor: pointer;
      box-shadow: 0 8px 24px rgba(79,70,229,0.35);
      text-decoration: none;
      transition: opacity 0.2s, transform 0.15s;
    }
    .cta-btn:hover { opacity: 0.92; transform: translateY(-1px); }
    .cta-trust {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      color: #64748b; font-size: 0.8rem; margin-top: 14px;
    }

    /* ── PAGE COUNTER PILL (sticky) ── */
    .page-pill {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(15,23,42,0.88); backdrop-filter: blur(8px);
      color: white; font-size: 0.82rem; font-weight: 600;
      padding: 7px 16px; border-radius: 20px; z-index: 50;
      pointer-events: none; opacity: 0;
      transition: opacity 0.3s;
      white-space: nowrap;
    }
    .page-pill.visible { opacity: 1; }

    /* ── RESPONSIVE ── */
    @media (max-width: 480px) {
      .preview-hero h1 { font-size: 1.25rem; }
      .cta-card { padding: 28px 18px; }
      .cta-card h2 { font-size: 1.2rem; }
    }

    .pv-missing { max-width: 520px; margin: 0 auto; padding: 110px 20px 60px; text-align: center; }
    .pv-missing h1 { font-size: 1.4rem; margin-bottom: 8px; }
    .pv-missing p { color: #64748b; margin-bottom: 20px; }
    .pv-missing a { display: inline-block; padding: 12px 22px; border-radius: 12px; background: linear-gradient(90deg,#4f46e5,#06b6d4); color: #fff; font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>

<!-- HEADER -->
<header>
  <a href="/" class="hd-brand">
    <img src="/MINDSHIFT.jpg" alt="MindShift Books logo">
    <span>MindShift Books</span>
  </a>
  <a href="/books" class="hd-back">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><polyline points="15 18 9 12 15 6"></polyline></svg>
    Back to Store
  </a>
</header>

<!-- HERO BANNER -->
<div class="preview-hero" id="pvHero">
  <div class="badge" id="pvBadge">📖 Free Preview</div>
  <h1 id="pvTitle">&nbsp;</h1>
  <p id="pvIntro"></p>
  <div class="progress-bar-wrap">
    <div class="progress-bar-fill" id="progressFill"></div>
  </div>
  <div class="progress-label" id="progressLabel">Loading preview…</div>
</div>

<!-- PDF VIEWER -->
<div class="pdf-viewer" id="pdfViewer">
  <div class="loader-wrap" id="loaderWrap">
    <div class="spinner"></div>
    <p>Loading preview…</p>
  </div>
</div>

<!-- PURCHASE CTA -->
<div class="cta-section" id="ctaSection" style="display:none;">
  <div class="cta-card">
    <div class="lock-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#a5b4fc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="26" height="26"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
    </div>

    <h2>You've reached the end of the <span>free preview</span></h2>
    <p class="sub" id="ctaSub"></p>

    <ul class="cta-bullets" id="ctaBullets"></ul>

    <div class="cta-price-row" id="ctaPriceRow"></div>

    <a href="/books" class="cta-btn" id="ctaBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
      <span id="ctaBtnText">Get the Full Book</span>
    </a>

    <div class="cta-trust">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="13" height="13"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
      Secure checkout · PDF emailed instantly after payment
    </div>
  </div>
</div>

<!-- PAGE COUNTER PILL -->
<div class="page-pill" id="pagePill">Page 1</div>

<!-- PDF.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
  // Disable right-click globally on this page
  document.addEventListener('contextmenu', e => e.preventDefault());

  const TICK = '<span class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="12" height="12"><polyline points="20 6 9 17 4 12"></polyline></svg></span>';

  const viewer = document.getElementById('pdfViewer');
  const loader = document.getElementById('loaderWrap');
  const cta    = document.getElementById('ctaSection');
  const fill   = document.getElementById('progressFill');
  const label  = document.getElementById('progressLabel');
  const pill   = document.getElementById('pagePill');
  let pillTimer = null;

  function showPill(text) {
    pill.textContent = text;
    pill.classList.add('visible');
    clearTimeout(pillTimer);
    pillTimer = setTimeout(() => pill.classList.remove('visible'), 2200);
  }

  // First-party page-view tracking (no third-party pixels/cookies)
  function track(productId) {
    try {
      const payload = JSON.stringify({ type: 'preview', path: location.pathname, productId: productId, ref: document.referrer || null });
      if (navigator.sendBeacon) {
        navigator.sendBeacon('/api/track', new Blob([payload], { type: 'application/json' }));
      } else {
        fetch('/api/track', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: payload, keepalive: true }).catch(() => {});
      }
    } catch (e) {}
  }

  function showMissing() {
    document.title = 'Preview not available | MindShift Books';
    document.body.innerHTML = `
      <header>
        <a href="/" class="hd-brand"><img src="/MINDSHIFT.jpg" alt="MindShift Books logo"><span>MindShift Books</span></a>
        <a href="/books" class="hd-back">Back to Store</a>
      </header>
      <div class="pv-missing">
        <h1>Preview not available</h1>
        <p>We couldn't find a free preview for this book.</p>
        <a href="/books">Browse books</a>
      </div>`;
  }

  function naira(n) { return '₦' + Number(n).toLocaleString(); }

  // Fill the page with this book's copy (all of it comes from the product's `preview` block)
  function applyBook(book) {
    const pv = book.preview;
    if (!document.title || document.title.indexOf('Preview') !== 0) document.title = `Preview — ${book.title} | MindShift Books`;

    document.getElementById('pvBadge').textContent = pv.badge || '📖 Free Preview — Chapter 1';
    document.getElementById('pvTitle').textContent = book.title;
    document.getElementById('pvIntro').textContent = pv.intro || 'Read a free preview before you buy.';
    document.getElementById('ctaSub').textContent  = pv.locked || 'The rest of the book is waiting for you inside the full version.';

    const list = document.getElementById('ctaBullets');
    list.innerHTML = '';
    (pv.bullets || []).concat(['Instant PDF delivery after payment']).forEach(text => {
      const li = document.createElement('li');
      li.innerHTML = TICK;
      li.appendChild(document.createTextNode(' ' + text));
      list.appendChild(li);
    });

    // Live price — comes from the product, so it can never go stale like the old hardcoded pages
    const priceRow = document.getElementById('ctaPriceRow');
    const btnText  = document.getElementById('ctaBtnText');
    if (book.priceNGN) {
      let h = `<span class="cta-price">${naira(book.priceNGN)}</span>`;
      if (book.originalPriceNGN && book.originalPriceNGN > book.priceNGN) {
        const pct = Math.round((1 - book.priceNGN / book.originalPriceNGN) * 100);
        h += `<span class="cta-price-old">${naira(book.originalPriceNGN)}</span><span class="cta-price-badge">${pct}% OFF</span>`;
      }
      priceRow.innerHTML = h;
      btnText.textContent = `Get the Full Book — ${naira(book.priceNGN)}`;
    } else {
      priceRow.style.display = 'none';
    }
    document.getElementById('ctaBtn').href = '/review?id=' + encodeURIComponent(book.id);
  }

  async function renderPDF(pdfUrl, maxPages) {
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    let pdf;
    try {
      pdf = await pdfjsLib.getDocument({ url: pdfUrl, disableRange: false, disableStream: false }).promise;
    } catch (err) {
      loader.innerHTML = `
        <div style="color:#ef4444;font-weight:600;">Failed to load preview.</div>
        <div style="color:#6b7280;font-size:0.85rem;margin-top:6px;">Please refresh and try again.</div>`;
      return;
    }

    const pages = maxPages ? Math.min(pdf.numPages, maxPages) : pdf.numPages;
    loader.remove();
    label.textContent = `Preview — ${pages} pages`;
    fill.style.width = '0%';

    const canvases = [];

    for (let i = 1; i <= pages; i++) {
      const page = await pdf.getPage(i);
      const viewport = page.getViewport({ scale: 2.2 });

      const wrap = document.createElement('div');
      wrap.className = 'page-wrap' + (i === pages ? ' fade-gate' : '');
      wrap.dataset.page = i;

      const canvas = document.createElement('canvas');
      canvas.width  = viewport.width;
      canvas.height = viewport.height;
      canvas.style.width  = '100%';
      canvas.style.height = 'auto';
      // Block drag-save on mobile
      canvas.addEventListener('dragstart', e => e.preventDefault());

      wrap.appendChild(canvas);
      viewer.appendChild(wrap);
      canvases.push({ canvas, page, viewport });

      fill.style.width = Math.round((i / pages) * 100) + '%';

      // Render immediately for first 3 pages, lazy for rest
      if (i <= 3) {
        await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
      }
    }

    // Reveal CTA
    cta.style.display = 'block';
    label.textContent = `Showing page 1 of ${pages}`;

    // Lazy render remaining pages using IntersectionObserver
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (!entry.isIntersecting) return;
        const wrap = entry.target;
        const pageNum = parseInt(wrap.dataset.page);
        if (pageNum <= 3) return; // already rendered
        const { canvas, page, viewport } = canvases[pageNum - 1];
        if (canvas.dataset.rendered) return;
        canvas.dataset.rendered = '1';
        page.render({ canvasContext: canvas.getContext('2d'), viewport });
        observer.unobserve(wrap);
      });
    }, { rootMargin: '300px' });
    viewer.querySelectorAll('.page-wrap').forEach(w => observer.observe(w));

    // Scroll observer for page pill + progress label
    const pageObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const p = parseInt(entry.target.dataset.page);
          fill.style.width = Math.round((p / pages) * 100) + '%';
          label.textContent = `Page ${p} of ${pages}`;
          showPill(`Page ${p} of ${pages}`);
        }
      });
    }, { threshold: 0.3 });
    viewer.querySelectorAll('.page-wrap').forEach(w => pageObserver.observe(w));
  }

  (async function init() {
    // The server injects the book as window.__PREVIEW__; falling back to the API
    // covers /preview?id=… being opened without that injection.
    let book = window.__PREVIEW__ || null;
    if (!book) {
      const id = new URLSearchParams(location.search).get('id');
      if (id) {
        try {
          const r = await fetch('/api/product/' + encodeURIComponent(id));
          if (r.ok) book = (await r.json()).product;
        } catch (e) {}
      }
    }
    if (!book || !book.preview || !book.preview.pdf) { showMissing(); return; }
    applyBook(book);
    track(book.id);
    renderPDF(book.preview.pdf, book.preview.maxPages);
  })();
</script>
</body>
</html>
